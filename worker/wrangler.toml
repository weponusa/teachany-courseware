name = "llm-proxy"
main = "src/index.js"
compatibility_date = "2024-12-01"

[vars]
# 环境变量通过 wrangler secret 设置，不写在代码中
# PARATERA_KEY, OPENROUTER_KEY
#
# Cloudflare Pages（teachany-courseware）加密环境变量：
# OPENROUTER_KEY（PBL 主）、SILICONFLOW_KEY（兜底）、PARATERA_KEY（兜底）、
# TYPESAFE_API_KEY（Jev 独立 noul 闸门；缺失则跳过闸门、原链路不变）
# AMAP_WEB_KEY（可选：全国学校定位与周边 POI；范围统一用固定30公里包络近似，不请求路线 ETA）
# PBL_JEV_GATE=off 可紧急关闭闸门

# 路由：llm-proxy.teachany.workers.dev
