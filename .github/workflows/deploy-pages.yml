name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'community/pending/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 构建发布目录（scripts/build-publish-site.sh，含 19000 文件门禁）
      - name: Build publish directory
        run: bash scripts/build-publish-site.sh _site

      - name: Verify PBL Map in publish output
        run: |
          test -f _site/pbl-map/index.html || { echo '❌ _site/pbl-map/index.html missing'; exit 1; }
          test -f _site/pbl-map/config.js || { echo '❌ _site/pbl-map/config.js missing'; exit 1; }
          echo "✅ pbl-map present ($(find _site/pbl-map -type f | wc -l | tr -d ' ') files)"

      # 增量部署到 gh-pages：先 clone 现有分支，rsync 更新，只 push 差异
      # 2026-10-02：该步骤观察到偶发 exit 2（clone/rsync/push 任一处瞬时失败即整步挂掉，
      # gh-pages 不动、站点静默停在旧版本），因此整步重试最多 3 次。
      - name: Deploy to gh-pages (incremental, 最多重试 3 次)
        # 提交信息走 env 传入：绝不内联进 shell 字符串。
        # 历史坑：原写法 `git commit -m "deploy: ${{ github.event.head_commit.message }}"`
        # 会把提交信息拼进双引号内，信息里只要出现英文双引号就会闭合引号，
        # 导致余下文字被当成 git 的参数（表现为 pathspec '走' did not match any file(s)），
        # 三次重试全挂、gh-pages 静默停在旧版本。
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -uo pipefail
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          # 取首行做部署信息，避免多行信息塞进 commit subject
          DEPLOY_MSG=$(printf '%s' "${COMMIT_MSG:-manual deploy}" | head -n 1)
          [ -n "$DEPLOY_MSG" ] || DEPLOY_MSG="manual deploy"

          deploy_once() {
            rm -rf _deploy
            # 尝试 clone 已有的 gh-pages 分支（shallow clone 减少传输量）
            if git clone --depth 1 --branch gh-pages "$REPO_URL" _deploy 2>/dev/null; then
              echo "✅ Cloned existing gh-pages branch"
            else
              echo "⚠️ gh-pages branch not found, creating fresh"
              mkdir _deploy && ( cd _deploy && git init -q ) || return 1
            fi

            cd _deploy || return 1
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # 同步 _site 内容到 _deploy（删除不再存在的文件）
            rsync -a --delete --no-perms --no-owner --no-group --exclude='.git/' ../_site/ ./ || return 1

            touch .nojekyll
            git add -A || return 1
            # pbl-map/.gitignore 曾忽略 engine/，须强制纳入发布目录中的跳转 stub
            if [ -d pbl-map/engine ]; then
              git add -f pbl-map/engine/ || return 1
            fi
            CHANGES=$(git diff --cached --numstat | wc -l | tr -d ' ')
            echo "Changed files: $CHANGES"

            if [ "$CHANGES" -eq 0 ]; then
              echo "✅ No changes to deploy"
              cd .. || true
              return 0
            fi

            # 显示摘要（用 diff --stat 避免 SIGPIPE）
            git diff --cached --stat | tail -5 || true
            git commit -q -m "deploy: $DEPLOY_MSG" || return 1
            git push origin HEAD:gh-pages || return 1
            cd .. || true
            echo "✅ Deployed successfully ($CHANGES files changed)"
          }

          for attempt in 1 2 3; do
            echo "── 部署尝试 $attempt / 3 ──"
            if deploy_once; then
              exit 0
            fi
            echo "⚠️ 第 $attempt 次部署失败"
            rm -rf _deploy
            cd "$GITHUB_WORKSPACE" || true
            [ "$attempt" -lt 3 ] && sleep 15
          done
          echo "❌ 三次部署均失败"
          exit 2

      # teachany.cn 由 Cloudflare Pages 连接 gh-pages 分支提供静态文件（非 main 直出）
      # read.teachany.cn 由独立 Cloudflare 项目连接 gh-pages-reading 分支
