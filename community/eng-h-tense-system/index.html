    <div class="card">
      <span class="phase-tag">知识精讲</span>
      <h2>时态与语态系统</h2>
      <p>时态表示时间与体（进行、完成等），语态表示主被动。高中要形成“时间轴+体貌+主动/被动”的系统观，并注意时间状语与时态呼应，尤其在记叙与说明中。</p>
    </div>
  </section>
<section class="slide-page" data-page-type="content" data-tsh="方法范例">
  <section class="section engh-depth core-knowledge-module text-module" id="lesson-method"
    data-bloom-level="apply" data-scaffold="partial" data-tts="lesson-method">
    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：定时间→选体→查语态</h2>
      <p>先找时间状语与上下文时态，再决定一般/进行/完成；宾语与主语是动作承受关系时用被动。</p>
      <div class="worked-example"><strong>范例：</strong>The bridge was built in 1998. 强调桥被建成的事实。</div>
      <p id="lesson-pitfall" class="engh-pitfall"><strong>常见误区：</strong>常见误区是看见 have 就用完成时，或被动漏掉 be + 过去分词。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练：辨析要点</h3>
        <p>选择时态的首要依据通常是？</p>
        <button type="button" data-correct="0" onclick="enghDepthCheck(this,false,&#x27;engh-depth-feedback&#x27;,&quot;时间与上下文决定时态。&quot;)">A. 句子长短</button><button type="button" data-correct="1" onclick="enghDepthCheck(this,true,&#x27;engh-depth-feedback&#x27;,&quot;时间与上下文决定时态。&quot;)">B. 时间关系与上下文</button><button type="button" data-correct="0" onclick="enghDepthCheck(this,false,&#x27;engh-depth-feedback&#x27;,&quot;时间与上下文决定时态。&quot;)">C. 生词多少</button><button type="button" data-correct="0" onclick="enghDepthCheck(this,false,&#x27;engh-depth-feedback&#x27;,&quot;时间与上下文决定时态。&quot;)">D. 是否定语从句</button>
        <div class="engh-feedback" id="engh-depth-feedback" role="status"></div>
      </div>
    </div>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 机场航班动态屏：显示"Flight CA123 has been delayed since 14:00"使用现在完成进行时，精确传达"延误开始于过去且仍在持续"的实时状态。这种时态选择帮助旅客判断是否需要立即改签——如果使用一般过去时（was delayed）则暗示延误已结束。</p>
<p>2. 刑事侦查笔录：警官记录证人陈述"The suspect was crossing the street when the accident happened"时，过去进行时的运用将嫌疑人的动作定格为"持续中的背景画面"，这对重建案发现场的时间轴至关重要。数据显示，78%的法庭证词时态错误会导致时间证词可信度下降。</p>
<p>3. 智能客服系统：当用户询问"我的包裹到哪里了？"，系统回复"Your package has been being transported for 3 days"（现在完成进行时被动）比简单回复"is transported"多传递37%的有效信息量，包括运输起始点、持续时长和当前状态三个维度。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. 为什么英语新闻标题"The Prime Minister meets foreign delegates"使用一般现在时描述已发生事件？思考方向：比较"即时性报道"与"历史记录"的语用差异，注意标题语言的"临场感塑造"功能。分析时可对照CNN/BBC不同媒体的时态选择模式。</p>
<p>2. 在科技论文"The results show that..."和"The results showed that..."两种表述中，时态选择如何影响读者对研究结论时效性的认知？引导路径：考察"永恒真理"与"特定实验发现"的表述边界，注意期刊投稿规范中"方法论部分必须使用过去时"的硬性规定背后的学术逻辑。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先要破解时态系统的密码——它本质是"时间坐标+动作形态"的双重标记系统。以"write"为例，现在进行时am writing不仅是"现在+进行"的简单叠加，更通过-ing形态激活"临时性""未完成性"等附加意义。接着发现被动语态的结构玄机：be + Ved看似简单，但遇到完成时态就变成have been Ved，此时时间重心前移至"过去的过去"，如"The code had been debugged before launch"强调在发射前已完成调试。最后打通应用任督二脉：当看到"by+时间点"就触发简单时态被动（The novel was finished by December），遇到"for+时间段"则自动匹配完成时态（The novel has been read for 3 months）。特别要警惕那些伪装者——since虽表示时间段，但强制要求完成时态主句，如"GDP has grown since 2020"（非is growing）。把这些规则放入真实场景检验：天气预报用"it's raining"制造临场感，而历史纪录片用"the war was raging"保持时间距离，两者差异正是时态系统的语用精髓。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 混淆过去进行时与一般过去时：学生常写出"I did my homework when my friend called"（应为was doing）。根源在于将"动作持续时间"与"动作完成时间"概念混淆。过去进行时强调背景动作的持续性（如做作业持续2小时），而一般过去时标记的是打断性瞬间动作（如朋友来电）。</p>
<p>2. 错误使用现在完成进行时：典型错误如"She has worked here since 2010"（正确应为has been working）。学生常忽视"-ing"形式对"持续至今"的视觉化暗示，导致无法区分"已完成"（has worked）和"仍继续"（has been working）的微妙差异。数据表明，在表达"从过去延续到现在"的场景中，92%的母语者优先选用进行时态。</p>
<p>3. 被动语态中的时态错位：常见错误"The report was being written by him yesterday at 8pm"（正确应为was written）。学生过度使用进行时被动结构，却忽略了"具体时间点+被动"的黄金组合规则——当出现精确时间状语（如yesterday at 8pm）时，简单时态被动语态才是标准选择。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
