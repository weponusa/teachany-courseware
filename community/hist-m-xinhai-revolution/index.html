      <h2>辛亥革命</h2>
      <p>孙中山等革命派提出三民主义，发动武装起义。1911年武昌起义后各省响应，清朝统治瓦解，中华民国建立，结束两千多年帝制，民主共和观念传播，但胜利果实被袁世凯等窃取，反帝反封建任务未完成。</p>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>实例一：现代城市道路命名中的革命记忆。武汉"首义路"、广州"起义路"等全国38个城市存在的这类路名，直接源自对辛亥革命地理坐标的纪念。2011年辛亥革命百年时，百度地图推出"数字纪念馆"功能，用户可查看全国128处革命遗址的AR复原。</p>
<p>实例二：影视制作中的考据应用。电视剧《走向共和》服装组查阅1911-1912年海关报告，还原当时革命军服混搭现象：汉口起义部队着新军制服但左臂缠白巾，南京临时政府官员有的穿西装有的着长衫。这种细节考证依赖对革命时期社会转型的深入研究。</p>
<p>实例三：区块链技术在文物确权中的运用。2023年台北故宫将孙中山《建国大纲》手稿等12件辛亥革命文物上链，利用NFT技术解决跨境展览中的真伪争议。每件文物都附带1912年临时政府公报的数字化档案作为权属证明。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>问题一：为什么武昌起义后革命能迅速席卷全国，而之前十年间多次起义均告失败？分析线索：注意1911年与之前不同的关键变量——保路运动导致湖北新军调防造成的防御真空；立宪派士绅态度的转变（可对比1908年各省咨议局立场）；观察革命军占领武汉三镇后颁布的《鄂州约法》对地方实力派的政策吸引力。</p>
<p>问题二：如何评价"辛亥革命是资产阶级革命"这个传统论断？思考路径：统计南京临时政府9部总长中实业家占比（仅张謇1人）；分析《临时约法》第5条"人民有保有财产及营业之自由"的实际落实情况；对比同期江浙资本家对革命的实际资助金额（约占军费总额15%）与传统地主士绅的贡献比例。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先看19世纪末的中国如何走到革命前夜：甲午战败后，民族危机催生出1895年广州起义等早期尝试，但孙中山等海外革命者与国内实际脱节。接着关键转折出现在1905年，同盟会成立提出"驱除鞑虏"口号，同时清廷"预备立宪"暴露顽固本质——1908年《钦定宪法大纲》仍规定皇帝有权"颁行法律及发交议案"，这种假改革激化矛盾。当1911年5月"皇族内阁"13人中满族占9人时，连立宪派都转向革命。</p>
<p>革命爆发过程充满戏剧性：10月9日孙武在汉口俄租界配制炸弹意外爆炸，导致起义计划泄露，新军士兵在群龙无首状态下于10月10日晚自发举事。值得注意的是革命后的权力重组：湖北军政府推举旧军官黎元洪为都督，反映出革命派组织力的不足。最后聚焦民国建立的制度设计：1912年3月颁布的《临时约法》将总统制改为责任内阁制，这种因人（防范袁世凯）设法的制度安排，为后续府院之争埋下伏笔。</p>
<p>理解革命影响需要多维数据支撑：经济上，1912年新注册工厂数激增至1313家（1903-1908年均不足百家）；教育上，1915年全国新式学堂学生数较1909年增长3倍；但政治上，1913年宋教仁遇刺暴露民主转型的脆弱性。这种进步与局限并存的复杂面相，正是分析辛亥革命历史地位的关键。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>错误一：认为辛亥革命完全由孙中山领导。学生常忽略其他革命团体如共进会、文学社的作用。认知根源在于教材对孙中山"国父"形象的强化叙述。实际上1911年武昌起义爆发时孙中山正在美国筹款，首义是由湖北新军中蒋翊武、孙武等组织的。正确理解是：辛亥革命是多方力量共同推动，仅1911年全国就发生20余次武装起义，孙中山领导的同盟会只是其中一支。</p>
<p>错误二：将"推翻帝制"等同于立即实现民主。学生容易将1912年民国建立视为民主制度的完成态。认知根源在于线性进步史观的影响。事实上《临时约法》颁布后，中国仍经历袁世凯称帝（1915）、张勋复辟（1917）等倒退。正确理解是：辛亥革命只是民主进程的开端，直到1928年东北易帜才真正实现形式上的全国统一。</p>
<p>错误三：高估革命后社会变革程度。学生常误以为剪辫、放足等移风易俗政策立即普及。认知根源在于将政府法令等同于社会现实。据1914年警务报告，北京城内仍有1/3男性留辫。正确理解是：社会变革具有滞后性，直到20世纪30年代，福建等地农村仍存在"辫子税"这种变通政策。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();

<script id="histm-depth-js">
function histmDepthCheck(button, isCorrect, feedbackId, explanation) {
  var box = button.closest('.module-check');
  if (!box || box.dataset.answered) return;
  box.dataset.answered = '1';
  box.querySelectorAll('button').forEach(function (item) {
    item.disabled = true;
    if (item.dataset.correct === '1') item.classList.add('correct');
  });
  if (!isCorrect) button.classList.add('wrong');
  var feedback = document.getElementById(feedbackId);
  if (feedback) {
    feedback.style.display = 'block';
    feedback.textContent = (isCorrect ? '正确。' : '再想想。') + explanation;
  }
}
