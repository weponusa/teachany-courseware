  <section class="section engh-depth core-knowledge-module text-module" id="lesson-method"

    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：主干优先，层层剥离</h2>
      <p>划出主谓宾，把从句与非谓语当作“零件”判断其作用；长难句先译主干。</p>
      <div class="worked-example"><strong>范例：</strong>The book that he recommended was worth reading. 主干：The book was worth reading.</div>
      <p id="lesson-pitfall" class="engh-pitfall"><strong>常见误区：</strong>常见误区是平行结构看走眼，或主谓一致被插入语干扰。</p>
      <div class="module-check" data-conceptest="true">

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 国际商务邮件中的虚拟语气：在伦敦某贸易公司2023年内部审计中发现，87%的初级职员会在"Should you require further information..."这类条件式商务套话中使用错误时态。正确的虚拟语气结构让提议显得更专业委婉，直接影响5.3%的客户响应率。</p>
<p>2. 科技论文中的分词结构：Nature期刊2022年统计显示，材料科学领域论文摘要中平均每篇使用2.7个现在分词短语（如"Using TEM microscopy, we observed..."）。这种紧凑语法结构能在有限字数内呈现研究方法与结论的因果关系。</p>
<p>3. 法律条文中的定语从句：美国最高法院2021年判例中，关键争议点在于某环境保护法条款中"the factories which discharge over 50 tons annually"是否包含逗号。最终判决认定无逗号的限制性从句将约束范围缩小至特定工厂群体，影响全美37家企业的排污标准。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. 为什么英语母语者会自然区分"the teacher wearing glasses"和"the teacher, wearing glasses"？观察两类表达在口语中的语调差异：限制性定语从句中"wearing glasses"通常与前面名词合成一个语调群，整体音调较高；而非限制性插入成分前后有明显停顿，且"wearing glasses"音调明显下降。这种语音特征如何反证书面语中逗号的语法功能？</p>
<p>2. 在"I insist that he (should) be punished"和"I insist that he is punished"中，虚拟语气与陈述语气导致怎样的语义差异？比较英美法庭记录发现：英国法官87%使用虚拟语气表示主张，而美国法官62%倾向陈述语气直接陈述事实。这种语法选择如何反映不同法系对"主张"与"事实"的界定差异？</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先看这个两难选择：新闻报道需要同时满足"客观陈述"和"突出重点"时，语法如何帮忙？这引出了非谓语动词的核心价值——用"Seeing the accident, the reporter called 120"这样的结构，既保持动作时间顺序，又通过分词短语制造视觉焦点。接着会发现，这种浓缩表达带来新问题：当多个动作共享主语时，学生常像摆积木般堆砌"Opening the door, taking the bag, going downstairs"，暴露出对逻辑主语的模糊认知。此时需要引入"悬垂分词"概念，通过对比"Walking in the park, the flowers smelled sweet"(错误)与"Walking in the park, I smelled the sweet flowers"(正确)来强化主谓逻辑。最后在虚拟语气中，语法系统展现出惊人的精密性：从"If I were you"的与现在事实相反，到"If I had been there"的与过去事实相反，时态倒退机制如同数学公式般严格。但最具迷惑性的是混合虚拟，比如"If he had followed the doctor's advice yesterday, he wouldn't be in hospital now"中，前半句用过去完成表过去未实现，后半句用would+动词原形表现在结果，这种时空切换正是语法综合进阶的分水岭。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 非谓语动词逻辑主语混淆：学生常写出"Having finished homework, the TV was turned on"这类错误。根源在于机械记忆"doing作状语"的规则，却忽视分词短语必须与主句主语构成逻辑主谓关系。正确理解如"Having finished homework, Tom turned on the TV"中，Tom既是finish的动作发出者，又是turn on的执行者。</p>
<p>2. 虚拟语气时间错位：在"If he came yesterday, he would attend the meeting"中错误使用came而非had come。学生混淆了与现在/将来事实相反的虚拟条件句（用过去式）和与过去事实相反的虚拟条件句（用过去完成式）。正确结构应为"If he had come yesterday, he would have attended..."</p>
<p>3. 限制性定语从句误用逗号：约65%的学生在"The book, which has a blue cover is mine"中错误添加逗号。其认知误区是将所有which引导的从句都视为非限制性定语从句。实际上，当定语从句限定范围时（如从多本书中指定蓝皮的那本），必须去掉逗号变为"The book which has a blue cover is mine"。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>

  box.dataset.answered = '1';
  box.querySelectorAll('button').forEach(function (item) {
    item.disabled = true;
    if (item.dataset.correct === '1') item.classList.add('correct');
  });
  if (!isCorrect) button.classList.add('wrong');
  var feedback = document.getElementById(feedbackId);
  if (feedback) {
    feedback.style.display = 'block';
    feedback.textContent = (isCorrect ? '正确。' : '再想想。') + explanation;
  }
}
</script>
