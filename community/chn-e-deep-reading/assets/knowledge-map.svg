<circle cx="387.0" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="399.0" y="192.0" font-size="13.5" fill="#334155">边读边问“为什么”“说明了什么”，才能读</text>
<text x="399.0" y="214.0" font-size="13.5" fill="#334155">出更丰富的含义</text>
