<text x="1035.0" y="192.0" font-size="13.5" fill="#334155">像拆积木一样把文章分成开头、经过、结</text>
<text x="1035.0" y="214.0" font-size="13.5" fill="#334155">尾</text>
<circle cx="1023.0" cy="231.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="1035.0" y="236.0" font-size="13.5" fill="#334155">给每段话标出&#x27;作者想说什么&#x27;小标签</text>
<circle cx="1023.0" cy="253.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="1035.0" y="258.0" font-size="13.5" fill="#334155">比一比哪个人物动作描写最生动</text>
