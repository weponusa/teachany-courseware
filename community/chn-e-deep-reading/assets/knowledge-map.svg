<text x="706.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">方法：三问法——写什么、怎么写、为</text>
<text x="706.0" y="172.0" font-size="16.0" font-weight="700" fill="#0f172a">什么</text>
<circle cx="705.0" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="717.0" y="192.0" font-size="13.5" fill="#334155">把疑问记在旁边，课堂讨论时拿出来说</text>
<circle cx="705.0" cy="209.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="717.0" y="214.0" font-size="13.5" fill="#334155">常见误区是只追故事结局，或把阅读题答</text>
<text x="717.0" y="236.0" font-size="13.5" fill="#334155">成“我觉得好看”</text>
<circle cx="705.0" cy="253.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="717.0" y="258.0" font-size="13.5" fill="#334155">完成所有关卡解锁满分</text>
