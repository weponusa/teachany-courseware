    <div class="card">
      <span class="phase-tag">知识精讲</span>
      <h2>世界人口与人种</h2>
      <p>世界人口分布不均匀：沿海、平原、气候适宜地区较稠密，干旱、高寒、湿热雨林等地区较稀疏。人口问题包括增长、迁移与老龄化等。人种划分是自然特征分类，要树立平等观念，反对种族歧视。</p>
    </div>
  </section>
<section class="slide-page" data-page-type="content" data-tsh="方法范例">
  <section class="section geom-depth core-knowledge-module text-module" id="lesson-method"
    data-bloom-level="apply" data-scaffold="partial" data-tts="lesson-method">
    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：稠密稀疏找原因</h2>
      <p>从自然（地形气候水源）与社会经济（交通工农业历史）两方面分析分布。</p>
      <div class="worked-example"><strong>范例：</strong>东亚、南亚、欧洲西部、北美东部是人口稠密区的典型代表。</div>
      <p id="lesson-pitfall" class="geom-pitfall"><strong>常见误区：</strong>常见误区是只谈自然原因忽视经济，或对人种持偏见。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练：辨析要点</h3>
        <p>人口分布稀疏的地区往往是？</p>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 东京地铁客流调控：利用人口密度热力图（市中心23区高达15,000人/km²），在早晚高峰实施差异化票价。山手线在7:30-9:00期间对进站乘客收取20%附加费，使每小时客流从12万降至9万人次，这是人口分布知识在城市交通中的直接应用。</p>
<p>2. 新冠疫苗分配算法：WHO根据人口空间分布数据，为非洲54国设计疫苗分发方案。考虑尼日利亚拉各斯（2,100人/km²）与北部沙漠区（4人/km²）的差异，采用"人口密度+交通可达性"双因子模型，使疫苗覆盖率提升37%。</p>
<p>3. 语言学习APP本地化：多邻国（Duolingo）根据全球人口迁移数据调整课程内容。针对美国墨西哥裔聚居区（如加州南部），增加西班牙语教学中的农业词汇；对法国巴黎郊区（非裔人口占18%）则强化商务法语场景，体现人口分布与文化传播的关系。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. 问题：为什么加拿大90%人口集中在美加边境100公里范围内，而澳大利亚却集中在东南沿海？引导分析：比较两国自然条件的差异点（如加拿大冻土带分布与澳大利亚西部沙漠的形成原因），再思考殖民历史对多伦多vs悉尼等核心城市选址的影响，最后结合当前产业布局（加拿大汽车工业带与澳大利亚矿业分布）进行综合解释。</p>
<p>2. 问题：非洲裔在美国篮球运动员中占比73%，但在游泳项目中仅占2%，这是否能证明人种体质差异？引导分析：先查找美国公共游泳池数量在黑人社区与白人社区的分布差异（底特律黑人区每10万人0.5个泳池vs白人区3.2个），再追溯20世纪种族隔离政策对体育设施投入的影响，最后思考社会经济因素与所谓"天赋"的关联性。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先从一个矛盾现象切入：地球陆地面积1.49亿km²中，90%人口集中在10%的土地上。接着用北纬60°-40°"人口腰带"为例（集中了全球65%人口），引出人口分布的四极：东亚（中国长三角密度达800人/km²）、南亚（恒河平原占印度43%人口）、欧洲西部（莱茵河流域每平方公里超300人）、北美东部（波士华城市带）。然后分析自然因素的决定性作用——亚马逊平原占巴西面积60%却只有5%人口，而青藏高原每平方公里不足2人，说明气候、地形、水源的基础限制。但接着要打破简单决定论：同样位于沙漠带，尼罗河谷地人口密度高达1,500人/km²，而澳大利亚内陆几乎无人，这引出了人类改造能力的关键作用。最后落到动态发展视角：美国"阳光带"迁移（1950-2020年南部人口占比从28%升至40%）、中国"胡焕庸线"东侧人口占比94%的稳定性，说明科技、政策等因素正在重塑但未根本改变分布格局。贯穿始终的核心方法是：读图时先找经纬度参照系，再叠加地形图层，最后用人口密度色阶图验证假设，例如分析法国人口为何既集中又分散——巴黎大都会区占全国19%人口，但全国城市化率80%体现均衡发展。</p>
</section>

<h3>🔍 易错点辨析</h3>
<p>1. 错误表现：认为"人口密度=人口数量"。学生常将巴西（2.15亿人）和澳大利亚（0.26亿人）直接比较得出巴西人口更多的结论。认知根源在于混淆了绝对数量与分布强度的概念。正确理解应对比两国人口密度（巴西25人/km² vs 澳大利亚3人/km²），结合亚马逊雨林和内陆沙漠对分布的影响，说明澳大利亚人口集中分布在东南沿海的特征。</p>
<p>2. 错误表现：将人种与国籍划等号。看到非洲裔就认定是"非洲人"，忽视美国有13.6%的黑人人口。这种错误源于将生物学特征与社会身份简单对应。正确理解需区分人种（基于肤色、发质等体质特征）与民族/国籍概念，例如巴西作为种族熔炉，其1.2亿混血人口占全国47%，不能简单用三大人种划分。</p>
<p>3. 错误表现：用当前数据线性推演人口增长。有学生认为印度（2023年14.28亿）会永远保持比中国（14.26亿）更快增长。这忽视了生育率变化，印度总和生育率已从1950年的5.9降至2023年的2.0，接近更替水平。正确分析应结合年龄结构（印度中位年龄28岁 vs 中国39岁）和社会经济发展综合判断。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
