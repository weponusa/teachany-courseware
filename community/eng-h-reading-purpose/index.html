      <h2>阅读主旨与目的题</h2>
      <p>主旨题抓全文中心，目的题关注写作意图（告知、说服、娱乐等）。看首尾段与各段首句，区分“段落大意”与“全文主旨”，警惕细节冒充主旨。</p>

      <p>把每段用四个词概括，再合并；选项过宽过窄都错。目的题关注读者收获。</p>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 医学研究报告解读：当医生阅读《柳叶刀》关于新冠疫苗有效性的研究时，需准确识别"83%防护率"是支持"疫苗有效"这一主旨的关键证据，而非研究本身结论。这种能力直接影响医疗决策的准确性。</p>
<p>2. 商业竞品分析：某手机品牌市场部对比分析竞争对手发布会内容时，通过统计"innovation"一词出现频次（12次/千词）及位置（80%在开场5分钟），准确判断其营销策略核心是技术形象塑造而非价格战。</p>
<p>3. 社交媒体舆情监控：TikTok平台使用NLP技术自动识别热门视频的purpose倾向，当检测到"should"等情态动词密度超过15%时标记为"劝导型内容"，2023年数据显示该算法准确率达92%。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. 当文本出现矛盾信息时如何判断主旨？例如某篇气候文章同时呈现"全球变暖速度减缓"数据和"极端天气增加"案例。注意统计矛盾双方所占篇幅比例（如70% vs 30%），观察转折词（however, but）出现位置，通常后者才是作者真正立场。</p>
<p>2. 文化差异如何影响purpose识别？对比《经济学人》和《人民日报》关于同一经济事件的报道：前者多用irony（反讽）表达批判，后者常用"新征程"等隐喻体现建设性。建议建立文体库统计不同源文本的特征词频。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先要明确阅读目的题的本质是解码作者意图，这需要区分三个层次：最表层是文本类型（如argumentative essay中80%会出现thesis statement），接着分析语言特征（某环保倡议书中"we must act now"出现5次体现urgency），最后结合社会语境（如疫情后健康类文章普遍转向precaution而非alarm）。具体操作时，先快速扫描首段和结论段定位主旨句，某研究显示这两处出现核心观点的概率达73%；接着用"动词分析法"——说明文多用explain/demonstrate（占60%以上），议论文倾向argue/persuade；最后检查文本一致性，当数据与观点出现断层时（如引用2020年数据论证2023年趋势），往往暗示真实目的可能是警示现状而非预测未来。典型如剑桥真题Test4中，通过统计"historical comparison"部分仅占全文20%，就能判断其核心目的是分析当下教育模式而非怀旧。</p>
</section>

  <h2 class="section-title">📚 深度理解</h2>
<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 混淆主旨与细节：学生常将支撑性细节当作主旨，比如将文中"65%的英国青少年使用TikTok学习俚语"这一数据当作主旨。根源在于未识别作者用此数据实为论证"社交媒体正在改变语言学习方式"的核心观点。正确做法应通过高频重复词（如change, influence等）和段落首尾句定位主旨。</p>
<p>2. 过度推断目的：面对环保主题文本，学生常误判"呼吁捐款"为作者目的，而实际文本仅呈现了北极熊数量下降30%的数据。这种错误源于将个人联想等同于文本意图，需严格依据文中明确出现的动词（如inform, analyze）和情态词（may, should）来判断。</p>
<p>3. 忽视文体特征：在分析科技说明文时，学生容易忽略"objective"（客观性）这一关键特征。例如某篇关于量子计算的文本中，虽然出现"revolutionary"一词，但全文85%的句子使用被动语态和第三人称，实际目的是解释而非宣传。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
