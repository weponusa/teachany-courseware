      <p>长三角地处长江入海口，地势低平，水网密布，气候湿润，交通便利，是我国经济最活跃的区域之一。城市密集，工商业发达，一体化发展强调协作与优势互补。</p>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. <strong>上海洋山港自动化码头</strong>：全球最大集装箱港的选址直接运用了三角洲前缘深水岸线知识。L4级无人集卡依托对长江主泓（main channel）南偏5°的精确测绘，使40万吨级货轮吃水深度控制在16米内，2023年吞吐量突破4900万标准箱。</p>
<p>2. <strong>太湖蓝藻预警系统</strong>：中科院南京地理所通过反演1990-2022年太湖营养盐输入数据，建立流域模型。当卫星遥感显示叶绿素a浓度＞40μg/L时，自动触发湖州-无锡联合调度机制，2023年蓝藻暴发面积同比减少62%。</p>
<p>3. <strong>绍兴纺织业转型</strong>：基于三角洲土壤承载力8-12t/m²的研究，柯桥区将3.2万家纺织厂整合为197个产业园。采用"地下污水处理+地上光伏"的立体模式，单位GDP能耗从2015年0.78吨标煤降至2023年0.41吨。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. <strong>为何长江口北支正在萎缩？</strong>对比1855年与2020年地图可见，北支宽度从18km缩至3km。从科氏力（Coriolis force）和潮汐不对称性角度分析：长江主泓受地转偏向力影响持续南偏，而东海前进潮波在崇明岛东端形成流速差，导致北支年均淤积量达1.2亿m³。思考：这种变化对启东港的航运功能意味着什么？</p>
<p>2. <strong>长三角"Z"字形高铁网的地理逻辑</strong>：观察沪宁杭高铁走向，为何不采用直线连接？从基底断裂带（basement fault）和软土层分布来看，苏州-湖州段需绕行太湖南缘避开吴江沉降区（年均沉降速率＞20mm）。如果要在嘉兴规划磁浮线路，需要收集哪些岩土工程参数？</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先看长江入海口那浑黄的"鸟爪状"卫星图，这是年均4.8亿吨泥沙遇到东海潮汐顶托形成的典型radial状三角洲。当明代治水专家潘季驯提出"束水攻沙"时，就已触及现代地貌学核心——河流动力与海洋动力的博弈。接着定位到31°N,121°E这个坐标，上海陆家嘴摩天楼群正矗立在距今7000年前的古海岸线上，这里1.2万年来沉积了厚达300米的第四纪地层，造就了承载力惊人的地基。</p>
<p>当我们将比例尺缩放到1:50万，会看见太湖就像镶嵌在三角洲上的蓝宝石。这个2427km²的潟湖（lagoon）其实是古长江的弃河道，北宋单锷《吴中水利书》记载的"三江既入"指的就是它连通长江的古水道。最后聚焦当代，长三角城市群正在复刻德国莱茵鲁尔区的产业布局：上海张江的芯片设计（设计环节）、苏州工业园的晶圆制造（制造环节）、合肥的封装测试（配套环节），形成了一条基于冲积平原交通优势的完整产业链。2023年这里以2.2%的国土面积贡献了全国24%的GDP，每平方公里铁轨密度达12.8公里，是德国北威州的1.7倍。这种空间效率的秘密，就藏在沉积旋回（sedimentary cycle）造就的均质平原里。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. <strong>误认为长江三角洲完全由长江冲积形成</strong>：学生常将2.3万平方公里的三角洲全部归因于长江泥沙沉积（年均输沙量4.8亿吨），实际上钱塘江和东海潮汐共同塑造了南部地貌。这种误解源于教材对"潮坪地貌"（tidal flat）的淡化，例如杭州湾北岸的漕泾湿地就是典型的潮汐沉积区，其沉积物粒径（0.02-0.05mm）明显细于长江主河道沉积（0.1-0.3mm）。</p>
<p>2. <strong>混淆"核心区16市"与"城市群26市"范围</strong>：考试中常见将南通划入核心区（实际属于城市群扩展区），这是对2016年《长三角城市群发展规划》的误读。核心区严格指代沪苏浙皖交界的16个地级市，如2022年GDP达4.2万亿的苏州工业园区就属于核心区，而GDP1.1万亿的盐城则属于规划中的辐射区。</p>
<p>3. <strong>低估河网密度对农业的影响</strong>：面对"为何水稻亩产超600kg"的题，学生多答"气候温暖"，忽略6.4km/km²的河网密度才是关键。明代《农政全书》记载的"圩田体系"至今仍在运作，例如湖州菱湖镇的"鱼稻轮作"模式，利用密集河网实现年产值3.8万元/亩，是纯旱作农业的4.2倍。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
