<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 智能客服对话优化：阿里巴巴客服系统使用七选五逻辑分析技术，当用户输入"订单未收到"时，系统从7个预设响应中筛选5个最符合上下文逻辑的选项，使对话连贯性提升60%。这直接应用了语篇类型分析中的"问答匹配"原则。</p>
<p>2. 医学论文摘要生成：PubMed的AI摘要器需要从7个研究结论中选择5个组成连贯摘要。2023年斯坦福大学研究显示，采用"首尾句锚定法"——先确定开头结尾句再填充中间内容，使摘要逻辑评分提高2.3个点，这正是七选五的"框架优先"策略。</p>
<p>3. 法律文书自动校对：纽约某律所的合同审查软件运用七选五的干扰项识别技术，检测条款中逻辑断裂处。当发现"甲方义务"段落突然插入无关条款时，会从7个修正建议中推荐5个保持文书连贯性的选项，错误检出率达89%。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. 当选项中出现两个看似都符合语法的答案时，如何突破选择困境？思考方向：比较两者与上下文的"逻辑摩擦力"——哪个选项需要更少的额外解释就能融入现有语篇？例如某真题中选项A和D都含正确时态，但D中"in contrast"与后文"similarly"形成矛盾，而A的"furthermore"则保持递进关系。</p>
<p>2. 为什么有些正确选项反而与段落关键词汇重合度最低？分析路径：考察语篇的"信息流动"需求——当段落需要引入新信息时，重复旧词汇的选项可能造成冗余。如某科普文在解释黑洞概念后，正确选项恰是包含"event horizon"这个前文未提但必要的术语。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先要理解七选五的本质是语篇完形，不同于传统完形填空的单词层面，它考察的是"信息块"的组合逻辑。以2024年新课标卷为例，文章从"珊瑚白化现象"的记叙突然转向科学说明，此时必须捕捉到"according to marine biologists"这个文体转换信号。接着掌握三大定位工具：逻辑词（如however/therefore占选项特征的38%）、指代关系（this/those等占21%）、文体标志（议论文中70%正确选项含论证动词）。最后落实到操作层面，采用"三步排除法"——首筛3个明显无关项，再比对剩余4项与上下文的"逻辑接口"，例如某旅游指南题中，虽选项B、F都提及"local cuisine"，但只有F中的"after visiting the museum"与前文行程安排形成时间序列。整个过程就像组装语义乐高，每个选择必须同时满足形式衔接和内容推进的双重要求。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 忽视语篇连贯性：学生常孤立看待选项，忽略前后句的逻辑衔接。例如在2022年高考真题中，超43%的错误选择是由于未发现空格后"however"与选项C中"despite"的转折呼应。根源在于将七选五当作单句填空，正确做法应建立"三句定位法"——同时分析空格前一句、后一句及选项中的逻辑词。</p>
<p>2. 文体特征混淆：议论文中误选记叙性描写。某模拟题显示，当文章讨论"社交媒体成瘾"时，32%学生被选项E中生动的个人故事吸引，却忽略了该段需要数据支撑的论证句式。这反映出对"文体决定语言特征"的理解不足，议论文空格优先考虑含"studies show/statistics indicate"等标志词的选项。</p>
<p>3. 过度依赖词汇复现：看到相同词汇就盲目选择。如2023年某市质检题，选项G出现与段落相同的"carbon emission"，但实际需要的是解释碳排放机制的说明句而非重复术语的无效选项。此类错误占比27%，说明学生未建立"语义匹配＞词汇匹配"的筛选原则。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {

        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>

<script id="engh-depth-js">
function enghDepthCheck(button, isCorrect, feedbackId, explanation) {
  var box = button.closest('.module-check');
  if (!box || box.dataset.answered) return;
  box.dataset.answered = '1';
  box.querySelectorAll('button').forEach(function (item) {
    item.disabled = true;
    if (item.dataset.correct === '1') item.classList.add('correct');
  });
  if (!isCorrect) button.classList.add('wrong');
  var feedback = document.getElementById(feedbackId);
  if (feedback) {
    feedback.style.display = 'block';
    feedback.textContent = (isCorrect ? '正确。' : '再想想。') + explanation;
  }
}
</script>
