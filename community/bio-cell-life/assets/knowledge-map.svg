<text x="70.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">细胞膜的结构</text>
<circle cx="69.0" cy="187.0" r="3.4" fill="#2563eb" fill-opacity=".85"/>
<text x="81.0" y="192.0" font-size="13.5" fill="#334155">细胞膜主要由磷脂双分子层和</text>
<text x="81.0" y="214.0" font-size="13.5" fill="#334155">蛋白质构成</text>
<circle cx="69.0" cy="231.0" r="3.4" fill="#2563eb" fill-opacity=".85"/>
<text x="81.0" y="236.0" font-size="13.5" fill="#334155">肥皂泡实验可以模拟细胞膜</text>
<rect x="307.4" y="128" width="236.4" height="166" rx="14" fill="#ffffff" stroke="#2563eb" stroke-opacity=".35" stroke-width="2"/>
<path d="M321.4 128 h208.4 a14,14 0 0 1 14,14 v30.0 h-236.4 v-30.0 a14,14 0 0 1 14,-14 z" fill="#2563eb" fill-opacity=".13"/>
<text x="324.4" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">光照强度对绿萝淀粉产量的</text>
<text x="324.4" y="172.0" font-size="16.0" font-weight="700" fill="#0f172a">影响</text>
<circle cx="323.4" cy="187.0" r="3.4" fill="#2563eb" fill-opacity=".85"/>
<text x="335.4" y="192.0" font-size="13.5" fill="#334155">设计实验验证不同光照条件下</text>
<text x="335.4" y="214.0" font-size="13.5" fill="#334155">叶片淀粉含量变化</text>
<rect x="561.8" y="128" width="236.4" height="166" rx="14" fill="#ffffff" stroke="#2563eb" stroke-opacity=".35" stroke-width="2"/>
<path d="M575.8 128 h208.4 a14,14 0 0 1 14,14 v30.0 h-236.4 v-30.0 a14,14 0 0 1 14,-14 z" fill="#2563eb" fill-opacity=".13"/>
<text x="578.8" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">被动运输</text>
<circle cx="577.8" cy="187.0" r="3.4" fill="#2563eb" fill-opacity=".85"/>
<text x="589.8" y="192.0" font-size="13.5" fill="#334155">自由扩散是小分子（如氧气）</text>
<text x="589.8" y="214.0" font-size="13.5" fill="#334155">直接穿过磷脂层</text>
<circle cx="577.8" cy="231.0" r="3.4" fill="#2563eb" fill-opacity=".85"/>
<text x="589.8" y="236.0" font-size="13.5" fill="#334155">泡发干货时，干海带吸水变软</text>
<text x="589.8" y="258.0" font-size="13.5" fill="#334155">就是渗透现象——水分子…</text>
<rect x="816.2" y="128" width="236.4" height="166" rx="14" fill="#ffffff" stroke="#2563eb" stroke-opacity=".35" stroke-width="2"/>
<path d="M830.2 128 h208.4 a14,14 0 0 1 14,14 v30.0 h-236.4 v-30.0 a14,14 0 0 1 14,-14 z" fill="#2563eb" fill-opacity=".13"/>
<text x="833.2" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">主动运输</text>
<circle cx="832.2" cy="187.0" r="3.4" fill="#2563eb" fill-opacity=".85"/>
<text x="844.2" y="192.0" font-size="13.5" fill="#334155">这个过程占人体静息耗能的1/3</text>
<circle cx="832.2" cy="209.0" r="3.4" fill="#2563eb" fill-opacity=".85"/>
<text x="844.2" y="214.0" font-size="13.5" fill="#334155">儿童喝高钙牛奶时</text>
<rect x="1070.6" y="128" width="236.4" height="166" rx="14" fill="#ffffff" stroke="#2563eb" stroke-opacity=".35" stroke-width="2"/>
<path d="M1084.6 128 h208.4 a14,14 0 0 1 14,14 v30.0 h-236.4 v-30.0 a14,14 0 0 1 14,-14 z" fill="#2563eb" fill-opacity=".13"/>
<text x="1087.6" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">胞吞胞吐</text>
<circle cx="1086.6" cy="187.0" r="3.4" fill="#2563eb" fill-opacity=".85"/>
<text x="1098.6" y="192.0" font-size="13.5" fill="#334155">胞吞胞吐是运输‘大件行李’的</text>
<text x="1098.6" y="214.0" font-size="13.5" fill="#334155">方式</text>
<circle cx="1086.6" cy="231.0" r="3.4" fill="#2563eb" fill-opacity=".85"/>
<text x="1098.6" y="236.0" font-size="13.5" fill="#334155">伤口化脓时，脓液里的死亡白</text>
<text x="1098.6" y="258.0" font-size="13.5" fill="#334155">细胞就是通过胞吐作用把…</text>
<text x="1316" y="340" font-size="13" fill="#94a3b8" text-anchor="end">TeachAny · bio-cell-life</text>
