<text x="589.8" y="192.0" font-size="13.5" fill="#334155">句式就像搭积木，同样的词语</text>
<text x="589.8" y="214.0" font-size="13.5" fill="#334155">换顺序能变成不同句子</text>
<circle cx="577.8" cy="231.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="589.8" y="236.0" font-size="13.5" fill="#334155">就像把玩具从左手换到右手，</text>
<text x="589.8" y="258.0" font-size="13.5" fill="#334155">东西没变但感觉不一样</text>
