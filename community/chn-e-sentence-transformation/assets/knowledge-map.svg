<text x="335.4" y="192.0" font-size="13.5" fill="#334155">改完读一读，确认意思没变、</text>
<text x="335.4" y="214.0" font-size="13.5" fill="#334155">语句通顺</text>
<circle cx="323.4" cy="231.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="335.4" y="236.0" font-size="13.5" fill="#334155">常见误区是改了句式却改变原</text>
<text x="335.4" y="258.0" font-size="13.5" fill="#334155">意，或标点人称漏改</text>
