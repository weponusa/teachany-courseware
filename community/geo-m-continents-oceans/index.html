      <h2>大洲大洋与海陆变迁</h2>
      <p>全球七大洲、四大洋。海陆分布不是固定不变的：沧海桑田有沉积、地壳运动等证据；大陆漂移与板块构造解释大洲大洋的形成与变化。认识“变动中的地球表面”。</p>

      <p>先在地图上定位大洲大洋，再举化石、海岸线吻合、火山地震带等证据理解变迁。</p>

<section class="section" id="extended-reading" data-bloom-level="analyze" data-tts="extended-reading" data-tsh="拓展阅读">
  <h2 class="section-title">📖 拓展阅读</h2>
<div class="card purple">
<h3>🌍 跨学科联系</h3>
</div>
<div class="card purple">
<p>1. <strong>与物理学的联系</strong>：大陆漂移学说与板块运动理论直接应用了物理学中的流体力学原理。1912年阿尔弗雷德·魏格纳提出假说时，就借助了地球自转产生的科里奥利力解释大陆移动方向。现代地幔对流模型则完全建立在热对流物理公式基础上，如雷利-贝纳德对流方程（Rayleigh-Bénard convection）被用于计算地幔物质上升速率。</p>
</div>
<div class="card purple">
<p>2. <strong>与生物学的联系</strong>：大陆分布直接影响物种演化。南美洲与非洲海岸线形态的吻合性，通过两地发现的同种中龙（Mesosaurus）化石得到印证。现代生物地理学中"华莱士线"（1860年阿尔弗雷德·华莱士提出）正是基于亚澳板块分界形成的物种隔离带。</p>
</div>

<div class="card">
<h3>📜 来龙去脉</h3>
<p>1910年德国气象学家魏格纳在病床上发现大西洋两岸轮廓的惊人契合，1912年发表《大陆的起源》时却遭学界嘲讽。</p>
</div>
<div class="card">
<p>直到1950年代海洋勘探发现大西洋中脊的对称磁异常条带（1963年瓦因-马修斯假说），1968年"格洛玛·挑战者号"钻探证实海底年龄从洋中脊向两侧递增，板块构造理论才最终确立。</p>
<p>关键转折是1965年英国地球物理学家威尔逊提出转换断层概念，将大陆漂移、海底扩张统一为板块运动理论。</p>
</div>
<div class="card">
<p>该理论彻底改变了地理学认知框架：1977年发现的深海热泉生物群落，直接推翻了"生命依赖阳光"的传统生物链理论，促成极端环境生物学的新分支诞生。</p>
</div>
</section>
<section class="section" id="knowledge-context" data-bloom-level="understand" data-tts="knowledge-context" data-tsh="知识脉络">
  <h2 class="section-title">🧭 知识脉络</h2>
<div class="card purple">
<h3>📖 知识脉络梳理</h3>
</div>
<div class="card purple">
<p>同学们，今天我们用一个问题开启课堂：<strong>"为什么南美洲和非洲的海岸线能像拼图一样吻合？"</strong> 这背后隐藏着本节课的核心——<strong>大陆与海洋的分布规律</strong>。先看数据：地球表面71%是海洋（约3.61亿平方公里），29%是陆地（约1.49亿平方公里），但分布极不均匀——北半球陆地占39%，南半球仅19%。</p>
</div>
<div class="card purple">
<p>接下来我们聚焦<strong>七大洲四大洋的空间格局</strong>。亚洲面积4400万平方公里（占全球陆地30%），而大洋洲仅852万平方公里。太平洋最深处马里亚纳海沟达11034米，相当于把珠穆朗玛峰倒插进去还多2000米！通过对比各大洋平均深度（太平洋3940米vs北冰洋1205米），引导学生发现<strong>海底地形差异</strong>。</p>
</div>
<div class="card purple">
<p>理解分布后，我们要掌握<strong>分析地理特征的方法</strong>：1. 用板块构造学说解释喜马拉雅山每年增高1cm；2. 结合洋流图说明墨西哥暖流如何让英国冬季比同纬度加拿大暖和10℃；3. 通过南美洲西岸的荒漠与东岸雨林对比，理解<strong>海陆位置对气候的塑造</strong>。最后布置实践任务：让学生用黏土制作大西洋两岸大陆模型，验证大陆漂移说的证据。</p>
</div>
</section>

<section class="section" id="deep-understanding" data-bloom-level="understand" data-tts="deep-understanding" data-tsh="深度理解">
  <h2 class="section-title">📚 深度理解</h2>
<div class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 错误表现：将北冰洋误认为面积最小的海洋。</p>
<p>认知根源：学生常根据纬度高低判断大小，忽视实际测量数据。</p>
</div>
<div class="card">
<p>正确理解：四大洋按面积排序为太平洋(16525万km²)、大西洋(10646万km²)、印度洋(7342万km²)、北冰洋(1405万km²)，南冰洋(2032万km²)未被传统四大洋体系包含。</p>
<p>印度洋才是面积第三小的海洋。</p>
</div>
<div class="card">
<p>2. 错误表现：认为非洲与南美洲海岸线完全吻合。认知根源：只看简化版大陆轮廓图，忽略细节差异。正确理解：虽然大陆漂移学说证明两者曾连接，但实际海岸线存在约15°的夹角差异，且巴西东北部与几内亚湾的凹凸对应需精确测量才能确认，这是魏格纳当年论证时的关键难点。</p>
</div>
<div class="card">
<p>3. 错误表现：把格陵兰岛(216万km²)当作大陆。认知根源：混淆大陆与岛屿的划分标准。正确理解：大陆需满足"独立板块+显著地质差异"双条件，格陵兰虽大于澳大利亚大陆(769万km²)的最小分陆块，但属于北美板块延伸部分。教科书中七大洲划分本质是文化-地质复合标准。</p>
</div>

<div class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 国际航运路线规划：马士基航运公司利用大西洋洋流数据库设计节能航线，冬季借助北大西洋暖流可节省12%燃油。2023年数据显示，经直布罗陀海峡-苏伊士运河的亚欧航线比绕道好望角缩短9000公里，这直接关联印度洋与地中海的空间关系认知。</p>
</div>
<div class="card teal">
<p>2. 地震预警系统建设：日本气象厅根据太平洋板块俯冲带监测数据，在2011年东海地震前78秒发出预警。理解板块边界类型(此处为汇聚型)能预判地震烈度分布，目前全球83%的海沟型地震发生在环太平洋火山带。</p>
</div>
<div class="card teal">
<p>3. 极地科考站选址：中国南极昆仑站建于冰穹A(Dome A)并非偶然，该点位于东南极冰盖中心(南纬80°25′)，是研究冰芯记录全球气候变迁的理想位置。选址需综合考量大陆冰流方向、地质稳定性等要素，涉及南极洲作为独立板块的特殊性。</p>
</div>

<div class="card amber">
<h3>🧩 深入追问</h3>
<p>1. 问题：若未来巴拿马运河因地质活动消失，全球海运格局将如何变化？</p>
<p>分析引导：先比较现有运河与绕行合恩角的航程差异(缩短约1.3万公里)，再思考船舶尺寸限制带来的经济影响。</p>
<p>注意德雷克海峡的风浪强度是苏伊士运河的7倍，这会如何影响航运成本？</p>
</div>
<div class="card amber">
<p>最后考虑南美洲与北美洲重新连接对洋流系统的影响。</p>
<p>2. 问题：为什么印度板块北移速度(5cm/年)远超其他板块？</p>
<p>分析引导：从板块驱动力角度，比较地幔柱推力与板块拉力的差异。</p>
</div>
<div class="card amber">
<p>观察印度洋中脊扩张速率(16mm/年)与喜马拉雅抬升速率(1cm/年)的数据矛盾，思考特提斯洋闭合后的板块惯性运动。</p>
<p>可参考2015年尼泊尔地震的GPS位移数据辅助论证。</p>
</div>

<div class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先以"地球表面71%是海洋"这个宏观事实切入，引出人类认识海陆分布的历程——从麦哲伦环球航行证实海洋连通性，到魏格纳发现大西洋两岸古生物化石的相似性。</p>
</div>
<div class="card purple">
<p>接着用大陆漂移说的三大证据链：海岸线形态匹配(南美与非洲吻合度达85%)、古气候标志(南极洲发现二叠纪煤层)、古地磁异常(印度板块从南纬40°漂移至北纬20°)，自然过渡到板块构造理论。</p>
<p>以喜马拉雅山脉为例，解释印度板块以年均5cm速度撞击欧亚板块，导致珠峰仍在以4mm/年抬升。</p>
</div>
<div class="card purple">
<p>最后落实到读图方法：在卫星地图上识别洋中脊(如大西洋中脊年均扩张2.5cm)、海沟(马里亚纳海沟深11034米)等关键地貌，分析2011年日本海沟9级地震与太平洋板块俯冲的关联。</p>
<p>特别强调动态视角——红海每年扩张1.5cm，5000万年后将形成新的大洋；</p>
</div>
<div class="card purple">
<p>而地中海正在缩小，非洲板块北移终将使其闭合。</p>
<p>这种时空尺度的转换，正是地理思维的核心所在。</p>
</div>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
