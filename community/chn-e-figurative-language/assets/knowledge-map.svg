<text x="706.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">方法：找相似点、合情境、读一读</text>
<circle cx="705.0" cy="165.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="717.0" y="170.0" font-size="13.5" fill="#334155">在你最喜欢的一篇课文里，找出3处修辞手</text>
<text x="717.0" y="192.0" font-size="13.5" fill="#334155">法</text>
<circle cx="705.0" cy="209.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="717.0" y="214.0" font-size="13.5" fill="#334155">以&quot;我的好朋友&quot;为题，用比喻和拟人各写</text>
<text x="717.0" y="236.0" font-size="13.5" fill="#334155">一句</text>
<circle cx="705.0" cy="253.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="717.0" y="258.0" font-size="13.5" fill="#334155">收集5个你觉得最美的比喻句，抄到摘抄本</text>
<text x="717.0" y="280.0" font-size="13.5" fill="#334155">上</text>
