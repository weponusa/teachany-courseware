<text x="1024.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">深层理解：五镜头</text>
<circle cx="1023.0" cy="165.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="1035.0" y="170.0" font-size="13.5" fill="#334155">本体、喻体、比喻词</text>
<circle cx="1023.0" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="1035.0" y="192.0" font-size="13.5" fill="#334155">比喻重在&#x27;相似性&#x27;，拟人重在&#x27;人格化&#x27;</text>
<circle cx="1023.0" cy="209.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="1035.0" y="214.0" font-size="13.5" fill="#334155">比喻可以换成明喻/暗喻/借喻，拟人不能</text>
<text x="1035.0" y="236.0" font-size="13.5" fill="#334155">加&#x27;像&#x27;字</text>
