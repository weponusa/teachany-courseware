<text x="388.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">形象化语言：比喻拟人等让表达生动</text>
<circle cx="387.0" cy="165.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="399.0" y="170.0" font-size="13.5" fill="#334155">形象化语言借助比喻、拟人、夸张等，把</text>
<text x="399.0" y="192.0" font-size="13.5" fill="#334155">抽象或普通的事物写得具体可感</text>
<rect x="689.0" y="128" width="300.0" height="188" rx="14" fill="#ffffff" stroke="#ffe66d" stroke-opacity=".35" stroke-width="2"/>
