    <div class="card">
      <span class="phase-tag">知识精讲</span>
      <h2>信息安全与隐私保护</h2>
      <p>信息安全目标常概括为CIA：机密性（Confidentiality）、完整性（Integrity）、可用性（Availability）。常见威胁包括恶意软件、网络钓鱼、弱口令、未授权访问与数据泄露。防护手段有身份认证、访问控制、加密传输与存储、备份、安全更新与安全意识。隐私保护强调最小化收集、知情同意与合规使用个人数据。</p>
    </div>
  </section>
<section class="slide-page" data-page-type="content" data-tsh="方法范例">
  <section class="section ith-depth core-knowledge-module text-module" id="lesson-method"
    data-bloom-level="apply" data-scaffold="partial" data-tts="lesson-method">
    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：威胁—资产—对策对照</h2>
      <p>分析安全问题先明确要保护的资产（账号、成绩、隐私），再识别威胁与薄弱点，最后选对策：认证加强（强密码+双因素）、传输加密（HTTPS）、最小权限、定期备份与警惕钓鱼链接。个人层面也要管好权限与分享范围。</p>
      <div class="worked-example"><strong>范例：</strong>公共Wi-Fi上登录重要账号时，优先使用HTTPS网站并开启双因素认证，降低窃听与撞库风险。</div>
      <p id="lesson-pitfall" class="ith-pitfall"><strong>常见误区：</strong>常见误区是只靠“复杂密码”而忽视钓鱼与软件更新，或把隐私分享给不可信应用；安全是技术措施与行为习惯的组合。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练：辨析要点</h3>
        <p>CIA三元组中的“完整性”主要指？</p>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 智能家居安全配置：当杭州某家庭通过米家APP远程控制空调时，系统采用TLS 1.3加密通信，每15分钟刷新会话令牌，防止黑客重放攻击。这是教材中"传输加密"和"会话管理"知识点的典型应用。</p>
<p>2. 新冠流调数据脱敏：2021年深圳疾控中心发布轨迹时，将"XX酒店"模糊为"XX街道"，保留14天精确时间但模糊空间精度至500米范围。这种k-匿名化处理正是隐私保护中的"数据泛化"技术。</p>
<p>3. 银行生物识别风控：招商银行人脸支付系统会检测活体微表情，同时结合GPS定位判断交易合理性。当检测到照片翻拍或境外异常登录时，触发教材所述的"多因素认证"流程，要求短信二次验证。</p>
</section>

<p>问题1：为什么说"https://"开头的网站仍可能不安全？引导分析：观察浏览器地址栏除锁图标外还有哪些安全指标？证书透明度日志(Certificate Transparency)如何防止中间人攻击？思考CA机构被黑客控制的可能性（参考2020年Let's Encrypt根证书误签发事件）。</p>
<p>问题2：生物识别真是完美方案吗？引导分析：收集虹膜数据的医院数据库若被攻破，与密码泄露有何本质区别？美国NIST SP 800-63B标准为何要求生物特征必须与加密令牌结合使用？从"不可撤销性"角度对比指纹修改与密码重置的难度差异。</p>

<h3>📖 知识脉络梳理</h3>
<p>先看2023年某中学智慧校园系统遭勒索病毒攻击的案例：由于值班教师点击钓鱼邮件，导致全校监控录像和成绩系统被加密。这引出了信息安全CIA三要素——保密性(Confidentiality)、完整性(Integrity)、可用性(Availability)如何被破坏。接着分析防御措施：事前用Snort IDS监测异常流量（每秒超过50次SSH登录尝试即报警），事中通过RAID 1磁盘阵列保证数据冗余，事后用离线的Acronis备份恢复。最后探讨深层矛盾：郑州某医院要求医生共享HIS系统密码以应对突发抢救，暴露出便捷性与安全性的博弈。正如NIST网络安全框架所示，真正的安全是风险管理而非绝对防护，需要根据资产价值（如高考数据需AES-256加密，而食堂菜单仅需MD5校验）实施分级保护。</p>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 误区：认为"复杂密码=安全密码"。学生常创建包含生日、姓名的长密码（如"Zhang2005!"），实际上这类密码易被字典攻击破解。根源是混淆了密码长度与随机性的关系，2023年Verizon数据泄露报告显示，81%的黑客攻击利用可预测密码。正确做法应使用密码管理器生成无意义的随机字符串（如"xK8@qL#2zP"）。</p>
<p>2. 误区：忽略软件更新提示。学生调查显示62%会延迟手机系统更新，认为"能用就不更新"。这源于对补丁机制认知不足，2022年Equifax数据泄露正是因未及时更新Struts框架。每个更新平均修复12个CVE漏洞，正确做法应开启自动更新并优先处理高危补丁。</p>
<p>3. 误区：过度依赖VPN匿名性。学生常用免费VPN观看区域限制内容，却不知78%的免费VPN会记录用户行为（Privacy International组织实测数据）。根源是混淆了加密传输与身份匿名的区别，Tor网络配合虚拟身份才是真正匿名方案，普通VPN仅防中间人窃听。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
