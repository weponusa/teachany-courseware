<text x="324.4" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">方法：先写通顺再添修饰</text>
<circle cx="323.4" cy="165.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="335.4" y="170.0" font-size="13.5" fill="#334155">写完朗读，发现别扭就调整语</text>
<text x="335.4" y="192.0" font-size="13.5" fill="#334155">序或换词</text>
<circle cx="323.4" cy="209.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="335.4" y="214.0" font-size="13.5" fill="#334155">应一句一意，先通后美</text>
<rect x="561.8" y="128" width="236.4" height="144" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-opacity=".35" stroke-width="2"/>
<path d="M575.8 128 h208.4 a14,14 0 0 1 14,14 v8.0 h-236.4 v-8.0 a14,14 0 0 1 14,-14 z" fill="#60a5fa" fill-opacity=".13"/>
<text x="578.8" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">句子有骨架</text>
<circle cx="577.8" cy="165.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="589.8" y="170.0" font-size="13.5" fill="#334155">比如‘小明（谁）吃（做）苹果</text>
<text x="589.8" y="192.0" font-size="13.5" fill="#334155">（什么）’就是完整骨架</text>
<circle cx="577.8" cy="209.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="589.8" y="214.0" font-size="13.5" fill="#334155">妈妈让你‘把书包拿来’</text>
<rect x="816.2" y="128" width="236.4" height="144" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-opacity=".35" stroke-width="2"/>
<path d="M830.2 128 h208.4 a14,14 0 0 1 14,14 v8.0 h-236.4 v-8.0 a14,14 0 0 1 14,-14 z" fill="#60a5fa" fill-opacity=".13"/>
<text x="833.2" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">给句子穿衣</text>
<circle cx="832.2" cy="165.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="844.2" y="170.0" font-size="13.5" fill="#334155">好句子就像洋娃娃，光有骨架</text>
<text x="844.2" y="192.0" font-size="13.5" fill="#334155">不够，还要穿漂亮衣服</text>
<circle cx="832.2" cy="209.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="844.2" y="214.0" font-size="13.5" fill="#334155">就像‘红红的太阳’比‘太阳’更</text>
<text x="844.2" y="236.0" font-size="13.5" fill="#334155">能让人想到傍晚</text>
<rect x="1070.6" y="128" width="236.4" height="144" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-opacity=".35" stroke-width="2"/>
<path d="M1084.6 128 h208.4 a14,14 0 0 1 14,14 v8.0 h-236.4 v-8.0 a14,14 0 0 1 14,-14 z" fill="#60a5fa" fill-opacity=".13"/>
<text x="1087.6" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">句子手拉手</text>
<circle cx="1086.6" cy="165.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="1098.6" y="170.0" font-size="13.5" fill="#334155">试试看：用1个连接词能把2个</text>
<text x="1098.6" y="192.0" font-size="13.5" fill="#334155">短句变成1个长句</text>
<circle cx="1086.6" cy="209.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="1098.6" y="214.0" font-size="13.5" fill="#334155">就像用胶水把两张纸粘成贺卡</text>
