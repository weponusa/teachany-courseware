      <p>帝国主义国家重新瓜分世界的矛盾导致一战爆发。战争规模空前，造成巨大伤亡。战后凡尔赛—华盛顿体系暂时调整列强关系，却埋下新矛盾，也削弱了欧洲、促进民族解放与革命运动。</p>
    </div>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 国际防疫合作：1918年西班牙流感（实际源自美军堪萨斯军营）借战争人员流动扩散，全球5亿人感染。这促使1923年国际联盟建立流行病预警系统，成为当今WHO全球疫情警报机制的前身。日内瓦档案馆保存的原始疫情报告显示，当时已认识到战地医院交叉感染是传播主因。</p>
<p>2. 塑料工业发展：德国为应对英国海上封锁（1915年后进口减少75%），拜耳公司在1917年发明人造树脂"胶木"，替代短缺的天然橡胶。战后该技术转为民用，1926年首款全塑料收音机面世，直接推动现代注塑成型工艺发展。</p>
<p>3. 心理学临床应用：英国军医W.H.R. Rivers在1917年治疗弹震症（shell shock）患者时，发现创伤后应激障碍（PTSD）与大脑杏仁核异常有关。他设计的"渐进暴露疗法"至今仍是心理治疗标准手段，伦敦帝国战争博物馆保存着当年手绘的治疗流程示意图。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. 问题：如果德国在1917年不实施无限制潜艇战，美国是否仍会参战？分析思路：考察齐默尔曼电报事件（1917年1月）与美墨关系史，注意美国对德贸易额从1914年1.7亿美元激增至1916年8.5亿美元的数据变化，思考威尔逊"十四点原则"中"航海自由"条款的实际经济背景。</p>
<p>2. 问题：为何西线堑壕战持续4年未能突破？分析思路：对比1916年索姆河战役（首日英军伤亡6万）与1918年亚眠战役（坦克集群突破）的战例，结合当时机枪射速（马克沁机枪每分钟600发）与野战炮射程（法国75mm炮8公里）的技术参数，思考防御优势与进攻手段的辩证关系。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先看19世纪末欧洲火药桶如何成型：德国1871年统一后工业产量跃居欧洲第二（1913年占全球15%），与英国殖民霸权产生结构性冲突，双方海军造舰竞赛使无畏舰数量从1906年1艘增至1914年48艘。接着巴尔干这个"欧洲的火药桶"被点燃：奥匈吞并波斯尼亚引发1908年危机，塞尔维亚民族主义组织"黑手社"训练了刺杀斐迪南的普林西普。战争爆发后，施里芬计划原想6周打败法国，却因马恩河战役（1914年9月）破产，形成从瑞士到北海的600公里堑壕战线。当东线坦能堡战役（1914年8月）俄军损失15万时，日本却趁机夺取德国山东殖民地，展现战争的全球性。最后1917年成为关键转折：德国潜艇战每月击沉60万吨商船迫使美国参战，而列宁"和平法令"使东线崩塌。到1918年11月，德国国内革命爆发，基尔港水兵起义，最终在贡比涅森林签署停战协定。战后凡尔赛和约规定的1320亿金马克赔款，埋下了更大冲突的种子。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 错误表现：认为萨拉热窝事件是战争爆发的根本原因。认知根源在于学生容易将直接导火索与深层原因混淆。正确理解是：虽然1914年斐迪南大公遇刺引发战争，但根本原因是帝国主义国家间长期积累的矛盾——德国与英国的海军竞赛耗资4.2亿马克（1906-1914年）、法德围绕阿尔萨斯-洛林的领土纠纷持续43年、俄奥在巴尔干的势力争夺导致1908年波斯尼亚危机。这些结构性矛盾才是战争必然性的关键。</p>
<p>2. 错误表现：混淆"同盟国"与"协约国"阵营变化。认知根源在于静态记忆成员国名单。正确理解是：意大利原本属于德奥同盟（1882年三国同盟），却在1915年转投协约国，因其与奥匈帝国存在特伦蒂诺领土争端。同样，奥斯曼帝国1914年加入同盟国，保加利亚1915年加入，这些动态变化反映各国实际利益考量，不能简单背诵初始阵营。</p>
<p>3. 错误表现：将凡尔登战役（1916年）误作战争转折点。认知根源在于对"转折"概念理解片面。正确理解是：虽然凡尔登造成70万伤亡，但真正战略转折是1917年美国参战——威尔逊总统4月对德宣战后，每月向欧洲输送25万美军，到1918年11月已累计200万人，彻底改变双方力量对比。同时俄国因十月革命退出战争（1918年3月《布列斯特和约》），形成东西战线双重转折。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>

<script id="histm-depth-js">
function histmDepthCheck(button, isCorrect, feedbackId, explanation) {
  var box = button.closest('.module-check');
  if (!box || box.dataset.answered) return;
  box.dataset.answered = '1';
  box.querySelectorAll('button').forEach(function (item) {
    item.disabled = true;
    if (item.dataset.correct === '1') item.classList.add('correct');
  });
  if (!isCorrect) button.classList.add('wrong');
  var feedback = document.getElementById(feedbackId);
  if (feedback) {
    feedback.style.display = 'block';
    feedback.textContent = (isCorrect ? '正确。' : '再想想。') + explanation;
  }
}
</script>
