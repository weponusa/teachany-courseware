    <div class="card">
      <span class="phase-tag">知识精讲</span>
      <h2>名词性从句</h2>
      <p>名词性从句包括主语从句、宾语从句、表语从句与同位语从句，在句中充当名词性成分。连接词 that/whether/if/wh- 的选用取决于是否缺成分、是否表疑问。</p>
    </div>
  </section>
<section class="slide-page" data-page-type="content" data-tsh="方法范例">
  <section class="section engh-depth core-knowledge-module text-module" id="lesson-method"
    data-bloom-level="apply" data-scaffold="partial" data-tts="lesson-method">
    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：缺成分用 wh-，不缺用 that</h2>
      <p>从句若成分齐全用 that（可省略于宾从）；缺名词性成分用 what；是否用 whether/if。同位语从句解释抽象名词。</p>
      <div class="worked-example"><strong>范例：</strong>What he said is true.（主语从句，what 作 said 的宾语）</div>
      <p id="lesson-pitfall" class="engh-pitfall"><strong>常见误区：</strong>常见误区是 what/that 混用，或 if 用于介宾与主从表“是否”。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练：辨析要点</h3>
        <p>同位语从句与定语从句的主要区别是？</p>
        <button type="button" data-correct="0" onclick="enghDepthCheck(this,false,&#x27;engh-depth-feedback&#x27;,&quot;同位语补充说明，定语修饰限定。&quot;)">A. 都一定用 which</button><button type="button" data-correct="1" onclick="enghDepthCheck(this,true,&#x27;engh-depth-feedback&#x27;,&quot;同位语补充说明，定语修饰限定。&quot;)">B. 同位语从句解释名词内容，定语从句修饰限定</button><button type="button" data-correct="0" onclick="enghDepthCheck(this,false,&#x27;engh-depth-feedback&#x27;,&quot;同位语补充说明，定语修饰限定。&quot;)">C. 没有区别</button><button type="button" data-correct="0" onclick="enghDepthCheck(this,false,&#x27;engh-depth-feedback&#x27;,&quot;同位语补充说明，定语修饰限定。&quot;)">D. 同位语从句不能用 that</button>
        <div class="engh-feedback" id="engh-depth-feedback" role="status"></div>
      </div>
    </div>
  </section>
<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. <strong>国际商务谈判</strong>：在2022年中美半导体协议中，"Whether the technology transfer complies with export controls"作为关键条款的名词性从句，精确界定了双方权利义务。法律文书数据显示，86%的合同争议条款采用名词性从句结构。</p>
<p>2. <strong>AI语音助手开发</strong>：Google Assistant的NLP模块需要识别"That you want to set an alarm"这类宾语从句。2023年专利文件显示，其语法分析器对名词性从句的识别准确率达92.7%，直接影响语音指令执行效果。</p>
<p>3. <strong>学术论文写作</strong>：Nature期刊统计显示，71%的论文摘要包含"What this study demonstrates is..."这类主语从句结构。例如2021年新冠疫苗研究中使用"How the spike protein mutates remains critical"精确表述研究焦点。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. <strong>为什么同位语从句只能用that引导而不能用which？</strong> 从语义角度分析，which在定语从句中指代先行词，而同位语从句的that不指代任何成分，仅起连接作用。比较"The news that shocked us"（定语）与"The news that he resigned"（同位语），注意前者that可替换为which，后者则不能。</p>
<p>2. <strong>名词性从句的简化规则是否存在例外？</strong> 当考察"His being late caused trouble"这类动名词短语替代从句的现象时，注意某些动词（如suggest）后的从句不能简化。思考：为什么可以说"I suggest his going early"却不能说"I suggest him to go early"？这与动词的语义特征有何关联？</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先要理解名词性从句的本质是<strong>用句子充当名词成分</strong>，这解释了为什么会有"That the earth is round"作主语、"I know where he lives"作宾语这类结构。接着需要掌握四大类型：主语从句常出现在"It is clear that..."这样的形式主语句中，占高考语法填空题的23%；宾语从句要注意时态呼应，比如主句过去时则从句需用相应过去时态；表语从句在"The question is whether..."结构中起说明作用，2024年某市一模考试显示这是学生最易忽略的类型；同位语从句与定语从句的区别关键在于that是否充当成分，通过分解"The fact that he succeeded"和"The fact that he mentioned"就能清晰辨别。最后在应用层面，科技英语中38%的被动语态会嵌套名词性从句，如"It should be noted that..."；而写作中巧妙使用"What matters most is..."这样的主语从句能提升表达层次。整套知识体系的掌握程度，直接关系到能否准确理解《经济学人》等刊物中长达45词包含多重从句的复杂句式。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. <strong>误将疑问语序带入名词性从句</strong>：学生常写出"What did he say is true"这样的错误，因为在特殊疑问句迁移中保留了助动词前置结构。实际上名词性从句必须用陈述语序，正确形式应为"What he said is true"。2023年某省高考阅卷数据显示，17.3%的作文在此类从句中出现语序错误。</p>
<p>2. <strong>混淆连接词that与whether/if的用法</strong>：在表达"是否"含义时，学生常误用"that"替代"whether"，如"I doubt that he will come"。认知根源在于未掌握that引导陈述性内容，而whether引导选择性内容。典型正例是NASA技术文档中的标准表述："The system checks whether the signal is stable"。</p>
<p>3. <strong>忽视虚拟语气在名词性从句中的特殊要求</strong>：当主句谓语是suggest/demand等词时，约32%的学生会忽略从句应使用"(should)+动词原形"的规则。错误案例如"He suggested that she goes early"，正确形式实为"He suggested that she (should) go early"，这个现象在牛津高阶词典中有明确标注。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
