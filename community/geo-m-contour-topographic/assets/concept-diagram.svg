<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
      .title { font-size: 28px; font-weight: 800; fill: #f8fafc; }
      .name { font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .rule { font-size: 15px; fill: #94a3b8; }
      .contour { fill: none; stroke: #92400e; stroke-width: 2.5; }
      .contour-thin { fill: none; stroke: #92400e; stroke-width: 1.5; opacity: .6; }
      .label { font-size: 13px; fill: #b45309; font-weight: 600; }
      .box { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 14; }
      .box-inner { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 10; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="#0f172a"/>
  <text x="600" y="48" text-anchor="middle" class="title">五种地形部位判读图</text>
  <text x="600" y="78" text-anchor="middle" class="rule">等高线形状 → 地形部位 · 判读口诀速查</text>

  <!-- Row 1: 山峰, 山脊, 山谷 -->
  <!-- 山峰 -->
  <g transform="translate(40,110)">
    <rect class="box" width="360" height="240"/>
    <rect class="box-inner" x="15" y="15" width="330" height="160"/>
    <ellipse cx="180" cy="95" rx="140" ry="55" class="contour-thin"/>
    <ellipse cx="180" cy="95" rx="105" ry="42" class="contour-thin"/>
    <ellipse cx="180" cy="95" rx="70" ry="30" class="contour"/>
    <ellipse cx="180" cy="95" rx="35" ry="16" class="contour"/>
    <circle cx="180" cy="95" r="4" fill="#ef4444"/>
    <text x="180" y="200" text-anchor="middle" class="name">山峰</text>
    <text x="180" y="222" text-anchor="middle" class="rule">闭合曲线 · 数值内高外低</text>
  </g>

  <!-- 山脊 -->
  <g transform="translate(420,110)">
    <rect class="box" width="360" height="240"/>
    <rect class="box-inner" x="15" y="15" width="330" height="160"/>
    <path d="M 40 140 Q 120 100 180 95 Q 240 90 320 130" class="contour"/>
    <path d="M 40 110 Q 120 70 180 65 Q 240 60 320 100" class="contour-thin"/>
    <path d="M 40 80 Q 120 40 180 35 Q 240 30 320 70" class="contour-thin"/>
    <path d="M 40 170 Q 120 130 180 125 Q 240 120 320 160" class="contour-thin"/>
    <line x1="180" y1="30" x2="180" y2="160" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="180" y="200" text-anchor="middle" class="name">山脊</text>
    <text x="180" y="222" text-anchor="middle" class="rule">凸低为脊 · 分水线</text>
  </g>

  <!-- 山谷 -->
  <g transform="translate(800,110)">
    <rect class="box" width="360" height="240"/>
    <rect class="box-inner" x="15" y="15" width="330" height="160"/>
    <path d="M 40 50 Q 120 90 180 95 Q 240 100 320 60" class="contour"/>
    <path d="M 40 80 Q 120 120 180 125 Q 240 130 320 90" class="contour-thin"/>
    <path d="M 40 110 Q 120 150 180 155 Q 240 160 320 120" class="contour-thin"/>
    <path d="M 40 20 Q 120 60 180 65 Q 240 70 320 30" class="contour-thin"/>
    <line x1="180" y1="30" x2="180" y2="160" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="180" y="200" text-anchor="middle" class="name">山谷</text>
    <text x="180" y="222" text-anchor="middle" class="rule">凸高为谷 · 集水线 · 可能发育河流</text>
  </g>

  <!-- Row 2: 鞍部, 陡崖, 盆地 -->
  <!-- 鞍部 -->
  <g transform="translate(40,380)">
    <rect class="box" width="360" height="240"/>
    <rect class="box-inner" x="15" y="15" width="330" height="160"/>
    <ellipse cx="100" cy="95" rx="70" ry="40" class="contour"/>
    <ellipse cx="100" cy="95" rx="45" ry="25" class="contour-thin"/>
    <ellipse cx="260" cy="95" rx="70" ry="40" class="contour"/>
    <ellipse cx="260" cy="95" rx="45" ry="25" class="contour-thin"/>
    <ellipse cx="180" cy="95" rx="30" ry="18" class="contour" stroke-dasharray="5,3"/>
    <circle cx="180" cy="95" r="4" fill="#8b5cf6"/>
    <text x="180" y="200" text-anchor="middle" class="name">鞍部</text>
    <text x="180" y="222" text-anchor="middle" class="rule">两峰之间低洼处 · 形如马鞍</text>
  </g>

  <!-- 陡崖 -->
  <g transform="translate(420,380)">
    <rect class="box" width="360" height="240"/>
    <rect class="box-inner" x="15" y="15" width="330" height="160"/>
    <path d="M 60 40 L 60 150" class="contour"/>
    <path d="M 90 40 L 90 150" class="contour"/>
    <path d="M 120 40 L 120 150" class="contour"/>
    <path d="M 150 40 L 150 150" class="contour"/>
    <path d="M 180 40 L 180 150" class="contour"/>
    <path d="M 210 40 L 210 150" class="contour"/>
    <path d="M 240 40 L 240 150" class="contour"/>
    <path d="M 270 40 L 270 150" class="contour"/>
    <path d="M 300 40 L 300 150" class="contour"/>
    <line x1="180" y1="30" x2="180" y2="160" stroke="#10b981" stroke-width="3"/>
    <text x="180" y="200" text-anchor="middle" class="name">陡崖</text>
    <text x="180" y="222" text-anchor="middle" class="rule">多条等高线重合 · 示坡线指向低处</text>
  </g>

  <!-- 盆地 -->
  <g transform="translate(800,380)">
    <rect class="box" width="360" height="240"/>
    <rect class="box-inner" x="15" y="15" width="330" height="160"/>
    <ellipse cx="180" cy="95" rx="140" ry="55" class="contour"/>
    <ellipse cx="180" cy="95" rx="105" ry="42" class="contour"/>
    <ellipse cx="180" cy="95" rx="70" ry="30" class="contour-thin"/>
    <ellipse cx="180" cy="95" rx="35" ry="16" class="contour-thin"/>
    <circle cx="180" cy="95" r="4" fill="#f59e0b"/>
    <text x="180" y="200" text-anchor="middle" class="name">盆地</text>
    <text x="180" y="222" text-anchor="middle" class="rule">闭合曲线 · 数值内低外高</text>
  </g>
</svg>
