<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
      .title { font-size: 28px; font-weight: 800; fill: #f8fafc; }
      .step-num { font-size: 22px; font-weight: 800; fill: #15803d; }
      .step-name { font-size: 18px; font-weight: 700; fill: #f8fafc; }
      .step-desc { font-size: 14px; fill: #94a3b8; }
      .contour { fill: none; stroke: #92400e; stroke-width: 2.5; }
      .contour-thin { fill: none; stroke: #92400e; stroke-width: 1.5; opacity: .6; }
      .box { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 14; }
      .box-inner { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 10; }
      .arrow { fill: none; stroke: #15803d; stroke-width: 3; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#0f172a"/>
  <text x="600" y="48" text-anchor="middle" class="title">等高线形成过程四步图</text>
  <text x="600" y="78" text-anchor="middle" class="step-desc">从立体山体到平面地图 · 水平切山 → 投影成图</text>

  <!-- Step 1: 山体 -->
  <g transform="translate(40,120)">
    <rect class="box" width="260" height="220"/>
    <rect class="box-inner" x="15" y="15" width="230" height="150"/>
    <path d="M 30 150 L 90 50 L 130 80 L 170 30 L 230 150 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
    <line x1="30" y1="100" x2="230" y2="100" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="130" y="200" text-anchor="middle" class="step-num">① 定山</text>
    <text x="130" y="222" text-anchor="middle" class="step-desc">一座立体山，海拔 0–400 米</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="310" y1="230" x2="360" y2="230" class="arrow"/>

  <!-- Step 2: 水平切片 -->
  <g transform="translate(370,120)">
    <rect class="box" width="260" height="220"/>
    <rect class="box-inner" x="15" y="15" width="230" height="150"/>
    <path d="M 30 150 L 90 50 L 130 80 L 170 30 L 230 150 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
    <line x1="30" y1="120" x2="230" y2="120" stroke="#ef4444" stroke-width="2"/>
    <line x1="30" y1="90" x2="230" y2="90" stroke="#f59e0b" stroke-width="2"/>
    <line x1="30" y1="60" x2="230" y2="60" stroke="#10b981" stroke-width="2"/>
    <text x="130" y="200" text-anchor="middle" class="step-num">② 切片</text>
    <text x="130" y="222" text-anchor="middle" class="step-desc">每隔 100 米水平切一刀</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="640" y1="230" x2="690" y2="230" class="arrow"/>

  <!-- Step 3: 各层交线 -->
  <g transform="translate(700,120)">
    <rect class="box" width="260" height="220"/>
    <rect class="box-inner" x="15" y="15" width="230" height="150"/>
    <ellipse cx="130" cy="90" rx="100" ry="40" class="contour-thin"/>
    <ellipse cx="130" cy="90" rx="70" ry="28" class="contour"/>
    <ellipse cx="130" cy="90" rx="40" ry="16" class="contour"/>
    <text x="130" y="200" text-anchor="middle" class="step-num">③ 取线</text>
    <text x="130" y="222" text-anchor="middle" class="step-desc">每刀边缘就是一条等高线</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="970" y1="230" x2="1020" y2="230" class="arrow"/>

  <!-- Step 4: 投影成图 -->
  <g transform="translate(1030,120)">
    <rect class="box" width="260" height="220"/>
    <rect class="box-inner" x="15" y="15" width="230" height="150"/>
    <ellipse cx="130" cy="90" rx="100" ry="40" class="contour-thin"/>
    <ellipse cx="130" cy="90" rx="70" ry="28" class="contour"/>
    <ellipse cx="130" cy="90" rx="40" ry="16" class="contour"/>
    <text x="130" y="200" text-anchor="middle" class="step-num">④ 投影</text>
    <text x="130" y="222" text-anchor="middle" class="step-desc">垂直投影到同一平面</text>
  </g>

  <!-- Bottom summary -->
  <g transform="translate(40,380)">
    <rect class="box" width="1120" height="260"/>
    <text x="600" y="420" text-anchor="middle" class="step-name">等高线地形图 = 把同一海拔的点连成闭合曲线</text>
    <text x="600" y="450" text-anchor="middle" class="step-desc">同线等高 · 同图等距 · 闭合曲线 · 不相交（除陡崖）</text>

    <!-- Mini contour map -->
    <g transform="translate(200,480)">
      <ellipse cx="0" cy="0" rx="80" ry="35" class="contour"/>
      <ellipse cx="0" cy="0" rx="55" ry="24" class="contour"/>
      <ellipse cx="0" cy="0" rx="30" ry="13" class="contour"/>
      <text x="0" y="55" text-anchor="middle" class="step-desc">山峰：闭合内高</text>
    </g>
    <g transform="translate(450,480)">
      <path d="M -60 20 Q 0 -20 60 20" class="contour"/>
      <path d="M -60 0 Q 0 -40 60 0" class="contour-thin"/>
      <path d="M -60 -20 Q 0 -60 60 -20" class="contour-thin"/>
      <text x="0" y="55" text-anchor="middle" class="step-desc">山脊：凸低为脊</text>
    </g>
    <g transform="translate(700,480)">
      <path d="M -60 -20 Q 0 20 60 -20" class="contour"/>
      <path d="M -60 0 Q 0 40 60 0" class="contour-thin"/>
      <path d="M -60 20 Q 0 60 60 20" class="contour-thin"/>
      <text x="0" y="55" text-anchor="middle" class="step-desc">山谷：凸高为谷</text>
    </g>
    <g transform="translate(950,480)">
      <line x1="-40" y1="-30" x2="-40" y2="30" class="contour"/>
      <line x1="-20" y1="-30" x2="-20" y2="30" class="contour"/>
      <line x1="0" y1="-30" x2="0" y2="30" class="contour"/>
      <line x1="20" y1="-30" x2="20" y2="30" class="contour"/>
      <line x1="40" y1="-30" x2="40" y2="30" class="contour"/>
      <text x="0" y="55" text-anchor="middle" class="step-desc">陡崖：多线重合</text>
    </g>
  </g>
</svg>
