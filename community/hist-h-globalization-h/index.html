      <h2>全球化与多极化</h2>
      <p>两极格局结束后，世界多极化趋势加强，经济全球化加速，跨国公司、国际贸易与信息化深刻改变世界。全球化带来发展机遇，也扩大风险与不平等；中国等新兴力量推动更加公正的国际秩序。</p>

      <h2>方法：经济全球化 + 政治多极化</h2>
      <p>经济：贸易投资科技互联；政治：一超多强与多强并立趋势。评价要辩证：机遇与挑战并存。</p>
      <div class="worked-example"><strong>范例：</strong>世界贸易组织推动贸易规则化；同时金融危机显示风险传导加快。</div>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>应用一：跨境电商供应链优化。宁波港2023年处理的跨境包裹中，73%采用智能分拣系统，这些系统需要加载WTO《贸易便利化协定》（TFA）的232项标准数据。工程师必须理解多边贸易规则与技术参数的映射关系，例如原产地证书（CO）电子化使清关时间从48小时压缩至90分钟。</p>
<p>应用二：国际抗疫合作中的标准博弈。科兴疫苗在印尼的本地化生产（2021）涉及42项技术转移条款，核心是处理WHO预认证（PQ）与BPOM认证的差异。这要求医药代表既懂ISO13485质量管理体系，又清楚《生物多样性公约》（CBD）对病毒株跨境转移的限制。</p>
<p>应用三：碳足迹计算器的算法设计。苹果公司2025年实现碳中和的承诺，需要精确计算iPhone组件从刚果钴矿到郑州组装的碳排放。程序员必须整合UNFCCC国家清单报告、国际航运IMO 2020低硫令等137类数据源，这本质是将《巴黎协定》第6条市场机制转化为代码逻辑。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>问题一：当新加坡用《多元文化主义白皮书》（1989）管理宗教和谐时，法国却立法禁止公立学校佩戴宗教标志（2004），这两种应对文化全球化的模式，底层逻辑差异何在？分析线索：比较两国殖民地历史（莱佛士1819年登陆vs法兰西第三共和国殖民体系），注意新加坡《维持宗教和谐法》第17条"社区修复令"与法国《世俗主义原则》第1款的立法技术差异。</p>
<p>问题二：观察2023年沙特主权财富基金（PIF）同时投资美国Lucid电动车和中国华人运通，而挪威养老金却减持特斯拉股票，这种资本流动的多向性如何重构传统的"核心-边缘"（Core-Periphery）理论？思考方向：追踪PIF近五年在NEOM智慧城（沙特）、软银愿景基金（日本）、黑石基础设施（美国）的投资组合，注意主权基金年报中"地缘经济对冲"（Geoeconomic Hedging）策略的表述变化。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先要破除"哥伦布1492年发现新大陆即全球化开端"的简单叙事——大航海时代前的丝绸之路已形成跨大陆贸易网（威尼斯商人马可·波罗经此路线耗时4年到达元大都）。接着需要审视工业革命如何通过三股力量加速全球化：蒸汽船使跨大西洋航程从2个月缩至2周（1838年"天狼星号"首航）、电报让伦敦至孟买信息传递从半年变为5分钟（1870年海底电缆竣工）、金本位制（1880-1914）将各国货币绑定在4.8665克黄金/英镑的标准上。当这种单极秩序在二战中崩塌，1944年布雷顿森林体系用1盎司黄金=35美元的固定汇率搭建新框架，但真正质变发生在1995年WTO成立时，其《服务贸易总协定》（GATS）首次将教育、医疗等160个领域纳入谈判。此时多极化开始显现：2001年多哈回合谈判因G21集团抵制而停滞，2013年中国提出"一带一路"倡议（截至2023年涉及147国），2020年RCEP协定创造全球30%GDP的经济圈。最后要看到数字技术的颠覆性——当Zoom在疫情期间日活用户从1000万飙至3亿（2020），TikTok算法推荐机制引发欧盟《数字服务法》（DSA）立法，这已不是传统意义上的商品流动，而是数据主权与算力霸权的全新博弈场。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>误区一：将全球化等同于西方化。学生常引用麦当劳全球门店数（4万+）或好莱坞电影市场份额（65%）作为论据，实质混淆了文化传播与价值替代的区别。认知根源在于将20世纪后期的"华盛顿共识"（Washington Consensus）错误投射到整个历史进程。实际上，2023年TikTok用户超15亿、印度宝莱坞年产量1800部电影，证明全球化正在形成多中心文化生态。</p>
<p>误区二：认为多极化必然导致冲突。学生常以美苏冷战（1947-1991）类比当前国际关系，忽视G20国家贸易依存度（平均38.7%）的现实约束。这种线性思维源于对"修昔底德陷阱"（Thucydides Trap）的机械套用。金砖国家新开发银行（NDB）2022年放贷规模达317亿美元，展示出制度性合作的可能。</p>
<p>误区三：把逆全球化（Deglobalization）视为历史倒退。学生看到英国脱欧（2016）或美国加征钢铝关税（2018）就断言全球化终结，未注意到全球数字服务贸易仍保持12.4%年增长。这是将周期性调整误判为趋势逆转，正如19世纪铁路技术（1830-1870）曾引发类似争议，最终催生更深度全球化。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }

<script id="histh-depth-js">
function histhDepthCheck(button, isCorrect, feedbackId, explanation) {
  var box = button.closest('.module-check');
  if (!box || box.dataset.answered) return;
  box.dataset.answered = '1';
  box.querySelectorAll('button').forEach(function (item) {
    item.disabled = true;
    if (item.dataset.correct === '1') item.classList.add('correct');
  });
  if (!isCorrect) button.classList.add('wrong');
  var feedback = document.getElementById(feedbackId);
  if (feedback) {
    feedback.style.display = 'block';
    feedback.textContent = (isCorrect ? '正确。' : '再想想。') + explanation;
  }
}
</script>
