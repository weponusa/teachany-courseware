  <style>
    :root {
      --bg: #0a1628;
      --bg2: #0f2040;
      --card: rgba(15,32,64,0.9);
      --border: rgba(56,189,248,0.2);
      --primary: #38bdf8;
      --secondary: #34d399;
      --accent: #fbbf24;
      --danger: #f87171;
      --purple: #a78bfa;
      --pink: #f472b6;
      --text: #f0f9ff;
      --muted: #94a3b8;
      --r: 16px;

      /* 主题色 */
      --land: #34d399;
      --water: #38bdf8;
      --sky: #a78bfa;
      --fur: #fbbf24;
      --feather: #f472b6;
      --scale: #34d399;
      --skin: #22d3ee;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
      overflow-x: hidden;
      padding-top: 52px;
    }

    /* ─── Nav ─── */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      background: rgba(10,22,40,0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0.65rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { font-size: 1rem; font-weight: 700; color: var(--primary); }
    .nav-links { display: flex; gap: 1.2rem; }
    .nav-links a { font-size: 0.82rem; color: var(--muted); text-decoration: none; transition: color .15s; }
    .nav-links a:hover { color: #fff; }
    @media(max-width:600px){ .nav-links { display:none; } }

    /* ─── Hero ─── */
    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 3rem 1.5rem;
      background:
        radial-gradient(ellipse at 70% 20%, rgba(167,139,250,.15) 0%, transparent 55%),
        radial-gradient(ellipse at 20% 75%, rgba(52,211,153,.1) 0%, transparent 50%),
        var(--bg);
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(167,139,250,.12);
      border: 1px solid rgba(167,139,250,.3);
      border-radius: 99px; padding: 5px 16px;
      font-size: .82rem; color: var(--purple);
      margin-bottom: 1.5rem; letter-spacing: .04em;
    }
    .hero h1 {
      font-size: clamp(2.2rem,5vw,3.8rem);
      font-weight: 900;
      background: linear-gradient(135deg, #fff 30%, var(--purple) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 1rem;
    }
    .hero-sub { font-size: 1.1rem; color: var(--muted); max-width: 540px; margin: 0 auto 2rem; }
    .emoji-row { display: flex; justify-content: center; gap: 1rem; font-size: 2.5rem; margin-bottom: 2rem; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-8px) } }
    .scroll-hint { color: var(--muted); font-size: .85rem; display: flex; align-items: center; gap: 6px; animation: bounce 2s infinite; }
    @keyframes bounce { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(6px) } }

    /* ─── Figure ─── */
    .ta-standard-figure {
      max-width: 900px; margin: 2.5rem auto; padding: 0 1.5rem;
    }
    .ta-standard-figure img.hero-cover-img {
      width: 100%; border-radius: var(--r); border: 1px solid var(--border);
    }
    .ta-standard-figure figcaption {
      margin-top: .6rem; font-size: .82rem; color: var(--muted); text-align: center;
    }

    /* ─── Section ─── */
    section { max-width: 960px; margin: 0 auto; padding: 4.5rem 1.5rem; }
    .section-tag {
      display: inline-block;
      background: rgba(56,189,248,.1); color: var(--primary);
      border: 1px solid rgba(56,189,248,.25); border-radius: 6px;
      font-size: .78rem; padding: 2px 10px; margin-bottom: .8rem;
    }
    .section-title { font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: .4rem; }
    .section-sub { color: var(--muted); margin-bottom: 2rem; font-size: .95rem; }

    /* ─── Card grid ─── */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 1.2rem; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.4rem;
      backdrop-filter: blur(10px);
      transition: transform .2s, box-shadow .2s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0,0,0,.35); }
    .card-icon { font-size: 2.4rem; margin-bottom: .6rem; }
    .card h3 { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: .4rem; }
    .card p { font-size: .88rem; color: #cbd5e1; }
    .card .examples { font-size: .8rem; color: var(--primary); margin-top: .5rem; }

    /* ─── ABT ─── */
    .abt-block {
      background: var(--card); border-radius: var(--r);
      padding: 1.4rem 1.6rem; margin-bottom: 1.2rem;
      border-left: 4px solid;
      backdrop-filter: blur(10px);
    }
    .abt-block.and { border-color: var(--secondary); }
    .abt-block.but { border-color: var(--accent); }
    .abt-block.therefore { border-color: var(--primary); }
    .abt-label { font-size: .75rem; font-weight: 700; letter-spacing: .1em; margin-bottom: .4rem; }
    .abt-block.and .abt-label { color: var(--secondary); }
    .abt-block.but .abt-label { color: var(--accent); }
    .abt-block.therefore .abt-label { color: var(--primary); }

    /* ─── Canvas wrap ─── */
    .canvas-wrap {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.5rem;
      backdrop-filter: blur(10px);
    }
    .canvas-wrap h3 { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: .4rem; }
    .canvas-desc { font-size: .84rem; color: var(--muted); margin-bottom: 1rem; }
    canvas { display: block; border-radius: 10px; max-width: 100%; }
    .canvas-status { text-align: center; font-size: .85rem; color: var(--accent); min-height: 1.5em; margin-top: .6rem; }
    .ctrl-row { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .ctrl-btn {
      padding: 6px 14px; border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(56,189,248,.1); color: var(--text);
      font-size: .82rem; cursor: pointer; font-family: inherit;
      transition: background .15s;
    }
    .ctrl-btn:hover,.ctrl-btn.active { background: rgba(56,189,248,.3); border-color: var(--primary); }

    /* ─── 拖拽分类 ─── */
    .drag-arena {
      display: flex; gap: 1rem; flex-wrap: wrap;
      margin-bottom: 1.2rem;
    }
    .drag-source {
      background: rgba(15,32,64,.7); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1rem;
      flex: 0 0 auto;
    }
    .drag-source h4 { font-size: .85rem; color: var(--muted); margin-bottom: .6rem; }
    .drag-zone-row {
      display: flex; gap: 1rem; flex-wrap: wrap;
    }
    .drag-zone {
      flex: 1; min-width: 180px;
      min-height: 120px;
      border-radius: var(--r); padding: 1rem;
      border: 2px dashed;
      transition: background .2s;
    }
    .drag-zone.land  { border-color: var(--land);  background: rgba(52,211,153,.05); }
    .drag-zone.water { border-color: var(--water); background: rgba(56,189,248,.05); }
    .drag-zone.sky   { border-color: var(--sky);   background: rgba(167,139,250,.05); }
    .drag-zone.land.over  { background: rgba(52,211,153,.15); }
    .drag-zone.water.over { background: rgba(56,189,248,.15); }
    .drag-zone.sky.over   { background: rgba(167,139,250,.15); }
    .drag-zone h4 { font-size: .88rem; font-weight: 700; margin-bottom: .5rem; }
    .drag-zone.land  h4 { color: var(--land); }
    .drag-zone.water h4 { color: var(--water); }
    .drag-zone.sky   h4 { color: var(--sky); }
    .drag-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,.08); border: 1px solid var(--border);
      border-radius: 99px; padding: 4px 12px;
      font-size: .82rem; cursor: grab; margin: 3px;
      user-select: none; transition: transform .15s, background .15s;
    }
    .drag-chip:hover { background: rgba(255,255,255,.15); transform: scale(1.05); }
    .drag-chip.dragging { opacity: .4; }
    .drag-result { font-size: .88rem; color: var(--accent); min-height: 1.5em; margin-top: .6rem; }

    /* ─── 选择题 ─── */
    .quiz-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.4rem; margin-bottom: 1.2rem;
      backdrop-filter: blur(10px);
    }
    .quiz-q { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: .8rem; }
    .quiz-q span { color: var(--primary); margin-right: .4rem; }
    .quiz-opts { display: flex; flex-direction: column; gap: .5rem; }
    .quiz-opt {
      padding: .7rem 1rem; border-radius: 10px;
      border: 1px solid var(--border); cursor: pointer;
      font-size: .9rem; transition: background .15s, border-color .15s;
      background: rgba(255,255,255,.04);
    }
    .quiz-opt:hover { background: rgba(56,189,248,.1); border-color: var(--primary); }
    .quiz-opt.correct { background: rgba(52,211,153,.15); border-color: var(--secondary); color: var(--secondary); pointer-events: none; }
    .quiz-opt.wrong   { background: rgba(248,113,113,.1); border-color: var(--danger); color: var(--danger); pointer-events: none; }
    .quiz-fb {
      display: none; margin-top: .6rem; padding: .7rem 1rem;
      border-radius: 10px; font-size: .85rem; line-height: 1.55;
    }
    .quiz-fb.show { display: block; }
    .quiz-fb.correct { background: rgba(52,211,153,.12); color: var(--secondary); border: 1px solid rgba(52,211,153,.3); }
    .quiz-fb.wrong   { background: rgba(248,113,113,.08); color: #fca5a5; border: 1px solid rgba(248,113,113,.25); }

    /* ─── 成就徽章 ─── */
    .badge-row { display: flex; flex-wrap: wrap; gap: 1rem; }
    .badge {
      display: flex; flex-direction: column; align-items: center; gap: .3rem;
      width: 80px; opacity: .35; filter: grayscale(1);
      transition: opacity .4s, filter .4s, transform .3s;
    }
    .badge.earned { opacity: 1; filter: none; transform: scale(1.1); }
    .badge-icon { font-size: 2.2rem; }
    .badge-name { font-size: .72rem; color: var(--muted); text-align: center; }
    .badge.earned .badge-name { color: var(--accent); }

    /* ─── 总结 ─── */
    .sum-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 1rem; }
    .sum-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.2rem; text-align: center;
    }
    .sum-icon { font-size: 2.4rem; margin-bottom: .5rem; }
    .sum-card h4 { font-size: .95rem; font-weight: 700; color: #fff; margin-bottom: .4rem; }
    .sum-card p { font-size: .82rem; color: #cbd5e1; }

    /* ─── 视频容器 ─── */
    .video-wrap {
      background: #000; border-radius: var(--r); overflow: hidden;
      border: 1px solid var(--border); margin: 1.5rem 0;
    }
    .video-wrap video { width: 100%; display: block; }

    /* ─── 雷达图容器 ─── */
    #radarCanvas { background: rgba(15,32,64,.6); border-radius: 12px; }
    .animal-selector { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    .animal-btn {
      padding: 6px 16px; border-radius: 99px;
      border: 1px solid var(--border); cursor: pointer;
      background: rgba(255,255,255,.05); color: var(--text);
      font-size: .82rem; font-family: inherit; transition: all .15s;
    }
    .animal-btn:hover { background: rgba(167,139,250,.2); border-color: var(--purple); }
    .animal-btn.active { background: rgba(167,139,250,.25); border-color: var(--purple); color: var(--purple); }

    /* ─── 知识图谱 ─── */
    .kg-wrap { max-width: 960px; margin: 0 auto; padding: 0 1.5rem 2rem; }

    /* 分隔线 */
    .section-divider {
      max-width: 960px; margin: 0 auto; padding: 0 1.5rem;
      border-top: 1px solid rgba(56,189,248,.1);
    }
  </style>

</section><section class="slide-page" data-page-type="content" data-tsh="方法范例">
  <section class="section scie-depth core-knowledge-module text-module" id="lesson-method"
    data-bloom-level="apply" data-scaffold="partial" data-tts="lesson-method">
    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：抓关键特征再归类</h2>
      <p>先找“呼吸方式、运动器官、体表覆盖物、繁殖方式”等关键特征，再归入大类。遇到陌生动物先描述特征，不要急着叫名字。</p>
      <div class="worked-example"><strong>范例：</strong>蝙蝠会飞但体表有毛、胎生哺乳，应归入哺乳动物而不是鸟类。</div>
      <p id="lesson-pitfall" class="scie-pitfall"><strong>常见误区：</strong>常见误区是“会飞就是鸟”“生活在水里就是鱼”，忽略鲸鱼、蝙蝠等例外。</p>
      <div class="module-check" data-conceptest="true">

  <!-- Q1 -->
  <div class="quiz-card">
    <div class="quiz-q"><span>Q1</span>🐟 鱼的身体表面覆盖着什么？</div>
    <div class="quiz-opts">
      <div class="quiz-opt" onclick="ans(this,'q1','A')">A. 毛发</div>
      <div class="quiz-opt" onclick="ans(this,'q1','B')">B. 羽毛</div>
      <div class="quiz-opt" onclick="ans(this,'q1','C')">C. 鳞片 ✓</div>
      <div class="quiz-opt" onclick="ans(this,'q1','D')">D. 光滑皮肤</div>
    </div>
    <div class="quiz-fb correct" id="q1-C">✅ 正确！鱼的身体表面覆盖着鳞片。鳞片防水又灵活，能减少在水中游泳时的阻力，同时保护鱼的身体。</div>
    <div class="quiz-fb wrong" id="q1-A">❌ 毛发是哺乳动物（如猫、狗、兔子）身体表面的覆盖物，不是鱼的特征哦！鱼的身体表面是鳞片。</div>
    <div class="quiz-fb wrong" id="q1-B">❌ 羽毛是鸟类身体表面的覆盖物，帮助鸟儿飞翔和保温。鱼不是鸟，它的身体表面是鳞片。</div>
    <div class="quiz-fb wrong" id="q1-D">❌ 光滑皮肤是两栖动物（如青蛙）的特征，青蛙可以用皮肤辅助呼吸。鱼的身体表面是鳞片哦！</div>
  </div>

  <!-- Q2 -->
  <div class="quiz-card">
    <div class="quiz-q"><span>Q2</span>🦅 老鹰主要靠什么在天空中移动？</div>
    <div class="quiz-opts">
      <div class="quiz-opt" onclick="ans(this,'q2','A')">A. 四肢行走</div>
      <div class="quiz-opt" onclick="ans(this,'q2','B')">B. 用翅膀飞翔 ✓</div>
      <div class="quiz-opt" onclick="ans(this,'q2','C')">C. 扭动身体爬行</div>
      <div class="quiz-opt" onclick="ans(this,'q2','D')">D. 用鳍游泳</div>
    </div>
    <div class="quiz-fb correct" id="q2-B">✅ 正确！老鹰靠翅膀飞翔。鸟类的翅膀上有羽毛，可以扇动空气产生升力，帮助它们在空中翱翔。</div>
    <div class="quiz-fb wrong" id="q2-A">❌ 四肢行走是陆地动物（如狗、马）的运动方式，老鹰主要生活在空中，靠翅膀飞翔移动哦！</div>
    <div class="quiz-fb wrong" id="q2-C">❌ 扭动身体爬行是蛇的运动方式，蛇没有腿，靠身体扭动前进。老鹰有翅膀，靠飞翔移动。</div>
    <div class="quiz-fb wrong" id="q2-D">❌ 用鳍游泳是鱼类的运动方式，鱼生活在水里。老鹰生活在空中，靠翅膀飞翔哦！</div>
  </div>

  <!-- Q3 -->
  <div class="quiz-card">
    <div class="quiz-q"><span>Q3</span>🐸 青蛙是什么动物？它能生活在哪些地方？</div>
    <div class="quiz-opts">
      <div class="quiz-opt" onclick="ans(this,'q3','A')">A. 只能生活在水中</div>
      <div class="quiz-opt" onclick="ans(this,'q3','B')">B. 只能生活在陆地上</div>
      <div class="quiz-opt" onclick="ans(this,'q3','C')">C. 两栖动物，水中和陆地都能生活 ✓</div>
      <div class="quiz-opt" onclick="ans(this,'q3','D')">D. 只能生活在空中</div>
    </div>
    <div class="quiz-fb correct" id="q3-C">✅ 正确！青蛙是两栖动物，既能在水里游泳，又能在陆地上跳跃。它的皮肤光滑，需要保持湿润，所以常在水边生活。</div>
    <div class="quiz-fb wrong" id="q3-A">❌ 青蛙可不是只能在水里生活！成年青蛙可以在陆地上跳跃，它是两栖动物——水中和陆地都能生活。</div>
    <div class="quiz-fb wrong" id="q3-B">❌ 青蛙的皮肤需要保持湿润，它也会在水里游泳（特别是蝌蚪期）。青蛙是两栖动物，不只生活在陆地哦！</div>
    <div class="quiz-fb wrong" id="q3-D">❌ 青蛙不会飞！它靠强壮的后腿跳跃移动，生活在水边，是两栖动物。</div>
  </div>

  <!-- Q4 -->
  <div class="quiz-card">
    <div class="quiz-q"><span>Q4</span>🐮 牛只吃草和植物，它属于哪种食性？</div>
    <div class="quiz-opts">
      <div class="quiz-opt" onclick="ans(this,'q4','A')">A. 肉食动物</div>
      <div class="quiz-opt" onclick="ans(this,'q4','B')">B. 草食动物 ✓</div>
      <div class="quiz-opt" onclick="ans(this,'q4','C')">C. 杂食动物</div>
      <div class="quiz-opt" onclick="ans(this,'q4','D')">D. 不吃任何东西</div>
    </div>
    <div class="quiz-fb correct" id="q4-B">✅ 正确！牛是草食动物，只吃草和植物。草食动物通常有宽平的臼齿，适合研磨植物纤维。</div>
    <div class="quiz-fb wrong" id="q4-A">❌ 肉食动物只吃其他动物的肉，如老虎、鲨鱼。牛只吃草和植物，应该是草食动物哦！</div>
    <div class="quiz-fb wrong" id="q4-C">❌ 杂食动物既吃植物又吃动物，如熊、猪。牛只吃草和植物，不吃肉，它是草食动物。</div>
    <div class="quiz-fb wrong" id="q4-D">❌ 所有动物都需要吃东西获取能量。牛每天要吃很多草，它是草食动物哦！</div>
  </div>

  <!-- Q5 -->
  <div class="quiz-card">
    <div class="quiz-q"><span>Q5</span>🐍 蛇没有腿，它靠什么方式移动？</div>
    <div class="quiz-opts">
      <div class="quiz-opt" onclick="ans(this,'q5','A')">A. 飞翔</div>
      <div class="quiz-opt" onclick="ans(this,'q5','B')">B. 游泳</div>
      <div class="quiz-opt" onclick="ans(this,'q5','C')">C. 扭动身体爬行 ✓</div>
      <div class="quiz-opt" onclick="ans(this,'q5','D')">D. 跳跃</div>
    </div>
    <div class="quiz-fb correct" id="q5-C">✅ 正确！蛇没有腿，靠扭动身体和腹部鳞片与地面的摩擦力来爬行前进。蛇的爬行速度其实很快！</div>
    <div class="quiz-fb wrong" id="q5-A">❌ 蛇没有翅膀，不能飞翔。它靠扭动身体爬行，用腹部鳞片和地面摩擦来移动。</div>

    <div class="quiz-fb wrong" id="q5-D">❌ 跳跃是青蛙的运动方式，青蛙有强壮的后腿。蛇没有腿，靠扭动身体爬行哦！</div>
  </div>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
