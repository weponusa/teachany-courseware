  <style>
:root{--bg:#0b1120;--border:#2a3a5e;--primary:#60a5fa;--primary-dark:#3b82f6;--secondary:#818cf8;--success:#4ade80;--text:#e6edf7;--danger:#f87171;--primary-light:#93c5fd;--radius:12px;--shadow:0 4px 20px rgba(0,0,0,.3);--card-bg:#15233f;--text-muted:#8aa0c0}

    :root {
      --bg: #f8fafc;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --primary-light: #dbeafe;
      --secondary: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --card-bg: #ffffff;
      --radius: 14px;
      --shadow: 0 4px 24px rgba(59,130,246,0.08);
      --shadow-lg: 0 8px 40px rgba(59,130,246,0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    /* ── Header ── */
    .app-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      color: #fff;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      box-shadow: 0 2px 16px rgba(30,58,138,0.25);
      position: sticky; top: 0; z-index: 100;
    }
    .app-header .logo { font-size: 15px; font-weight: 700; opacity: .9; letter-spacing: .5px; }
    .app-header h1 { font-size: 18px; font-weight: 700; }
    .app-header .meta { font-size: 12px; opacity: .75; text-align: right; line-height: 1.5; }
    /* ── Progress Bar ── */
    .progress-wrap {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 10px 32px;
      display: flex; align-items: center; gap: 12px;
    }
    .progress-label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .progress-track {
      flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 4px; transition: width .5s ease;
    }
    .progress-pct { font-size: 12px; color: var(--primary); font-weight: 700; min-width: 36px; text-align: right; }
    /* ── Nav Tabs ── */
    .nav-tabs {
      display: flex; background: #fff; border-bottom: 2px solid var(--border);
      padding: 0 24px; gap: 4px; overflow-x: auto;
    }
    .nav-tab {
      padding: 14px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
      border-bottom: 3px solid transparent; color: var(--text-muted);
      transition: all .2s; white-space: nowrap; border-radius: var(--radius) var(--radius) 0 0;
      margin-bottom: -2px;
    }
    .nav-tab:hover { color: var(--primary); background: var(--primary-light); }
    .nav-tab.active { color: var(--primary); border-bottom-color: var(--primary); background: var(--primary-light); }
    .nav-tab.locked { opacity: .4; cursor: not-allowed; }
    /* ── Main Layout ── */
    .main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
    /* ── Cards ── */
    .card {
      background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 28px 32px; margin-bottom: 24px; border: 1px solid var(--border);
    }
    .card-title {
      font-size: 18px; font-weight: 700; color: var(--primary-dark);
      margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .card-title .icon { font-size: 20px; }
    /* ── ABT Banner ── */
    .abt-banner {
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 60%, #3b82f6 100%);
      border-radius: var(--radius); padding: 40px 48px; color: #fff; margin-bottom: 28px;
      position: relative; overflow: hidden;
    }
    .abt-banner::before {
      content: ''; position: absolute; right: -40px; top: -40px;
      width: 220px; height: 220px; background: rgba(255,255,255,.06); border-radius: 50%;
    }
    .abt-banner::after {
      content: ''; position: absolute; right: 60px; bottom: -60px;
      width: 160px; height: 160px; background: rgba(255,255,255,.04); border-radius: 50%;
    }
    .abt-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; opacity: .6; margin-bottom: 8px; }
    .abt-banner h2 { font-size: 26px; font-weight: 800; margin-bottom: 16px; line-height: 1.3; }
    .abt-text { font-size: 15px; line-height: 1.8; opacity: .9; max-width: 680px; }
    .abt-text .but { color: #fbbf24; font-weight: 700; }
    .abt-text .therefore { color: #34d399; font-weight: 700; }
    .core-q {
      margin-top: 20px; padding: 14px 20px; background: rgba(255,255,255,.12);
      border-radius: 10px; border-left: 4px solid #fbbf24;
      font-size: 15px; font-weight: 600; line-height: 1.5;
    }
    /* ── Module Block ── */
    .module-block { margin-bottom: 32px; }
    .module-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
      padding-bottom: 12px; border-bottom: 2px solid var(--primary-light);
    }
    .module-num {
      width: 36px; height: 36px; background: var(--primary); color: #fff;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; flex-shrink: 0;
    }
    .module-header h3 { font-size: 17px; font-weight: 700; color: var(--text); }
    .module-body { font-size: 14px; line-height: 1.9; color: #374151; }
    .module-body .key-q {
      display: inline-block; background: var(--primary-light); color: var(--primary-dark);
      border-radius: 6px; padding: 2px 10px; font-weight: 600; font-size: 13px; margin-bottom: 8px;
    }
    /* ── SVG Map ── */
    .map-wrap {
      background: #e8f4fd; border-radius: var(--radius); padding: 20px;
      margin: 16px 0; overflow: hidden;
    }
    .map-title { font-size: 14px; font-weight: 700; color: var(--primary-dark); margin-bottom: 12px; text-align: center; }
    .map-legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
    .legend-dot { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    /* ── Source Cards ── */
    .source-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
    .source-card {
      border-radius: 10px; padding: 16px 20px; font-size: 13px; line-height: 1.7;
    }
    .source-colonial { background: #fef3c7; border-left: 4px solid #f59e0b; }
    .source-native { background: #d1fae5; border-left: 4px solid #10b981; }
    .source-card .src-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; opacity: .7; }
    .source-card .src-text { font-style: italic; color: #374151; }
    .source-card .src-sig { font-size: 11px; color: var(--text-muted); margin-top: 8px; text-align: right; }
    /* ── Exercise ── */
    .exercise-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .ex-tab {
      padding: 7px 18px; border-radius: 20px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: 2px solid var(--border); background: #fff; color: var(--text-muted);
      transition: all .2s;
    }
    .ex-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .ex-panel { display: none; }
    .ex-panel.active { display: block; }
    .ex-q { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 14px; line-height: 1.6; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .opt {
      display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px;
      border: 2px solid var(--border); border-radius: 10px; cursor: pointer;
      font-size: 14px; transition: all .2s; background: #fff; text-align: left;
    }
    .opt:hover { border-color: var(--primary); background: var(--primary-light); }
    .opt.correct { border-color: var(--success); background: #d1fae5 !important; }
    .opt.wrong { border-color: var(--danger); background: #fee2e2 !important; }
    .opt-key {
      width: 24px; height: 24px; border-radius: 50%; background: var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
    }
    .feedback {
      margin-top: 14px; padding: 12px 16px; border-radius: 10px;
      font-size: 13px; line-height: 1.6; display: none;
    }
    .feedback.show { display: block; }
    .feedback.correct { background: #d1fae5; border-left: 4px solid var(--success); color: #065f46; }
    .feedback.wrong { background: #fee2e2; border-left: 4px solid var(--danger); color: #991b1b; }
    /* ── Sort Exercise ── */
    .sort-list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
    .sort-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      background: #fff; border: 2px solid var(--border); border-radius: 10px;
      cursor: grab; font-size: 14px; transition: all .2s; user-select: none;
    }
    .sort-item:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(59,130,246,.15); }
    .sort-item.dragging { opacity: .5; border-color: var(--primary); }
    .sort-item.drag-over { border-color: var(--secondary); background: #fffbeb; }
    .sort-handle { color: var(--text-muted); font-size: 18px; cursor: grab; }
    .sort-num {
      width: 26px; height: 26px; border-radius: 50%; background: var(--primary-light);
      color: var(--primary-dark); font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px;
      border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
      border: none; transition: all .2s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,.3); }
    .btn-outline { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
    .btn-outline:hover { background: var(--primary-light); }
    /* ── Branch Badges ── */
    .branch-result {
      margin-top: 16px; padding: 14px 18px; border-radius: 10px;
      font-size: 13px; line-height: 1.6; display: none;
    }
    .branch-result.show { display: block; }
    .branch-path-a { background: #dbeafe; border-left: 4px solid var(--primary); color: #1e3a8a; }
    .branch-path-b { background: #fef3c7; border-left: 4px solid var(--secondary); color: #78350f; }
    .branch-path-c { background: #d1fae5; border-left: 4px solid var(--success); color: #064e3b; }
    /* ── Summary ── */
    .summary-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
    .summary-card {
      background: linear-gradient(135deg, var(--primary-light), #fff);
      border-radius: 12px; padding: 20px; text-align: center;
      border: 1px solid var(--primary-light);
    }
    .summary-card .s-num { font-size: 32px; font-weight: 800; color: var(--primary); }
    .summary-card .s-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    /* ── Timeline ── */
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before {
      content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px;
      width: 2px; background: linear-gradient(to bottom, var(--primary), var(--secondary));
    }
    .tl-item { position: relative; margin-bottom: 18px; }
    .tl-dot {
      position: absolute; left: -24px; top: 4px;
      width: 12px; height: 12px; border-radius: 50%; background: var(--primary);
      border: 2px solid #fff; box-shadow: 0 0 0 2px var(--primary);
    }
    .tl-year { font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 2px; }
    .tl-text { font-size: 13px; color: var(--text); line-height: 1.5; }
    /* ── Responsive ── */
    @media (max-width: 700px) {
      .source-grid { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
      .abt-banner { padding: 24px 20px; }
      .main { padding: 16px 12px; }
    }
    .hidden { display: none !important; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700; letter-spacing: .5px;
    }
    .badge-blue { background: var(--primary-light); color: var(--primary-dark); }
    .badge-yellow { background: #fef3c7; color: #92400e; }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
    .mb-16 { margin-bottom: 16px; }
    .text-sm { font-size: 13px; color: var(--text-muted); }
    .flex-gap { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ═══ PPT 播放模式（v6.1 轻量注入） ═══ */
    body.play-mode { overflow: hidden; }
    body.play-mode .slide-wrapper {
      scroll-snap-type: y mandatory;
      overflow-y: auto;
      height: 100dvh;
      -webkit-overflow-scrolling: touch;
    }
    .slide-wrapper { position: relative; }
    .slide-progress-bar { position: fixed; top: 0; left: 0; height: 3px;
      background: linear-gradient(90deg, var(--primary, #3b82f6), var(--secondary, #06b6d4));
      z-index: 201; transition: width 0.3s; border-radius: 0 2px 2px 0; pointer-events: none; }
    .slide-toolbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 20px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border, #e5e7eb);
      transform: translateY(100%); transition: transform 0.3s ease; }
    body.play-mode .slide-toolbar, body.toolbar-visible .slide-toolbar { transform: translateY(0); }
    .toolbar-btn { background: none; border: none; cursor: pointer; padding: 8px;
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary, #6b7280); transition: all 0.2s; }
    .toolbar-btn:hover { background: var(--border, #e5e7eb); color: var(--text, #1f2937); }
    .toolbar-btn.active { color: var(--primary, #3b82f6); }
    .toolbar-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .toolbar-progress { flex: 1; max-width: 200px; height: 4px;
      background: var(--border, #e5e7eb); border-radius: 2px; cursor: pointer; position: relative; }
    .toolbar-progress-fill { height: 100%; background: var(--primary, #3b82f6);
      border-radius: 2px; transition: width 0.3s; }
    .toolbar-page-info { font-size: 12px; color: var(--text-secondary, #6b7280);
      min-width: 50px; text-align: center; }
    .play-mode-fab { position: fixed; bottom: 80px; right: 20px; z-index: 101;
      width: 48px; height: 48px; border-radius: 50%; border: none;
      background: var(--primary, #3b82f6); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(59,130,246,0.3); transition: all 0.3s; }
    .play-mode-fab:hover { transform: scale(1.1); box-shadow: 0 6px 16px rgba(59,130,246,0.4); }
    .play-mode-fab svg { width: 22px; height: 22px; fill: currentColor; stroke: none; }
    .slide-sidenav { position: fixed; right: 12px; top: 50%; transform: translateY(-50%);
      z-index: 90; display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
      opacity: 0; transition: opacity 0.3s; max-height: 70vh; overflow-y: auto;
      padding: 8px 4px; border-radius: 12px;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
      border: 1px solid var(--border, #e5e7eb); }
    .slide-sidenav::-webkit-scrollbar { display: none; }
    body.play-mode .slide-sidenav, body.toolbar-visible .slide-sidenav { opacity: 1; }
    .sidenav-dot { width: 24px; height: 4px; border-radius: 2px;
      background: var(--border, #e5e7eb); border: none; cursor: pointer;
      transition: all 0.2s; padding: 0; }
    .sidenav-dot.active { width: 32px; background: var(--primary, #3b82f6); }
    .sidenav-dot:hover { background: var(--primary, #3b82f6); opacity: 0.7; }
    .sidenav-counter { font-size: 10px; color: var(--text-secondary, #6b7280);
      text-align: center; margin-bottom: 4px; }
    /* 隐藏旧版 tab 导航（播放模式下） */
    body.play-mode #main-nav, body.play-mode nav[id="nav"], body.play-mode nav.nav { display: none !important; }
    @media (max-width:768px) {
      .slide-sidenav { right: 6px; gap: 2px; padding: 6px 3px; }
      .sidenav-dot { width: 20px; height: 3px; }
    }

<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-1"><h2>📖 殖民统治的痛</h2><div class="tu-q"><p><strong>And：</strong>学生知道殖民地的存在</p><p><strong>But：</strong>不清楚殖民剥削的具体表现</p><p><strong>Therefore：</strong>理解解放运动的必要性</p></div><div class="tu-q"><p>殖民统治的核心是经济掠夺和种族压迫。例如英国在印度推行‘孟加拉大饥荒’（1943年），为保障战争物资出口，导致300万人饿死，同时英国商人却囤积粮食牟利。这种‘吸血式’剥削激起了民族独立意识。</p></div><div class="tu-q"><p>🌍 就像班级里有人强行拿走你的午饭钱还嘲笑你，你会不会反抗？印度国大党领袖尼赫鲁曾说：‘每根英国铁路枕木下都躺着印度人的尸骨’。</p></div><div class="tu-q" data-answer="A"><h3>🏋️ 即练</h3><p>英国在印度造成大饥荒的主要目的是？</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="易错选B，要抓住殖民者根本目的是服务自身利益">A.保障对二战盟军的粮食供应</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="易错选B，要抓住殖民者根本目的是服务自身利益">B.惩罚印度人反抗</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="易错选B，要抓住殖民者根本目的是服务自身利益">C.进行人口控制实验</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="易错选B，要抓住殖民者根本目的是服务自身利益">D.发展印度农业</button></div><div class="tu-fb" hidden></div></div></section>
<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-2"><h2>📖 团结的力量</h2><div class="tu-q"><p><strong>And：</strong>学生了解单个国家独立事件</p><p><strong>But：</strong>忽视亚非拉联合斗争</p><p><strong>Therefore：</strong>认识国际互助的重要性</p></div><div class="tu-q"><p>1955年万隆会议是转折点，29个亚非国家首次抛开美苏自主发声。周恩来提出‘求同存异’，促成埃及纳赛尔（非洲）和印尼苏加诺（亚洲）合作。比如1961年埃及支援阿尔及利亚独立战争，提供中国转交的武器，最终使法国殖民军伤亡超18万后撤军。</p></div><div class="tu-q"><p>🌍 就像全校被霸凌的同学联合举报校霸，万隆会议后第三世界国家在联合国投票时经常互相支持。</p></div><div class="tu-q" data-answer="B"><h3>🏋️ 即练</h3><p>万隆会议对民族解放运动的最大贡献是？</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="注意会议性质是政治协调而非军事组织">A.建立了军事同盟</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="注意会议性质是政治协调而非军事组织">B.形成反殖统一战线</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="注意会议性质是政治协调而非军事组织">C.制定了经济制裁方案</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="注意会议性质是政治协调而非军事组织">D.推选出领导国</button></div><div class="tu-fb" hidden></div></div></section>

<canvas id="histTimelineCanvas" width="900" height="200" style="width:100%;max-height:220px;display:block;border-radius:14px;background:rgba(15,23,42,0.85);margin:16px 0" aria-label="互动时间轴"></canvas>
<script>
(function(){
  var canvas=document.getElementById('histTimelineCanvas');
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var items=[["1945", "联合国成立"], ["1947", "印巴分治"], ["1960", "非洲独立年"], ["1990", "纳米比亚独立"]];
  var hovered=-1;
  function draw(){
    var w=canvas.width,h=canvas.height;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle='rgba(15,23,42,0.85)';ctx.fillRect(0,0,w,h);
    var baseY=h/2+20;
    ctx.strokeStyle='#3b82f6';ctx.lineWidth=3;ctx.beginPath();
    items.forEach(function(item,i){var x=80+i*((w-160)/(items.length-1||1));if(i===0)ctx.moveTo(x,baseY);else ctx.lineTo(x,baseY);});
    ctx.stroke();
    items.forEach(function(item,i){
      var x=80+i*((w-160)/(items.length-1||1));
      ctx.fillStyle=i===hovered?'#f59e0b':'#3b82f6';
      ctx.beginPath();ctx.arc(x,baseY,i===hovered?14:10,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='white';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
      ctx.fillText(item[0],x,baseY-24);
      ctx.fillStyle='#cbd5e1';ctx.font='12px sans-serif';
      var desc=item[1].length>8?item[1].slice(0,8)+'…':item[1];
      ctx.fillText(desc,x,baseY+30);
    });
    if(hovered>=0){
      var item=items[hovered];
      ctx.fillStyle='rgba(30,41,59,0.95)';ctx.fillRect(w/2-140,10,280,44);
      ctx.strokeStyle='#3b82f6';ctx.strokeRect(w/2-140,10,280,44);
      ctx.fillStyle='#fbbf24';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
      ctx.fillText(item[0]+'：'+item[1],w/2,38);
    }
  }
  canvas.addEventListener('mousemove',function(e){
    var rect=canvas.getBoundingClientRect();var mx=(e.clientX-rect.left)*(canvas.width/rect.width);
    var newH=-1;items.forEach(function(item,i){var x=80+i*((canvas.width-160)/(items.length-1||1));if(Math.abs(mx-x)<24)newH=i;});
    if(newH!==hovered){hovered=newH;draw();}
  });
  canvas.addEventListener('mouseleave',function(){hovered=-1;draw();});
  draw();
})();
</script>

<script>
/* ═══════ Slide Controller v6.1 (轻量注入) ═══════ */
(function(){
'use strict';
/* 检测页面元素：.section 或 .screen */
const allSections = Array.from(document.querySelectorAll('.section, .screen'));
if(!allSections.length) return;
const totalPages = allSections.length;

let currentPage = 0, isPlayMode = false, isAutoPlay = false, autoPlayTimer = null;
const progressBar = document.getElementById('slide-progress-bar');
const sidenav = document.getElementById('slide-sidenav');
const fab = document.getElementById('play-mode-fab');
const fabPlay = document.getElementById('fab-icon-play');
const fabBrowse = document.getElementById('fab-icon-browse');
const tbPrev = document.getElementById('tb-prev');
const tbNext = document.getElementById('tb-next');
const tbPageInfo = document.getElementById('tb-page-info');
const tbProgressFill = document.getElementById('tb-progress-fill');
const tbProgress = document.getElementById('tb-progress');
const tbAutoplay = document.getElementById('tb-autoplay');
const tbFullscreen = document.getElementById('tb-fullscreen');

/* 提取标签名 */
function getPageLabel(el) {
  const h = el.querySelector('h1,h2,h3,.section-title');
  if (h) return h.textContent.trim().slice(0, 20);
  const btn = document.querySelector('.nav-btn.active, .nav-tab.active');
  if (btn) return btn.textContent.trim().slice(0, 20);
  return '第' + (allSections.indexOf(el) + 1) + '页';
}

function buildSidenav() {
  sidenav.innerHTML = '';
  const counter = document.createElement('div');
  counter.className = 'sidenav-counter'; counter.id = 'sidenav-counter';
  counter.textContent = '1/' + totalPages;
  sidenav.appendChild(counter);
  allSections.forEach((p, i) => {
    const d = document.createElement('button');
    d.className = 'sidenav-dot' + (i === 0 ? ' active' : '');
    d.setAttribute('aria-label', getPageLabel(p));
    d.addEventListener('click', () => goToPage(i));
    sidenav.appendChild(d);
  });
}

function updateUI() {
  const prog = totalPages > 1 ? currentPage / (totalPages - 1) * 100 : 100;
  if (progressBar) progressBar.style.width = prog + '%';
  if (tbProgressFill) tbProgressFill.style.width = prog + '%';
  if (tbPageInfo) tbPageInfo.textContent = (currentPage + 1) + ' / ' + totalPages;
  sidenav.querySelectorAll('.sidenav-dot').forEach((d, i) => d.classList.toggle('active', i === currentPage));
  const ce = document.getElementById('sidenav-counter');
  if (ce) ce.textContent = (currentPage + 1) + '/' + totalPages;
  if (tbPrev) tbPrev.style.opacity = currentPage === 0 ? '0.3' : '1';
  if (tbNext) tbNext.style.opacity = currentPage === totalPages - 1 ? '0.3' : '1';
}

function goToPage(i) {
  if (i < 0 || i >= totalPages) return;
  currentPage = i;
  const target = allSections[currentPage];
  target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  updateUI();
}

function nextPage() { if (currentPage < totalPages - 1) goToPage(currentPage + 1); }
function prevPage() { if (currentPage > 0) goToPage(currentPage - 1); }

/* Scroll-based page tracking */
let scrollTimeout;
function onScroll() {
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => {
    const st = window.scrollY;
    let closest = 0, minD = Infinity;
    allSections.forEach((p, i) => {
      const d = Math.abs(p.offsetTop - st - 100);
      if (d < minD) { minD = d; closest = i; }
    });
    if (closest !== currentPage) { currentPage = closest; updateUI(); }
  }, 120);
}
window.addEventListener('scroll', onScroll, { passive: true });

function togglePlayMode() {
  isPlayMode = !isPlayMode;
  document.body.classList.toggle('play-mode', isPlayMode);
  document.body.classList.toggle('toolbar-visible', isPlayMode);
  if (fabPlay) fabPlay.style.display = isPlayMode ? 'none' : 'block';
  if (fabBrowse) fabBrowse.style.display = isPlayMode ? 'block' : 'none';
  if (isPlayMode) {
    document.documentElement.style.overflow = 'hidden';
    goToPage(currentPage);
  } else {
    document.documentElement.style.overflow = '';
  }
}

if (fab) fab.addEventListener('click', togglePlayMode);
if (tbPrev) tbPrev.addEventListener('click', prevPage);
if (tbNext) tbNext.addEventListener('click', nextPage);
if (tbProgress) tbProgress.addEventListener('click', e => {
  const r = tbProgress.getBoundingClientRect();
  goToPage(Math.round((e.clientX - r.left) / r.width * (totalPages - 1)));
});
if (tbAutoplay) tbAutoplay.addEventListener('click', () => {
  isAutoPlay = !isAutoPlay;
  tbAutoplay.classList.toggle('active', isAutoPlay);
  if (isAutoPlay) {
    autoPlayTimer = setInterval(() => {
      if (currentPage < totalPages - 1) nextPage();
      else { clearInterval(autoPlayTimer); isAutoPlay = false; tbAutoplay.classList.remove('active'); }
    }, 8000);
  } else { clearInterval(autoPlayTimer); }
});
if (tbFullscreen) tbFullscreen.addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (!isPlayMode) {
    if (e.key === 'f' || e.key === 'F') { if (!e.ctrlKey && !e.metaKey) togglePlayMode(); }
    return;
  }
  switch (e.key) {
    case 'ArrowRight': case 'ArrowDown': case ' ': e.preventDefault(); nextPage(); break;
    case 'ArrowLeft': case 'ArrowUp': e.preventDefault(); prevPage(); break;
    case 'Escape': togglePlayMode(); break;
  }
});

buildSidenav();

/* ═══ v6.2 自动初始化：连续阅读模式下预加载动态内容 ═══ */
(function(){
  try {
    var inited = new Set();
    allSections.forEach(function(screen) {
      var id = screen.id;
      if (!id || inited.has(id)) return;
      inited.add(id);
      /* 根据屏幕 ID 推测并调用对应的 init 函数 */
      var caps = id.charAt(0).toUpperCase() + id.slice(1);
      var candidates = [
        'init' + caps,              /* initWarmup, initL1, initBoss ... */
        'init_' + id,               /* init_warmup */
        'load' + caps,              /* loadBoss */
        'build' + caps,             /* buildQuiz */
        'render' + caps,            /* renderContent */
        'setup' + caps,             /* setupLevel */
      ];
      for (var i = 0; i < candidates.length; i++) {
        if (typeof window[candidates[i]] === 'function') {
          try { window[candidates[i]](); } catch(e) {}
          break;
        }
      }
    });
  } catch(e) {}
})();
/* ═══ end v6.2 auto-init ═══ */

updateUI();
document.body.classList.add('toolbar-visible');
setTimeout(() => { if (!isPlayMode) document.body.classList.remove('toolbar-visible'); }, 3000);
})();
</script>

function histmDepthCheck(button, isCorrect, feedbackId, explanation) {
  var box = button.closest('.module-check');
  if (!box || box.dataset.answered) return;
  box.dataset.answered = '1';
  box.querySelectorAll('button').forEach(function (item) {
    item.disabled = true;
    if (item.dataset.correct === '1') item.classList.add('correct');
  });
  if (!isCorrect) button.classList.add('wrong');
  var feedback = document.getElementById(feedbackId);
  if (feedback) {
    feedback.style.display = 'block';
    feedback.textContent = (isCorrect ? '正确。' : '再想想。') + explanation;
  }
}
