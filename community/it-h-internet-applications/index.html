    <div class="card">
      <span class="phase-tag">知识精讲</span>
      <h2>互联网应用：Web、HTTP 与邮件</h2>
      <p>常见互联网应用基于客户端—服务器模式。Web 用浏览器访问服务器上的资源；HTTP/HTTPS 规定请求与响应的格式与语义（方法如 GET/POST、状态码如 200/404）。电子邮件通过 SMTP 发送、用 POP3/IMAP 接收。理解“协议+端口+资源定位（URL）”有助于判断应用如何通信、为何打不开网页或邮件失败。</p>
    </div>
  </section>
<section class="slide-page" data-page-type="content" data-tsh="方法范例">

    data-bloom-level="apply" data-scaffold="partial" data-tts="lesson-method">
    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：跟一次完整请求路径</h2>
      <p>以访问网页为例：解析URL→DNS查IP→建立连接（HTTPS还握手）→发送HTTP请求→服务器返回响应→浏览器渲染。排错时看域名、网络、证书、状态码分别对应哪一环。邮件则分清发信与收信协议角色不同。</p>
      <div class="worked-example"><strong>范例：</strong>输入 https://example.com/a 时，浏览器向该主机请求路径 /a；若返回 404，说明连接可能成功但资源不存在。</div>
      <p id="lesson-pitfall" class="ith-pitfall"><strong>常见误区：</strong>常见误区是把“能上网”等同于“应用层协议都懂”，或混淆 HTTP 状态码含义；应把 URL、DNS、HTTP、渲染分成环节理解。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练：辨析要点</h3>
        <p>HTTPS 相对 HTTP 的主要增强是？</p>

<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-1"><h2>📖 HTTP是什么</h2><div class="tu-q"><p><strong>And：</strong>学生每天用浏览器上网</p><p><strong>But：</strong>不清楚网址开头的http://代表什么</p><p><strong>Therefore：</strong>理解HTTP协议是使用互联网的基础</p></div><div class="tu-q"><p>HTTP是超文本传输协议，像快递员在浏览器和网站服务器之间送数据。比如你输入http://www.example.com时：1.浏览器用HTTP协议向服务器发送请求；2.服务器用HTTP协议返回网页内容。每次请求都有数字状态码，比如404表示网页不存在，200表示成功。</p></div><div class="tu-q"><p>🌍 就像点外卖：1.你在APP下单（发送HTTP请求）2.商家接单后送餐（服务器响应）3.收到短信‘订单已完成’（状态码200）。</p></div><div class="tu-q" data-answer="A"><h3>🏋️ 即练</h3><p>小明访问网站时看到‘404错误’说明：</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="选错的同学注意：404是HTTP标准状态码，专门表示‘未找到资源’">A.网页不存在</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="选错的同学注意：404是HTTP标准状态码，专门表示‘未找到资源’">B.网络连接超时</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="选错的同学注意：404是HTTP标准状态码，专门表示‘未找到资源’">C.需要输入密码</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="选错的同学注意：404是HTTP标准状态码，专门表示‘未找到资源’">D.浏览器版本过低</button></div><div class="tu-fb" hidden></div></div></section>
<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-2"><h2>📖 网址的秘密</h2><div class="tu-q"><p><strong>And：</strong>学生会输入网址访问网站</p><p><strong>But：</strong>不明白https://和www各部分含义</p><p><strong>Therefore：</strong>掌握URL结构能识别安全网站</p></div><div class="tu-q"><p>URL就像网络门牌号，以https://www.baidu.com为例：1.https是加密的HTTP协议，比http更安全；2.www是服务器名；3.baidu.com是域名。其中.com是顶级域名，baidu是注册名称。浏览器会先通过DNS服务器把域名转换成IP地址（如180.101.49.12）才能访问。</p></div><div class="tu-q"><p>🌍 就像寄快递：1.收件人‘张三’相当于域名2.快递员要通过电话簿（DNS）查到他家的真实地址（IP）才能送货。</p></div><div class="tu-q" data-answer="B"><h3>🏋️ 即练</h3><p>以下哪个网址最安全？</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="选错的同学记住：https开头的网址才有加密保护">A.http://bank.123.com</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="选错的同学记住：https开头的网址才有加密保护">B.https://bank.123.com</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="选错的同学记住：https开头的网址才有加密保护">C.www.bank.123.com</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="选错的同学记住：https开头的网址才有加密保护">D.bank.123.com</button></div><div class="tu-fb" hidden></div></div></section>
<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-3"><h2>📖 邮件怎么发</h2><div class="tu-q"><p><strong>And：</strong>学生注册过电子邮箱</p><p><strong>But：</strong>不知道邮件如何从发件箱到收件箱</p><p><strong>Therefore：</strong>理解SMTP/POP3协议保障通信安全</p></div><div class="tu-q"><p>邮件传输靠SMTP（发信）和POP3（收信）协议。比如用QQ邮箱发信给163邮箱：1.你的电脑通过SMTP协议把邮件送到QQ邮箱服务器2.QQ服务器通过SMTP把邮件转发给163服务器3.对方用POP3协议从163服务器下载邮件。整个过程像邮局系统，每个步骤都有数字端口号（如SMTP用25端口）。</p></div><div class="tu-q"><p>🌍 就像传统寄信：1.你把信投进邮筒（SMTP发信）2.邮局分拣运输3.收件人从信箱取信（POP3收信）。</p></div><div class="tu-q" data-answer="A"><h3>🏋️ 即练</h3><p>小红的邮件卡在发件箱最可能因为：</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="注意区分：SMTP管发送，POP3管接收，发件箱问题通常是SMTP异常">A.SMTP服务器故障</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="注意区分：SMTP管发送，POP3管接收，发件箱问题通常是SMTP异常">B.POP3服务器故障</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="注意区分：SMTP管发送，POP3管接收，发件箱问题通常是SMTP异常">C.收件人邮箱已满</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="注意区分：SMTP管发送，POP3管接收，发件箱问题通常是SMTP异常">D.邮件内容有敏感词</button></div><div class="tu-fb" hidden></div></div></section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
