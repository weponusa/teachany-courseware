<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#081426"/>
  <circle cx="1020" cy="110" r="170" fill="#38bdf8" opacity="0.12"/>
  <text x="80" y="100" fill="#f8fafc" font-size="48" font-weight="900">理想气体方程 · 概念结构</text>
  <text x="80" y="158" fill="#cbd5e1" font-size="26">p、V、T、n 如何定量联系？</text>
  <rect x="60" y="230" width="200" height="130" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <text x="90" y="300" fill="#38bdf8" font-size="24" font-weight="700">玻意耳</text>
  <text x="75" y="335" fill="#94a3b8" font-size="18">p₁V₁=p₂V₂</text>
  <rect x="290" y="230" width="200" height="130" rx="18" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/>
  <text x="320" y="300" fill="#a78bfa" font-size="24" font-weight="700">查理</text>
  <text x="305" y="335" fill="#94a3b8" font-size="18">V/T=常数</text>
  <rect x="520" y="230" width="200" height="130" rx="18" fill="#0f172a" stroke="#22c55e" stroke-width="3"/>
  <text x="545" y="300" fill="#22c55e" font-size="24" font-weight="700">阿伏伽德罗</text>
  <text x="535" y="335" fill="#94a3b8" font-size="18">V∝n</text>
  <rect x="750" y="210" width="360" height="170" rx="22" fill="#0f172a" stroke="#fbbf24" stroke-width="4"/>
  <text x="800" y="290" fill="#fbbf24" font-size="36" font-weight="800">pV = nRT</text>
  <text x="780" y="340" fill="#cbd5e1" font-size="20">R ≈ 8.31 J/(mol·K)</text>
  <text x="80" y="520" fill="#fbbf24" font-size="26">记忆：先判条件（恒温/恒压/变 n），再选定律，温度用 K。</text>
</svg>
