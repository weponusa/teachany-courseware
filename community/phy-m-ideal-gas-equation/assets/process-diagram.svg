<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#081426"/>
  <text x="80" y="90" fill="#f8fafc" font-size="44" font-weight="900">理想气体 · 解题流程</text>
  <circle cx="140" cy="280" r="50" fill="#38bdf8" opacity="0.2" stroke="#38bdf8" stroke-width="3"/>
  <text x="108" y="288" fill="#38bdf8" font-size="22" font-weight="700">1 读题</text>
  <line x1="190" y1="280" x2="270" y2="280" stroke="#64748b" stroke-width="4"/>
  <circle cx="320" cy="280" r="50" fill="#a78bfa" opacity="0.2" stroke="#a78bfa" stroke-width="3"/>
  <text x="278" y="275" fill="#a78bfa" font-size="18" font-weight="700">2 判条件</text>
  <text x="285" y="300" fill="#94a3b8" font-size="14">T/n 变？</text>
  <line x1="370" y1="280" x2="450" y2="280" stroke="#64748b" stroke-width="4"/>
  <circle cx="500" cy="280" r="50" fill="#22c55e" opacity="0.2" stroke="#22c55e" stroke-width="3"/>
  <text x="458" y="275" fill="#22c55e" font-size="18" font-weight="700">3 选定律</text>
  <text x="468" y="300" fill="#94a3b8" font-size="14">或 pV=nRT</text>
  <line x1="550" y1="280" x2="630" y2="280" stroke="#64748b" stroke-width="4"/>
  <circle cx="680" cy="280" r="50" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="3"/>
  <text x="638" y="275" fill="#f59e0b" font-size="18" font-weight="700">4 换单位</text>
  <text x="648" y="300" fill="#94a3b8" font-size="14">℃→K</text>
  <line x1="730" y1="280" x2="810" y2="280" stroke="#64748b" stroke-width="4"/>
  <circle cx="860" cy="280" r="50" fill="#fbbf24" opacity="0.2" stroke="#fbbf24" stroke-width="3"/>
  <text x="828" y="288" fill="#fbbf24" font-size="22" font-weight="700">5 计算</text>
  <rect x="80" y="400" width="1040" height="180" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="110" y="450" fill="#cbd5e1" font-size="22">恒温 → p₁V₁=p₂V₂ ｜ 恒压 → V₁/T₁=V₂/T₂ ｜ 一般 → pV=nRT</text>
  <text x="110" y="500" fill="#94a3b8" font-size="20">检验：结果量级是否合理（如标况 1 mol ≈ 22.4 L）</text>
  <text x="110" y="550" fill="#f87171" font-size="20">避坑：禁止直接用 ℃ 做比例运算！</text>
</svg>
