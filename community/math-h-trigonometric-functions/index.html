    <div class="card">
      <span class="phase-tag">知识精讲</span>
      <h2>三角函数综合：图像、性质与变换</h2>
      <p>正弦、余弦、正切函数把角与比值联系起来，并能用单位圆与图像研究性质。y=Asin(ωx+φ)+B（及余弦型）通过 A、ω、φ、B 控制振幅、周期、相位与上下平移。周期 T=2π/|ω|；对称轴、对称中心、单调区间是综合题常考点。同角关系、诱导公式用于化简求值。</p>
    </div>
  </section>
<section class="slide-page" data-page-type="content" data-tsh="方法范例">

    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：化标准型 → 读 A、ω、φ、B → 写性质</h2>
      <p>先把解析式化为 Asin(ωx+φ)+B 或 Acos(ωx+φ)+B，再求周期、最值、单调区间。求值优先用诱导公式化到锐角，或用单位圆判断象限符号。图像变换按“左右相位 → 横向伸缩 → 纵向伸缩/平移”的顺序分析更稳。</p>
      <div class="worked-example"><strong>范例：</strong>y=2sin(2x−π/3)：A=2，ω=2，φ=−π/3，T=π；最大值为 2，最小值为 −2。</div>
      <p id="lesson-pitfall" class="mathh-pitfall"><strong>常见误区：</strong>常见误区是周期写成 2π/ω 却漏了绝对值，或相位左右平移方向搞反。</p>
      <div class="module-check" data-conceptest="true">

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 心脏起搏器设计：工程师使用y=A+Bsin(ωt+φ)建模心肌电信号。某型号起搏器以72次/分钟为基准（ω=2π×1.2Hz），通过调节φ值实现不同心室同步化治疗，使心输出量提升15-20%。</p>
<p>2. 摩天大楼减震系统：台北101的660吨调谐质量阻尼器采用sin函数模拟风载振动。当风速达45m/s时，阻尼器振幅达1.5米，通过相位差180°的反向运动削减大楼摆动幅度约40%。</p>
<p>3. 医学影像重建：CT扫描的滤波反投影算法中，Radon变换需要计算数千个sinθ和cosθ值。某256排CT机每转一圈采集116736个投影数据，通过快速三角函数计算将重建时间压缩到0.35秒/层。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>问题1：当用y=Asin(Bx+C)+D建模潮汐时，为什么说参数A和D的物理意义比B、C更稳定？<br>引导思考：比较一天内潮差与月相周期的关系，注意天文常数与局部地理因素的差异。从挪威特罗姆瑟（潮差3.5米）与加拿大芬迪湾（潮差16米）的数据差异入手，分析哪个参数主要受海岸地形影响。</p>
<p>问题2：解释为什么sin²x+cos²x=1在交流电路分析中比在几何证明中更重要？<br>引导思考：考察220V交流电的瞬时功率计算，对比u(t)=311sin(100πt)与i(t)=14.14sin(100πt-π/6)的乘积展开式。思考为何视在功率S=UI需要转化为有功功率P=UIcosφ。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>从单摆实验测量周期开始，发现摆动角度θ与时间t的关系总满足某种周期性规律。接着引入单位圆定义，将sinθ从锐角扩展到任意角，解释为什么sin(π/2+θ)=cosθ这种诱导公式成立。通过绘制y=sinx的图像，观察到振幅、周期、相位三个关键特征，自然引出参数A、ω、φ的物理意义。以弹簧振子x(t)=0.2cos(10t)为例，说明导数v(t)=-2sin(10t)和加速度a(t)=-20cos(10t)都保持三角函数形式。最后综合应用解斜三角形问题：在测量珠峰高度时，若从海拔5200m处测得山顶仰角28°，前进1000米后仰角变为35°，通过建立tanθ方程可解出山体垂直高度约3640米（含观测点海拔）。整个知识链从周期性现象出发，经函数解析式与图像转换，最终落地到多参数的实际问题建模。</p>
</section>

  <h2 class="section-title">📚 深度理解</h2>
<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 相位平移混淆：学生常将y=sin(x+π/3)与y=sinx+π/3混淆。前者是图像左移π/3单位，后者是整体上移π/3单位。根源在于未理解相位变换本质是x的线性变换。如解y=2sin(3x-π/4)时，正确相位偏移量应是π/12而非π/4。</p>
<p>2. 周期计算遗漏系数：求y=cos(4x+π/6)周期时，约25%学生会直接答2π，忽略了x前系数4的影响。认知偏差来自对周期公式T=2π/|ω|中ω的提取不完整。实际周期应为π/2，在解决弹簧振子问题时这个错误会导致运动周期计算偏差50%。</p>
<p>3. 解三角方程漏解：解sinθ=0.5时，仅写出π/6而遗漏5π/6的情况。这种错误在单元测试中出现率达38%，源于未建立单位圆对称性的条件反射。例如在求交流电瞬时值时，漏解会导致电压峰值时刻少算50%。</p>
</section>
