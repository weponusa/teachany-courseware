<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eff6ff"/><stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="480" y="52" text-anchor="middle" fill="#1e3a8a" font-size="30" font-weight="800">议论文概念结构</text>

  <!-- 中心论点 -->
  <rect x="360" y="90" width="240" height="70" rx="14" fill="#1d4ed8"/>
  <text x="480" y="133" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">中心论点</text>
  <text x="480" y="182" text-anchor="middle" fill="#475569" font-size="16">作者要证明的观点（标题 / 开头 / 结尾常有信号词）</text>

  <!-- 论据两卡片 -->
  <rect x="90" y="230" width="330" height="110" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/>
  <text x="255" y="268" text-anchor="middle" fill="#1e3a8a" font-size="22" font-weight="700">事实论据</text>
  <text x="255" y="300" text-anchor="middle" fill="#475569" font-size="17">事例 · 数据 · 史实</text>
  <text x="255" y="324" text-anchor="middle" fill="#64748b" font-size="14">确凿、典型才有力</text>

  <rect x="540" y="230" width="330" height="110" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/>
  <text x="705" y="268" text-anchor="middle" fill="#1e3a8a" font-size="22" font-weight="700">道理论据</text>
  <text x="705" y="300" text-anchor="middle" fill="#475569" font-size="17">名言 · 公理 · 科学原理</text>
  <text x="705" y="324" text-anchor="middle" fill="#64748b" font-size="14">权威、公认才可信</text>

  <line x1="300" y1="230" x2="430" y2="162" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="660" y1="230" x2="530" y2="162" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr)"/>
  <text x="480" y="226" text-anchor="middle" fill="#3b82f6" font-size="15" font-weight="600">支 撑</text>

  <!-- 论证方法 -->
  <rect x="200" y="380" width="560" height="64" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
  <text x="480" y="407" text-anchor="middle" fill="#1e3a8a" font-size="20" font-weight="700">论证方法</text>
  <text x="480" y="432" text-anchor="middle" fill="#475569" font-size="17">举例论证 · 道理论证 · 对比论证 · 比喻论证</text>
  <line x1="480" y1="380" x2="480" y2="342" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 表达效果 -->
  <rect x="330" y="472" width="300" height="48" rx="24" fill="#1d4ed8"/>
  <text x="480" y="503" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">表达效果：说服力</text>
  <line x1="480" y1="444" x2="480" y2="470" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr)"/>
</svg>
