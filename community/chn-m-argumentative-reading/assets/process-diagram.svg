<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f0fdf4"/><stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg2)"/>
  <text x="480" y="52" text-anchor="middle" fill="#14532d" font-size="30" font-weight="800">议论文阅读答题四步法</text>

  <!-- 步骤 1 -->
  <circle cx="140" cy="120" r="26" fill="#16a34a"/>
  <text x="140" y="129" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">1</text>
  <rect x="40" y="160" width="200" height="120" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="3"/>
  <text x="140" y="200" text-anchor="middle" fill="#14532d" font-size="21" font-weight="700">圈画观点句</text>
  <text x="140" y="232" text-anchor="middle" fill="#475569" font-size="15">通读全文找中心论点</text>
  <text x="140" y="256" text-anchor="middle" fill="#475569" font-size="15">在观点句下画横线</text>

  <!-- 步骤 2 -->
  <circle cx="370" cy="120" r="26" fill="#16a34a"/>
  <text x="370" y="129" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">2</text>
  <rect x="270" y="160" width="200" height="120" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="3"/>
  <text x="370" y="200" text-anchor="middle" fill="#14532d" font-size="21" font-weight="700">标注论据类型</text>
  <text x="370" y="232" text-anchor="middle" fill="#475569" font-size="15">逐段圈画论据</text>
  <text x="370" y="256" text-anchor="middle" fill="#475569" font-size="15">分清事实 / 道理</text>

  <!-- 步骤 3 -->
  <circle cx="600" cy="120" r="26" fill="#16a34a"/>
  <text x="600" y="129" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">3</text>
  <rect x="500" y="160" width="200" height="120" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="3"/>
  <text x="600" y="200" text-anchor="middle" fill="#14532d" font-size="21" font-weight="700">判断论证方法</text>
  <text x="600" y="232" text-anchor="middle" fill="#475569" font-size="15">举例 / 道理</text>
  <text x="600" y="256" text-anchor="middle" fill="#475569" font-size="15">对比 / 比喻</text>

  <!-- 步骤 4 -->
  <circle cx="830" cy="120" r="26" fill="#16a34a"/>
  <text x="830" y="129" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">4</text>
  <rect x="730" y="160" width="200" height="120" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="3"/>
  <text x="830" y="200" text-anchor="middle" fill="#14532d" font-size="21" font-weight="700">规范组织答案</text>
  <text x="830" y="232" text-anchor="middle" fill="#475569" font-size="15">方法 + 内容 + 效果</text>
  <text x="830" y="256" text-anchor="middle" fill="#475569" font-size="15">先判断再引原文</text>

  <line x1="168" y1="120" x2="342" y2="120" stroke="#16a34a" stroke-width="3" marker-end="url(#arr2)"/>
  <line x1="398" y1="120" x2="572" y2="120" stroke="#16a34a" stroke-width="3" marker-end="url(#arr2)"/>
  <line x1="628" y1="120" x2="802" y2="120" stroke="#16a34a" stroke-width="3" marker-end="url(#arr2)"/>

  <!-- 高频考题提示 -->
  <rect x="130" y="330" width="700" height="150" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="480" y="372" text-anchor="middle" fill="#14532d" font-size="20" font-weight="700">高频考题：「某段用了什么论证方法？有什么作用？」</text>
  <text x="480" y="412" text-anchor="middle" fill="#475569" font-size="17">答题格式：运用了……的论证方法，</text>
  <text x="480" y="442" text-anchor="middle" fill="#475569" font-size="17">（如何）证明了……的观点，</text>
  <text x="480" y="470" text-anchor="middle" fill="#475569" font-size="17">使论证更具体 / 更有力 / 更生动，增强说服力。</text>
</svg>
