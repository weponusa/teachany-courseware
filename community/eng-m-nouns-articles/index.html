      <h2>名词、代词与冠词</h2>
      <p>名词分可数/不可数，注意复数规则；代词代替名词，注意主格宾格与形容词性/名词性物主代词；冠词 a/an/the 与零冠词有使用条件。三者常在同一句子里一起考查。</p>

      <span class="phase-tag">方法与范例</span>
      <h2>方法：先判可数再选冠词</h2>
      <p>可数单数一般要限定词；特指用 the；元音音素开头用 an。物主代词后不再加名词时用 mine/yours。</p>
      <div class="worked-example"><strong>范例：</strong>I have an apple. The apple is sweet. It is mine.</div>
      <p id="lesson-pitfall" class="engm-pitfall"><strong>常见误区：</strong>常见误区是按字母不是按音素选 a/an，或 the 滥用。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练：辨析要点</h3>
        <p>元音音素开头的可数名词单数前常用？</p>
        <button type="button" data-correct="0" onclick="engmDepthCheck(this,false,&#x27;engm-depth-feedback&#x27;,&quot;an 用于元音音素前，如 an hour。&quot;)">A. a</button><button type="button" data-correct="1" onclick="engmDepthCheck(this,true,&#x27;engm-depth-feedback&#x27;,&quot;an 用于元音音素前，如 an hour。&quot;)">B. an</button><button type="button" data-correct="0" onclick="engmDepthCheck(this,false,&#x27;engm-depth-feedback&#x27;,&quot;an 用于元音音素前，如 an hour。&quot;)">C. 一律 the</button><button type="button" data-correct="0" onclick="engmDepthCheck(this,false,&#x27;engm-depth-feedback&#x27;,&quot;an 用于元音音素前，如 an hour。&quot;)">D. 不能用冠词</button>

<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-1"><h2>📖 名词分类</h2><div class="tu-q"><p><strong>And：</strong>学生知道名词表示人、事物或地点</p><p><strong>But：</strong>但常混淆可数名词与不可数名词的用法</p><p><strong>Therefore：</strong>学会区分能避免‘a water’等错误</p></div><div class="tu-q"><p>名词分可数（能用数字直接计算）和不可数（需借助量词）。例如：3个苹果（three apples）可数，但‘面包’不可数，需说‘a piece of bread’。特别注意：部分名词如‘hair’当头发整体时为不可数（Her hair is long），但指一根根头发时可数（There’s a hair in my soup!）</p></div><div class="tu-q"><p>🌍 点奶茶时说‘我要两杯奶茶’（two cups of milk tea），因为‘茶’不可数，但‘杯’可数。若说‘two milk teas’会被追问‘大杯还是中杯’哦！</p></div><div class="tu-q" data-answer="C"><h3>🏋️ 即练</h3><p>以下哪项正确？</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="错选A/B/D是没掌握不可数名词必须加量词（pieces of）或特殊用法（hairs指多根头发）">A. I need two advice</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="错选A/B/D是没掌握不可数名词必须加量词（pieces of）或特殊用法（hairs指多根头发）">B. She has three beautiful hairs</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="错选A/B/D是没掌握不可数名词必须加量词（pieces of）或特殊用法（hairs指多根头发）">C. Give me two pieces of paper</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="错选A/B/D是没掌握不可数名词必须加量词（pieces of）或特殊用法（hairs指多根头发）">D. We bought five furnitures</button></div><div class="tu-fb" hidden></div></div></section>
<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-2"><h2>📖 冠词陷阱</h2><div class="tu-q"><p><strong>And：</strong>学生知道a/an表泛指，the表特指</p><p><strong>But：</strong>遇到‘乐器’‘最高级’等特殊情况易错</p><p><strong>Therefore：</strong>掌握规律后考试少扣分</p></div><div class="tu-q"><p>记住三个黄金规则：① 弹西洋乐器加the（play the piano），但运动项目不加（play basketball）；② 序数词/最高级前必加the（the first, the tallest）；③ 三餐前通常零冠词（have breakfast）。特例：当breakfast被定语修饰时加the（the breakfast you made）。</p></div><div class="tu-q"><p>🌍 对比‘我每天弹吉他（play the guitar）’和‘我每天打篮球（play basketball）’，虽然都是爱好，冠词用法完全不同！</p></div><div class="tu-q" data-answer="D"><h3>🏋️ 即练</h3><p>选择正确句子：</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="A缺the（最高级），B多the（三餐），C多the（球类运动）">A. She is best student</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="A缺the（最高级），B多the（三餐），C多the（球类运动）">B. We have the lunch at 12:00</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="A缺the（最高级），B多the（三餐），C多the（球类运动）">C. He plays the volleyball very well</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="A缺the（最高级），B多the（三餐），C多the（球类运动）">D. This is the most expensive book</button></div><div class="tu-fb" hidden></div></div></section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
