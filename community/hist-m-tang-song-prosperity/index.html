      <p id="lesson-pitfall" class="histm-pitfall"><strong>常见误区：</strong>常见误区是用今天城市标准衡量古代，或认为宋朝“积贫积弱”就没有繁荣。</p>

<p>实例二：科举制度研究影响现代公务员考试。中央党校课题组分析唐代"身言书判"考核标准后，在2022年国家公务员面试中加入"应急情境模拟"环节，参考了唐吏部选官时"判题"考察实务能力的特点，使录用人员基层适应期缩短17%。</p>
<p>实例三：敦煌莫高窟游客管理系统运用了唐宋市坊制数据。通过分析《唐六典》中长安城"坊市分离"的流量控制方法，景区将每日6000名游客按预约时段分为"晨钟""午市""暮鼓"三批进出，复制了唐代"日中击鼓二百下开市"的错峰模式，使洞窟CO₂浓度下降41%。</p>

<h3>🔍 易错点辨析</h3>
<p>错误一：认为科举制始于唐朝。实际隋炀帝大业元年（605年）正式确立进士科，但学生常因唐朝完善科举而混淆。根源在于教材常将唐太宗"天下英雄入吾彀中"作为典型事例。正确理解是：隋文帝废除九品中正制，隋炀帝创进士科，唐朝发展出常科（每年考）与制科（临时设）并形成"三十老明经，五十少进士"的层级差异。</p>
<p>错误二：将大运河长度误记为2000公里。学生易混淆现代测量值（隋运河全长2700公里）与唐代主干道（约1800公里）。认知根源在于教材配图比例尺不统一，且汴河段在唐宋多次改道。正确数据应区分：隋朝动用543万民工，以洛阳为中心，北达涿郡（今北京）、南至余杭（今杭州），通济渠段就长达650公里。</p>
<p>错误三：认为"开元盛世"持续整个玄宗时期。实际上天宝年间（742-756）已出现土地兼并，学生因"盛唐"概念泛化而忽略转折。具体表现是：开元末年全国耕地6.42亿亩（《通典》），但到天宝十四年（755年）安史之乱前，均田制瓦解导致"客户"（佃农）占比已达40%。正确分期应以734年李林甫拜相为界，此前为治世，此后危机暗涌。</p>
</section>

      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
