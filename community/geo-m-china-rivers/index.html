  <section class="section geom-depth core-knowledge-module text-module" id="lesson-focus"

    <div class="card">
      <span class="phase-tag">知识精讲</span>
      <h2>中国的河流与湖泊</h2>
      <p>中国河流众多，外流河主要流入太平洋，长江、黄河是最重要的大河。河流水文特征受降水与地形影响。湖泊有淡水湖与咸水湖。防洪、灌溉、发电、航运是河流开发的重要主题。</p>
    </div>
  </section>
<section class="slide-page" data-page-type="content" data-tsh="方法范例">
  <section class="section geom-depth core-knowledge-module text-module" id="lesson-method"
    data-bloom-level="apply" data-scaffold="partial" data-tts="lesson-method">
    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：源流—水文—治理利用</h2>
      <p>每条大河记发源、流经、注入与一两个突出问题（如黄河泥沙、长江洪水）。</p>
      <div class="worked-example"><strong>范例：</strong>黄河“几”字形流经，中游黄土高原水土流失导致下游“地上河”。</div>
      <p id="lesson-pitfall" class="geom-pitfall"><strong>常见误区：</strong>常见误区是把黄河长江的问题张冠李戴，或只记长度不看治理。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练：辨析要点</h3>
        <p>长江最终注入？</p>
        <button type="button" data-correct="0" onclick="geomDepthCheck(this,false,&#x27;geom-depth-feedback&#x27;,&quot;长江注入太平洋。&quot;)">A. 印度洋</button><button type="button" data-correct="1" onclick="geomDepthCheck(this,true,&#x27;geom-depth-feedback&#x27;,&quot;长江注入太平洋。&quot;)">B. 太平洋</button><button type="button" data-correct="0" onclick="geomDepthCheck(this,false,&#x27;geom-depth-feedback&#x27;,&quot;长江注入太平洋。&quot;)">C. 北冰洋</button><button type="button" data-correct="0" onclick="geomDepthCheck(this,false,&#x27;geom-depth-feedback&#x27;,&quot;长江注入太平洋。&quot;)">D. 内陆湖</button>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 南水北调工程运用河流阶地知识规避沉降风险。东线工程利用京杭大运河故道时，工程师根据淮河下游阶地高程数据（如蚌埠段二级阶地海拔28-32米），将输水管道布设在稳定地层，避免地面沉降导致的管线破裂。</p>
<p>2. 长江电子航道图依赖水系形态参数。航道部门通过测量汉口段河曲率（1.78）、分汊系数（2.3）等数据，结合洞庭湖调蓄功能（削减洪峰流量1.2万m³/s），动态调整船舶通航规则。</p>
<p>3. 青海湖遥感监测揭示气候变化。中科院团队通过2000-2020年卫星影像分析，发现湖泊面积从4256km²增至4543km²，结合布哈河径流量增加12%的数据，验证青藏高原暖湿化趋势。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. 问题：为什么长江三峡建成后，下游的鄱阳湖反而出现"汛期反枯"现象？分析思路：先对比三峡水库调度数据（汛前消落水位145m→175m），再考察长江与鄱阳湖水位关系（湖口站多年平均水位差变化），最后思考人工干预对自然水系互补机制的长期影响。</p>
<p>2. 问题：同样流经黄土高原，为何渭河含沙量（37kg/m³）远低于泾河（171kg/m³）？分析线索：从流域岩性差异（渭河流经秦岭变质岩区）、支流特性（泾河接纳马莲河红壤区）、以及人类活动（宝鸡峡灌区引水沉沙）三个维度建立比较框架。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先以1998年长江特大洪水切入，揭示我国河流"东多西少"的基本格局——400mm等降水量线大致对应外流区与内流区分界，这解释了为什么占国土面积64%的外流区集中了全国95%的河川径流。接着通过长江与黄河的对比，发现河流特性受气候与地形双重控制：长江流域降水充沛（年降水量1000mm以上）加上青藏高原的"水塔"作用，形成年径流量占全国36%的巨系统；而黄河虽流经中纬度但受季风影响弱（兰州站年降水量仅328mm），加上黄土高原侵蚀，造就了"水少沙多"的特殊性。最后聚焦人类活动影响，三峡水库的175米蓄水位使长江中游冲刷量增加2.4亿吨/年，而太湖流域的圩田系统导致水面率从12.6%降至7.4%，这些案例都说明现代治水必须统筹自然水循环与社会用水需求。从宏观格局到微观机制，中国河流的故事始终是自然地理与人文因素交织的生动教材。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 错误认为长江是中国最长的河流但水量不如黄河。实际上长江全长6300公里不仅是长度第一，年径流量达9513亿立方米（黄河仅580亿立方米）。这种错误源于学生将"母亲河"的情感认知与水文数据混淆，需强调黄河因流经干旱区而含沙量高但水量有限。</p>
<p>2. 混淆内流河与外流河的分界线。常见错误是将400mm等降水量线等同于季风区界线（实际为大兴安岭-阴山-贺兰山-巴颜喀拉山-冈底斯山）。根源在于忽视地形对水系的影响，如额尔齐斯河虽在西北却属北冰洋外流河，因其发源于阿尔泰山迎风坡。</p>
<p>3. 误判湖泊咸淡成因。有学生认为"所有内流区的湖都是咸水湖"，实际上青藏高原的冰川融水补给湖（如纳木错）矿化度仅1.7g/L，而干旱区的尾闾湖（如罗布泊）可达322g/L。需结合补给方式与蒸发量综合判断。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
