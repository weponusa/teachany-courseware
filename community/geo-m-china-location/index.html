<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 国际物流路径优化：中欧班列选择满洲里（123°E）或阿拉山口（83°E）口岸时，需计算西部省区到不同口岸的运输半径。新疆出口货物经阿拉山口比满洲里缩短1200公里，这正是经度跨度大的直接应用。</p>
<p>2. 卫星导航校准：北斗系统在南海诸岛（最南至3°N）定位时，需特别调整电离层模型。曾母暗沙附近的定位误差可能达到赤道地区的1.8倍，这涉及纬度对GNSS信号的影响机制。</p>
<p>3. 气候农业决策：云南咖啡种植区（22°N）与海南橡胶园（18°N）的寒害预警阈值相差2℃，源于纬度带热量差异。农业部制定的《热带作物种植北界》直接运用了位置纬度数据。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. 问题：若以胡焕庸线（黑河-腾冲线）为界，中国东南部面积占42%却承载94%人口，这与地理位置有何深层关联？引导：从季风区范围（大兴安岭-阴山-贺兰山连线）、海岸线长度（1.8万千米）、第三阶梯平原占比（12%）等角度，思考水热组合与人类活动的匹配度。</p>
<p>2. 问题：中俄边境黑龙江主航道中心线（129°E附近）与中哈边境巴尔鲁克山（82°E）相差47个经度，为何产生完全不同的界碑设置方式？引导：对比《尼布楚条约》与《中哈国界协定》签订时的测绘技术差异，思考经度跨度对边界划定的历史影响。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先要理解中国在世界的位置：北纬4°至53°N的纬度跨度带来从热带到寒温带9个温度带，73°E至135°E的经度跨度形成"东五区至东九区"的时区潜力。接着看疆域特征：陆地边界2.28万千米接壤14国，海岸线北起鸭绿江口（124°E）南至北仑河口（108°E），特别要注意南海断续线内200余个岛礁构成的海洋权益。最后落实到分析方法：用"四至点"坐标记忆法（如漠河北极村53°33'N），通过邻国接壤长度排序（俄罗斯最长4374千米）建立空间认知，结合地形三级阶梯理解海陆位置对降水的影响——东南季风携带的水汽到兰州（104°E）已衰减60%。典型案例如上海（121°E）与喀什（76°E）同在北纬31°附近，但年降水量相差10倍，这正是经度位置与海陆关系共同作用的结果。</p>
</section>

<h3>🔍 易错点辨析</h3>
<p>1. 错误认为中国最南端是海南岛三亚。实际上最南端是南沙群岛的曾母暗沙（3°58'N），两者纬度相差近10°。学生常因旅游宣传和地图视觉焦点产生误解，需通过南海断续线地图和主权碑坐标数据强化认知。</p>
<p>2. 混淆"地理中心"与"几何中心"。新疆塔城地区的中国地理中心（83°36'E,46°14'N）是基于人口经济权重计算，而陕西泾阳的几何中心（108°55'E,34°32'N）是纯数学中点。学生容易忽视地理学中"重心"概念的复杂性。</p>
<p>3. 低估中国东西时差幅度。虽然全国统一使用北京时间（东八区），但新疆喀什（73°E）与黑龙江抚远（135°E）理论时差达4小时8分钟。学生常因统一时区政策忽略实际太阳时的差异，可通过日出时间对照表进行验证。</p>
</section>

(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;

      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
