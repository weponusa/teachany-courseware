    <div class="slide-inner"><div class="card card-accent"><div class="section-header"><span class="phase-tag">Concept</span><h2>阅读细节题：课标核心是什么？</h2></div><p><strong>阅读细节题</strong>是高中英语的重要内容。语言技能分理解性技能和表达性技能，具体包括听、说、读、看（viewing）、写等，学生基于语篇所开展的学习活动即是基于这些语言技能，理解语篇和对语篇作出回应的活动。</p><p>所有的语言学习活动都应该在一定的主题语境下进行，即学生围绕某一具体的主题语境，基于不同类型的语篇，在解决问题的过程中，运用语言技能获取、梳理、整合语言知识和文化知识，深化对语言的理解，重视对语篇的赏析。</p></div></div>

      <h2>方法：题干关键词定位→比对选项</h2>
      <p>用专有名词、数字、生词回原文；选项常见陷阱：偷换、绝对化、答非所问、拼凑。</p>
      <div class="worked-example"><strong>范例：</strong>题干问原因，原文 because/lead to 处才是答案区，不可抄结果句。</div>
      <p id="lesson-pitfall" class="engh-pitfall"><strong>常见误区：</strong>常见误区是看见原词就选，掉入拼凑陷阱。</p>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>医疗报告解读：医生需要快速提取患者CT报告中的关键数据，如"5mm结节位于右肺上叶（SUVmax 2.3）"，这要求精准识别医学文本中的数值细节。某三甲医院统计显示，83%的误诊源于关键数据提取偏差，训练细节定位能力可降低医疗风险。</p>
<p>法律文书审核：律师处理合同时必须核对条款细节，比如"违约金为每日0.05%"与"年利率18%"的等价关系。2023年上海某并购案因漏看"最惠国待遇"条款细节导致2.4亿元损失，凸显细节阅读的商业价值。</p>
<p>AI信息抽取：Google的BERT模型在处理"航班CA981将于15:00延误至17:30"这类信息时，需要识别时间、航班号等细节实体。MIT实验显示，加入细节定位训练的模型准确率提升19%，达到92.3%的F1值。</p>

<section class="card amber">
<h3>🧩 深入追问</h3>
<p>问题1：当细节题题干出现"EXCEPT"时，解题策略与常规细节题有何本质不同？分析：这类逆向题实际考查的是信息排除能力，需要建立"反向验证"思维。建议先标注题干中的排除对象，再用选项回查原文时采用"证伪法"，特别注意那些使用同义词替换的干扰项。</p>
<p>问题2：如何处理文中出现的专业技术术语细节？以托福阅读中"photosystem II中的P680色素分子"为例。分析：这类细节不需要理解术语本身，而是定位其功能描述。重点捕捉破折号、括号或"which means"等解释性信号词，统计显示87%的术语题答案就在术语出现处的2句范围内。</p>

<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先要明确细节题的本质是"信息匹配游戏"，核心在于理解题干与原文的对应关系。例如2022年新高考Ⅰ卷第27题，题干问"珊瑚白化的直接原因"，原文第三段首句"rising sea temperatures trigger..."就是完美对应。接着要掌握三大定位技巧：数字定位（如年代、百分比）、专有名词定位（如人名、地名）、转折词定位（but/however后常出考点）。以剑桥雅思12 Test5为例，14题通过"1988"这个时间戳快速锁定段落，节省70%答题时间。最后要训练抗干扰能力，特别是选项中的"部分正确"陷阱，比如原文说"30% students use tablets"，干扰项可能变成"most students use mobile phones"。统计显示，高考英语细节题正确选项与原文的词汇重复率高达65%，而干扰项通常在1-2个关键词上做手脚。整套方法的应用就像考古学家用毛刷清理文物，需要逐层剥离无关信息，精准暴露关键细节。</p>
</section>

<h3>🔍 易错点辨析</h3>
<p>错误1：将推断题当作细节题处理。学生常把文中隐含的信息当作直接细节，例如面对"The town had been prosperous until the mine closed"时，直接选择"the mine is still operating"作为细节答案。根源在于混淆了detail questions和inference questions的题干特征，前者需要100%原文重现，后者允许合理推导。正确做法是锁定题干关键词如"according to the passage"或"the author states"。</p>
<p>错误2：忽略限定词导致范围错位。当原文出现"most participants (78%) reported improved sleep"时，学生常错选"all participants"作为正确细节。这是对量化限定词（some/majority/approximately）的敏感性不足，2019年高考全国卷Ⅲ第24题就因此设置了干扰项。精确做法是用笔圈出原文数据及限定范围。</p>
<p>错误3：跨段落信息拼贴。例如将第三段提到的"1936年发现"和第五段的"应用场景"强行组合成新事实。这种错误在雅思阅读T/F/NG题中占错误率的34%（剑桥官方数据）。本质是未遵循"one question one location"原则，应训练用题干关键词定位单一段落。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>

<script id="engh-depth-js">
function enghDepthCheck(button, isCorrect, feedbackId, explanation) {
  var box = button.closest('.module-check');
  if (!box || box.dataset.answered) return;
  box.dataset.answered = '1';
  box.querySelectorAll('button').forEach(function (item) {
    item.disabled = true;
    if (item.dataset.correct === '1') item.classList.add('correct');
  });
  if (!isCorrect) button.classList.add('wrong');
  var feedback = document.getElementById(feedbackId);
  if (feedback) {
    feedback.style.display = 'block';
    feedback.textContent = (isCorrect ? '正确。' : '再想想。') + explanation;
  }
}
</script>
