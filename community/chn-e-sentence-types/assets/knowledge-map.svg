<path d="M830.2 128 h208.4 a14,14 0 0 1 14,14 v30.0 h-236.4 v-30.0 a14,14 0 0 1 14,-14 z" fill="#ffe66d" fill-opacity=".13"/>
<text x="833.2" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">方法：听语气、看标点、试</text>
<text x="833.2" y="172.0" font-size="16.0" font-weight="700" fill="#0f172a">变换</text>
<circle cx="832.2" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="844.2" y="192.0" font-size="13.5" fill="#334155">在课本里各找一种句型各1句，</text>
<text x="844.2" y="214.0" font-size="13.5" fill="#334155">抄在本子上</text>
<circle cx="832.2" cy="231.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="844.2" y="236.0" font-size="13.5" fill="#334155">把&quot;春天来了</text>
<circle cx="832.2" cy="253.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="844.2" y="258.0" font-size="13.5" fill="#334155">自己造4种句子，每种1句</text>
<rect x="1070.6" y="128" width="236.4" height="188" rx="14" fill="#ffffff" stroke="#ffe66d" stroke-opacity=".35" stroke-width="2"/>
<path d="M1084.6 128 h208.4 a14,14 0 0 1 14,14 v30.0 h-236.4 v-30.0 a14,14 0 0 1 14,-14 z" fill="#ffe66d" fill-opacity=".13"/>
<text x="1087.6" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">深层理解：五镜头</text>
<circle cx="1086.6" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="1098.6" y="192.0" font-size="13.5" fill="#334155">像拆积木一样分解句子成分：</text>
<text x="1098.6" y="214.0" font-size="13.5" fill="#334155">谁+做什么+怎么做</text>
<circle cx="1086.6" cy="231.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="1098.6" y="236.0" font-size="13.5" fill="#334155">陈述句讲事实</text>
<circle cx="1086.6" cy="253.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="1098.6" y="258.0" font-size="13.5" fill="#334155">把字句强调动作发出者（我把</text>
<text x="1098.6" y="280.0" font-size="13.5" fill="#334155">作业写完）</text>
