<text x="70.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">陈述句的秘密</text>
<circle cx="69.0" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="81.0" y="192.0" font-size="13.5" fill="#334155">陈述句就像小记者报道新闻，</text>
<text x="81.0" y="214.0" font-size="13.5" fill="#334155">只讲事实不带感情</text>
<circle cx="69.0" cy="231.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="81.0" y="236.0" font-size="13.5" fill="#334155">告诉妈妈‘今天语文课学了5个</text>
<text x="81.0" y="258.0" font-size="13.5" fill="#334155">生字’也是在用陈述句</text>
<rect x="307.4" y="128" width="236.4" height="188" rx="14" fill="#ffffff" stroke="#ffe66d" stroke-opacity=".35" stroke-width="2"/>
