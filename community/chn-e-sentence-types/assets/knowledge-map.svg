<text x="578.8" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">句子类型：陈述疑问祈使感</text>
<text x="578.8" y="172.0" font-size="16.0" font-weight="700" fill="#0f172a">叹</text>
<circle cx="577.8" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="589.8" y="192.0" font-size="13.5" fill="#334155">按语气分，句子可分为陈述句</text>
<text x="589.8" y="214.0" font-size="13.5" fill="#334155">、疑问句、祈使句、感叹句</text>
