<text x="324.4" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">制作句子类型手册</text>
<circle cx="323.4" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="335.4" y="192.0" font-size="13.5" fill="#334155">收集校园里各种类型的句子</text>
