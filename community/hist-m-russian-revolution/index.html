    /* ===== CSS 变量 & 重置 ===== */
    :root {
      --bg-dark: #0d1117;
      --bg-card: #161b22;
      --bg-card2: #1c2128;
      --accent-red: #c0392b;
      --accent-gold: #f1c40f;
      --accent-blue: #2980b9;
      --accent-green: #27ae60;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --border: rgba(255,255,255,0.08);
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', SimHei, sans-serif;
      line-height: 1.75;
      font-size: 16px;

    a { color: var(--accent-blue); text-decoration: none; }
    img { max-width: 100%; border-radius: var(--radius); }

    /* ===== 导航 ===== */
    nav.top-nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,17,23,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex; align-items: center; gap: 8px;
      height: 56px; overflow-x: auto;

    nav.top-nav a {
      color: var(--text-secondary); font-size: 14px;

      white-space: nowrap; transition: all 0.2s;
    }
    nav.top-nav a:hover, nav.top-nav a.active {

    }
    nav.top-nav .nav-brand {
      font-weight: 700; color: #e74c3c; margin-right: 16px;
      font-size: 15px; white-space: nowrap;
    }

    /* ===== 页面区块 ===== */
    section { padding: 64px 24px; max-width: 1100px; margin: 0 auto; }
    section + section { border-top: 1px solid var(--border); }

    /* ===== Hero ===== */
    section.hero {
      padding: 80px 24px 48px;
      text-align: center;
    }
    .hero-year-badge {
      display: inline-block;
      background: rgba(192,57,43,0.2);
      border: 1px solid #e74c3c;
      color: #e74c3c;
      font-size: 13px; font-weight: 600;
      padding: 4px 16px; border-radius: 20px;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }
    .hero h1 {
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 900; color: #fff;
      line-height: 1.1; margin-bottom: 16px;
    }
    .hero h1 .star { color: #e74c3c; margin: 0 8px; }
    .hero .subtitle {
      font-size: 1.2rem; color: var(--text-secondary);
      max-width: 580px; margin: 0 auto 32px;
    }
    .hero-tags { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 40px; }
    .hero-tag {
      background: var(--bg-card2); border: 1px solid var(--border);
      font-size: 13px; color: var(--text-secondary);
      padding: 4px 14px; border-radius: 20px;
    }

    /* ===== 知识结构主图 (Hero figure) ===== */
    .ta-standard-figure {
      margin: 40px auto; max-width: 900px;
      background: var(--bg-card);
      border: 1px solid rgba(192,57,43,0.3);
      border-radius: var(--radius); padding: 12px;
    }
    .ta-standard-figure img.hero-cover-img {
      width: 100%; border-radius: 10px;
      display: block;
    }
    .ta-standard-figure figcaption {
      text-align: center; margin-top: 10px;
      font-size: 13px; color: var(--text-secondary);
    }


    .bloom-tag {
      display: inline-block;
      background: rgba(241,196,15,0.15);
      color: var(--accent-gold);
      font-size: 12px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    /* ===== 学习目标 ===== */
    .objectives-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px; margin-top: 28px;
    }
    .objective-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
    }
    .objective-card .bloom-level {
      font-size: 11px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .objective-card p { font-size: 14px; color: var(--text-secondary); }

    /* ===== 模块标题 ===== */
    .section-header {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 32px;
    }
    .section-header .number {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #c0392b, #922b21);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 900; color: #fff; flex-shrink: 0;
    }
    .section-header h2 { font-size: 1.8rem; font-weight: 800; color: #fff; }
    .section-header .section-sub { font-size: 0.95rem; color: var(--text-secondary); }

    /* ===== 时间线 ===== */
    .timeline {
      position: relative;
      padding-left: 40px;
      margin-top: 24px;
    }
    .timeline::before {
      content: '';
      position: absolute; left: 16px; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom, #c0392b, #2980b9, #27ae60);
      border-radius: 2px;
    }
    .timeline-item {
      position: relative;
      margin-bottom: 32px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      transition: border-color 0.2s, transform 0.2s;
      cursor: pointer;
    }
    .timeline-item:hover {
      border-color: rgba(192,57,43,0.5);
      transform: translateX(4px);
    }
    .timeline-item::before {
      content: '';
      position: absolute; left: -32px; top: 24px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent-red);
      border: 3px solid var(--bg-dark);
      box-shadow: 0 0 0 2px var(--accent-red);
    }
    .timeline-item .year {
      font-size: 13px; font-weight: 700;
      color: var(--accent-red); letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .timeline-item h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
    .timeline-item p { font-size: 14px; color: var(--text-secondary); }
    .timeline-item .detail {
      display: none; margin-top: 12px;
      font-size: 14px; color: var(--text-secondary);
      border-top: 1px solid var(--border); padding-top: 12px;
    }
    .timeline-item.expanded .detail { display: block; }
    .expand-hint { font-size: 12px; color: var(--accent-blue); margin-top: 8px; }

    /* ===== 人物卡片 ===== */
    .person-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px; margin-top: 24px;
    }
    .person-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
      text-align: center;
    }
    .person-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, #c0392b, #922b21);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; margin: 0 auto 16px;
      border: 3px solid rgba(192,57,43,0.4);
    }
    .person-card h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 4px; }
    .person-card .role { font-size: 13px; color: var(--accent-gold); margin-bottom: 10px; }
    .person-card p { font-size: 14px; color: var(--text-secondary); }

    /* ===== 对比卡片 ===== */
    .compare-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 20px; margin-top: 24px;
    }
    .compare-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
    }
    .compare-card h3 { font-size: 1rem; font-weight: 700; color: var(--accent-gold); margin-bottom: 14px; }
    .compare-card ul { padding-left: 18px; }
    .compare-card li { font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }

    /* ===== Canvas 互动时间轴 ===== */
    #canvas-timeline-wrap {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
      margin-top: 24px;
    }
    #canvas-timeline-wrap h3 {
      font-size: 1rem; font-weight: 700; color: var(--accent-gold);
      margin-bottom: 12px;
    }
    #canvas-timeline {
      width: 100%; height: 280px; cursor: pointer;
      border-radius: 10px; display: block;
    }
    #canvas-info {
      margin-top: 12px; padding: 14px; min-height: 60px;
      background: rgba(255,255,255,0.04); border-radius: 10px;
      font-size: 14px; color: var(--text-secondary);
      transition: all 0.3s;
    }
    #canvas-info h4 { color: var(--accent-red); margin-bottom: 4px; font-size: 15px; }

    /* ===== 地图区 ===== */
    .map-intro {
      font-size: 14px; color: var(--text-secondary); margin-bottom: 20px;
      background: var(--bg-card); border-radius: 10px; padding: 14px 18px;
      border-left: 3px solid var(--accent-blue);
    }

    /* ===== 视频区 ===== */
    .video-wrap {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; margin-top: 24px;
    }
    .video-wrap video {
      width: 100%; border-radius: 0; display: block;
    }
    .video-caption {
      padding: 12px 20px; font-size: 13px; color: var(--text-secondary);
      border-top: 1px solid var(--border);
    }

    /* ===== 练习题 ===== */
    .quiz-grid {
      display: flex; flex-direction: column; gap: 24px; margin-top: 24px;
    }
    .quiz-item {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
    }
    .quiz-item .q-num {
      font-size: 12px; font-weight: 700; color: var(--accent-red); margin-bottom: 8px;
    }
    .quiz-item .q-text { font-weight: 600; margin-bottom: 16px; }
    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .quiz-option {
      background: var(--bg-card2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px; cursor: pointer;
      font-size: 14px; transition: all 0.2s;
    }
    .quiz-option:hover { border-color: var(--accent-blue); }
    .quiz-option.correct { background: rgba(39,174,96,0.15); border-color: #27ae60; color: #27ae60; }
    .quiz-option.wrong { background: rgba(192,57,43,0.15); border-color: #e74c3c; color: #e74c3c; }
    .quiz-feedback {
      margin-top: 12px; padding: 10px 14px;
      background: rgba(255,255,255,0.04); border-radius: 8px;
      font-size: 13px; color: var(--text-secondary); display: none;
    }
    .quiz-feedback.show { display: block; }

    /* ===== 小结 ===== */
    .summary-box {
      background: linear-gradient(135deg, rgba(192,57,43,0.12), rgba(41,128,185,0.08));
      border: 1px solid rgba(192,57,43,0.25);
      border-radius: var(--radius); padding: 28px; margin-top: 24px;
    }
    .summary-box h3 { color: var(--accent-gold); margin-bottom: 16px; font-size: 1.1rem; }
    .summary-box p { color: var(--text-secondary); font-size: 15px; line-height: 1.9; }
    .summary-timeline {
      display: flex; align-items: center; flex-wrap: wrap;
      gap: 0; margin: 20px 0;
    }
    .st-node {
      background: var(--accent-red); color: #fff;
      padding: 8px 16px; border-radius: 24px;
      font-size: 13px; font-weight: 600;
    }
    .st-arrow {
      color: var(--text-secondary); font-size: 20px; padding: 0 6px;
    }

    /* ===== 插图 ===== */
    .illustration-wrap {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 16px; margin-top: 24px;
    }
    .illustration-wrap figure { margin: 0; }
    .illustration-wrap img {
      width: 100%; height: 200px; object-fit: cover;
      background: var(--bg-card);
    }
    .illustration-wrap figcaption {
      font-size: 12px; color: var(--text-secondary);
      text-align: center; padding: 6px;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 600px) {
      .compare-grid, .quiz-options, .illustration-wrap { grid-template-columns: 1fr; }
      .hero h1 { font-size: 2rem; }
      section { padding: 40px 16px; }
    }
  </style>

<!-- ===== M1 革命背景 ===== -->
<section id="background" data-tsh="思考：沙俄的哪些矛盾最终促成了革命的爆发？">
<figure class="teachany-figure" style="margin:28px 0;text-align:center">
  <img src="./assets/section1.webp" alt="革命力量从四面八方汇聚，深刻改变了俄国的命运" loading="lazy" style="max-width:100%;border-radius:12px">
  <figcaption style="margin-top:10px;font-size:14px;color:#475569">革命力量从四面八方汇聚，深刻改变了俄国的命运</figcaption>
</figure>

  <div class="section-header">
    <div class="number">1</div>
    <div>
      <h2>革命前夜——背景与条件</h2>
      <div class="section-sub">20世纪初 · 沙俄矛盾积累</div>
    </div>
  </div>

  <p data-tts id="bg-intro">20世纪初，沙皇俄国是一个相对落后的农业帝国，社会矛盾极为尖锐。第一次世界大战（1914—1918年）是压垮沙俄统治的最后一根稻草。</p>

  <div class="compare-grid" style="margin-top:24px;">
    <div class="compare-card">
      <h3>🏭 社会经济矛盾</h3>
      <ul>
        <li>工人劳动条件极为恶劣，工时长达14小时</li>
        <li>农民承受沉重地租，土地高度集中</li>
        <li>工业化起步晚，生产力水平低下</li>
        <li>资本主义发展不充分，封建残余浓厚</li>
      </ul>
    </div>
    <div class="compare-card">
      <h3>⚔️ 一战催化危机</h3>
      <ul>
        <li>俄军伤亡超过160万人，战线接连崩溃</li>
        <li>首都彼得格勒粮食严重短缺</li>
        <li>士兵厌战，军队士气低落</li>
        <li>战争开支使政府财政濒临破产</li>
      </ul>
    </div>
  </div>

  <div style="margin-top:24px;background:rgba(192,57,43,0.08);border:1px solid rgba(192,57,43,0.2);border-radius:12px;padding:18px 22px;">
    <p style="font-weight:700;color:var(--accent-gold);margin-bottom:8px;">📌 历史解释</p>
    <p style="font-size:14px;color:var(--text-secondary);">
      沙皇尼古拉二世统治下的俄国，有三重矛盾同时爆发：
      <strong style="color:#fff">封建专制矛盾</strong>（政治层面）、
      <strong style="color:#fff">劳资阶级矛盾</strong>（经济层面）、
      <strong style="color:#fff">一战民族存亡矛盾</strong>（军事层面）。
      三重危机叠加，使革命成为历史必然。
    </p>
  </div>
</section>

<!-- ===== M2 二月革命 ===== -->
<section id="february" data-tsh="二月革命与十月革命有何本质区别？谁是革命的领导力量？">
  <div class="section-header">
    <div class="number">2</div>
    <div>
      <h2>二月革命——推翻沙皇的前奏</h2>
      <div class="section-sub">1917年3月 · 彼得格勒</div>
    </div>
  </div>

  <p data-tts id="feb-intro">1917年3月，首都彼得格勒爆发大规模工人罢工和街头示威。驻扎彼得格勒的士兵拒绝向示威群众开枪，转而倒戈支持革命。二月革命在短短数日内推翻了统治俄国长达303年的罗曼诺夫王朝。</p>

  <div class="compare-grid" style="margin-top:24px;">
    <div class="compare-card">
      <h3>✅ 二月革命的成果</h3>
      <ul>
        <li>推翻沙皇尼古拉二世，罗曼诺夫王朝覆灭</li>
        <li>建立资产阶级临时政府</li>
        <li>工人苏维埃同时成立（两个政权并立）</li>
        <li>宣布基本民主自由</li>
      </ul>
    </div>
    <div class="compare-card">
      <h3>❗ 临时政府的局限</h3>
      <ul>
        <li>继续一战，拒绝停战退出</li>
        <li>拖延解决土地问题</li>
        <li>代表资产阶级利益，与工农群众对立</li>
        <li>为十月革命埋下伏笔</li>
      </ul>
    </div>
  </div>

  <!-- 人物卡片 -->
  <div class="person-grid" style="margin-top:28px;">
    <div class="person-card">
      <div class="person-avatar">🎖</div>
      <h3>尼古拉二世</h3>
      <div class="role">俄国末代沙皇</div>
      <p>罗曼诺夫王朝最后一位沙皇，二月革命中被迫退位。专制顽固，对民众疾苦漠然，最终被历史淘汰。</p>
    </div>
    <div class="person-card">
      <div class="person-avatar">✊</div>
      <h3>列宁（弗拉基米尔·伊里奇·乌里扬诺夫）</h3>
      <div class="role">布尔什维克党领袖</div>
      <p>马克思主义理论家与革命领袖，从瑞士流亡归国后发表《四月提纲》，领导十月革命，成为苏联创建者。</p>
    </div>
    <div class="person-card">
      <div class="person-avatar">⚡</div>
      <h3>托洛茨基</h3>
      <div class="role">彼得格勒苏维埃主席</div>
      <p>十月革命的军事组织者，指挥赤卫队和革命士兵攻占冬宫，是起义成功的关键执行者。</p>
    </div>
  </div>
</section>

      </div>
      <div style="text-align:center;padding:16px;background:rgba(41,128,185,0.1);border-radius:10px;">

<section id="significance" data-tsh="十月革命对今天的世界有什么影响？你如何评价这场革命？">

    <div>

  let hoveredIdx = -1;

  // 响应式宽度
  function resize() {
    const wrap = canvas.parentElement;
    const w = wrap.clientWidth - 48;
    if (w > 0) canvas.width = w;
    draw(hoveredIdx);
  }
  window.addEventListener('resize', resize);

  const events = [
    {

    },
    {
      date: '1917.11', label: '十月起义', icon: '⭐',
      color: '#c0392b',
      desc: '<h4>1917年11月7日 · 十月武装起义</h4>阿芙乐尔号炮声响起，工人赤卫队攻占冬宫，推翻临时政府。全俄苏维埃代表大会宣告苏维埃政权成立，列宁当选人民委员会主席。'

      color: '#16a085',
      desc: '<h4>1918-1922年 · 苏俄内战</h4>国内白军与帝国主义列强武装干涉，苏维埃政权面临生死考验。红军最终粉碎内外敌人，苏联于1922年正式成立。'
    }
  ];

  function draw(hi) {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // 背景
    ctx.fillStyle = '#161b22';
    ctx.fillRect(0, 0, w, h);

    const n = events.length;
    const padX = 60;
    const step = (w - padX * 2) / (n - 1);
    const lineY = h / 2;

    // 主时间线
    const grad = ctx.createLinearGradient(padX, 0, w - padX, 0);
    grad.addColorStop(0, '#c0392b');
    grad.addColorStop(0.5, '#8e44ad');
    grad.addColorStop(1, '#16a085');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(padX, lineY);
    ctx.lineTo(w - padX, lineY);
    ctx.stroke();

    events.forEach((ev, i) => {
      const x = padX + i * step;
      const isHovered = i === hi;
      const r = isHovered ? 24 : 18;

      // 竖线
      ctx.strokeStyle = ev.color;
      ctx.lineWidth = isHovered ? 2.5 : 1.5;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(x, lineY - r - 4);
      ctx.lineTo(x, lineY - 60);
      ctx.stroke();
      ctx.setLineDash([]);

      // 圆圈
      ctx.beginPath();
      ctx.arc(x, lineY, r, 0, Math.PI * 2);
      ctx.fillStyle = isHovered ? ev.color : '#1c2128';
      ctx.fill();
      ctx.strokeStyle = ev.color;
      ctx.lineWidth = isHovered ? 3 : 2;
      ctx.stroke();

      // emoji 图标
      ctx.font = `${isHovered ? 18 : 14}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(ev.icon, x, lineY);

      // 日期标签
      ctx.font = `bold ${isHovered ? 14 : 12}px "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.fillStyle = isHovered ? '#fff' : '#8b949e';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(ev.date, x, lineY + r + 20);

      // 事件名
      ctx.font = `${isHovered ? 13 : 11}px "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.fillStyle = isHovered ? ev.color : '#6e7681';
      ctx.fillText(ev.label, x, lineY + r + 38);

      // 悬停光晕
      if (isHovered) {
        ctx.beginPath();
        ctx.arc(x, lineY, r + 8, 0, Math.PI * 2);
        ctx.strokeStyle = ev.color + '44';
        ctx.lineWidth = 4;
        ctx.stroke();
      }
    });
  }

  function getHitIdx(mx, my) {
    const w = canvas.width, h = canvas.height;
    const n = events.length;
    const padX = 60;
    const step = (w - padX * 2) / (n - 1);
    const lineY = h / 2;
    for (let i = 0; i < n; i++) {
      const x = padX + i * step;
      const dx = mx - x, dy = my - lineY;
      if (dx * dx + dy * dy < 28 * 28) return i;
    }
    return -1;
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };
  }

  canvas.addEventListener('mousemove', e => {
    const { x, y } = getPos(e);
    const idx = getHitIdx(x, y);

    if (idx !== hoveredIdx) {
      hoveredIdx = idx;
      draw(hoveredIdx);
    }
  });

  canvas.addEventListener('mouseleave', () => {
    hoveredIdx = -1;
    canvas.style.cursor = 'default';
    draw(-1);
  });

  canvas.addEventListener('click', e => {
    const { x, y } = getPos(e);
    const idx = getHitIdx(x, y);
    if (idx >= 0) {
      info.innerHTML = events[idx].desc;
      info.style.borderLeft = `4px solid ${events[idx].color}`;
    }
  });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const { x, y } = getPos(e);
    const idx = getHitIdx(x, y);
    if (idx >= 0) {
      info.innerHTML = events[idx].desc;
      info.style.borderLeft = `4px solid ${events[idx].color}`;

      draw(hoveredIdx);

      });

    });
    canvas.parentNode.appendChild(bar);
  })();

  resize(); // 初始化：设置正确宽度并首次渲染
})();

      <h2>方法：从背景、过程、意义把握革命</h2>
      <p>分析十月革命可从背景（一战加剧社会矛盾、二月革命后两个政权并存）、过程（列宁提出《四月提纲》、彼得格勒武装起义）和意义（建立第一个社会主义国家、鼓舞世界被压迫民族）三方面梳理，理解其历史必然性和世界意义。</p>
      <div class="worked-example"><strong>范例：</strong>1917年11月7日（俄历十月），彼得格勒武装起义攻占冬宫，推翻临时政府，宣告苏维埃政权建立。</div>
      <p id="lesson-pitfall" class="misc-pitfall"><strong>常见误区：</strong>常见误区是把二月革命和十月革命混为一谈，或忽视其世界意义。应分清二月革命推翻沙皇专制、十月革命推翻资产阶级临时政府建立社会主义国家，并认识其对世界历史的深远影响。</p>
      <div class="module-check" data-conceptest="true">

      <h2>拓展：十月革命的世界影响</h2>
      <p>十月革命不仅改变了俄国的命运，也深刻影响了世界历史进程。它建立了世界上第一个社会主义国家，为国际无产阶级和被压迫民族的解放斗争树立了榜样，推动了世界社会主义运动的发展。十月革命的胜利和马克思列宁主义的传播，也对中国产生了重要影响，促进了马克思主义在中国的传播，为中国共产党的成立作了思想上和干部上的准备。</p>
