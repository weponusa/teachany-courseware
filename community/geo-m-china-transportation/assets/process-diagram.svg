<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="780" height="420" fill="#f8fafc"/>
  <text x="390" y="42" text-anchor="middle" font-size="26" font-weight="800" fill="#b45309">运输方式怎么选？</text>
  <text x="390" y="68" text-anchor="middle" font-size="14" fill="#92400e">先看货物，再对号入座</text>
  <!-- 起点 -->
  <rect x="300" y="92" width="180" height="52" rx="12" fill="#f59e0b"/>
  <text x="390" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">一批货要运</text>
  <!-- 分支线 -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M390 144 L120 190" /><path d="M390 144 L270 190" />
    <path d="M390 144 L510 190" /><path d="M390 144 L660 190" />
  </g>
  <!-- 四个判断 -->
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="190" width="120" height="50" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="120" y="212" font-size="13" font-weight="700" fill="#5b21b6">急需·贵重?</text>
    <text x="120" y="230" font-size="12" fill="#64748b">药品 鲜花</text>
    <rect x="210" y="190" width="120" height="50" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="270" y="212" font-size="13" font-weight="700" fill="#92400e">大宗·长途?</text>
    <text x="270" y="230" font-size="12" fill="#64748b">煤炭 粮食</text>
    <rect x="450" y="190" width="120" height="50" rx="10" fill="#fff" stroke="#14b8a6" stroke-width="2"/>
    <text x="510" y="212" font-size="13" font-weight="700" fill="#115e59">笨重·不急?</text>
    <text x="510" y="230" font-size="12" fill="#64748b">矿石 集装箱</text>
    <rect x="600" y="190" width="120" height="50" rx="10" fill="#fff" stroke="#ef4444" stroke-width="2"/>
    <text x="660" y="212" font-size="13" font-weight="700" fill="#991b1b">液体·气体?</text>
    <text x="660" y="230" font-size="12" fill="#64748b">石油 天然气</text>
    <!-- 箭头到方式 -->
    <path d="M120 240 L120 290" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <path d="M270 240 L270 290" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <path d="M510 240 L510 290" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <path d="M660 240 L660 290" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <!-- 运输方式 -->
    <rect x="60" y="290" width="120" height="54" rx="10" fill="#ede9fe"/>
    <text x="120" y="314" font-size="14" font-weight="700" fill="#5b21b6">✈️ 航空</text>
    <text x="120" y="334" font-size="11" fill="#5b21b6">最快</text>
    <rect x="210" y="290" width="120" height="54" rx="10" fill="#fef3c7"/>
    <text x="270" y="314" font-size="14" font-weight="700" fill="#92400e">🚂 铁路</text>
    <text x="270" y="334" font-size="11" fill="#92400e">量大价低</text>
    <rect x="450" y="290" width="120" height="54" rx="10" fill="#ccfbf1"/>
    <text x="510" y="314" font-size="14" font-weight="700" fill="#115e59">🚢 水运</text>
    <text x="510" y="334" font-size="11" fill="#115e59">最便宜</text>
    <rect x="600" y="290" width="120" height="54" rx="10" fill="#fee2e2"/>
    <text x="660" y="314" font-size="14" font-weight="700" fill="#991b1b">🛢️ 管道</text>
    <text x="660" y="334" font-size="11" fill="#991b1b">连续供应</text>
    <!-- 公路补充 -->
    <rect x="330" y="290" width="120" height="54" rx="10" fill="#cffafe"/>
    <text x="390" y="314" font-size="14" font-weight="700" fill="#155e75">🚗 公路</text>
    <text x="390" y="334" font-size="11" fill="#155e75">短途·灵活</text>
  </g>
  <text x="390" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#b45309">短途门到门、鲜活快递，也别忘用公路！</text>
</svg>
