<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="780" height="430" fill="#fffbeb"/>
  <text x="390" y="42" text-anchor="middle" font-size="26" font-weight="800" fill="#b45309">五种现代运输方式</text>
  <text x="390" y="68" text-anchor="middle" font-size="14" fill="#92400e">看运量 · 速度 · 运费 · 目的地条件</text>
  <g font-size="13" text-anchor="middle">
    <!-- 铁路 -->
    <rect x="20" y="95" width="136" height="270" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="88" y="150" font-size="40">🚂</text>
    <text x="88" y="185" font-size="18" font-weight="700" fill="#1e293b">铁路</text>
    <text x="88" y="215" font-size="13" fill="#64748b">运量：大</text>
    <text x="88" y="238" font-size="13" fill="#64748b">速度：较快</text>
    <text x="88" y="261" font-size="13" fill="#64748b">运费：较低</text>
    <rect x="30" y="285" width="116" height="60" rx="8" fill="#fef3c7"/>
    <text x="88" y="310" font-size="12" fill="#92400e">大宗·长途</text>
    <text x="88" y="330" font-size="12" fill="#92400e">煤炭 粮食 钢材</text>
    <!-- 公路 -->
    <rect x="172" y="95" width="136" height="270" rx="12" fill="#fff" stroke="#06b6d4" stroke-width="2"/>
    <text x="240" y="150" font-size="40">🚗</text>
    <text x="240" y="185" font-size="18" font-weight="700" fill="#1e293b">公路</text>
    <text x="240" y="215" font-size="13" fill="#64748b">运量：小</text>
    <text x="240" y="238" font-size="13" fill="#64748b">速度：较快</text>
    <text x="240" y="261" font-size="13" fill="#64748b">运费：较高</text>
    <rect x="182" y="285" width="116" height="60" rx="8" fill="#cffafe"/>
    <text x="240" y="310" font-size="12" fill="#155e75">短途·灵活</text>
    <text x="240" y="330" font-size="12" fill="#155e75">快递 鲜活</text>
    <!-- 水运 -->
    <rect x="324" y="95" width="136" height="270" rx="12" fill="#fff" stroke="#14b8a6" stroke-width="2"/>
    <text x="392" y="150" font-size="40">🚢</text>
    <text x="392" y="185" font-size="18" font-weight="700" fill="#1e293b">水运</text>
    <text x="392" y="215" font-size="13" fill="#64748b">运量：最大</text>
    <text x="392" y="238" font-size="13" fill="#64748b">速度：最慢</text>
    <text x="392" y="261" font-size="13" fill="#64748b">运费：最低</text>
    <rect x="334" y="285" width="116" height="60" rx="8" fill="#ccfbf1"/>
    <text x="392" y="310" font-size="12" fill="#115e59">笨重·不急</text>
    <text x="392" y="330" font-size="12" fill="#115e59">矿石 集装箱</text>
    <!-- 航空 -->
    <rect x="476" y="95" width="136" height="270" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="544" y="150" font-size="40">✈️</text>
    <text x="544" y="185" font-size="18" font-weight="700" fill="#1e293b">航空</text>
    <text x="544" y="215" font-size="13" fill="#64748b">运量：最小</text>
    <text x="544" y="238" font-size="13" fill="#64748b">速度：最快</text>
    <text x="544" y="261" font-size="13" fill="#64748b">运费：最高</text>
    <rect x="486" y="285" width="116" height="60" rx="8" fill="#ede9fe"/>
    <text x="544" y="310" font-size="12" fill="#5b21b6">贵重·急需</text>
    <text x="544" y="330" font-size="12" fill="#5b21b6">药品 鲜花</text>
    <!-- 管道 -->
    <rect x="628" y="95" width="136" height="270" rx="12" fill="#fff" stroke="#ef4444" stroke-width="2"/>
    <text x="696" y="150" font-size="40">🛢️</text>
    <text x="696" y="185" font-size="18" font-weight="700" fill="#1e293b">管道</text>
    <text x="696" y="215" font-size="13" fill="#64748b">运量：连续</text>
    <text x="696" y="238" font-size="13" fill="#64748b">速度：—</text>
    <text x="696" y="261" font-size="13" fill="#64748b">运费：低</text>
    <rect x="638" y="285" width="116" height="60" rx="8" fill="#fee2e2"/>
    <text x="696" y="310" font-size="12" fill="#991b1b">液体·气体</text>
    <text x="696" y="330" font-size="12" fill="#991b1b">石油 天然气</text>
  </g>
  <text x="390" y="400" text-anchor="middle" font-size="14" font-weight="600" fill="#b45309">口诀：大宗长途铁路，短途灵活公路；笨重不急水运，贵重急需航空；油气全靠管道。</text>
</svg>
