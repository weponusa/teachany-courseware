<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fafc"/><stop offset="0.55" stop-color="#eef6ff"/><stop offset="1" stop-color="#ecfeff"/>
  </linearGradient>
  <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/>
  </linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1e3a8a" flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="1536" height="1024" fill="url(#bg)"/>
<circle cx="140" cy="120" r="180" fill="#3b82f6" opacity="0.06"/>
<circle cx="1400" cy="900" r="200" fill="#06b6d4" opacity="0.07"/>

<text x="768.0" y="86" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="54" font-weight="800" fill="#0f172a">二次函数的最值</text>
<text x="768.0" y="132" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" fill="#475569">从顶点到实际应用 · 先定范围，再求最值</text>

<!-- 连接线 -->
<g stroke="#93c5fd" stroke-width="4" fill="none">
  <path d="M768 460 L520 345"/>
  <path d="M768 460 L1016 345"/>
  <path d="M768 580 L520 695"/>
  <path d="M768 580 L1016 695"/>
</g>

<!-- 中心 -->
<g filter="url(#sh)">
  <rect x="558" y="452" width="420" height="136" rx="24" fill="url(#center)"/>
</g>
<text x="768" y="508" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="36" font-weight="800" fill="#ffffff">二次函数的最值</text>
<text x="768" y="552" text-anchor="middle" font-family="Times New Roman, serif" font-size="30" fill="#e0f2fe">y = a(x−h)² + k</text>

<!-- 分支1 最值来源 -->
<g filter="url(#sh)"><rect x="120" y="180" width="400" height="170" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/></g>
<circle cx="164" cy="222" r="20" fill="#3b82f6"/><text x="164" y="230" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff">1</text>
<text x="196" y="230" font-family="PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#1d4ed8">最值来源</text>
<text x="150" y="278" font-family="PingFang SC, sans-serif" font-size="22" fill="#334155">a &gt; 0 → 最小值 k</text>
<text x="150" y="312" font-family="PingFang SC, sans-serif" font-size="22" fill="#334155">a &lt; 0 → 最大值 k</text>

<!-- 分支2 区间最值 -->
<g filter="url(#sh)"><rect x="1016" y="180" width="400" height="170" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/></g>
<circle cx="1060" cy="222" r="20" fill="#3b82f6"/><text x="1060" y="230" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff">2</text>
<text x="1092" y="230" font-family="PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#1d4ed8">区间最值</text>
<text x="1046" y="278" font-family="PingFang SC, sans-serif" font-size="22" fill="#334155">对称轴在左 / 内 / 右</text>
<text x="1046" y="312" font-family="PingFang SC, sans-serif" font-size="22" fill="#334155">不在范围内就比端点</text>

<!-- 分支3 建模四步 -->
<g filter="url(#sh)"><rect x="120" y="695" width="400" height="170" rx="18" fill="#ffffff" stroke="#a5f3fc" stroke-width="2"/></g>
<circle cx="164" cy="737" r="20" fill="#06b6d4"/><text x="164" y="745" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff">3</text>
<text x="196" y="745" font-family="PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#0e7490">建模四步</text>
<text x="150" y="793" font-family="PingFang SC, sans-serif" font-size="22" fill="#334155">设变量 · 列函数</text>
<text x="150" y="827" font-family="PingFang SC, sans-serif" font-size="22" fill="#334155">定范围 · 求最值</text>

<!-- 分支4 实际应用 -->
<g filter="url(#sh)"><rect x="1016" y="695" width="400" height="170" rx="18" fill="#ffffff" stroke="#a5f3fc" stroke-width="2"/></g>
<circle cx="1060" cy="737" r="20" fill="#06b6d4"/><text x="1060" y="745" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff">4</text>
<text x="1092" y="745" font-family="PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#0e7490">实际应用</text>
<text x="1046" y="793" font-family="PingFang SC, sans-serif" font-size="22" fill="#334155">利润最大 · 面积最大</text>
<text x="1046" y="827" font-family="PingFang SC, sans-serif" font-size="22" fill="#334155">范围由实际意义决定</text>

<text x="768.0" y="972" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="22" fill="#64748b">先看开口定高低 · 再找顶点看位置 · 顶点不在范围里就比端点</text>
</svg>