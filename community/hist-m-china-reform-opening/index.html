  <style>
    :root {
      --bg: #f8fafc;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --primary-light: #dbeafe;
      --secondary: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --red: #dc2626;
      --gold: #d97706;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --card-bg: #ffffff;
      --radius: 14px;
      --shadow: 0 4px 24px rgba(59,130,246,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    /* ── Header ── */
    .app-header {
      background: linear-gradient(135deg, #991b1b 0%, #dc2626 50%, #f59e0b 100%);
      color: #fff;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      box-shadow: 0 2px 16px rgba(153,27,27,0.3);
      position: sticky; top: 0; z-index: 100;
    }
    .app-header .logo { font-size: 15px; font-weight: 700; opacity: .9; letter-spacing: .5px; }
    .app-header h1 { font-size: 18px; font-weight: 700; }
    .app-header .meta { font-size: 12px; opacity: .75; text-align: right; line-height: 1.5; }
    /* ── Progress ── */
    .progress-wrap {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 10px 32px; display: flex; align-items: center; gap: 12px;
    }
    .progress-label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .progress-track { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #dc2626, #f59e0b); border-radius: 4px; transition: width .5s ease; }
    .progress-pct { font-size: 12px; color: #dc2626; font-weight: 700; min-width: 36px; text-align: right; }
    /* ── Nav Tabs ── */
    .nav-tabs {
      display: flex; background: #fff; border-bottom: 2px solid var(--border);
      padding: 0 24px; gap: 4px; overflow-x: auto;
    }
    .nav-tab {
      padding: 14px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
      border-bottom: 3px solid transparent; color: var(--text-muted);
      transition: all .2s; white-space: nowrap; border-radius: var(--radius) var(--radius) 0 0;
      margin-bottom: -2px;
    }
    .nav-tab:hover { color: #dc2626; background: #fff1f2; }
    .nav-tab.active { color: #dc2626; border-bottom-color: #dc2626; background: #fff1f2; }
    /* ── Main ── */
    .main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
    /* ── Cards ── */
    .card {
      background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 28px 32px; margin-bottom: 24px; border: 1px solid var(--border);
    }
    .card-title {
      font-size: 18px; font-weight: 700; color: var(--primary-dark);
      margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    /* ── ABT Banner ── */
    .abt-banner {
      background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 60%, #f59e0b 100%);
      border-radius: var(--radius); padding: 40px 48px; color: #fff; margin-bottom: 28px;
      position: relative; overflow: hidden;
    }
    .abt-banner::before {
      content: ''; position: absolute; right: -40px; top: -40px;
      width: 220px; height: 220px; background: rgba(255,255,255,.05); border-radius: 50%;
    }
    .abt-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; opacity: .6; margin-bottom: 8px; }
    .abt-banner h2 { font-size: 26px; font-weight: 800; margin-bottom: 16px; line-height: 1.3; }
    .abt-text { font-size: 15px; line-height: 1.8; opacity: .9; max-width: 680px; }
    .abt-text .but { color: #fbbf24; font-weight: 700; }
    .abt-text .therefore { color: #34d399; font-weight: 700; }
    .core-q {
      margin-top: 20px; padding: 14px 20px; background: rgba(255,255,255,.12);
      border-radius: 10px; border-left: 4px solid #fbbf24;
      font-size: 15px; font-weight: 600; line-height: 1.5;
    }
    /* ── Module ── */
    .module-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
      padding-bottom: 12px; border-bottom: 2px solid #fff1f2;
    }
    .module-num {
      width: 36px; height: 36px; background: #dc2626; color: #fff;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; flex-shrink: 0;
    }
    .module-header h3 { font-size: 17px; font-weight: 700; color: var(--text); }
    .key-q {
      display: inline-block; background: #fff1f2; color: #991b1b;
      border-radius: 6px; padding: 2px 10px; font-weight: 600; font-size: 13px; margin-bottom: 8px;
    }
    .module-body { font-size: 14px; line-height: 1.9; color: #374151; }
    /* ── Compare Cards ── */
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin: 16px 0; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
    .compare-card { padding: 20px 24px; }
    .compare-old { background: #374151; color: #e5e7eb; }
    .compare-new { background: #f0fdf4; color: #374151; }
    .compare-card .c-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: .7; margin-bottom: 10px; }
    .compare-card .c-title { font-size: 16px; font-weight: 800; margin-bottom: 12px; }
    .compare-card .c-item { font-size: 13px; line-height: 1.8; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; gap: 8px; }
    .compare-new .c-item { border-bottom-color: rgba(0,0,0,.07); }
    .compare-card .c-icon { font-size: 14px; flex-shrink: 0; }
    /* ── Canvas Chart ── */
    .chart-wrap {
      background: #fff; border-radius: 12px; padding: 20px; margin: 16px 0;
      border: 1px solid var(--border);
    }
    .chart-title { font-size: 14px; font-weight: 700; color: var(--primary-dark); margin-bottom: 4px; }
    .chart-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
    canvas { display: block; width: 100%; }
    /* ── SEZ Map ── */
    .sez-map-wrap { background: #e8f4fd; border-radius: var(--radius); padding: 20px; margin: 16px 0; }
    .sez-map-title { font-size: 14px; font-weight: 700; color: var(--primary-dark); margin-bottom: 12px; text-align: center; }
    /* ── Options / Exercises ── */
    .exercise-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .ex-tab {
      padding: 7px 18px; border-radius: 20px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: 2px solid var(--border); background: #fff; color: var(--text-muted);
      transition: all .2s;
    }
    .ex-tab.active { background: #dc2626; color: #fff; border-color: #dc2626; }
    .ex-panel { display: none; }
    .ex-panel.active { display: block; }
    .ex-q { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 14px; line-height: 1.6; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .opt {
      display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px;
      border: 2px solid var(--border); border-radius: 10px; cursor: pointer;
      font-size: 14px; transition: all .2s; background: #fff; text-align: left;
    }
    .opt:hover { border-color: #dc2626; background: #fff1f2; }
    .opt.correct { border-color: var(--success); background: #d1fae5 !important; }
    .opt.wrong { border-color: var(--danger); background: #fee2e2 !important; }
    .opt-key {
      width: 24px; height: 24px; border-radius: 50%; background: var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
    }
    .feedback {
      margin-top: 14px; padding: 12px 16px; border-radius: 10px;
      font-size: 13px; line-height: 1.6; display: none;
    }
    .feedback.show { display: block; }
    .feedback.correct { background: #d1fae5; border-left: 4px solid var(--success); color: #065f46; }
    .feedback.wrong { background: #fee2e2; border-left: 4px solid var(--danger); color: #991b1b; }
    .branch-result { margin-top: 16px; padding: 14px 18px; border-radius: 10px; font-size: 13px; line-height: 1.6; display: none; }
    .branch-result.show { display: block; }
    .branch-path-a { background: #dbeafe; border-left: 4px solid var(--primary); color: #1e3a8a; }
    .branch-path-b { background: #d1fae5; border-left: 4px solid var(--success); color: #064e3b; }
    .branch-path-warn { background: #fef3c7; border-left: 4px solid var(--secondary); color: #78350f; }
    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px;
      border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
      border: none; transition: all .2s;
    }
    .btn-primary { background: #dc2626; color: #fff; }
    .btn-primary:hover { background: #991b1b; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(220,38,38,.3); }
    .btn-outline { background: #fff; color: #dc2626; border: 2px solid #dc2626; }
    .btn-outline:hover { background: #fff1f2; }
    /* ── Timeline ── */
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before { content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px; width: 2px; background: linear-gradient(to bottom, #dc2626, #f59e0b); }
    .tl-item { position: relative; margin-bottom: 18px; }
    .tl-dot { position: absolute; left: -24px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: #dc2626; border: 2px solid #fff; box-shadow: 0 0 0 2px #dc2626; }
    .tl-year { font-size: 12px; font-weight: 700; color: #dc2626; margin-bottom: 2px; }
    .tl-text { font-size: 13px; color: var(--text); line-height: 1.5; }
    /* ── Summary ── */
    .summary-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
    .summary-card { background: linear-gradient(135deg, #fff1f2, #fff); border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #fecaca; }
    .summary-card .s-num { font-size: 32px; font-weight: 800; color: #dc2626; }
    .summary-card .s-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    /* ── Flip Cards ── */
    .flip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
    .flip-card { perspective: 800px; height: 180px; cursor: pointer; }
    .flip-inner { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
    .flip-card.flipped .flip-inner { transform: rotateY(180deg); }
    .flip-front, .flip-back {
      position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
      border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: center;
    }
    .flip-front { background: #374151; color: #e5e7eb; border: 2px solid #4b5563; }
    .flip-back { background: #f0fdf4; color: #374151; border: 2px solid #86efac; transform: rotateY(180deg); }
    .flip-front .f-era { font-size: 11px; opacity: .6; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .flip-front .f-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
    .flip-front .f-hint { font-size: 11px; opacity: .5; margin-top: auto; }
    .flip-back .b-label { font-size: 11px; color: #065f46; font-weight: 700; margin-bottom: 6px; }
    .flip-back .b-items { font-size: 12px; line-height: 1.7; color: #374151; }
    /* ── Matching ── */
    .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
    .match-left, .match-right { display: flex; flex-direction: column; gap: 8px; }
    .match-item {
      padding: 10px 14px; border-radius: 10px; font-size: 13px; cursor: pointer;
      border: 2px solid var(--border); background: #fff; transition: all .2s; font-weight: 500;
      user-select: none;
    }
    .match-item:hover { border-color: #dc2626; }
    .match-item.selected { border-color: #dc2626; background: #fff1f2; }
    .match-item.matched { border-color: var(--success); background: #d1fae5; cursor: default; }
    .match-item.wrong-match { border-color: var(--danger); background: #fee2e2; }
    /* ── Misc ── */
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
    .mb-16 { margin-bottom: 16px; }
    .text-sm { font-size: 13px; color: var(--text-muted); }
    @media (max-width: 700px) {
      .compare-grid, .flip-grid, .match-grid { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
      .abt-banner { padding: 24px 20px; }
      .main { padding: 16px 12px; }
    }

    /* ═══ PPT 播放模式（v6.1 轻量注入） ═══ */
    body.play-mode { overflow: hidden; }
    body.play-mode .slide-wrapper {
      scroll-snap-type: y mandatory;
      overflow-y: auto;
      height: 100dvh;
      -webkit-overflow-scrolling: touch;
    }
    .slide-wrapper { position: relative; }
    .slide-progress-bar { position: fixed; top: 0; left: 0; height: 3px;
      background: linear-gradient(90deg, var(--primary, #3b82f6), var(--secondary, #06b6d4));
      z-index: 201; transition: width 0.3s; border-radius: 0 2px 2px 0; pointer-events: none; }
    .slide-toolbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 20px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border, #e5e7eb);
      transform: translateY(100%); transition: transform 0.3s ease; }
    body.play-mode .slide-toolbar, body.toolbar-visible .slide-toolbar { transform: translateY(0); }
    .toolbar-btn { background: none; border: none; cursor: pointer; padding: 8px;
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary, #6b7280); transition: all 0.2s; }
    .toolbar-btn:hover { background: var(--border, #e5e7eb); color: var(--text, #1f2937); }
    .toolbar-btn.active { color: var(--primary, #3b82f6); }
    .toolbar-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .toolbar-progress { flex: 1; max-width: 200px; height: 4px;
      background: var(--border, #e5e7eb); border-radius: 2px; cursor: pointer; position: relative; }
    .toolbar-progress-fill { height: 100%; background: var(--primary, #3b82f6);
      border-radius: 2px; transition: width 0.3s; }
    .toolbar-page-info { font-size: 12px; color: var(--text-secondary, #6b7280);
      min-width: 50px; text-align: center; }
    .play-mode-fab { position: fixed; bottom: 80px; right: 20px; z-index: 101;
      width: 48px; height: 48px; border-radius: 50%; border: none;
      background: var(--primary, #3b82f6); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(59,130,246,0.3); transition: all 0.3s; }
    .play-mode-fab:hover { transform: scale(1.1); box-shadow: 0 6px 16px rgba(59,130,246,0.4); }
    .play-mode-fab svg { width: 22px; height: 22px; fill: currentColor; stroke: none; }
    .slide-sidenav { position: fixed; right: 12px; top: 50%; transform: translateY(-50%);
      z-index: 90; display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
      opacity: 0; transition: opacity 0.3s; max-height: 70vh; overflow-y: auto;
      padding: 8px 4px; border-radius: 12px;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
      border: 1px solid var(--border, #e5e7eb); }
    .slide-sidenav::-webkit-scrollbar { display: none; }
    body.play-mode .slide-sidenav, body.toolbar-visible .slide-sidenav { opacity: 1; }
    .sidenav-dot { width: 24px; height: 4px; border-radius: 2px;
      background: var(--border, #e5e7eb); border: none; cursor: pointer;
      transition: all 0.2s; padding: 0; }
    .sidenav-dot.active { width: 32px; background: var(--primary, #3b82f6); }
    .sidenav-dot:hover { background: var(--primary, #3b82f6); opacity: 0.7; }
    .sidenav-counter { font-size: 10px; color: var(--text-secondary, #6b7280);
      text-align: center; margin-bottom: 4px; }
    /* 隐藏旧版 tab 导航（播放模式下） */
    body.play-mode #main-nav, body.play-mode nav[id="nav"], body.play-mode nav.nav { display: none !important; }
    @media (max-width:768px) {
      .slide-sidenav { right: 6px; gap: 2px; padding: 6px 3px; }
      .sidenav-dot { width: 20px; height: 3px; }
    }

<section class="slide-page" data-page-type="content" data-tsh="精讲">

    <div class="card">
      <span class="phase-tag">知识精讲</span>
      <h2>改革开放与中国特色社会主义</h2>
      <p>1978年十一届三中全会作出改革开放的伟大决策，工作重心转移到经济建设。从农村改革到城市改革、从经济特区到全面开放，中国大踏步赶上时代，开创中国特色社会主义道路。</p>
    </div>
  </section>
<section class="slide-page" data-page-type="content" data-tsh="方法范例">
  <section class="section histm-depth core-knowledge-module text-module" id="lesson-method"
    data-bloom-level="apply" data-scaffold="partial" data-tts="lesson-method">

      <h2>方法：决策—进程—成就</h2>
      <p>抓住十一届三中全会意义，再举例家庭联产承包、特区、社会主义市场经济体制等。</p>
      <div class="worked-example"><strong>范例：</strong>设立深圳等经济特区，发挥窗口与试验田作用，推动对外开放。</div>
      <p id="lesson-pitfall" class="histm-pitfall"><strong>常见误区：</strong>常见误区是把改革开放理解为只引进外资，忽视思想路线与体制变革。</p>
      <div class="module-check" data-conceptest="true">

<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-1"><h2>📖 改革前困境</h2><div class="tu-q"><p><strong>And：</strong>学生知道计划经济时期物资短缺</p><p><strong>But：</strong>不理解为何生产越多反而越穷</p><p><strong>Therefore：</strong>揭示改革必要性</p></div><div class="tu-q"><p>计划经济下全国年产自行车1200万辆仍要凭票购买（1978年数据），工厂按指标生产不考虑市场需求。比如上海手表厂年产300万只，但农村人根本买不到——这不是生产力问题，是体制问题。</p></div><div class="tu-q"><p>🌍 就像全班统一穿校服，高个子总嫌裤子短，矮个子总嫌衣服大，但工厂只管完成1000套的生产任务。</p></div><div class="tu-q" data-answer="A"><h3>🏋️ 即练</h3><p>1978年粮票现象说明：</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="错选B/C/D：混淆了现象与本质原因">A. 生产与需求脱节</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="错选B/C/D：混淆了现象与本质原因">B. 农民懒惰不种地</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="错选B/C/D：混淆了现象与本质原因">C. 国外封锁导致</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="错选B/C/D：混淆了现象与本质原因">D. 自然灾害影响</button></div><div class="tu-fb" hidden></div></div></section>
<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-2"><h2>📖 特区试验田</h2><div class="tu-q"><p><strong>And：</strong>学生知道深圳从小渔村变大城市</p><p><strong>But：</strong>不明白为何要画圈搞特殊</p><p><strong>Therefore：</strong>理解渐进式改革智慧</p></div><div class="tu-q"><p>1980年深圳特区用15%企业所得税吸引外资（当时全国55%），就像班级选5个同学先试用新教材。蛇口工业区提出"时间就是金钱"，3天盖一层楼创下"深圳速度"。到1992年特区GDP占全国1/4，证明市场经济可行。</p></div><div class="tu-q"><p>🌍 就像手游先搞删档测试，发现问题再调整，比直接公测更稳妥。</p></div><div class="tu-q" data-answer="A"><h3>🏋️ 即练</h3><p>经济特区特殊在：</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="错选B/C/D：未抓住政策试验核心">A. 实行不同经济政策</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="错选B/C/D：未抓住政策试验核心">B. 地理位置特别</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="错选B/C/D：未抓住政策试验核心">C. 人口数量少</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="错选B/C/D：未抓住政策试验核心">D. 资源更丰富</button></div><div class="tu-fb" hidden></div></div></section>
<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-3"><h2>📖 中国式道路</h2><div class="tu-q"><p><strong>And：</strong>学生感受到生活水平提高</p><p><strong>But：</strong>分不清改革开放与西方化的区别</p><p><strong>Therefore：</strong>树立制度自信</p></div><div class="tu-q"><p>中国特色社会主义就像高铁：轨道（党的领导）不能变，但动力系统（市场经济）可升级。2023年我国GDP是1978年的40倍，但没像苏联那样解体。关键是把"市场"和"社会主义"结合，比如脱贫攻坚战投入近1.6万亿，这是纯市场经济做不到的。</p></div><div class="tu-q"><p>🌍 就像用美团点餐既享受送餐便利（市场），又保留妈妈做饭的健康标准（社会主义）。</p></div><div class="tu-q" data-answer="A"><h3>🏋️ 即练</h3><p>中国特色社会主义本质是：</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="错选B/C/D：混淆了手段与目标">A. 市场与社会主义结合</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="错选B/C/D：混淆了手段与目标">B. 完全自由市场经济</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="错选B/C/D：混淆了手段与目标">C. 回到计划经济</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="错选B/C/D：混淆了手段与目标">D. 复制西方模式</button></div><div class="tu-fb" hidden></div></div></section>

  var hovered=-1;

    ctx.clearRect(0,0,w,h);
    ctx.fillStyle='rgba(15,23,42,0.85)';ctx.fillRect(0,0,w,h);

    ctx.stroke();
    items.forEach(function(item,i){
      var x=80+i*((w-160)/(items.length-1||1));
      ctx.fillStyle=i===hovered?'#f59e0b':'#3b82f6';
      ctx.beginPath();ctx.arc(x,baseY,i===hovered?14:10,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='white';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
      ctx.fillText(item[0],x,baseY-24);
      ctx.fillStyle='#cbd5e1';ctx.font='12px sans-serif';
      var desc=item[1].length>8?item[1].slice(0,8)+'…':item[1];
      ctx.fillText(desc,x,baseY+30);
    });
    if(hovered>=0){
      var item=items[hovered];
      ctx.fillStyle='rgba(30,41,59,0.95)';ctx.fillRect(w/2-140,10,280,44);
      ctx.strokeStyle='#3b82f6';ctx.strokeRect(w/2-140,10,280,44);
      ctx.fillStyle='#fbbf24';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
      ctx.fillText(item[0]+'：'+item[1],w/2,38);
    }
  }

    var rect=canvas.getBoundingClientRect();var mx=(e.clientX-rect.left)*(canvas.width/rect.width);
    var newH=-1;items.forEach(function(item,i){var x=80+i*((canvas.width-160)/(items.length-1||1));if(Math.abs(mx-x)<24)newH=i;});
    if(newH!==hovered){hovered=newH;draw();}
  });
  canvas.addEventListener('mouseleave',function(){hovered=-1;draw();});
  draw();
})();

});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (!isPlayMode) {
    if (e.key === 'f' || e.key === 'F') { if (!e.ctrlKey && !e.metaKey) togglePlayMode(); }
    return;
  }
  switch (e.key) {
    case 'ArrowRight': case 'ArrowDown': case ' ': e.preventDefault(); nextPage(); break;
    case 'ArrowLeft': case 'ArrowUp': e.preventDefault(); prevPage(); break;
    case 'Escape': togglePlayMode(); break;
  }
});

buildSidenav();

/* ═══ v6.2 自动初始化：连续阅读模式下预加载动态内容 ═══ */
(function(){
  try {
    var inited = new Set();
    allSections.forEach(function(screen) {
      var id = screen.id;
      if (!id || inited.has(id)) return;
      inited.add(id);
      /* 根据屏幕 ID 推测并调用对应的 init 函数 */
      var caps = id.charAt(0).toUpperCase() + id.slice(1);
      var candidates = [
        'init' + caps,              /* initWarmup, initL1, initBoss ... */
        'init_' + id,               /* init_warmup */
        'load' + caps,              /* loadBoss */
        'build' + caps,             /* buildQuiz */
        'render' + caps,            /* renderContent */
        'setup' + caps,             /* setupLevel */
      ];
      for (var i = 0; i < candidates.length; i++) {
        if (typeof window[candidates[i]] === 'function') {
          try { window[candidates[i]](); } catch(e) {}
          break;
        }
      }
    });
  } catch(e) {}
})();
/* ═══ end v6.2 auto-init ═══ */

updateUI();
document.body.classList.add('toolbar-visible');
setTimeout(() => { if (!isPlayMode) document.body.classList.remove('toolbar-visible'); }, 3000);
})();
</script>

<script id="histm-depth-js">
function histmDepthCheck(button, isCorrect, feedbackId, explanation) {
  var box = button.closest('.module-check');
  if (!box || box.dataset.answered) return;
  box.dataset.answered = '1';
  box.querySelectorAll('button').forEach(function (item) {
    item.disabled = true;
    if (item.dataset.correct === '1') item.classList.add('correct');
  });
  if (!isCorrect) button.classList.add('wrong');
  var feedback = document.getElementById(feedbackId);
  if (feedback) {
    feedback.style.display = 'block';
    feedback.textContent = (isCorrect ? '正确。' : '再想想。') + explanation;
  }
}
</script>
