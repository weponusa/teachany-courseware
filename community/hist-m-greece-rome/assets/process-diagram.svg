<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d4a017"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad2)" rx="16"/>

  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#f8fafc">地中海文明演进时间线</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#94a3b8">从爱琴文明到罗马帝国的两千年历程</text>

  <!-- 主轴 -->
  <line x1="80" y1="340" x2="1120" y2="340" stroke="#d4a017" stroke-width="3" marker-end="url(#arr2)"/>

  <!-- 节点 1：爱琴文明 -->
  <circle cx="130" cy="340" r="9" fill="#0ea5e9"/>
  <text x="130" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#7dd3fc">爱琴文明</text>
  <text x="130" y="320" text-anchor="middle" font-size="12" fill="#94a3b8">约前2000年</text>
  <rect x="55" y="370" width="150" height="86" rx="10" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="130" y="394" text-anchor="middle" font-size="12" fill="#e2e8f0">克里特与迈锡尼</text>
  <text x="130" y="414" text-anchor="middle" font-size="12" fill="#e2e8f0">希腊文明的摇篮</text>
  <text x="130" y="434" text-anchor="middle" font-size="11" fill="#94a3b8">线形文字 · 海上贸易</text>
  <line x1="130" y1="349" x2="130" y2="370" stroke="#0ea5e9" stroke-width="1.5"/>

  <!-- 节点 2：城邦兴起 -->
  <circle cx="270" cy="340" r="9" fill="#0ea5e9"/>
  <text x="270" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#7dd3fc">城邦兴起</text>
  <text x="270" y="320" text-anchor="middle" font-size="12" fill="#94a3b8">前8世纪</text>
  <rect x="195" y="230" width="150" height="60" rx="10" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="270" y="252" text-anchor="middle" font-size="12" fill="#e2e8f0">雅典 · 斯巴达</text>
  <text x="270" y="272" text-anchor="middle" font-size="11" fill="#94a3b8">小国寡民各自独立</text>
  <line x1="270" y1="290" x2="270" y2="331" stroke="#0ea5e9" stroke-width="1.5"/>

  <!-- 节点 3：希波战争 -->
  <circle cx="410" cy="340" r="9" fill="#f59e0b"/>
  <text x="410" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#fcd34d">希波战争</text>
  <text x="410" y="320" text-anchor="middle" font-size="12" fill="#94a3b8">前490 / 前480年</text>
  <rect x="335" y="370" width="150" height="86" rx="10" fill="#3a2c10" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="410" y="394" text-anchor="middle" font-size="12" fill="#e2e8f0">马拉松 · 温泉关</text>
  <text x="410" y="414" text-anchor="middle" font-size="12" fill="#e2e8f0">萨拉米斯海战</text>
  <text x="410" y="434" text-anchor="middle" font-size="11" fill="#94a3b8">希腊城邦联手胜波斯</text>
  <line x1="410" y1="349" x2="410" y2="370" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- 节点 4：亚历山大东征 -->
  <circle cx="550" cy="340" r="9" fill="#0ea5e9"/>
  <text x="550" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#7dd3fc">亚历山大东征</text>
  <text x="550" y="320" text-anchor="middle" font-size="12" fill="#94a3b8">前334—前323年</text>
  <rect x="475" y="230" width="150" height="60" rx="10" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="550" y="252" text-anchor="middle" font-size="12" fill="#e2e8f0">横跨欧亚非帝国</text>
  <text x="550" y="272" text-anchor="middle" font-size="11" fill="#94a3b8">开启希腊化时代</text>
  <line x1="550" y1="290" x2="550" y2="331" stroke="#0ea5e9" stroke-width="1.5"/>

  <!-- 节点 5：罗马共和国 -->
  <circle cx="690" cy="340" r="9" fill="#dc2626"/>
  <text x="690" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#fca5a5">罗马共和国</text>
  <text x="690" y="320" text-anchor="middle" font-size="12" fill="#94a3b8">前509年</text>
  <rect x="615" y="370" width="150" height="86" rx="10" fill="#4c1d1d" stroke="#dc2626" stroke-width="1.2"/>
  <text x="690" y="394" text-anchor="middle" font-size="12" fill="#e2e8f0">元老院 · 执政官</text>
  <text x="690" y="414" text-anchor="middle" font-size="12" fill="#e2e8f0">十二铜表法 前450年</text>
  <text x="690" y="434" text-anchor="middle" font-size="11" fill="#94a3b8">布匿战争称霸地中海</text>
  <line x1="690" y1="349" x2="690" y2="370" stroke="#dc2626" stroke-width="1.5"/>

  <!-- 节点 6：罗马帝国 -->
  <circle cx="830" cy="340" r="9" fill="#dc2626"/>
  <text x="830" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#fca5a5">罗马帝国</text>
  <text x="830" y="320" text-anchor="middle" font-size="12" fill="#94a3b8">前27年</text>
  <rect x="755" y="230" width="150" height="60" rx="10" fill="#4c1d1d" stroke="#dc2626" stroke-width="1.2"/>
  <text x="830" y="252" text-anchor="middle" font-size="12" fill="#e2e8f0">屋大维建元首制</text>
  <text x="830" y="272" text-anchor="middle" font-size="11" fill="#94a3b8">Pax Romana 两百年</text>
  <line x1="830" y1="290" x2="830" y2="331" stroke="#dc2626" stroke-width="1.5"/>

  <!-- 节点 7：帝国分裂 -->
  <circle cx="960" cy="340" r="9" fill="#8b5cf6"/>
  <text x="960" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#c4b5fd">帝国分裂</text>
  <text x="960" y="320" text-anchor="middle" font-size="12" fill="#94a3b8">395年</text>
  <rect x="890" y="370" width="140" height="86" rx="10" fill="#2e2260" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="960" y="394" text-anchor="middle" font-size="12" fill="#e2e8f0">分为东西两部</text>
  <text x="960" y="414" text-anchor="middle" font-size="12" fill="#e2e8f0">西罗马 476年亡</text>
  <text x="960" y="434" text-anchor="middle" font-size="11" fill="#94a3b8">东罗马延续近千年</text>
  <line x1="960" y1="349" x2="960" y2="370" stroke="#8b5cf6" stroke-width="1.5"/>

  <!-- 阶段色带标注 -->
  <rect x="80" y="520" width="480" height="34" rx="8" fill="#0ea5e9" opacity="0.18"/>
  <text x="320" y="542" text-anchor="middle" font-size="14" font-weight="700" fill="#7dd3fc">古希腊阶段：城邦 → 古典时代 → 希腊化</text>
  <rect x="580" y="520" width="540" height="34" rx="8" fill="#dc2626" opacity="0.18"/>
  <text x="850" y="542" text-anchor="middle" font-size="14" font-weight="700" fill="#fca5a5">古罗马阶段：王政 → 共和国 → 帝国 → 分裂</text>

  <!-- 底部记忆口诀 -->
  <rect x="180" y="585" width="840" height="56" rx="10" fill="#334155" stroke="#d4a017" stroke-width="1.5"/>
  <text x="600" y="608" text-anchor="middle" font-size="14" font-weight="700" fill="#fbbf24">记忆口诀：奥运最早（前776）· 共和居中（前509）· 帝国最晚（前27）</text>
  <text x="600" y="630" text-anchor="middle" font-size="12" fill="#94a3b8">希腊"想"——民主哲思城邦争鸣；罗马"做"——立法治国帝国经营</text>
</svg>
