<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad)" rx="16"/>

  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#f8fafc">希腊罗马文明 · 核心概念结构图</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#94a3b8">从城邦到帝国：西方政治文明的两大源头</text>

  <!-- 中心根节点 -->
  <rect x="470" y="95" width="260" height="56" rx="12" fill="#d4a017" opacity="0.95"/>
  <text x="600" y="120" text-anchor="middle" font-size="18" font-weight="800" fill="#1e293b">地中海文明</text>
  <text x="600" y="140" text-anchor="middle" font-size="12" fill="#422006">前2000年 — 476年</text>

  <!-- 连线：根 → 希腊 / 罗马 -->
  <line x1="530" y1="151" x2="300" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="151" x2="900" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ══ 希腊分支 ══ -->
  <rect x="170" y="200" width="260" height="52" rx="12" fill="#0ea5e9"/>
  <text x="300" y="224" text-anchor="middle" font-size="17" font-weight="800" fill="#082f49">古希腊文明</text>
  <text x="300" y="242" text-anchor="middle" font-size="11.5" fill="#0c4a6e">民主与哲思的源头</text>

  <!-- 希腊子节点 -->
  <g font-size="13.5" fill="#e2e8f0">
    <rect x="40" y="300" width="180" height="88" rx="10" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="130" y="326" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7dd3fc">城邦制度</text>
    <text x="130" y="348" text-anchor="middle" font-size="11.5" fill="#cbd5e1">小国寡民 · 独立自主</text>
    <text x="130" y="368" text-anchor="middle" font-size="11.5" fill="#cbd5e1">多山环海孕育</text>

    <rect x="250" y="300" width="180" height="88" rx="10" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="340" y="326" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7dd3fc">雅典民主</text>
    <text x="340" y="348" text-anchor="middle" font-size="11.5" fill="#cbd5e1">公民大会 · 直接民主</text>
    <text x="340" y="368" text-anchor="middle" font-size="11.5" fill="#fbbf24">仅限成年男性公民</text>

    <rect x="40" y="420" width="180" height="88" rx="10" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="130" y="446" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7dd3fc">斯巴达</text>
    <text x="130" y="468" text-anchor="middle" font-size="11.5" fill="#cbd5e1">军事化城邦</text>
    <text x="130" y="488" text-anchor="middle" font-size="11.5" fill="#cbd5e1">双王制 · 黑劳士</text>

    <rect x="250" y="420" width="180" height="88" rx="10" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="340" y="446" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7dd3fc">希腊化时代</text>
    <text x="340" y="468" text-anchor="middle" font-size="11.5" fill="#cbd5e1">亚历山大东征</text>
    <text x="340" y="488" text-anchor="middle" font-size="11.5" fill="#cbd5e1">希腊文化传至欧亚非</text>
  </g>

  <!-- 希腊分支连线 -->
  <line x1="240" y1="252" x2="140" y2="300" stroke="#0ea5e9" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="330" y1="252" x2="338" y2="300" stroke="#0ea5e9" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="240" y1="388" x2="140" y2="420" stroke="#0ea5e9" stroke-width="1.8" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="330" y1="388" x2="338" y2="420" stroke="#0ea5e9" stroke-width="1.8" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- ══ 罗马分支 ══ -->
  <rect x="770" y="200" width="260" height="52" rx="12" fill="#dc2626"/>
  <text x="900" y="224" text-anchor="middle" font-size="17" font-weight="800" fill="#fef2f2">古罗马文明</text>
  <text x="900" y="242" text-anchor="middle" font-size="11.5" fill="#fecaca">法律与帝国的奠基者</text>

  <!-- 罗马子节点 -->
  <g font-size="13.5" fill="#e2e8f0">
    <rect x="640" y="300" width="180" height="88" rx="10" fill="#4c1d1d" stroke="#dc2626" stroke-width="1.5"/>
    <text x="730" y="326" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fca5a5">罗马共和国</text>
    <text x="730" y="348" text-anchor="middle" font-size="11.5" fill="#cbd5e1">元老院 · 执政官</text>
    <text x="730" y="368" text-anchor="middle" font-size="11.5" fill="#cbd5e1">保民官 · 前509年</text>

    <rect x="850" y="300" width="180" height="88" rx="10" fill="#4c1d1d" stroke="#dc2626" stroke-width="1.5"/>
    <text x="940" y="326" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fca5a5">罗马帝国</text>
    <text x="940" y="348" text-anchor="middle" font-size="11.5" fill="#cbd5e1">屋大维 · 前27年</text>
    <text x="940" y="368" text-anchor="middle" font-size="11.5" fill="#cbd5e1">横跨欧亚非</text>

    <rect x="640" y="420" width="180" height="88" rx="10" fill="#4c1d1d" stroke="#dc2626" stroke-width="1.5"/>
    <text x="730" y="446" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fca5a5">罗马法</text>
    <text x="730" y="468" text-anchor="middle" font-size="11.5" fill="#cbd5e1">十二铜表法 前450年</text>
    <text x="730" y="488" text-anchor="middle" font-size="11.5" fill="#cbd5e1">查士丁尼法典 6世纪</text>

    <rect x="850" y="420" width="180" height="88" rx="10" fill="#4c1d1d" stroke="#dc2626" stroke-width="1.5"/>
    <text x="940" y="446" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fca5a5">工程与扩张</text>
    <text x="940" y="468" text-anchor="middle" font-size="11.5" fill="#cbd5e1">道路 · 引水渠</text>
    <text x="940" y="488" text-anchor="middle" font-size="11.5" fill="#cbd5e1">混凝土 · 军团</text>
  </g>

  <!-- 罗马分支连线 -->
  <line x1="840" y1="252" x2="740" y2="300" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="930" y1="252" x2="938" y2="300" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="840" y1="388" x2="740" y2="420" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="930" y1="388" x2="938" y2="420" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- 希腊 → 罗马 影响箭头 -->
  <path d="M 430 344 Q 535 300 640 344" fill="none" stroke="#d4a017" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
  <text x="535" y="312" text-anchor="middle" font-size="12.5" font-weight="700" fill="#d4a017">文化继承与发展</text>

  <!-- 底部共同遗产 -->
  <rect x="320" y="560" width="560" height="72" rx="12" fill="#334155" stroke="#d4a017" stroke-width="2"/>
  <text x="600" y="590" text-anchor="middle" font-size="16" font-weight="800" fill="#fbbf24">共同遗产 → 现代西方文明</text>
  <text x="600" y="614" text-anchor="middle" font-size="12.5" fill="#e2e8f0">民主思想 · 共和制度 · 法律体系 · 字母文字 · 古典建筑 · 奥林匹克精神</text>

  <line x1="300" y1="508" x2="480" y2="560" stroke="#d4a017" stroke-width="1.8" marker-end="url(#arrow)" opacity="0.7"/>
  <line x1="900" y1="508" x2="720" y2="560" stroke="#d4a017" stroke-width="1.8" marker-end="url(#arrow)" opacity="0.7"/>
</svg>
