<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-1"><h2>📖 比喻与象征</h2><div class="tu-q"><p><strong>And：</strong>学生知道比喻是打比方</p><p><strong>But：</strong>但分不清比喻和象征的区别</p><p><strong>Therefore：</strong>掌握象征的深层含义</p></div><div class="tu-q"><p>比喻是直接比较（如'床前明月光，疑是地上霜'），而象征用具体事物代表抽象概念（如'莲'象征高洁）。例如《爱莲说》中'出淤泥而不染'，用莲花生长环境象征君子品格，全篇未提'君子'二字却处处暗喻。统计显示，高考古诗鉴赏题中约30%涉及象征手法。</p></div><div class="tu-q"><p>🌍 就像看到红十字想到医疗救助，古诗中的'柳枝'常象征离别。现代广告也用鸽子象征和平，和古人用'青松'象征坚毅异曲同工。</p></div><div class="tu-q" data-answer="A"><h3>🏋️ 即练</h3><p>《石灰吟》'粉骨碎身浑不怕，要留清白在人间'用了什么手法？</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="选B可能混淆比喻与象征，这里石灰是人格的象征物而非简单比喻">A.象征（石灰喻人格）</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="选B可能混淆比喻与象征，这里石灰是人格的象征物而非简单比喻">B.比喻（石灰比作雪）</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="选B可能混淆比喻与象征，这里石灰是人格的象征物而非简单比喻">C.夸张（粉骨碎身）</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="选B可能混淆比喻与象征，这里石灰是人格的象征物而非简单比喻">D.对比（怕与不怕）</button></div><div class="tu-fb" hidden></div></div></section>
<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-2"><h2>📖 虚实结合</h2><div class="tu-q"><p><strong>And：</strong>学生能识别景物描写</p><p><strong>But：</strong>常忽略虚写的情感作用</p><p><strong>Therefore：</strong>理解虚实相生的艺术效果</p></div><div class="tu-q"><p>实写眼前景，虚写想象/回忆。如《夜雨寄北》'何当共剪西窗烛'是虚写未来场景，与实写'巴山夜雨'形成时空交错。数据显示，85%的怀古诗采用虚实结合，如《念奴娇·赤壁怀古》实写江景，虚写周瑜。关键要抓住'忽''忆''梦'等虚写提示词。</p></div><div class="tu-q"><p>🌍 就像拍照用前景（实）和背景虚化突出主体，古诗用虚写烘托情感。发朋友圈'要是你在就好了'就是现代版虚实结合。</p></div><div class="tu-q" data-answer="A"><h3>🏋️ 即练</h3><p>杜甫《月夜》'香雾云鬟湿，清辉玉臂寒'属于：</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="选B未注意标题'月夜'说明诗人身陷长安，此乃对月思妻的想象">A.虚写（想象妻子）</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="选B未注意标题'月夜'说明诗人身陷长安，此乃对月思妻的想象">B.实写（眼前景象）</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="选B未注意标题'月夜'说明诗人身陷长安，此乃对月思妻的想象">C.对比（湿与寒）</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="选B未注意标题'月夜'说明诗人身陷长安，此乃对月思妻的想象">D.比喻（云喻鬟）</button></div><div class="tu-fb" hidden></div></div></section>
<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-3"><h2>📖 用典技巧</h2><div class="tu-q"><p><strong>And：</strong>学生知道典故是引用故事</p><p><strong>But：</strong>难理解典故的言外之意</p><p><strong>Therefore：</strong>学会解读典故的深层寄托</p></div><div class="tu-q"><p>用典分事典（历史故事）和语典（化用名句）。如辛弃疾《永遇乐》连用孙权、刘裕等5个典故，借古讽今。关键要明白'为何用此典'，比如《锦瑟》'庄生晓梦'典暗示人生如梦。据统计，用典诗在高考占比25%，常用典故TOP3是：闻鸡起舞、鲈鱼堪脍、廉颇老矣。</p></div><div class="tu-q"><p>🌍 就像现在说'愚公移山'不是真讲挖山，而是表达坚持。古诗用'卧薪尝胆'也不单讲历史，重在表现忍辱负重。</p></div><div class="tu-q" data-answer="A"><h3>🏋️ 即练</h3><p>李白《行路难》'闲来垂钓碧溪上'用了谁的典故？</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="选B可能混淆严子陵钓鱼典故，此处特指姜尚遇文王前垂钓渭水">A.姜太公</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="选B可能混淆严子陵钓鱼典故，此处特指姜尚遇文王前垂钓渭水">B.严子陵</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="选B可能混淆严子陵钓鱼典故，此处特指姜尚遇文王前垂钓渭水">C.范蠡</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="选B可能混淆严子陵钓鱼典故，此处特指姜尚遇文王前垂钓渭水">D.诸葛亮</button></div><div class="tu-fb" hidden></div></div></section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;

      }
    }
    return pts;
  }
  function draw(){

    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();

    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>

<script id="chnh-depth-js">
function chnhDepthCheck(button, isCorrect, feedbackId, explanation) {
  var box = button.closest('.module-check');
  if (!box || box.dataset.answered) return;
  box.dataset.answered = '1';
  box.querySelectorAll('button').forEach(function (item) {
    item.disabled = true;
    if (item.dataset.correct === '1') item.classList.add('correct');
  });
  if (!isCorrect) button.classList.add('wrong');
  var feedback = document.getElementById(feedbackId);
  if (feedback) {
    feedback.style.display = 'block';
    feedback.textContent = (isCorrect ? '正确。' : '再想想。') + explanation;
  }
}
