      <h2>中国人口与民族</h2>
      <p>中国人口基数大，分布东多西少；民族众多，汉族为主体，少数民族主要分布在东北、西北、西南等地，有大杂居、小聚居特点。人口政策与民族政策影响区域发展与社会和谐。</p>
    </div>

      <p>用人口密度图说明东密西疏原因；民族问题强调平等团结与区域贡献。</p>
      <div class="worked-example"><strong>范例：</strong>黑河—腾冲一线是人口分布的重要地理分界。</div>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>在春运客流预测中，人口迁徙大数据发挥关键作用。2023年春运期间，百度地图利用手机定位数据追踪28.8亿人次出行，结合汉族占91.6%的人口结构，分析出从东部沿海向中西部省份的返乡潮。这种分析帮助交通部门动态调整全国铁路日开行旅客列车最高达1.1万列。</p>
<p>民族语言技术支撑智能设备应用。科大讯飞开发的维汉双语系统覆盖新疆46%的智能手机用户，能识别维吾尔语15种方言变体，准确率达92%。这建立在新疆13个世居民族、47种语言方言的普查数据基础上，解决少数民族地区信息鸿沟问题。</p>
<p>人口年龄结构影响医疗资源配置。上海瑞金医院利用七普数据中65岁以上人口占比13.5%的现状，开发"老年友善医院"系统，针对2.4万社区高龄老人提供定制健康档案。系统根据浦东新区汉族老人98.2%的占比，优化普通话版电子病历模板的使用比重。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>问题一：东北地区人口减少但城镇化率反而升高（2022年辽宁67.96%），这与常规认知矛盾，如何解释？思考时可从三个层面切入：首先注意城镇化率是城镇常住人口占比，不直接反映总人口变化；其次观察近十年东北农村人口向城市集中的速度（年均1.2%）快于城市人口流失速度（年均0.8%）；最后考虑国企改革后"单位制"解体带来的城乡人口再分配效应。</p>
<p>问题二：为何新疆实施"少数民族骨干计划"但汉族考生也符合条件？分析这个政策设计需要跳出简单民族二分法：一方面新疆生产建设兵团第三代汉族子女已形成特定文化群体；另一方面政策本质是面向"经济社会发展相对滞后地区"，如喀什、和田等南疆地区汉族考生同样面临教育资源不足问题。可对比内蒙古"八省区蒙古语授课考生"政策的不同设计逻辑。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先要从第七次人口普查14.1亿这个数字说起，这个占世界18%的人口如何分布在黑河-腾冲线两侧？东南部43%的国土居住着94%人口，山西阳泉市密度高达1800人/平方公里而西藏阿里地区仅0.3人/平方公里，这种差异源于地形、气候和历史开发进程。接着看人口结构变化，60岁以上占比18.7%与德国相当，但劳动年龄人口中1.3亿大专以上学历者形成"人才红利"，这解释了为何富士康在郑州产业园能快速招募30万熟练工。</p>
<p>民族分布呈现"大散居、小聚居"特点，彝族主要分布在大小凉山但全国所有县市都有分布，回族在宁夏只占该区人口36%却在全国形成4.6万个清真寺社区。最后落实到政策应用，理解西气东输工程要同时考虑新疆资源禀赋和东部市场需求，而"少数民族高层次骨干计划"每年5000个招生指标，正是基于各民族人口比例（如苗族1100万占0.78%对应39个名额）进行的精准分配。从人口密度计算到民族政策制定，核心是把握"数量特征-空间分布-发展政策"这条分析链条。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>第一个常见错误是将"人口密度"简单等同于"人口数量"。学生常认为上海人口最多所以密度最大，实际上重庆常住人口3205万（2022年）比上海多，但因面积8.24万平方公里远超上海6340平方公里，密度仅389人/平方公里，而上海达3926人/平方公里。这种错误源于对"密度=人口/面积"公式理解不深，需要强调单位面积概念。</p>
<p>第二个误区是混淆"少数民族自治区"和"少数民族聚居区"。有学生误以为云南西双版纳是自治区，实际它是傣族自治州。我国五大自治区（如新疆维吾尔自治区）是省级行政区，而自治州、自治县属于地方自治单位。这种混淆源于对行政区划层级认知模糊，需要对照地图区分自治区（省）、自治州（地级）、自治县（县级）三级。</p>
<p>第三个典型错误是误判计划生育政策的时间节点。部分学生认为"全面二孩"政策始于2013年，实际独生子女政策松动经历2013年"单独二孩"到2016年"全面二孩"的过程。2021年三孩政策出台后，总和生育率仍维持在1.3左右的低水平。这种错误源于对政策演变时序记忆混乱，需结合"七普"数据中2020年出生人口1200万比2019年下降18%等具体数据强化理解。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
