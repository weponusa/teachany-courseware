  <style>
    :root {
      --bg: #0a1628;
      --bg2: #0f2040;
      --card: rgba(15,32,64,0.9);
      --border: rgba(56,189,248,0.2);
      --primary: #38bdf8;
      --secondary: #34d399;
      --accent: #fbbf24;
      --danger: #f87171;
      --purple: #a78bfa;
      --pink: #f472b6;
      --text: #f0f9ff;
      --muted: #94a3b8;
      --r: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
      overflow-x: hidden;
      padding-top: 52px;
    }

    /* ─── Nav ─── */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      background: rgba(10,22,40,0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0.65rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { font-size: 1rem; font-weight: 700; color: var(--primary); }
    .nav-links { display: flex; gap: 1.2rem; }
    .nav-links a { font-size: 0.82rem; color: var(--muted); text-decoration: none; transition: color .15s; }
    .nav-links a:hover { color: #fff; }
    @media(max-width:600px){ .nav-links { display:none; } }

    /* ─── Hero ─── */
    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 3rem 1.5rem;
      background:
        radial-gradient(ellipse at 70% 20%, rgba(56,189,248,.15) 0%, transparent 55%),
        radial-gradient(ellipse at 20% 75%, rgba(251,191,36,.1) 0%, transparent 50%),
        var(--bg);
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(56,189,248,.12);
      border: 1px solid rgba(56,189,248,.3);
      border-radius: 99px; padding: 5px 16px;
      font-size: .82rem; color: var(--primary);
      margin-bottom: 1.5rem; letter-spacing: .04em;
    }
    .hero h1 {
      font-size: clamp(2.2rem,5vw,3.8rem);
      font-weight: 900;
      background: linear-gradient(135deg, #fff 30%, var(--primary) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 1rem;
    }
    .hero-sub { font-size: 1.1rem; color: var(--muted); max-width: 540px; margin: 0 auto 2rem; }
    .emoji-row { display: flex; justify-content: center; gap: 1rem; font-size: 2.5rem; margin-bottom: 2rem; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-8px) } }
    .scroll-hint { color: var(--muted); font-size: .85rem; display: flex; align-items: center; gap: 6px; animation: bounce 2s infinite; }
    @keyframes bounce { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(6px) } }

    /* ─── Hero Figure ─── */
    .ta-standard-figure {
      max-width: 900px; margin: 2.5rem auto; padding: 0 1.5rem;
    }
    .ta-standard-figure img.hero-cover-img {
      width: 100%; border-radius: var(--r); border: 1px solid var(--border);
    }
    .ta-standard-figure figcaption {
      margin-top: .6rem; font-size: .82rem; color: var(--muted); text-align: center;
    }

    /* ─── Section ─── */
    section { max-width: 960px; margin: 0 auto; padding: 4.5rem 1.5rem; }
    .section-tag {
      display: inline-block;
      background: rgba(56,189,248,.1); color: var(--primary);
      border: 1px solid rgba(56,189,248,.25); border-radius: 6px;
      font-size: .78rem; padding: 2px 10px; margin-bottom: .8rem;
    }
    .section-title { font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: .4rem; }
    .section-sub { color: var(--muted); margin-bottom: 2rem; font-size: .95rem; }

    /* ─── Card grid ─── */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 1.2rem; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.4rem;
      backdrop-filter: blur(10px);
      transition: transform .2s, box-shadow .2s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0,0,0,.35); }
    .card-icon { font-size: 2.4rem; margin-bottom: .6rem; }
    .card h3 { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: .4rem; }
    .card p { font-size: .88rem; color: #cbd5e1; }
    .card .unit-tag { font-size: .8rem; color: var(--accent); margin-top: .5rem; font-weight: 600; }

    /* ─── ABT ─── */
    .abt-block {
      background: var(--card); border-radius: var(--r);
      padding: 1.4rem 1.6rem; margin-bottom: 1.2rem;
      border-left: 4px solid;
      backdrop-filter: blur(10px);
    }
    .abt-block.and { border-color: var(--secondary); }
    .abt-block.but { border-color: var(--accent); }
    .abt-block.therefore { border-color: var(--primary); }
    .abt-label { font-size: .75rem; font-weight: 700; letter-spacing: .1em; margin-bottom: .4rem; }
    .abt-block.and .abt-label { color: var(--secondary); }
    .abt-block.but .abt-label { color: var(--accent); }
    .abt-block.therefore .abt-label { color: var(--primary); }

    /* ─── Canvas wrap ─── */
    .canvas-wrap {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.5rem;
      backdrop-filter: blur(10px);
    }
    .canvas-wrap h3 { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: .4rem; }
    .canvas-desc { font-size: .84rem; color: var(--muted); margin-bottom: 1rem; }
    canvas { display: block; border-radius: 10px; max-width: 100%; }
    .canvas-status { text-align: center; font-size: .85rem; color: var(--accent); min-height: 1.5em; margin-top: .6rem; }
    .ctrl-row { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .ctrl-btn {
      padding: 6px 14px; border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(56,189,248,.1); color: var(--text);
      font-size: .82rem; cursor: pointer; font-family: inherit;
      transition: background .15s;
    }
    .ctrl-btn:hover,.ctrl-btn.active { background: rgba(56,189,248,.3); border-color: var(--primary); }

    /* ─── Data table ─── */
    .data-table-wrap {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.5rem;
      backdrop-filter: blur(10px); overflow-x: auto;
    }
    .data-table-wrap h3 { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: .8rem; }
    table.meas-table { width: 100%; border-collapse: collapse; }
    table.meas-table th {
      background: rgba(56,189,248,.15); color: var(--primary);
      font-size: .85rem; padding: .6rem 1rem; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    table.meas-table td {
      padding: .55rem 1rem; font-size: .88rem; border-bottom: 1px solid rgba(56,189,248,.07);
    }
    table.meas-table tr:last-child td { border-bottom: none; }
    table.meas-table input[type="text"] {
      background: rgba(56,189,248,.06);
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: .88rem; padding: 4px 10px;
      width: 120px; font-family: inherit; outline: none;
      transition: border-color .15s;
    }
    table.meas-table input:focus { border-color: var(--primary); }
    .submit-btn {
      margin-top: 1rem; padding: 8px 22px;
      background: rgba(56,189,248,.2); border: 1px solid rgba(56,189,248,.4);
      border-radius: 10px; color: var(--primary); font-size: .9rem;
      cursor: pointer; font-family: inherit; font-weight: 600;
      transition: background .15s;
    }
    .submit-btn:hover { background: rgba(56,189,248,.35); }
    .table-feedback { margin-top: .8rem; font-size: .88rem; min-height: 1.5em; }

    /* ─── Quiz ─── */
    .quiz-block {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.5rem; margin-bottom: 1.4rem;
      backdrop-filter: blur(10px);
    }
    .quiz-q { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 1rem; }
    .quiz-opts { display: flex; flex-direction: column; gap: .5rem; }
    .quiz-opt {
      padding: .6rem 1.1rem; border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(56,189,248,.05); color: var(--text);
      font-size: .9rem; cursor: pointer; text-align: left;
      font-family: inherit; transition: background .15s, border-color .15s;
    }
    .quiz-opt:hover:not([disabled]) { background: rgba(56,189,248,.14); border-color: var(--primary); }
    .quiz-opt.correct { background: rgba(52,211,153,.18); border-color: var(--secondary); color: var(--secondary); }
    .quiz-opt.wrong   { background: rgba(248,113,113,.18); border-color: var(--danger); color: var(--danger); }
    .quiz-feedback { margin-top: .8rem; font-size: .88rem; min-height: 1.4em; padding: .4rem .8rem; border-radius: 8px; }
    .quiz-feedback.ok   { background: rgba(52,211,153,.12); color: var(--secondary); }
    .quiz-feedback.bad  { background: rgba(248,113,113,.12); color: var(--danger); }

    /* ─── Badge ─── */
    .badge-area {
      display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1.5rem;
    }
    .badge {
      display: flex; flex-direction: column; align-items: center;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.2rem 1.6rem;
      min-width: 120px; backdrop-filter: blur(10px);
      transition: transform .2s;
      filter: grayscale(1) opacity(.45);
    }
    .badge.earned { filter: none; animation: pop .4s ease; }
    @keyframes pop { 0%{transform:scale(.8)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
    .badge-icon { font-size: 2.4rem; margin-bottom: .4rem; }
    .badge-name { font-size: .82rem; font-weight: 700; color: #fff; }
    .badge-desc { font-size: .74rem; color: var(--muted); margin-top: .2rem; text-align: center; }

    /* ─── Video section ─── */
    .video-wrap {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); overflow: hidden;
    }
    .video-wrap video { width: 100%; display: block; border-radius: var(--r); }

    /* ─── Think box ─── */
    .think-box {
      background: rgba(56,189,248,.06); border: 1px solid rgba(56,189,248,.2);
      border-radius: var(--r); padding: 1.2rem 1.4rem; margin: 1.5rem 0;
    }
    .think-box p { font-size: .9rem; color: #e2e8f0; }

    /* ─── Ruler tip ─── */
    .ruler-steps {
      display: flex; gap: 1rem; flex-wrap: wrap; margin: 1.5rem 0;
    }
    .ruler-step {
      flex: 1; min-width: 160px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1rem 1.2rem;
    }
    .ruler-step .step-num { font-size: 1.4rem; font-weight: 900; color: var(--primary); }
    .ruler-step p { font-size: .88rem; color: #cbd5e1; }

    /* ─── Compare ─── */
    .compare-row {
      display: flex; gap: 1rem; flex-wrap: wrap; margin: 1.5rem 0;
    }
    .compare-card {
      flex: 1; min-width: 220px;
      background: var(--card); border-radius: var(--r); padding: 1.2rem;
      border: 1px solid var(--border);
    }
    .compare-card.vague { border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.05); }
    .compare-card.precise { border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.05); }
    .compare-label { font-size: .78rem; font-weight: 700; letter-spacing: .1em; margin-bottom: .6rem; }
    .vague .compare-label { color: var(--danger); }
    .precise .compare-label { color: var(--secondary); }
    .compare-text { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: .3rem; }
    .compare-why { font-size: .84rem; color: var(--muted); }

    /* ─── Section dividers ─── */
    .section-divider {
      border: none; border-top: 1px solid var(--border);
      margin: 0;
    }

    /* ─── Achievements progress bar ─── */
    .progress-bar-outer {
      background: rgba(56,189,248,.1); border-radius: 99px;
      height: 8px; margin: .5rem 0 1.2rem;
    }
    .progress-bar-inner {
      height: 8px; border-radius: 99px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width .5s ease;
    }
    .progress-label { font-size: .78rem; color: var(--muted); text-align: right; }

    /* ─── responsive ─── */
    @media(max-width:600px){
      .card-grid { grid-template-columns: 1fr; }
      .compare-row { flex-direction: column; }
      .ruler-steps { flex-direction: column; }
    }
  </style>

<script id="scie-depth-js">
function scieDepthCheck(button, isCorrect, feedbackId, explanation) {
  var box = button.closest('.module-check');
  if (!box || box.dataset.answered) return;
  box.dataset.answered = '1';
  box.querySelectorAll('button').forEach(function (item) {
    item.disabled = true;
    if (item.dataset.correct === '1') item.classList.add('correct');
  });
  if (!isCorrect) button.classList.add('wrong');
  var feedback = document.getElementById(feedbackId);
  if (feedback) {
    feedback.style.display = 'block';
    feedback.textContent = (isCorrect ? '正确。' : '再想想。') + explanation;
  }
}
</script>
