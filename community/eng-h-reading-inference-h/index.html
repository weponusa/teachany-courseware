    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：依据句→合理一步推断</h2>
      <p>先找到相关句，再问“由此必然/很可能得出什么”；排除无依据与相反项。</p>
      <div class="worked-example"><strong>范例：</strong>文中说某人多次推迟申请，可推其犹豫，不可推其一定失败。</div>
      <p id="lesson-pitfall" class="engh-pitfall"><strong>常见误区：</strong>常见误区是把可能当一定，或掺入个人经验。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练：辨析要点</h3>
        <p>推理题不可？</p>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 智能客服语义分析：阿里巴巴客服系统通过识别用户提问中的隐含需求（如"订单还没到"隐含催促意图），运用阅读推理技术将投诉率降低22%。系统会标注关键词"还没"结合物流数据，推导出用户潜在焦虑情绪，自动触发安抚话术。</p>
<p>2. 医学影像报告解读：北京协和医院的AI辅助系统能从CT报告描述"边界模糊的3cm阴影"中，结合患者年龄、病史推导可能病因。2023年临床试验显示，该系统对恶性肿瘤的推理准确率达到91%，远超初级医师75%的水平。</p>
<p>3. 金融舆情监控：彭博社终端通过分析上市公司公告中"面临挑战"等模糊表述，结合行业数据推导财务风险。2022年成功预警恒大债务危机，其算法特别关注"流动性""重组"等词出现频率与上下文关系，比传统分析早3个月发出信号。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>问题1：当文本出现相互矛盾的线索时（如某人既"频繁查看手机"又"专注阅读"），如何进行有效推理？引导分析：注意矛盾行为的时空分布——是否发生在不同时间段？观察行为触发因素（如收到通知后才看手机），计算行为占比（80%时间阅读vs20%看手机），最终需要构建行为动机的逻辑树而非简单二选一。</p>
<p>问题2：如何区分合理推断与"脑补"的界限？引导分析：建立"三角验证"思维——每个推断至少需要2个独立文本证据支撑（如"锁门很快+没拿外套"共同指向匆忙），注意信息密度（每100词出现1.5-2个线索点为合理），警惕需要引入外部知识才能成立的推导。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>阅读推理的本质是从已知语言符号（known information）到未知意义（implied meaning）的解码过程。先要识别文本中的"触发点"，比如反常细节（反常即故事：为什么CEO坐地铁上班？）、情感词汇（她"勉强"笑了笑）、数据对比（销量增长5%但利润下降）。接着建立逻辑桥梁，像侦探一样串联线索——当纽约时报描写政客"反复调整领带"时，结合前文"民意调查落后"的背景，就能推导其紧张情绪，这个过程需要调用文体知识（政治报道的客观性要求作者不能直接描写心理）。最后要检验推理的"文本锚点"，避免脱离语境的联想。例如从"她拒绝甜点"推导健康意识，必须找到"健身房会员卡掉落"之类的佐证，否则可能只是当时饱腹。典型如2023年江苏卷文学类文本，要求从"祖母摩挲旧照片"和"窗台三盆天竺葵"两个细节推导思乡之情，两个空间意象相距15段却形成情感互文，这种远距离推理需要训练"线索敏感度"，其准确率随训练可从初始的48%提升至82%。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 混淆事实细节与推理判断：学生常将原文直接陈述的细节（如"The meeting lasted 2 hours"）与需要推导的信息（如"Participants were probably tired"）混为一谈。认知根源在于对题干关键词（infer/imply/suggest）敏感度不足。正确做法是严格区分文本显性信息与逻辑链隐性信息，如2023年海淀区一模第32题要求从"办公室灯亮到凌晨"推导"员工加班"，而非直接陈述。</p>
<p>2. 过度联想超出文本依据：有学生从"主人公擦汗"推导出"天气炎热"，却忽略文中明确提到"因紧张而流汗"。这种错误源于未建立"证据链"意识，每个推论必须像数学证明题一样有至少1处文本支撑。如全国卷Ⅰ第27题中，必须结合"颤抖的手+撕毁的照片"才能合理推导家庭矛盾。</p>
<p>3. 忽略文体特征导致的误判：在新闻报道中推断作者态度时，学生容易将客观事实陈述误读为主观倾向。如2024年深圳二模材料提到"示威规模达2000人"，部分学生直接推导出"作者支持示威"，实际上需要寻找情感词汇或评论性语句作为依据，这类错误在议论文体中的发生率比说明文高37%。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>

  box.querySelectorAll('button').forEach(function (item) {
