<p>1. 现代物流中的"香料航线"算法优化。马士基航运公司2021年亚欧航线采用历史季风数据建模，将15世纪葡萄牙航海家记录的东北季风周期（10月-次年4月）转化为集装箱船班期算法，使鹿特丹港到新加坡航程缩短9天。</p>
<p>2. 墨西哥银比索的全球化遗产。西班牙在1545-1824年间从波托西银矿开采的4.5万吨白银，造就了最早的全球货币体系。今天美元符号"$"正是源自比索上的双柱图案，纽约联邦储备银行金库仍存有1840枚殖民时期银币作为历史储备。</p>
<p>3. 抗疟疾药物的植物溯源。金鸡纳树皮（奎宁原料）的欧洲需求直接催生了1640年代秘鲁的生态掠夺。现代制药公司如诺华通过分析殖民时期植物标本的DNA，在厄瓜多尔重新发现已灭绝的药用树种Cinchona officinalis var. javariensis。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. 问题：为什么葡萄牙选择绕过非洲而非穿越地中海？分析线索：比较1488年迪亚士船队绕过好望角与1453年奥斯曼帝国攻占君士坦丁堡后的关税数据（威尼斯商船通行费上涨370%），注意葡萄牙亨利王子1434年就开始系统测绘西非海岸，比奥斯曼封锁早19年。</p>
<p>2. 问题：如何评价"哥伦布大交换"的生态影响？思考路径：对比1500年前后美洲与欧亚大陆的人口变化（美洲原住民减少90% vs 欧洲人口增长50%），观察马铃薯传入爱尔兰后的人口爆炸（1540-1840年从50万增至800万），注意烟草传播速度（1580-1610年英国消费量增长200倍）与肺癌医学记载的时间关联。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先要理解15世纪欧洲面临的现实困境：奥斯曼帝国控制传统商路后，威尼斯商人转售的香料价格暴涨，1453-1498年间胡椒每磅从1杜卡特涨到8杜卡特。这驱使葡萄牙亨利王子建立航海学校，系统改进卡拉维尔帆船（载货量比阿拉伯三角帆船大3倍）和象限仪（误差从5°缩小到1°）。接着看关键突破点：1488年迪亚士发现好望角时，船上携带的"帕德龙"石柱（现存里斯本海事博物馆）标明了经纬度测量新方法；1494年《托德西利亚斯条约》用教皇子午线划分势力范围，实为最早的国际海洋法实践。最后聚焦殖民体系的运作机制：西班牙在墨西哥推行"米塔制"强迫劳动（每周1/7壮丁下矿），导致波托西银矿1545-1600年产量占全球60%；而荷兰1602年发明的股份制让东印度公司募集到650万荷兰盾资本（相当于今日20亿美元），阿姆斯特丹证券交易所的股价波动记录显示，1622年香料贸易利润率仍高达400%。这些技术、制度和暴力的结合，彻底重构了全球文明格局。</p>
</section>

<h3>🔍 易错点辨析</h3>
<p>1. 错误认为哥伦布"发现"美洲是单纯的科学探索。实际上1492年航行时西班牙王室给他的敕令明确写着"获取黄金和香料"（《圣塔菲协议》原件现存塞维利亚档案馆），其船队携带的玻璃珠等小商品就是用于贸易交换。学生容易受教科书简化表述影响，忽略殖民掠夺的本质属性。</p>
<p>2. 混淆"价格革命"与"商业革命"概念。16世纪西班牙从美洲运回约181吨黄金（据经济史学家Earl Hamilton统计），导致欧洲物价上涨4-5倍，这是"价格革命"；而荷兰东印度公司1602年成立后发展的股票交易、期货市场等金融创新才属于"商业革命"。两者虽有关联但驱动机制不同。</p>
<p>3. 高估达·伽马航线的直接贸易价值。1498年葡萄牙船队运回的香料虽价值是成本的60倍，但次年威尼斯商人立即通过红海航线压价竞争。真正垄断要等到1509年第乌海战摧毁阿拉伯舰队后，这个时间差常被忽略。</p>
</section>

(function(){

  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];

      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
