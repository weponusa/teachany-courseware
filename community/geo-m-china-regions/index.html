    <div class="card">
      <span class="phase-tag">知识精讲</span>
      <h2>中国四大地理区域</h2>
      <p>依据自然与人文地理特征，中国划分为北方、南方、西北、青藏四大地理区域。秦岭—淮河是南北方重要分界；西北干旱半干旱，青藏高寒。分区是认识区域差异的钥匙。</p>
    </div>
  </section>
<section class="slide-page" data-page-type="content" data-tsh="方法范例">
  <section class="section geom-depth core-knowledge-module text-module" id="lesson-method"
    data-bloom-level="apply" data-scaffold="partial" data-tts="lesson-method">
    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：分界线 + 主导因素</h2>
      <p>北方南方比降水与气温；西北比干旱；青藏比高寒。用表格式对比最清晰。</p>
      <div class="worked-example"><strong>范例：</strong>秦岭—淮河一线与 1 月 0℃ 等温线、800 mm 年等降水量线大致吻合。</div>
      <p id="lesson-pitfall" class="geom-pitfall"><strong>常见误区：</strong>常见误区是四大区域界线记混，或只用一个指标解释所有差异。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练：辨析要点</h3>
        <p>划分西北地区与北方地区的主导因素更突出的是？</p>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. <strong>南水北调工程选线</strong>：中线工程沿伏牛山-太行山东麓建设，正是利用南方地区与北方地区的分界过渡带。2022年输水量达94亿立方米，设计者通过分析秦岭-淮河线两侧200mm降水差，确定丹江口水库为最佳取水点。</p>
<p>2. <strong>高原铁路建设</strong>：青藏铁路在昆仑山口（北纬36°）的轨温设计采用-45℃标准，而非兰州段的-30℃，这是基于对中国地势第一、二级阶梯分界线的精确测绘。冻土监测数据显示，该界线南北侧年均地温差达8℃。</p>
<p>3. <strong>农产品冷链物流</strong>：京东物流在西安（北纬34°）设立双温区仓储中心，北库保持0℃存储苹果，南库设15℃存储柑橘。该布局依据秦岭-淮河线两侧水果主产区的温度需求差异，2023年使损耗率降低23%。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. <strong>为何淮河段分界线比秦岭段波动更大？</strong> 对比两段地形剖面图会发现：秦岭海拔突变形成明显屏障，而淮河流域地势平缓使冷暖空气拉锯战范围达50-80公里。可思考：2016年1月寒潮期间，分界线为何临时南推至长江？这与准静止锋动态有何关联？</p>
<p>2. <strong>西北干旱区与青藏高寒区都缺水，本质差异何在？</strong> 从水循环角度分析：塔里木盆地年均蒸发量2000mm但降水不足100mm，属于"绝对缺水"；而三江源区蒸发量仅300mm却存有冰川融水，是"利用型缺水"。这种差异如何影响两个区域的生态恢复策略？</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>中国地理分区始于一个根本矛盾：960万平方公里国土上存在巨大环境差异。先看温度带，1月0℃等温线像无形的剪刀，将东部裁剪出北方集中供暖区与南方非供暖区——但2018年寒潮中，这条线在淮河平原出现了40公里摆动，揭示出界线本质是动态过渡带。接着用地形图叠加，发现青藏高原并非简单按海拔3000米划分：柴达木盆地（海拔2800米）划入西北地区，因其年降水不足50mm符合干旱特征，而横断山区虽海拔高却因降水1000mm以上归入南方地区。最后落实到具体问题：2021年郑州"7·20"暴雨时，气象学家发现秦岭对水汽的拦截使暴雨中心北移，这正是地理分区知识在灾害预警中的应用——秦岭不仅在地图上画线，更在真实世界中影响着每秒300立方米的水汽输送。</p>
</section>

<h3>🔍 易错点辨析</h3>
<p>1. <strong>混淆800mm等降水量线与秦岭-淮河线</strong>：学生常将两者完全等同，实际上800mm线在秦岭段偏南15-30公里。错误源于对"自然地理界线具有过渡性"理解不足，正确认知是：秦岭主脊（海拔2000-3000米）对水汽的阻挡作用才是根本，淮河段因平原地形使界线与降水线基本吻合。</p>
<p>2. <strong>误判青藏高原边界</strong>：约40%学生将祁连山全划入西北地区。实际上祁连山东段（年均温＞0℃部分）属于青藏高原区，这是因只记"昆仑-祁连-横断"口诀却忽视温度指标。正确划分应叠加1月均温-8℃等值线和地形阶梯线双重标准。</p>
<p>3. <strong>过度简化南方/北方分界</strong>：常见将柑橘、茶树种植北界直接等同于秦岭-淮河线。事实上汉中盆地（北纬33°）因秦岭南坡阻挡冷空气，可种植柑橘；而信阳毛尖（北纬32°）茶树越冬需人工防冻。这反映学生对"农业活动界线≠自然分界线"理解不深。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {

    }

      ctx.fillStyle = nd.color; ctx.fill();

      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>

  box.querySelectorAll('button').forEach(function (item) {

    if (item.dataset.correct === '1') item.classList.add('correct');

  if (feedback) {

}
