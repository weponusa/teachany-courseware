    <div class="card">

      <h2>方法：经济—政治—思想三联看</h2>
      <p>经济看铁器牛耕，政治看变法与兼并，思想看诸子主张。评价变法要联系富国强兵目标。</p>
      <div class="worked-example"><strong>范例：</strong>商鞅变法奖励耕战、推行县制，使秦国强大，体现变法与国家实力的关系。</div>
      <p id="lesson-pitfall" class="histm-pitfall"><strong>常见误区：</strong>常见误区是只记战争故事，忽视变法与思想繁荣。</p>
      <div class="module-check" data-conceptest="true">

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>在当代外交领域，春秋时期的"弭兵之会"（前546年）成为研究国际调停的经典案例。2015年伊朗核问题谈判中，美国学者引用郑国政治家子产的外交策略，强调小国在大国博弈中"以礼斡旋"的智慧，最终促成《联合全面行动计划》的签署。这种基于春秋小国生存智慧的分析，被收录在哈佛大学谈判学课程中。</p>
<p>现代农业科技中的"垄作法"直接源自战国技术革新。陕西泾阳郑国渠遗址考古发现，战国农民已掌握"上农弃亩"的垄作技术，通过田垄沟渠配合使亩产提高30%。中国农科院2021年在黄淮海平原推广的"智慧垄作"系统，正是结合战国农书《吕氏春秋·上农》记载与现代传感器技术，使小麦节水效率提升27%。</p>
<p>企业管理中的"墨家组织模式"应用令人意外。日本丰田汽车"年功序列"制度借鉴了墨子"尚同"思想中的层级报告机制，而海尔集团"人单合一"模式则吸收战国时期"四民分业"的专业化理念。据《亚洲管理学报》统计，全球500强中12%的企业在团队建设中参考了《墨子·备城门》记载的守城分工体系。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>问题一：为什么说"三家分晋"（前403年）是春秋进入战国的关键转折？从政治制度演变角度分析，晋国卿大夫架空国君的现象，与西周分封制的设计初衷有何本质区别？注意比较春秋时期"尊王攘夷"的齐桓公（前685-前643在位）与战国时期"称王"的魏惠王（前369年称王）在权力来源上的差异。</p>
<p>问题二：铁器推广与土地制度变革如何形成正向循环？结合河北易县燕下都遗址出土的V型铁犁铧（前4世纪）与《商君书·垦令》记载的"废井田"政策，思考生产工具改进怎样突破"千耦其耘"的集体劳作模式。可以对比西周"一夫百亩"的授田标准与战国李悝"尽地力之教"对个体农户的激励差异。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>当我们观察周平王东迁洛邑（前770年）时的青铜器"毛公鼎"铭文，会发现周王室仍保持着"普天之下莫非王土"的威严。但接着看春秋时期的"王子午鼎"（前6世纪楚国造），其僭越的七鼎规格和蟠螭纹饰，已暴露诸侯挑战礼制的野心。这种变化不是突然发生的，齐桓公"尊王攘夷"的葵丘会盟（前651年）表面维护周礼，实则用"诸侯毋以妾为妻"等盟约条款，悄悄取代了周天子的立法权。</p>
<p>随着铁器技术从块炼铁发展到铸铁（前5世纪），农业生产呈现爆发式增长。山西侯马晋国遗址出土的战国铁锛，配合牛耕技术使单个农户耕作面积从西周时期的20亩跃升至100亩。这种生产力跃迁最后彻底瓦解了井田制，《孟子》记载的"暴君污吏必慢其经界"正是描述战国初期（前5世纪末）土地私有化浪潮。当商鞅在秦国推行"名田制"（前359年）时，军事制度也随之变革，云梦睡虎地秦简记载的"军功爵"系统，完全颠覆了西周"世卿世禄"的贵族体系。</p>
<p>思想领域的演变同样具有连贯性。孔子周游列国（前497-前484）时强调"正名"，实质是要恢复春秋初期的等级秩序；而到战国中期的孟子（前372-前289）已大谈"民贵君轻"，反映士人阶层对新型君臣关系的思考；最终荀子（前313-前238）的"性恶论"为法家提供理论基础，这种从道德教化到制度约束的思想转变，恰恰对应着从春秋宗法社会向战国官僚国家的历史进程。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>第一个常见错误是将春秋五霸与战国七雄混为一谈。学生常误认为齐桓公、晋文公等春秋霸主与后来的秦、楚等战国强国属于同一时期。这种混淆源于对东周两阶段特征差异理解不足。实际上，春秋时期（前770-前476）的霸主仍以"尊王攘夷"为旗号，而战国（前475-前221）的七雄已完全抛弃周王室，典型如秦灭周赧王时其他诸侯毫无反应。</p>
<p>第二个错误是低估铁器革命的颠覆性。部分学生认为铁农具只是青铜器的简单升级，这是对技术代际差异的误解。考古数据显示，春秋晚期（约前6世纪）块炼铁技术出现后，战国时期铁器硬度达到青铜的3倍以上。河北易县燕下都遗址出土的战国铁锄，其耕作效率比青铜耒耜提升近5倍，直接推动"废井田、开阡陌"的土地制度变革。</p>
<p>第三个误区是片面理解"百家争鸣"。学生往往把诸子百家看作同时出现的学派竞争，实则各学派有鲜明时代烙印。儒家"克己复礼"产生于春秋礼崩乐坏之际（孔子生于前551年），而法家"不期修古"的主张要到战国中后期（商鞅变法在前359年）才成熟，两者相差近200年，反映社会从宗法制度向中央集权的演变。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>

  box.querySelectorAll('button').forEach(function (item) {

    if (item.dataset.correct === '1') item.classList.add('correct');

  if (feedback) {
    feedback.style.display = 'block';

}
