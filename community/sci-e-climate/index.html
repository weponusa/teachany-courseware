    <div class="slide-inner"><div class="card card-accent"><div class="section-header"><span class="phase-tag">Concept</span><h2>天气 vs 气候</h2></div><p><strong>天气</strong>是某一时刻或几天的阴晴、风雨、冷暖等状况，变化快。<strong>气候</strong>是某地多年平均的天气状况，如年均气温、年降水量、季节分配，相对稳定。</p><p>气象站观测气温、湿度、气压、风向风速、降水等，积累数据才能描述气候。天气预报预测未来几天天气，不是几十年气候。</p></div></div>

    <div class="slide-inner"><div class="card"><div class="section-header"><span class="phase-tag">Examples</span><h2>气候如何影响我们？</h2></div><p>我国东部<strong>季风气候</strong>雨热同期，利于水稻生长；西北干旱少雨，适合耐旱作物。不同气候带植被、动物、民居（如南方通风、北方保暖）各不相同。</p><p>近年来<strong>全球变暖</strong>使极端天气增多，节能减排、植树护林有助于减缓气候变化影响。</p></div></div>

    <div class="card">
      <span class="phase-tag">知识精讲</span>
      <h2>气候与天气</h2>
      <p>气候是一个地方多年天气的平均状况，如“热带气候炎热多雨”。天气多变，气候相对稳定。影响气候的因素有纬度、海陆位置、地形等。了解气候有助于农业、建筑和出行安排，也与全球气候变化议题相关。</p>
    </div>
  </section>
<section class="slide-page" data-page-type="content" data-tsh="方法范例">
  <section class="section scie-depth core-knowledge-module text-module" id="lesson-method"
    data-bloom-level="apply" data-scaffold="partial" data-tts="lesson-method">
    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：时间尺度区分天气与气候</h2>
      <p>看时间长短：几天内的变化谈天气，多年规律谈气候。解释两地气候差异时优先考虑纬度高低和距海远近。</p>
      <div class="worked-example"><strong>范例：</strong>“昆明四季如春”是气候描述；“昆明今天降温下雨”是天气描述。</div>
      <p id="lesson-pitfall" class="scie-pitfall"><strong>常见误区：</strong>常见误区是把一次寒潮当成气候永久改变，或把气候差异只归因于“离赤道远近”而忽略地形。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练 1：概念辨析</h3>
        <p>“海南长夏无冬”描述的是？</p>
        <button type="button" data-correct="0" onclick="scieDepthCheck(this,false,&#x27;scie-depth-feedback-1&#x27;,&quot;长期温度特征属于气候。&quot;)">A. 某一天的天气</button><button type="button" data-correct="1" onclick="scieDepthCheck(this,true,&#x27;scie-depth-feedback-1&#x27;,&quot;长期温度特征属于气候。&quot;)">B. 气候特征</button><button type="button" data-correct="0" onclick="scieDepthCheck(this,false,&#x27;scie-depth-feedback-1&#x27;,&quot;长期温度特征属于气候。&quot;)">C. 一次地震</button><button type="button" data-correct="0" onclick="scieDepthCheck(this,false,&#x27;scie-depth-feedback-1&#x27;,&quot;长期温度特征属于气候。&quot;)">D. 月相变化</button>

<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-1"><h2>📖 天气气候分得清</h2><div class="tu-q"><p><strong>And：</strong>学生知道今天下雨或晴天</p><p><strong>But：</strong>容易把连下三天雨当成气候现象</p><p><strong>Therefore：</strong>用时间尺度区分二者</p></div><div class="tu-q"><p>天气是短时间（几小时到几天）的大气状况，比如2023年7月北京连续3天暴雨就是天气现象；气候是某地长期（30年以上）的天气规律，比如北京夏季平均降水量占全年60%以上。就像每日体温是'天气'，常年36.5℃是'气候'。</p></div><div class="tu-q"><p>🌍 今天体育课突然下雨要取消（天气），但广州每年4月清明时节雨纷纷（气候）。带学生对比本周天气预报和《地理课本》气候特征表格。</p></div><div class="tu-q" data-answer="A"><h3>🏋️ 即练</h3><p>以下哪个描述属于气候？</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="错选B/D的同学把短期现象当长期规律">A. 三亚全年平均气温25℃</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="错选B/D的同学把短期现象当长期规律">B. 昨天台风登陆深圳</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="错选B/D的同学把短期现象当长期规律">C. 明天阴转多云</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="错选B/D的同学把短期现象当长期规律">D. 上周持续高温</button></div><div class="tu-fb" hidden></div></div></section>
<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-2"><h2>📖 气候变暖看得见</h2><div class="tu-q"><p><strong>And：</strong>学生感受过夏天越来越热</p><p><strong>But：</strong>认为只是今年特别热</p><p><strong>Therefore：</strong>用数据认识长期趋势</p></div><div class="tu-q"><p>全球气候变暖指地球平均气温持续上升。近100年全球气温升高0.74℃，相当于每天升温0.0002℃。就像温水煮青蛙，短期感觉不明显但危害很大。例如北极海冰每10年减少13.1%，相当于3个北京市的面积消失。</p></div><div class="tu-q"><p>🌍 观察小区大树年轮：紧密环（冷年）和宽松环（暖年）交替，但最近10年宽松环明显增多。用温度计记录今年夏季每日最高温，对比爷爷奶奶小时候的天气日记。</p></div><div class="tu-q" data-answer="A"><h3>🏋️ 即练</h3><p>气候变暖指多长时间的温度变化？</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="错选B/C的同学混淆了短期天气与长期气候">A. 至少30年的持续变化</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="错选B/C的同学混淆了短期天气与长期气候">B. 今年比去年更热</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="错选B/C的同学混淆了短期天气与长期气候">C. 本周持续高温</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="错选B/C的同学混淆了短期天气与长期气候">D. 一天内温差大</button></div><div class="tu-fb" hidden></div></div></section>
<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-3"><h2>📖 极端天气频敲门</h2><div class="tu-q"><p><strong>And：</strong>学生经历过暴雨/高温等极端天气</p><p><strong>But：</strong>认为只是偶然现象</p><p><strong>Therefore：</strong>理解与气候变化的关联</p></div><div class="tu-q"><p>气候变暖导致极端天气更强更频繁。就像烧开水时气泡更剧烈：1℃升温会使大气含水量增加7%，导致暴雨更强。2021年郑州1小时降雨量达201.9毫米，相当于150个西湖水倒下来。同时高温天数增加，上海2022年40℃以上天数破纪录。</p></div><div class="tu-q"><p>🌍 对比近5年家庭电费账单：空调使用月份是否延长？用海绵吸水实验模拟（正常气候吸5次才滴水，变暖后3次就滴答流）。</p></div><div class="tu-q" data-answer="A"><h3>🏋️ 即练</h3><p>气候变暖可能引起：</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="错选B的同学把趋势夸大绝对化">A. 暴雨强度增加</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="错选B的同学把趋势夸大绝对化">B. 冬天永远消失</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="错选B的同学把趋势夸大绝对化">C. 每天固定时间下雨</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="错选B的同学把趋势夸大绝对化">D. 月亮温度升高</button></div><div class="tu-fb" hidden></div></div></section>
<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-4"><h2>📖 小小行动大不同</h2><div class="tu-q"><p><strong>And：</strong>学生知道要环保</p><p><strong>But：</strong>觉得个人行动没用</p><p><strong>Therefore：</strong>量化日常行为影响</p></div><div class="tu-q"><p>每个人都能减缓气候变化。1棵大树1年吸收18kg二氧化碳，相当于20台空调开8小时的排放量。如果全班40人每天少用1张纸，1年能保护2棵大树。骑自行车代替汽车出行1公里，减少碳排放量相当于1个氢气球大小。</p></div><div class="tu-q"><p>🌍 开展班级'绿色银行'：记录每天关灯节电、双面用纸等行为，每月换算成'拯救的北极熊数量'（每节约10度电=1kgCO2=保护0.01㎡海冰）。</p></div><div class="tu-q" data-answer="A"><h3>🏋️ 即练</h3><p>以下哪种行为对减缓气候变暖最有效？</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="错选C的同学没注意能源消耗">A. 步行上学代替坐车</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="错选C的同学没注意能源消耗">B. 每天多喝一瓶水</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="错选C的同学没注意能源消耗">C. 穿厚衣服开空调</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="错选C的同学没注意能源消耗">D. 把旧玩具埋地下</button></div><div class="tu-fb" hidden></div></div></section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>

function scieDepthCheck(button, isCorrect, feedbackId, explanation) {

  if (!box || box.dataset.answered) return;

  box.querySelectorAll('button').forEach(function (item) {

    if (item.dataset.correct === '1') item.classList.add('correct');
