<text x="324.4" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">多感官观察实践</text>
<circle cx="323.4" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="335.4" y="192.0" font-size="13.5" fill="#334155">选择教室里的一个物品进行5分</text>
<text x="335.4" y="214.0" font-size="13.5" fill="#334155">钟观察</text>
<rect x="561.8" y="128" width="236.4" height="210" rx="14" fill="#ffffff" stroke="#ffe66d" stroke-opacity=".35" stroke-width="2"/>
<path d="M575.8 128 h208.4 a14,14 0 0 1 14,14 v30.0 h-236.4 v-30.0 a14,14 0 0 1 14,-14 z" fill="#ffe66d" fill-opacity=".13"/>
<text x="578.8" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">细节描写：小处见精神</text>
<circle cx="577.8" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="589.8" y="192.0" font-size="13.5" fill="#334155">细节描写抓住人物或事物细微</text>
<text x="589.8" y="214.0" font-size="13.5" fill="#334155">而有特点的地方来写</text>
<rect x="816.2" y="128" width="236.4" height="210" rx="14" fill="#ffffff" stroke="#ffe66d" stroke-opacity=".35" stroke-width="2"/>
<path d="M830.2 128 h208.4 a14,14 0 0 1 14,14 v30.0 h-236.4 v-30.0 a14,14 0 0 1 14,-14 z" fill="#ffe66d" fill-opacity=".13"/>
<text x="833.2" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">方法：选典型细节、写准确</text>
<text x="833.2" y="172.0" font-size="16.0" font-weight="700" fill="#0f172a">动作神态</text>
<circle cx="832.2" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="844.2" y="192.0" font-size="13.5" fill="#334155">动词要准，少用“很、非常”，</text>
<text x="844.2" y="214.0" font-size="13.5" fill="#334155">让细节自己说话</text>
<circle cx="832.2" cy="231.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="844.2" y="236.0" font-size="13.5" fill="#334155">常见误区是细节与中心无关，</text>
<text x="844.2" y="258.0" font-size="13.5" fill="#334155">或写得太碎没有重点</text>
<rect x="1070.6" y="128" width="236.4" height="210" rx="14" fill="#ffffff" stroke="#ffe66d" stroke-opacity=".35" stroke-width="2"/>
<path d="M1084.6 128 h208.4 a14,14 0 0 1 14,14 v30.0 h-236.4 v-30.0 a14,14 0 0 1 14,-14 z" fill="#ffe66d" fill-opacity=".13"/>
<text x="1087.6" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">深层理解：五镜头</text>
<circle cx="1086.6" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="1098.6" y="192.0" font-size="13.5" fill="#334155">像放大镜看蚂蚁——分解动作、</text>
<text x="1098.6" y="214.0" font-size="13.5" fill="#334155">神态、衣褶等微小部分</text>
<circle cx="1086.6" cy="231.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="1098.6" y="236.0" font-size="13.5" fill="#334155">细节是作文的调味料，让平淡</text>
<text x="1098.6" y="258.0" font-size="13.5" fill="#334155">变美味</text>
<circle cx="1086.6" cy="275.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="1098.6" y="280.0" font-size="13.5" fill="#334155">对比&#x27;她哭了&#x27;和&#x27;她咬着嘴唇，</text>
<text x="1098.6" y="302.0" font-size="13.5" fill="#334155">眼泪在眼眶里打转&#x27;</text>
