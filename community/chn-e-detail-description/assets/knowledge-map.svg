<circle cx="69.0" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="81.0" y="192.0" font-size="13.5" fill="#334155">理解什么是 细节描写 ，知道</text>
<text x="81.0" y="214.0" font-size="13.5" fill="#334155">它的作用</text>
<circle cx="69.0" cy="231.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="81.0" y="236.0" font-size="13.5" fill="#334155">掌握 外貌、动作、语言、心理</text>
<text x="81.0" y="258.0" font-size="13.5" fill="#334155">、神态 5种细节类型</text>
<circle cx="69.0" cy="275.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="81.0" y="280.0" font-size="13.5" fill="#334155">能用细节描写 改进自己的作文</text>
<text x="81.0" y="302.0" font-size="13.5" fill="#334155"> ，让文章更生动</text>
<rect x="307.4" y="128" width="236.4" height="210" rx="14" fill="#ffffff" stroke="#ffe66d" stroke-opacity=".35" stroke-width="2"/>
