<text x="70.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">修辞手法：辨认名称与表达</text>
<text x="70.0" y="172.0" font-size="16.0" font-weight="700" fill="#0f172a">作用</text>
<circle cx="69.0" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="81.0" y="192.0" font-size="13.5" fill="#334155">常见修辞有比喻、拟人、排比</text>
<text x="81.0" y="214.0" font-size="13.5" fill="#334155">、夸张、反问等</text>
<rect x="307.4" y="128" width="236.4" height="166" rx="14" fill="#ffffff" stroke="#ffe66d" stroke-opacity=".35" stroke-width="2"/>
<path d="M321.4 128 h208.4 a14,14 0 0 1 14,14 v30.0 h-236.4 v-30.0 a14,14 0 0 1 14,-14 z" fill="#ffe66d" fill-opacity=".13"/>
<text x="324.4" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">方法：辨特征、说作用、结</text>
<text x="324.4" y="172.0" font-size="16.0" font-weight="700" fill="#0f172a">合句意</text>
<circle cx="323.4" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="335.4" y="192.0" font-size="13.5" fill="#334155">看句子是否有“像”、是否把物</text>
<text x="335.4" y="214.0" font-size="13.5" fill="#334155">当人、是否结构相似连…</text>
<circle cx="323.4" cy="231.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="335.4" y="236.0" font-size="13.5" fill="#334155">应结合句意说好处</text>
<rect x="561.8" y="128" width="236.4" height="166" rx="14" fill="#ffffff" stroke="#ffe66d" stroke-opacity=".35" stroke-width="2"/>
<path d="M575.8 128 h208.4 a14,14 0 0 1 14,14 v30.0 h-236.4 v-30.0 a14,14 0 0 1 14,-14 z" fill="#ffe66d" fill-opacity=".13"/>
<text x="578.8" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">比喻初探</text>
<circle cx="577.8" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="589.8" y="192.0" font-size="13.5" fill="#334155">比喻就是把A事物比作B事物，</text>
<text x="589.8" y="214.0" font-size="13.5" fill="#334155">让表达更生动</text>
<circle cx="577.8" cy="231.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="589.8" y="236.0" font-size="13.5" fill="#334155">操场上的梧桐树叶哗啦啦响，</text>
<text x="589.8" y="258.0" font-size="13.5" fill="#334155">像在拍绿色的小手掌</text>
<rect x="816.2" y="128" width="236.4" height="166" rx="14" fill="#ffffff" stroke="#ffe66d" stroke-opacity=".35" stroke-width="2"/>
<path d="M830.2 128 h208.4 a14,14 0 0 1 14,14 v30.0 h-236.4 v-30.0 a14,14 0 0 1 14,-14 z" fill="#ffe66d" fill-opacity=".13"/>
<text x="833.2" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">拟人妙用</text>
<circle cx="832.2" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="844.2" y="192.0" font-size="13.5" fill="#334155">拟人就是把事物当人来写，给</text>
<text x="844.2" y="214.0" font-size="13.5" fill="#334155">它人的动作或感情</text>
<circle cx="832.2" cy="231.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="844.2" y="236.0" font-size="13.5" fill="#334155">放学时我的书包饿得咕咕叫（</text>
<text x="844.2" y="258.0" font-size="13.5" fill="#334155">其实是肚子响）</text>
<rect x="1070.6" y="128" width="236.4" height="166" rx="14" fill="#ffffff" stroke="#ffe66d" stroke-opacity=".35" stroke-width="2"/>
<path d="M1084.6 128 h208.4 a14,14 0 0 1 14,14 v30.0 h-236.4 v-30.0 a14,14 0 0 1 14,-14 z" fill="#ffe66d" fill-opacity=".13"/>
<text x="1087.6" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">排比力量</text>
<circle cx="1086.6" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="1098.6" y="192.0" font-size="13.5" fill="#334155">注意：排比句字数不必完全相</text>
<text x="1098.6" y="214.0" font-size="13.5" fill="#334155">同，但结构要基本一致</text>
<circle cx="1086.6" cy="231.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="1098.6" y="236.0" font-size="13.5" fill="#334155">妈妈装零食，爸爸查路线，我</text>
<text x="1098.6" y="258.0" font-size="13.5" fill="#334155">理书包</text>
<text x="1316" y="340" font-size="13" fill="#94a3b8" text-anchor="end">TeachAny · chn-e-rhetorical-devices</text>
</svg>