<text x="70.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">探究作文结构</text>
<circle cx="69.0" cy="165.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="81.0" y="170.0" font-size="13.5" fill="#334155">请选择一篇你喜欢的作文，分析其结构</text>
<rect x="371.0" y="128" width="300.0" height="188" rx="14" fill="#ffffff" stroke="#ffe66d" stroke-opacity=".35" stroke-width="2"/>
<path d="M385.0 128 h272.0 a14,14 0 0 1 14,14 v8.0 h-300.0 v-8.0 a14,14 0 0 1 14,-14 z" fill="#ffe66d" fill-opacity=".13"/>
<text x="388.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">作文结构：开头、中间、结尾分工</text>
<circle cx="387.0" cy="165.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="399.0" y="170.0" font-size="13.5" fill="#334155">一篇完整的作文通常有开头引出话题、中</text>
<text x="399.0" y="192.0" font-size="13.5" fill="#334155">间展开具体内容、结尾收束点题</text>
<rect x="689.0" y="128" width="300.0" height="188" rx="14" fill="#ffffff" stroke="#ffe66d" stroke-opacity=".35" stroke-width="2"/>
<path d="M703.0 128 h272.0 a14,14 0 0 1 14,14 v8.0 h-300.0 v-8.0 a14,14 0 0 1 14,-14 z" fill="#ffe66d" fill-opacity=".13"/>
<text x="706.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">方法：先列提纲再写作</text>
<circle cx="705.0" cy="165.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="717.0" y="170.0" font-size="13.5" fill="#334155">中间部分详写重点，略写次要，避免平均</text>
<text x="717.0" y="192.0" font-size="13.5" fill="#334155">用力或一段到底</text>
<circle cx="705.0" cy="209.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="717.0" y="214.0" font-size="13.5" fill="#334155">常见误区是一段到底不分段，或开头很长</text>
<text x="717.0" y="236.0" font-size="13.5" fill="#334155">、重点事件却一笔带过</text>
<rect x="1007.0" y="128" width="300.0" height="188" rx="14" fill="#ffffff" stroke="#ffe66d" stroke-opacity=".35" stroke-width="2"/>
<path d="M1021.0 128 h272.0 a14,14 0 0 1 14,14 v8.0 h-300.0 v-8.0 a14,14 0 0 1 14,-14 z" fill="#ffe66d" fill-opacity=".13"/>
<text x="1024.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">深层理解：五镜头</text>
<circle cx="1023.0" cy="165.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="1035.0" y="170.0" font-size="13.5" fill="#334155">像搭积木一样把作文分成开头、中间、结</text>
<text x="1035.0" y="192.0" font-size="13.5" fill="#334155">尾三部分</text>
<circle cx="1023.0" cy="209.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="1035.0" y="214.0" font-size="13.5" fill="#334155">开头点题，中间展开，结尾总结，像汉堡</text>
<text x="1035.0" y="236.0" font-size="13.5" fill="#334155">包一样层层分明</text>
<circle cx="1023.0" cy="253.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="1035.0" y="258.0" font-size="13.5" fill="#334155">对比流水账和结构清晰的文章，感受段落</text>
<text x="1035.0" y="280.0" font-size="13.5" fill="#334155">衔接的重要性</text>
<text x="1316" y="362" font-size="13" fill="#94a3b8" text-anchor="end">TeachAny · chn-e-essay-structure</text>
</svg>