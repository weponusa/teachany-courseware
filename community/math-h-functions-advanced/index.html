    <div class="card">
      <span class="phase-tag">知识精讲</span>
      <h2>函数综合性质：单调、奇偶与最值</h2>
      <p>函数性质是高中函数综合的主干：定义域优先；单调性描述函数增减，常用导数或定义法；奇偶性由 f(−x) 与 ±f(x) 的关系判定，须先关于原点对称的定义域；最值可结合单调性、基本不等式、导数求极值。综合题常把性质与方程、不等式、图像变换串联。</p>
    </div>
  </section>
<section class="slide-page" data-page-type="content" data-tsh="方法范例">
  <section class="section mathh-depth core-knowledge-module text-module" id="lesson-method"
    data-bloom-level="apply" data-scaffold="partial" data-tts="lesson-method">
    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：先定义域，再奇偶/单调，最后求值或比大小</h2>
      <p>判断奇偶：先看定义域是否关于原点对称，再算 f(−x)。判断单调：在区间内求导看符号，或用定义比较。求最值：能配方/基本不等式则用之，否则用导数找驻点并检验端点。</p>
      <div class="worked-example"><strong>范例：</strong>f(x)=x+1/x（x&gt;0）：由基本不等式 x+1/x≥2，当 x=1 时取等，最小值为 2；在 (0,1] 递减、[1,+∞) 递增。</div>
      <p id="lesson-pitfall" class="mathh-pitfall"><strong>常见误区：</strong>常见误区是未限制定义域就谈奇偶或单调，或求最值时不检验等号能否取到。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练 1：概念辨析</h3>
        <p>判断函数奇偶性时，首先必须检查？</p>
        <button type="button" data-correct="0" onclick="mathhDepthCheck(this,false,&#x27;mathh-depth-feedback-1&#x27;,&quot;定义域不关于原点对称则既不是奇函数也不是偶函数。&quot;)">A. 值域是否为正</button><button type="button" data-correct="1" onclick="mathhDepthCheck(this,true,&#x27;mathh-depth-feedback-1&#x27;,&quot;定义域不关于原点对称则既不是奇函数也不是偶函数。&quot;)">B. 定义域是否关于原点对称</button><button type="button" data-correct="0" onclick="mathhDepthCheck(this,false,&#x27;mathh-depth-feedback-1&#x27;,&quot;定义域不关于原点对称则既不是奇函数也不是偶函数。&quot;)">C. 是否有最大值</button><button type="button" data-correct="0" onclick="mathhDepthCheck(this,false,&#x27;mathh-depth-feedback-1&#x27;,&quot;定义域不关于原点对称则既不是奇函数也不是偶函数。&quot;)">D. 导数是否存在</button>
        <div class="mathh-feedback" id="mathh-depth-feedback-1" role="status"></div>
      </div>
      <div class="module-check" data-conceptest="true">
        <h3>马上练 2：计算应用</h3>
        <p>x&gt;0 时，x+1/x 的最小值是？</p>
        <button type="button" data-correct="0" onclick="mathhDepthCheck(this,false,&#x27;mathh-depth-feedback-2&#x27;,&quot;x+1/x≥2√(x·1/x)=2，x=1 时取等。&quot;)">A. 0</button><button type="button" data-correct="0" onclick="mathhDepthCheck(this,false,&#x27;mathh-depth-feedback-2&#x27;,&quot;x+1/x≥2√(x·1/x)=2，x=1 时取等。&quot;)">B. 1</button><button type="button" data-correct="1" onclick="mathhDepthCheck(this,true,&#x27;mathh-depth-feedback-2&#x27;,&quot;x+1/x≥2√(x·1/x)=2，x=1 时取等。&quot;)">C. 2</button><button type="button" data-correct="0" onclick="mathhDepthCheck(this,false,&#x27;mathh-depth-feedback-2&#x27;,&quot;x+1/x≥2√(x·1/x)=2，x=1 时取等。&quot;)">D. 4</button>

<section class="section" data-bloom-level="apply" data-scaffold="full"><h2>函数的单调性与极值</h2><p style="line-height:1.9;">函数的单调性描述了函数值随自变量变化的趋势。函数在某一区间内如果随着自变量的增加而增加，则称该函数在该区间内是单调递增的；反之，则是单调递减的。例如，函数f(x) = x^2在x > 0时是单调递增的，在x < 0时是单调递减的。函数的极值是指函数在某一点取得的最大值或最小值。通过求导，我们可以找到函数的极值点，并进一步分析函数的单调性。理解函数的单调性与极值，对于解决最优化问题和分析函数的变化趋势具有重要意义。</p></section>
<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 地震监测中的对数应用：里克特震级采用log₁₀(E/E₀)计算，其中E是地震波能量。2023年土耳其7.8级地震释放的能量约是6级地震的63倍（每级相差约31.6倍），这种非线性关系只有通过对数尺度才能直观表达。</p>
<p>2. 金融复利与指数函数：某银行年利率5%的复利存款，本金A₀=10000元，t年后本息和A(t)=10000×1.05^t。10年后将增长至16289元（精确到元），这种指数增长模型是金融计算的核心工具。</p>
<p>3. 交流电的三角函数模型：家用220V电压瞬时值u=311sin(100πt)，其中311V是峰值电压，100π对应50Hz频率。工程师用此模型计算电路功率时，需对sin²(ωt)在[0,2π]积分得到等效直流电压220V。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. 为什么指数函数y=a^x的定义域是全体实数，而值域却是(0,+∞)？分析线索：从整数指数幂扩展到分数指数幂的过程看，比如2^(1/2)=√2，再思考a^0和a^(-x)的数学意义；结合函数图像在a>1和0<a<1时的渐近线特征。</p>
<p>2. 当比较log₅7和log₇5的大小时，除了用计算器直接求值，能否通过函数性质判断？思考方向：观察两个对数的底数和真数关系，尝试构建辅助函数f(x)=logₓ(x+2)；考虑换底公式与导数分析函数的单调性特征。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>当我们研究变量间的依赖关系时，函数概念自然浮现：从初中y=2x+1这样的具体对应，发展到高中用映射严格定义函数。先认识三类基本函数——幂函数y=x^a展现多项式曲线的多样性（如a=2时抛物线，a=1/2时半支抛物线）；指数函数y=a^x揭示爆炸式增长规律，在a=e≈2.718时具有独特的导数性质；对数函数y=logₐx则是指数函数的逆运算，其图像关于y=x对称。接着考察周期变化的三角函数，sinx的2π周期性在简谐振动中体现为完整运动循环。在实际应用中，这些函数往往组合出现：例如阻尼振动模型y=e^(-kt)sin(ωt)就融合了指对数和三角函数的特性。最后通过函数应用将知识串联——用二分法求f(x)=x³-2x-5零点时，既需要理解函数连续性，又要计算具体函数值。现代GPS定位中的三球交汇算法，本质上就是求解三个非线性函数的公共解。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 混淆幂函数与指数函数的定义：学生常将y=x^a与y=a^x混淆。认知根源在于两者都含"指数"字眼且表达式相似。实际上，幂函数是底数为变量（如y=x²），指数函数是指数为变量（如y=2^x）。例如在比较x³与3^x时，x<0时x³可能为负而3^x始终为正。</p>
<p>2. 对数函数定义域错误：解题时常见遗漏logₐx中x>0的条件。例如解log₂(x-3)=5时，学生直接得x=35而忽略x-3>0的前提。这源于对对数函数图像特征理解不足，其定义域限制源自对数运算的数学本质。</p>
<p>3. 三角函数周期性应用失误：求sin(2x+π/3)的周期时，误用2π而忽略系数影响。正确做法应识别ω=2，周期T=2π/2=π。这类错误源于对周期公式T=2π/|ω|的机械记忆，未理解ω的实际物理意义是角速度。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
