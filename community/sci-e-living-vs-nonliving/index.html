  <style>
    :root {
      --bg:       #0d1b2a;
      --bg2:      #1a2f4a;
      --card:     rgba(20,40,70,0.90);
      --border:   rgba(34,197,94,0.22);
      --primary:  #22c55e;
      --secondary:#38bdf8;
      --accent:   #facc15;
      --danger:   #f87171;
      --purple:   #a78bfa;
      --coral:    #fb923c;
      --muted:    #94a3b8;
      --text:     #f0fdf4;
      --r:        16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
      overflow-x: hidden;
      padding-top: 52px;
    }

    /* ── Nav ── */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      background: rgba(13,27,42,0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: .6rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { font-size: 1rem; font-weight: 700; color: var(--primary); }
    .nav-links { display: flex; gap: 1.2rem; }
    .nav-links a { font-size: .82rem; color: var(--muted); text-decoration: none; transition: color .15s; }
    .nav-links a:hover { color: #fff; }
    @media(max-width:600px){ .nav-links { display:none; } }

    /* ── Hero ── */
    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 3rem 1.5rem;
      background:
        radial-gradient(ellipse at 35% 25%, rgba(34,197,94,.15) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 70%, rgba(56,189,248,.10) 0%, transparent 50%),
        var(--bg);
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.35);
      border-radius: 99px; padding: .38rem 1.1rem;
      font-size: .82rem; color: var(--primary); font-weight: 600; margin-bottom: 1.8rem;
    }
    .hero h1 {
      font-size: clamp(2.4rem, 7vw, 5rem);
      font-weight: 900; line-height: 1.1;
      background: linear-gradient(135deg, #fff 30%, #22c55e 65%, #38bdf8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1.2rem;
    }
    .hero-sub { font-size: 1.15rem; color: var(--muted); margin-bottom: 2.4rem; }
    .hero-tags { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; margin-bottom: 2rem; }
    .hero-tags span {
      padding: .4rem 1rem; border-radius: 99px; font-size: .85rem; font-weight: 600;
    }
    .tag-living   { background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.4); color: var(--primary); }
    .tag-science  { background: rgba(56,189,248,.12); border: 1px solid rgba(56,189,248,.35); color: var(--secondary); }
    .tag-grade    { background: rgba(250,204,21,.12); border: 1px solid rgba(250,204,21,.35); color: var(--accent); }

    /* ── Sections ── */
    section { padding: 4rem 1.5rem; max-width: 1100px; margin: 0 auto; }
    .section-title {
      font-size: 1.75rem; font-weight: 800; margin-bottom: 1.5rem;
      display: flex; align-items: center; gap: .6rem;
    }
    .section-title .num {
      width: 2.1rem; height: 2.1rem; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: .95rem; font-weight: 800;
    }
    .num-green  { background: rgba(34,197,94,.25); color: var(--primary); }
    .num-blue   { background: rgba(56,189,248,.2); color: var(--secondary); }
    .num-yellow { background: rgba(250,204,21,.2); color: var(--accent); }
    .num-red    { background: rgba(248,113,113,.2); color: var(--danger); }
    .num-purple { background: rgba(167,139,250,.2); color: var(--purple); }

    /* ── ABT Intro ── */
    .abt-block {
      background: rgba(34,197,94,.06); border: 1px solid rgba(34,197,94,.25);
      border-radius: var(--r); padding: 1.5rem 2rem; margin-bottom: 2rem;
    }
    .abt-block .abt-tag {
      display: inline-block; padding: .2rem .65rem; border-radius: 99px;
      font-size: .72rem; font-weight: 700; margin-bottom: .5rem; letter-spacing: .04em;
    }
    .abt-tag.and  { background: rgba(56,189,248,.2); color: var(--secondary); }
    .abt-tag.but  { background: rgba(250,204,21,.2); color: var(--accent); }
    .abt-tag.therefore { background: rgba(34,197,94,.2); color: var(--primary); }
    .abt-block p { color: #cbd5e1; line-height: 1.8; font-size: 1rem; }

    /* ── Cards grid ── */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.2rem; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.4rem 1.5rem;
      transition: transform .2s, border-color .2s;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--primary); }
    .card .icon { font-size: 2.2rem; margin-bottom: .7rem; }
    .card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: .5rem; }
    .card p { font-size: .88rem; color: var(--muted); line-height: 1.6; }

    /* Trait cards */
    .trait-card {
      background: var(--card); border-radius: var(--r); padding: 1.4rem 1.5rem;
      border-left: 4px solid; display: flex; gap: 1rem; align-items: flex-start;
    }
    .trait-card .trait-icon { font-size: 2rem; flex-shrink: 0; }
    .trait-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: .35rem; }
    .trait-card p { font-size: .87rem; color: var(--muted); }

    /* Living / Non-living comparison */
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media(max-width:680px){ .compare-grid { grid-template-columns: 1fr; } }
    .compare-panel { border-radius: var(--r); padding: 1.6rem; }
    .living-panel { background: rgba(34,197,94,.06); border: 2px solid rgba(34,197,94,.3); }
    .nonliving-panel { background: rgba(100,116,139,.06); border: 2px solid rgba(100,116,139,.3); }
    .compare-panel h3 { font-size: 1.3rem; font-weight: 800; margin-bottom: 1rem; }
    .item-chips { display: flex; flex-wrap: wrap; gap: .5rem; }
    .chip {
      padding: .35rem .9rem; border-radius: 99px; font-size: .85rem; font-weight: 600;
    }
    .chip-living    { background: rgba(34,197,94,.15); color: #86efac; border: 1px solid rgba(34,197,94,.3); }
    .chip-nonliving { background: rgba(100,116,139,.15); color: #cbd5e1; border: 1px solid rgba(100,116,139,.3); }

    /* ── Canvas Interactive ── */
    #drag-canvas-area {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.4rem;
      user-select: none;
    }
    .drag-instructions {
      text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 1rem;
    }
    .drag-zones {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;
    }
    .drop-zone {
      min-height: 140px; border-radius: 14px; border: 2px dashed;
      padding: .75rem; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start; gap: .5rem;
    }
    .drop-zone.living-zone   { border-color: rgba(34,197,94,.5); background: rgba(34,197,94,.05); }
    .drop-zone.nonliving-zone{ border-color: rgba(100,116,139,.5); background: rgba(100,116,139,.05); }
    .drop-zone h4 { font-size: 1rem; font-weight: 700; margin-bottom: .4rem; }
    .drop-zone.living-zone h4   { color: var(--primary); }
    .drop-zone.nonliving-zone h4{ color: #94a3b8; }
    .dropped-items { display: flex; flex-wrap: wrap; gap: .4rem; min-height: 36px; width: 100%; }
    .dropped-chip {
      padding: .3rem .7rem; border-radius: 99px; font-size: .82rem; font-weight: 600;
      cursor: pointer;
    }
    .dropped-chip.correct   { background: rgba(34,197,94,.25); color: #86efac; border: 1px solid rgba(34,197,94,.5); }
    .dropped-chip.incorrect { background: rgba(248,113,113,.2); color: #fca5a5; border: 1px solid rgba(248,113,113,.4); }
    .draggables { display: flex; flex-wrap: wrap; gap: .6rem; }
    .draggable-item {
      padding: .4rem 1rem; border-radius: 99px; font-size: .88rem; font-weight: 600;
      cursor: grab; background: rgba(56,189,248,.12); border: 1px solid rgba(56,189,248,.35);
      color: var(--secondary); transition: transform .15s, opacity .15s;
    }
    .draggable-item:active { cursor: grabbing; transform: scale(1.08); }
    .draggable-item.placed { opacity: .4; pointer-events: none; }
    #drag-feedback {
      text-align: center; min-height: 2rem; font-weight: 700; font-size: 1rem;
      margin-top: .75rem; transition: all .3s;
    }
    #drag-score { text-align: center; color: var(--muted); font-size: .85rem; margin-top: .4rem; }

    /* ── Canvas Game ── */
    #living-canvas {
      width: 100%; border-radius: var(--r);
      border: 1px solid var(--border); background: var(--card);
      cursor: default;
    }

    /* ── Video Section ── */
    .video-wrap {
      position: relative; width: 100%; padding-top: 56.25%;
      border-radius: var(--r); overflow: hidden;
      background: #000; box-shadow: 0 0 40px rgba(34,197,94,.15);
    }
    .video-wrap video { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* ── Quiz ── */
    .quiz-block {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.5rem 1.8rem; margin-bottom: 1.4rem;
    }
    .quiz-q { font-size: 1.05rem; font-weight: 700; margin-bottom: 1rem; }
    .quiz-options { display: flex; flex-direction: column; gap: .55rem; }
    .quiz-opt {
      padding: .65rem 1rem; border-radius: 10px; font-size: .9rem; cursor: pointer;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      transition: all .2s; display: flex; gap: .6rem; align-items: flex-start;
    }
    .quiz-opt:hover { border-color: var(--secondary); background: rgba(56,189,248,.08); }
    .quiz-opt.correct   { border-color: var(--primary)!important; background: rgba(34,197,94,.12)!important; color: #86efac; }
    .quiz-opt.incorrect { border-color: var(--danger)!important; background: rgba(248,113,113,.12)!important; color: #fca5a5; }
    .quiz-opt.disabled  { pointer-events: none; }
    .quiz-explain {
      display: none; margin-top: .9rem; padding: .75rem 1rem;
      border-radius: 10px; background: rgba(250,204,21,.08);
      border: 1px solid rgba(250,204,21,.25); color: #fef9c3; font-size: .88rem;
    }
    .quiz-explain.show { display: block; }

    /* ── True/False Practice ── */
    .tf-item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.2rem 1.5rem; margin-bottom: 1rem;
    }
    .tf-q { font-weight: 600; margin-bottom: .75rem; }
    .tf-btns { display: flex; gap: .8rem; }
    .tf-btn {
      padding: .5rem 1.4rem; border-radius: 99px; font-weight: 700;
      cursor: pointer; border: none; font-size: .9rem; transition: all .2s;
    }
    .tf-true  { background: rgba(34,197,94,.15); color: var(--primary); border: 1px solid rgba(34,197,94,.4); }
    .tf-false { background: rgba(248,113,113,.12); color: var(--danger); border: 1px solid rgba(248,113,113,.35); }
    .tf-btn.selected-correct { background: var(--primary)!important; color: #fff; }
    .tf-btn.selected-wrong   { background: var(--danger)!important; color: #fff; }
    .tf-result { display:none; margin-top:.6rem; font-size:.86rem; font-weight:600; }
    .tf-result.show { display:block; }

    /* ── Achievement Badge ── */
    .badge-grid { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
    .badge {
      width: 130px; text-align: center; padding: 1.1rem .8rem;
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      transition: all .3s; cursor: default; opacity: .45;
    }
    .badge.unlocked { opacity: 1; box-shadow: 0 0 18px rgba(34,197,94,.2); border-color: var(--primary); }
    .badge .badge-icon { font-size: 2.2rem; display: block; margin-bottom: .45rem; }
    .badge .badge-name { font-size: .78rem; font-weight: 700; color: var(--muted); }
    .badge.unlocked .badge-name { color: var(--primary); }

    /* ── Section divider ── */
    .divider { border: none; border-top: 1px solid rgba(34,197,94,.12); margin: 0; }

    /* ── Tutor card override colors ── */
    :root {
      --ta-tutor-primary: #22c55e;
      --ta-tutor-bg: rgba(20,40,70,0.95);
    }
  </style>

      <span class="chip chip-nonliving">💧 水</span>
      <span class="chip chip-nonliving">🌬️ 空气</span>

    </div>

  <div class="cards">
    <div class="card">
      <div class="icon">🪨</div>
      <h3>石头不会长大</h3>
      <p>石头是岩石风化而成，不能生长，不需要食物，也不能繁殖。哪怕放一百年也是那块石头。</p>

    <div class="card">
      <div class="icon">💧</div>
      <h3>水没有生命</h3>

    </div>

      <div class="icon">🌬️</div>
      <h3>空气很重要</h3>
      <p>空气是混合气体（主要是氮气和氧气）。动物靠空气呼吸，但空气本身是非生物。</p>
    </div>
    <div class="card">
      <div class="icon">🌍</div>
      <h3>土壤是非生物</h3>
      <p>土壤提供矿物质供植物生长，但土壤本身（矿物颗粒+有机质）是非生物。</p>

    </div>
    <div class="quiz-explain" id="q3-exp">
      ✅ <strong>答案是 A「石头、水、铅笔、空气」</strong>。<br>
      这四样都没有生命特征，是非生物。<br>
      🔑 <strong>错因诊断：</strong>B组有"树"和"蜗牛"是生物；C组有"花""草""鸟"是生物；D组中"蘑菇"是生物（真菌类）。注意蘑菇属于生物！
    </div>
  </div>

  <!-- Q4 -->
  <div class="quiz-block" id="q4">
    <div class="quiz-q" data-tts>4. 植物也是生物，下列哪项能证明这一点？</div>
    <div class="quiz-options">
      <div class="quiz-opt" onclick="answerQ('q4',0)"><span>A</span> 植物有绿色的叶子</div>
      <div class="quiz-opt" onclick="answerQ('q4',1)"><span>B</span> 植物能生长、繁殖和进行光合作用（营养）</div>
      <div class="quiz-opt" onclick="answerQ('q4',2)"><span>C</span> 植物不会跑</div>
      <div class="quiz-opt" onclick="answerQ('q4',3)"><span>D</span> 植物比动物便宜</div>
    </div>
    <div class="quiz-explain" id="q4-exp">
      ✅ <strong>答案是 B</strong>。<br>
      植物能生长（小苗→大树），能繁殖（开花结果产种子），能进行光合作用获取营养，这些都是生物特征。<br>
      🔑 <strong>错因诊断：</strong>颜色（A）和行为（C/D）都不是判断生物的标准。
    </div>
  </div>

  <!-- Q5 -->
  <div class="quiz-block" id="q5">
    <div class="quiz-q" data-tts>5. 小明说"火会动，所以火是生物"，他的说法错在哪里？</div>
    <div class="quiz-options">
      <div class="quiz-opt" onclick="answerQ('q5',0)"><span>A</span> 火根本不会动</div>
      <div class="quiz-opt" onclick="answerQ('q5',1)"><span>B</span> 小明说的没有错</div>
      <div class="quiz-opt" onclick="answerQ('q5',2)"><span>C</span> 会动不等于是生物；火不能繁殖、没有细胞，不具备生物特征</div>
      <div class="quiz-opt" onclick="answerQ('q5',3)"><span>D</span> 因为火的颜色不对</div>
    </div>
    <div class="quiz-explain" id="q5-exp">
      ✅ <strong>答案是 C</strong>。<br>
      判断是否为生物要看是否同时具备多项生命特征，而不只是"会动"。<br>
      🔑 <strong>错因诊断：</strong>「会动」是最常见的误判依据。火会动但不能繁殖、没有细胞结构，不是生物。
    </div>
  </div>
</section>

      <h2>生物与非生物</h2>
      <p>生物能生长、繁殖、呼吸、对外界刺激作出反应，并需要营养；非生物不具备这些生命特征。石头会“长大”其实是沉积或风化造成的假象，火会“吃掉”木头、会“动”，但不会繁殖，因此火不是生物。判断时要对照一整套生命特征，不能只看一两条。</p>
    </div>

<script>

      }
    }
    return pts;
  }

    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>

<script id="scie-depth-js">
function scieDepthCheck(button, isCorrect, feedbackId, explanation) {
  var box = button.closest('.module-check');
  if (!box || box.dataset.answered) return;
  box.dataset.answered = '1';
  box.querySelectorAll('button').forEach(function (item) {
    item.disabled = true;
    if (item.dataset.correct === '1') item.classList.add('correct');
  });
  if (!isCorrect) button.classList.add('wrong');
  var feedback = document.getElementById(feedbackId);
  if (feedback) {
    feedback.style.display = 'block';
    feedback.textContent = (isCorrect ? '正确。' : '再想想。') + explanation;
  }
}
