<circle cx="705.0" cy="209.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="717.0" y="214.0" font-size="13.5" fill="#334155">用新陈代谢解释植物落叶与塑料花不凋谢</text>
<text x="717.0" y="236.0" font-size="13.5" fill="#334155">的区别</text>
<circle cx="705.0" cy="253.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="717.0" y="258.0" font-size="13.5" fill="#334155">对比向日葵（生物）与太阳能板（非生物</text>
