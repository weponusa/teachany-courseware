<circle cx="69.0" cy="165.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="81.0" y="170.0" font-size="13.5" fill="#334155">生物能生长、繁殖、呼吸、对外界刺激作</text>
<text x="81.0" y="192.0" font-size="13.5" fill="#334155">出反应，并需要营养</text>
