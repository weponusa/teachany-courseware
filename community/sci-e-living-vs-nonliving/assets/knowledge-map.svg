<text x="399.0" y="170.0" font-size="13.5" fill="#334155">遇到可疑对象，依次问：会不会生长</text>
<circle cx="387.0" cy="187.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="399.0" y="192.0" font-size="13.5" fill="#334155">常见误区是把“会动”当成生物的充分条件</text>
<text x="399.0" y="214.0" font-size="13.5" fill="#334155">，汽车、河水都会动却不是生物</text>
<circle cx="387.0" cy="231.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="399.0" y="236.0" font-size="13.5" fill="#334155">点击下方任意段落开始收听，可自动连播 </text>
<text x="399.0" y="258.0" font-size="13.5" fill="#334155">· 建议先听再学</text>
