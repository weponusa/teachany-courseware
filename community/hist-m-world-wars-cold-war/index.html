      <h2>两次世界大战与冷战</h2>
      <p>20世纪上半叶两次世界大战重创人类，战后形成美苏两极格局，进入冷战。冷战以对抗为主，有时缓和，局部热战不断。理解现当代史，要抓住战争教训与和平发展主题。</p>

      <h2>方法：热战—两极—冷战特征</h2>
      <p>先对比两次大战影响，再写雅尔塔体系、北约华约、冷战表现（军备竞赛、局部战争等）。</p>
      <div class="worked-example"><strong>范例：</strong>杜鲁门主义等标志冷战开始，世界分裂为两大阵营。</div>
      <p id="lesson-pitfall" class="histm-pitfall"><strong>常见误区：</strong>常见误区是把冷战理解成没有冲突的和平时期。</p>
      <div class="module-check" data-conceptest="true">

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 联合国安理会表决机制：2014年克里米亚危机中，俄罗斯动用一票否决权阻止决议，这正是雅尔塔会议确立的五常机制（1945年）。了解冷战起源就能明白，否决权设计初衷是避免美苏直接冲突，如今仍影响着国际争端解决方式。</p>
<p>2. 核电站技术转化：苏联1954年建成世界首座核电站奥布宁斯克，源自曼哈顿计划（耗资20亿美元）的军事技术民用化。今天全球413座核反应堆中，70%采用压水堆技术，其原型正是美国1953年为潜艇研发的S1W反应堆。</p>
<p>3. 卫星导航系统竞争：GPS（美国1978年首发卫星）与格洛纳斯（苏联1982年部署）的竞争，直接延续自冷战太空竞赛。2023年北斗系统完成组网，全球137个国家使用，这种技术格局正是美苏当年划分势力范围的历史延续。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. 问题：如果1945年罗斯福未逝世，冷战是否可能避免？分析线索：比较杜鲁门与罗斯福对苏政策差异（如1944年百分比协定），注意斯大林在雅尔塔会议后对东欧的实际控制（红军驻军达120个师），再思考个人因素在结构性矛盾中的作用。</p>
<p>2. 问题：核威慑真的维持了"长和平"吗？分析线索：统计1945-1991年局部战争频率（平均每年2.7场），对照核武器数量增长曲线（从2枚到7万枚），比较朝鲜战争与古巴导弹危机中决策者的风险计算方式，注意"相互确保毁灭"理论的实际运作机制。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先看1919年凡尔赛宫镜厅里的矛盾：克莱蒙梭坚持要让德国"世代记住战败"，结果埋下复仇种子——德国失去13%领土、10%人口，却要支付相当于5万吨黄金的赔款。接着经济大萧条袭来，1932年德国失业率飙升至30%，这才让纳粹党得票从1928年2.6%暴涨至1932年37.3%。当1939年9月1日德军闪击波兰时，其实是一战遗留问题与绥靖政策（英国海军条约允许德国保留35%吨位）共同引爆的火药桶。</p>
<p>二战后的雅尔塔体系更值得玩味：罗斯福用联合国安理会否决权换取斯大林对日作战，却不知红军已秘密将缴获的德国V-2导弹技术送往佩内明德。1947年杜鲁门主义出台时，马歇尔正在哈佛演讲中提到"欧洲病人"需要输血，而莫洛托夫立刻组建共产党情报局反击。最讽刺的是柏林墙（1961年修建时全长155公里），它既是冷战的象征，却意外成为阻止核战升级的保险丝——当1989年11月9日民众推倒围墙时，苏联在东德其实仍驻有38万军队，但戈尔巴乔夫的新思维已让坦克发动机彻底熄火。</p>
<p>最后要看清技术如何改写规则：1945年8月6日广岛原子弹当量仅1.5万吨TNT，到1961年苏联测试的"沙皇炸弹"已达5000万吨。但正是这种毁灭能力催生了"恐怖平衡"，使得1962年赫鲁晓夫最终从古巴撤走导弹——因为双方都明白，按当时美苏拥有的核弹头数量（各约3万枚），足够毁灭地球文明10次。今天的我们仍生活在这个历史实验室里，从朝核问题到乌克兰危机，剧本始终带着两次大战与冷战的基因。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 错误表现：认为二战爆发的主要原因是希特勒个人野心。认知根源：学生容易将复杂历史事件简化为个人因素。正确理解：凡尔赛条约的严苛条款（德国赔款1320亿金马克）、1929年经济大萧条（美国GDP下降46%）、绥靖政策（1938年慕尼黑协定）共同构成战争土壤。希特勒只是利用了这些结构性矛盾。</p>
<p>2. 错误表现：混淆冷战"代理人战争"与直接军事冲突。认知根源：对"两极格局"理解表面化。正确理解：朝鲜战争（1950-1953年双方阵亡超200万）本质是美苏通过代理人的较量，而1962年古巴导弹危机（13天核战危机）才是双方直接对峙。冷战期间147场局部战争中，90%属于代理人战争。</p>
<p>3. 错误表现：将马歇尔计划单纯视为人道援助。认知根源：忽视经济手段的政治功能。正确理解：1948-1951年美国向西欧提供131.5亿美元（相当于现在1500亿），要求受援国必须购买美国商品并排挤共产党。该计划使西欧对美贸易依存度从1947年18%升至1951年33%，实质是杜鲁门主义的延伸。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();

function histmDepthCheck(button, isCorrect, feedbackId, explanation) {
  var box = button.closest('.module-check');
  if (!box || box.dataset.answered) return;
  box.dataset.answered = '1';
  box.querySelectorAll('button').forEach(function (item) {
    item.disabled = true;
    if (item.dataset.correct === '1') item.classList.add('correct');
  });
  if (!isCorrect) button.classList.add('wrong');
  var feedback = document.getElementById(feedbackId);
  if (feedback) {
    feedback.style.display = 'block';
    feedback.textContent = (isCorrect ? '正确。' : '再想想。') + explanation;
  }
}
