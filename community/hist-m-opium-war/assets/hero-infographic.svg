<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="180" fill="#b91c1c" opacity="0.08"/>
  <circle cx="90" cy="600" r="150" fill="#f59e0b" opacity="0.07"/>

  <!-- 标题 -->
  <text x="600" y="72" text-anchor="middle" fill="#f8fafc" font-size="40" font-weight="800" font-family="'PingFang SC','Microsoft YaHei',sans-serif">鸦片战争 · 核心数据信息图</text>
  <text x="600" y="112" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1839 — 1842 · 数字看懂中国近代史的开端</text>
  <rect x="480" y="132" width="240" height="4" rx="2" fill="url(#red)"/>

  <!-- 卡片 1：白银外流 -->
  <g>
    <rect x="60" y="170" width="340" height="200" rx="16" fill="#0f172a" stroke="#b91c1c" stroke-width="2"/>
    <rect x="60" y="170" width="340" height="6" rx="3" fill="url(#red)"/>
    <text x="90" y="222" fill="#94a3b8" font-size="17" font-family="'PingFang SC','Microsoft YaHei',sans-serif">白银年流失（1839年前）</text>
    <text x="90" y="292" fill="#ef4444" font-size="56" font-weight="800" font-family="'PingFang SC','Microsoft YaHei',sans-serif">600<tspan font-size="26" fill="#f8fafc"> 万两</tspan></text>
    <text x="90" y="332" fill="#cbd5e1" font-size="15" font-family="'PingFang SC','Microsoft YaHei',sans-serif">相当于清政府年财政收入的 1/10</text>
    <text x="90" y="356" fill="#64748b" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">鸦片贸易让中英贸易由逆差转为顺差</text>
  </g>

  <!-- 卡片 2：鸦片输入 -->
  <g>
    <rect x="430" y="170" width="340" height="200" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <rect x="430" y="170" width="340" height="6" rx="3" fill="url(#gold)"/>
    <text x="460" y="222" fill="#94a3b8" font-size="17" font-family="'PingFang SC','Microsoft YaHei',sans-serif">鸦片年输入（1838年）</text>
    <text x="460" y="292" fill="#f59e0b" font-size="56" font-weight="800" font-family="'PingFang SC','Microsoft YaHei',sans-serif">40200<tspan font-size="26" fill="#f8fafc"> 箱</tspan></text>
    <text x="460" y="332" fill="#cbd5e1" font-size="15" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1820 年仅 4000 箱，18 年翻 10 倍</text>
    <text x="460" y="356" fill="#64748b" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全国吸食者超过 200 万人</text>
  </g>

  <!-- 卡片 3：虎门销烟 -->
  <g>
    <rect x="800" y="170" width="340" height="200" rx="16" fill="#0f172a" stroke="#0d9488" stroke-width="2"/>
    <rect x="800" y="170" width="340" height="6" rx="3" fill="#0d9488"/>
    <text x="830" y="222" fill="#94a3b8" font-size="17" font-family="'PingFang SC','Microsoft YaHei',sans-serif">虎门销烟（1839.6）</text>
    <text x="830" y="292" fill="#2dd4bf" font-size="56" font-weight="800" font-family="'PingFang SC','Microsoft YaHei',sans-serif">237<tspan font-size="26" fill="#f8fafc"> 万斤</tspan></text>
    <text x="830" y="332" fill="#cbd5e1" font-size="15" font-family="'PingFang SC','Microsoft YaHei',sans-serif">历时 23 天 · 海水浸化法销毁</text>
    <text x="830" y="356" fill="#64748b" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">林则徐主持 · 战争直接导火索</text>
  </g>

  <!-- 卡片 4：南京条约赔款 -->
  <g>
    <rect x="60" y="410" width="340" height="200" rx="16" fill="#0f172a" stroke="#b91c1c" stroke-width="2"/>
    <rect x="60" y="410" width="340" height="6" rx="3" fill="url(#red)"/>
    <text x="90" y="462" fill="#94a3b8" font-size="17" font-family="'PingFang SC','Microsoft YaHei',sans-serif">《南京条约》赔款（1842）</text>
    <text x="90" y="532" fill="#ef4444" font-size="56" font-weight="800" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2100<tspan font-size="26" fill="#f8fafc"> 万银元</tspan></text>
    <text x="90" y="572" fill="#cbd5e1" font-size="15" font-family="'PingFang SC','Microsoft YaHei',sans-serif">烟价 600 万 + 军费 1200 万 + 商欠 300 万</text>
    <text x="90" y="596" fill="#64748b" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">相当于清政府年收入的 1/3</text>
  </g>

  <!-- 卡片 5：五口通商 -->
  <g>
    <rect x="430" y="410" width="340" height="200" rx="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="430" y="410" width="340" height="6" rx="3" fill="#8b5cf6"/>
    <text x="460" y="462" fill="#94a3b8" font-size="17" font-family="'PingFang SC','Microsoft YaHei',sans-serif">五口通商</text>
    <text x="460" y="532" fill="#a78bfa" font-size="56" font-weight="800" font-family="'PingFang SC','Microsoft YaHei',sans-serif">5<tspan font-size="26" fill="#f8fafc"> 个口岸</tspan></text>
    <text x="460" y="572" fill="#cbd5e1" font-size="15" font-family="'PingFang SC','Microsoft YaHei',sans-serif">广州 · 厦门 · 福州 · 宁波 · 上海</text>
    <text x="460" y="596" fill="#64748b" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">东南沿海门户从此洞开</text>
  </g>

  <!-- 卡片 6：协定关税 -->
  <g>
    <rect x="800" y="410" width="340" height="200" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <rect x="800" y="410" width="340" height="6" rx="3" fill="url(#gold)"/>
    <text x="830" y="462" fill="#94a3b8" font-size="17" font-family="'PingFang SC','Microsoft YaHei',sans-serif">协定关税税率（1843）</text>
    <text x="830" y="532" fill="#f59e0b" font-size="56" font-weight="800" font-family="'PingFang SC','Microsoft YaHei',sans-serif">5<tspan font-size="26" fill="#f8fafc"> %</tspan></text>
    <text x="830" y="572" fill="#cbd5e1" font-size="15" font-family="'PingFang SC','Microsoft YaHei',sans-serif">原粤海关税率 16%—40%</text>
    <text x="830" y="596" fill="#64748b" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中国关税自主权从此丧失</text>
  </g>

  <!-- 底部结论 -->
  <text x="600" y="652" text-anchor="middle" fill="#94a3b8" font-size="16" font-family="'PingFang SC','Microsoft YaHei',sans-serif">从白银外流到主权丧失 —— 中国开始沦为半殖民地半封建社会</text>
</svg>
