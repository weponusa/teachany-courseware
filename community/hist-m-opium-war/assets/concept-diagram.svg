<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <circle cx="1130" cy="560" r="170" fill="#b91c1c" opacity="0.08"/>

  <text x="600" y="66" text-anchor="middle" fill="#f8fafc" font-size="38" font-weight="800" font-family="'PingFang SC','Microsoft YaHei',sans-serif">鸦片战争 · 因果结构图</text>
  <text x="600" y="104" text-anchor="middle" fill="#94a3b8" font-size="17" font-family="'PingFang SC','Microsoft YaHei',sans-serif">从工业革命到社会性质变化 —— 一条完整的因果链</text>
  <rect x="490" y="122" width="220" height="4" rx="2" fill="#b91c1c"/>

  <!-- 节点样式：上排 4 个，下排 3 个 -->
  <!-- 1 工业革命 -->
  <g>
    <rect x="50" y="170" width="240" height="110" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <text x="170" y="208" text-anchor="middle" fill="#60a5fa" font-size="20" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">英国工业革命</text>
    <text x="170" y="238" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">生产力暴涨 · 商品过剩</text>
    <text x="170" y="260" text-anchor="middle" fill="#64748b" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">急需海外市场与原料</text>
  </g>
  <!-- 2 贸易逆差 -->
  <g>
    <rect x="350" y="170" width="240" height="110" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="470" y="208" text-anchor="middle" fill="#fbbf24" font-size="20" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中英贸易逆差</text>
    <text x="470" y="238" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">年进口茶叶 3000 万磅</text>
    <text x="470" y="260" text-anchor="middle" fill="#64748b" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">英货滞销 · 年逆差 300 万两</text>
  </g>
  <!-- 3 鸦片走私 -->
  <g>
    <rect x="650" y="170" width="240" height="110" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="770" y="208" text-anchor="middle" fill="#fbbf24" font-size="20" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">鸦片走私泛滥</text>
    <text x="770" y="238" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">4000 箱 → 40200 箱</text>
    <text x="770" y="260" text-anchor="middle" fill="#64748b" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">年掠白银 600 万两</text>
  </g>
  <!-- 4 虎门销烟 -->
  <g>
    <rect x="950" y="170" width="200" height="110" rx="14" fill="#0f172a" stroke="#0d9488" stroke-width="2"/>
    <text x="1050" y="208" text-anchor="middle" fill="#2dd4bf" font-size="20" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">虎门销烟</text>
    <text x="1050" y="238" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1839.6 · 237 万斤</text>
    <text x="1050" y="260" text-anchor="middle" fill="#64748b" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">直接导火索</text>
  </g>

  <!-- 上排箭头 -->
  <line x1="290" y1="225" x2="344" y2="225" stroke="#ef4444" stroke-width="3" marker-end="url(#arr)"/>
  <text x="317" y="212" text-anchor="middle" fill="#ef4444" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开拓市场</text>
  <line x1="590" y1="225" x2="644" y2="225" stroke="#ef4444" stroke-width="3" marker-end="url(#arr)"/>
  <text x="617" y="212" text-anchor="middle" fill="#ef4444" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">扭转逆差</text>
  <line x1="890" y1="225" x2="944" y2="225" stroke="#ef4444" stroke-width="3" marker-end="url(#arr)"/>
  <text x="917" y="212" text-anchor="middle" fill="#ef4444" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">严禁鸦片</text>

  <!-- 转折箭头：虎门销烟 → 鸦片战争（向下） -->
  <path d="M1050 280 L1050 330 L700 360" fill="none" stroke="#ef4444" stroke-width="3" marker-end="url(#arr)"/>
  <text x="900" y="322" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">英国借口发动战争（1840.6）</text>

  <!-- 下排节点（从右到左） -->
  <!-- 5 鸦片战争 -->
  <g>
    <rect x="580" y="360" width="240" height="110" rx="14" fill="#0f172a" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="700" y="398" text-anchor="middle" fill="#ef4444" font-size="20" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">鸦片战争</text>
    <text x="700" y="428" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1840.6 — 1842.8</text>
    <text x="700" y="450" text-anchor="middle" fill="#64748b" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两阶段作战 · 清军战败</text>
  </g>
  <!-- 6 南京条约 -->
  <g>
    <rect x="290" y="360" width="240" height="110" rx="14" fill="#0f172a" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="410" y="398" text-anchor="middle" fill="#ef4444" font-size="20" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">《南京条约》</text>
    <text x="410" y="428" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1842.8.29 · 第一个不平等条约</text>
    <text x="410" y="450" text-anchor="middle" fill="#64748b" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">割地 · 赔款 · 五口 · 协定关税</text>
  </g>
  <!-- 7 社会性质变化 -->
  <g>
    <rect x="20" y="360" width="220" height="110" rx="14" fill="#1c1917" stroke="#ef4444" stroke-width="3"/>
    <text x="130" y="398" text-anchor="middle" fill="#f87171" font-size="19" font-weight="800" font-family="'PingFang SC','Microsoft YaHei',sans-serif">社会性质变化</text>
    <text x="130" y="428" text-anchor="middle" fill="#fca5a5" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开始沦为半殖民地</text>
    <text x="130" y="450" text-anchor="middle" fill="#fca5a5" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">半封建社会</text>
  </g>

  <!-- 下排箭头（从右向左） -->
  <line x1="580" y1="415" x2="536" y2="415" stroke="#ef4444" stroke-width="3" marker-end="url(#arr)"/>
  <text x="558" y="402" text-anchor="middle" fill="#ef4444" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">战败签约</text>
  <line x1="290" y1="415" x2="246" y2="415" stroke="#ef4444" stroke-width="3" marker-end="url(#arr)"/>
  <text x="268" y="402" text-anchor="middle" fill="#ef4444" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">主权丧失</text>

  <!-- 根本原因标注 -->
  <rect x="50" y="540" width="700" height="52" rx="10" fill="#b91c1c" opacity="0.15"/>
  <text x="70" y="572" fill="#fca5a5" font-size="16" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">根本原因：英国工业革命后急需打开中国市场 ｜ 直接原因（导火索）：1839 年虎门销烟</text>

  <!-- 影响标注 -->
  <rect x="50" y="608" width="700" height="52" rx="10" fill="#f59e0b" opacity="0.12"/>
  <text x="70" y="640" fill="#fcd34d" font-size="16" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">影响：中国近代史的开端 · 自然经济开始解体 · 魏源提出"师夷长技以制夷"</text>

  <!-- 右侧结论框 -->
  <rect x="800" y="540" width="350" height="120" rx="14" fill="#0f172a" stroke="#b91c1c" stroke-width="2"/>
  <text x="975" y="578" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一句话记忆</text>
  <text x="975" y="610" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">半殖民地 = 主权不完整（政治）</text>
  <text x="975" y="636" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="'PingFang SC','Microsoft YaHei',sans-serif">半封建 = 经济开始变化（经济）</text>
</svg>
