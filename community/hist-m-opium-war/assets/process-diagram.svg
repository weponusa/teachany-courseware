<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg3)"/>
  <circle cx="110" cy="110" r="160" fill="#b91c1c" opacity="0.08"/>

  <text x="600" y="66" text-anchor="middle" fill="#f8fafc" font-size="38" font-weight="800" font-family="'PingFang SC','Microsoft YaHei',sans-serif">鸦片战争 · 战争进程时间线</text>
  <text x="600" y="104" text-anchor="middle" fill="#94a3b8" font-size="17" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1839.6 虎门销烟 → 1842.8 《南京条约》· 三年战事一目了然</text>
  <rect x="490" y="122" width="220" height="4" rx="2" fill="#b91c1c"/>

  <!-- 时间轴主线 -->
  <rect x="80" y="330" width="1040" height="6" rx="3" fill="url(#tl)"/>

  <!-- 节点 1：虎门销烟 1839.6（上） -->
  <g>
    <circle cx="140" cy="333" r="12" fill="#0d9488" stroke="#f8fafc" stroke-width="3"/>
    <rect x="50" y="190" width="180" height="110" rx="12" fill="#0f172a" stroke="#0d9488" stroke-width="2"/>
    <text x="140" y="220" text-anchor="middle" fill="#2dd4bf" font-size="18" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1839.6</text>
    <text x="140" y="248" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">虎门销烟</text>
    <text x="140" y="272" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">林则徐销毁鸦片</text>
    <text x="140" y="290" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">237 万斤 · 23 天</text>
    <line x1="140" y1="300" x2="140" y2="318" stroke="#0d9488" stroke-width="2"/>
  </g>

  <!-- 节点 2：战争爆发 1840.6（下） -->
  <g>
    <circle cx="300" cy="333" r="12" fill="#b91c1c" stroke="#f8fafc" stroke-width="3"/>
    <rect x="210" y="380" width="180" height="110" rx="12" fill="#0f172a" stroke="#b91c1c" stroke-width="2"/>
    <text x="300" y="410" text-anchor="middle" fill="#ef4444" font-size="18" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1840.6</text>
    <text x="300" y="438" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">战争爆发</text>
    <text x="300" y="462" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">英舰封锁珠江口</text>
    <text x="300" y="480" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">主力沿海北上</text>
    <line x1="300" y1="348" x2="300" y2="378" stroke="#b91c1c" stroke-width="2"/>
  </g>

  <!-- 节点 3：定海失守 1840.7（上） -->
  <g>
    <circle cx="460" cy="333" r="12" fill="#b91c1c" stroke="#f8fafc" stroke-width="3"/>
    <rect x="370" y="190" width="180" height="110" rx="12" fill="#0f172a" stroke="#b91c1c" stroke-width="2"/>
    <text x="460" y="220" text-anchor="middle" fill="#ef4444" font-size="18" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1840.7</text>
    <text x="460" y="248" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">定海失守</text>
    <text x="460" y="272" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">英军攻占第一座县城</text>
    <text x="460" y="290" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">控制长江出海口</text>
    <line x1="460" y1="300" x2="460" y2="318" stroke="#b91c1c" stroke-width="2"/>
  </g>

  <!-- 节点 4：大沽口谈判 1840.8（下） -->
  <g>
    <circle cx="620" cy="333" r="12" fill="#f59e0b" stroke="#f8fafc" stroke-width="3"/>
    <rect x="530" y="380" width="180" height="110" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="620" y="410" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1840.8</text>
    <text x="620" y="438" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">大沽口谈判</text>
    <text x="620" y="462" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">琦善与英军议和</text>
    <text x="620" y="480" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">林则徐被革职</text>
    <line x1="620" y1="348" x2="620" y2="378" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <!-- 节点 5：强占香港 1841.1（上） -->
  <g>
    <circle cx="780" cy="333" r="12" fill="#b91c1c" stroke="#f8fafc" stroke-width="3"/>
    <rect x="690" y="190" width="180" height="110" rx="12" fill="#0f172a" stroke="#b91c1c" stroke-width="2"/>
    <text x="780" y="220" text-anchor="middle" fill="#ef4444" font-size="18" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1841.1</text>
    <text x="780" y="248" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">强占香港岛</text>
    <text x="780" y="272" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">《穿鼻草约》</text>
    <text x="780" y="290" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">琦善被锁拿进京</text>
    <line x1="780" y1="300" x2="780" y2="318" stroke="#b91c1c" stroke-width="2"/>
  </g>

  <!-- 节点 6：扩大侵略 1841.8（下） -->
  <g>
    <circle cx="940" cy="333" r="12" fill="#b91c1c" stroke="#f8fafc" stroke-width="3"/>
    <rect x="850" y="380" width="180" height="110" rx="12" fill="#0f172a" stroke="#b91c1c" stroke-width="2"/>
    <text x="940" y="410" text-anchor="middle" fill="#ef4444" font-size="18" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1841.8 — 1842.7</text>
    <text x="940" y="438" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">扩大侵略</text>
    <text x="940" y="462" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">厦门·定海·镇海·吴淞</text>
    <text x="940" y="480" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">镇江血战 · 溯江而上</text>
    <line x1="940" y1="348" x2="940" y2="378" stroke="#b91c1c" stroke-width="2"/>
  </g>

  <!-- 节点 7：南京条约 1842.8（上，终点高亮） -->
  <g>
    <circle cx="1080" cy="333" r="14" fill="#ef4444" stroke="#fbbf24" stroke-width="4"/>
    <rect x="990" y="180" width="190" height="120" rx="12" fill="#1c1917" stroke="#ef4444" stroke-width="3"/>
    <text x="1085" y="212" text-anchor="middle" fill="#f87171" font-size="19" font-weight="800" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1842.8.29</text>
    <text x="1085" y="242" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">《南京条约》</text>
    <text x="1085" y="266" text-anchor="middle" fill="#fca5a5" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第一个不平等条约</text>
    <text x="1085" y="286" text-anchor="middle" fill="#fca5a5" font-size="13" font-family="'PingFang SC','Microsoft YaHei',sans-serif">近代史开端</text>
    <line x1="1080" y1="300" x2="1080" y2="316" stroke="#ef4444" stroke-width="2"/>
  </g>

  <!-- 阶段标注 -->
  <rect x="80" y="540" width="500" height="46" rx="10" fill="#0d9488" opacity="0.15"/>
  <text x="100" y="569" fill="#5eead4" font-size="15" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第一阶段（1840.6—1841.1）：封锁珠江口 → 定海 → 大沽口谈判</text>
  <rect x="620" y="540" width="500" height="46" rx="10" fill="#b91c1c" opacity="0.18"/>
  <text x="640" y="569" fill="#fca5a5" font-size="15" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第二阶段（1841.8—1842.8）：厦门 → 吴淞 → 镇江 → 江宁签约</text>

  <text x="600" y="636" text-anchor="middle" fill="#94a3b8" font-size="16" font-family="'PingFang SC','Microsoft YaHei',sans-serif">战败根源：武器代差 + 指挥腐朽 + 国库空虚（仅存 1032 万两）—— 落后就要挨打</text>
</svg>
