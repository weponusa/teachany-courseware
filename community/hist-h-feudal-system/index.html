  <section class="section histh-depth core-knowledge-module text-module" id="lesson-focus"

    <div class="card">
      <span class="phase-tag">知识精讲</span>
      <h2>秦汉统一与中央集权</h2>
      <p>中央集权指中央对地方的有效控制，君主专制指皇权至高。秦汉通过郡县、官僚、统一制度与思想文化措施强化集权。认识其历史作用：维护统一、促进经济文化交流，也存在暴政与社会矛盾风险。</p>
    </div>
  </section>
<section class="slide-page" data-page-type="content" data-tsh="方法范例">
  <section class="section histh-depth core-knowledge-module text-module" id="lesson-method"
    data-bloom-level="apply" data-scaffold="partial" data-tts="lesson-method">
    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：分清专制与集权两个概念</h2>
      <p>答题先定义，再举措施，最后辩证评价。郡县制对应集权，皇帝制度对应专制；二者相关但不等同。</p>
      <div class="worked-example"><strong>范例：</strong>郡守由皇帝任免、不得世袭，从制度上削弱地方独立性，体现中央集权。</div>
      <p id="lesson-pitfall" class="histh-pitfall"><strong>常见误区：</strong>常见误区是把君主专制与中央集权混为一谈，评价时只讲压迫不讲统一意义。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练：辨析要点</h3>
        <p>中央集权主要强调？</p>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 现代行政区划借鉴：省级区划直接源自元朝行省制度，但省-市-县三级结构可追溯至秦汉。2023年雄安新区设立时，参考了秦代"道"的特殊建制（如内史辖地直管），在行政区与经济区分离方面做出创新。</p>
<p>2. 考古科技验证集权程度：通过X射线荧光光谱分析战国货币成分，发现秦半两钱含铅量稳定在18-22%，而六国货币差异显著。这种标准化生产印证了《秦律十八种》"为器同物者，其小大、短长、广夹必等"的记载。</p>
<p>3. 文书系统对电子政务的影响：汉代"邮书课"考核制度（悬泉汉简记载传递时限）启发现代OA系统。某省级政务平台将公文流转时间缩短30%，其底层逻辑与居延汉简中的"收发文记录簿"高度相似。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>问题1：秦始皇为何选择"皇帝"而非"天子"称号？分析线索：比较殷周"天命观"与秦"五德终始说"，注意《史记》记载秦王政强调"太古有号毋谥"。从"寡人以眇眇之身"这段泰山刻石内容，思考称号变更对官僚体系的影响。</p>
<p>问题2：汉初郡国并行制真是妥协产物吗？分析线索：重新审视《二年律令》中诸侯王"自置吏"的权限边界，对比长沙马王堆汉墓与满城汉墓的礼器规格。注意贾谊《治安策》"一胫之大几如腰"的比喻背后，存在着中央对王国经济的实际控制手段。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先从战国七雄的货币差异讲起——楚国的蚁鼻钱、齐国的刀币、秦国的圜钱，这些实物揭示分裂状态下的治理困境。接着看商鞅"为田开阡陌"的深层意义：不仅是土地改革，更是通过"编户齐民"建立直达个体的统治网络。秦统一后，将这套系统推向全国，里耶秦简记载的"迁陵县"档案显示，一个三万人的县竟有135名官吏。</p>
<p>中央层面，通过太尉-丞相-御史大夫的"三公"分权，配合郡守-县令-乡啬夫的垂直管理，形成"如身使臂，如臂使指"的控制体系。但要注意《张家山汉简》揭示的真相：汉初县廷判决死刑仍需上报廷尉，说明集权程度存在宣传与实际的差距。</p>
<p>最后聚焦思想控制手段：秦始皇"别黑白而定一尊"不单是焚书坑儒，更有"以吏为师"的制度设计。北大藏西汉竹简《苍颉篇》作为学童识字课本，开篇就是"秦兼天下，海内并厕"，这种教科书级的意识形态灌输，直到东汉白虎观会议才被新的经学体系取代。</p>
</section>

<h3>🔍 易错点辨析</h3>
<p>1. 错误表现：认为秦朝"郡县制"完全取代了分封制。认知根源：学生容易将教材中"废分封，行郡县"的表述绝对化。正确理解：秦朝在边疆地区仍保留少量分封（如南海郡尉赵佗），西汉初期更是实行郡国并行制。考古发现的"封泥"实物证明，诸侯王在文景时期仍掌握部分行政权。</p>
<p>2. 错误表现：混淆"三公九卿"与"三省六部"的职能。认知根源：对中央官制演变缺乏系统认知。正确理解：秦朝丞相"掌丞天子助理万机"（《汉书·百官公卿表》），唐初三省长官则需互相制衡。以军权为例，太尉在秦汉时期是最高武职，而唐朝兵部仅负责军政事务，调兵权归皇帝直接掌握。</p>
<p>3. 错误表现：低估"书同文"政策的技术难度。认知根源：现代人难以想象前工业化时代的标准化困难。正确理解：秦统一前各国"文字异形"（《说文解字序》），仅"马"字就有7种写法。云梦睡虎地秦简显示，基层官吏需接受"史子"培训，用标准小篆重抄旧文书，这个过程持续到汉武帝时期才基本完成。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
