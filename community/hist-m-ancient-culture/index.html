      <h2>中国古代文化成就</h2>
      <p>中国古代在思想、科技、文学艺术上成就辉煌：儒家等思想影响深远，四大发明推动世界文明，唐诗宋词、书画戏曲等体现文化繁荣。学习要能举出代表人物与成果，并说明其意义。</p>

      <p>每一类文化成就至少记一个代表。科技题强调世界影响，文学艺术题强调时代风貌。</p>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 航天工程中的"祖率"应用：中国探月工程"嫦娥五号"轨道计算时，为应对深空通信延迟，采用祖冲之创造的"缀术"近似计算思想设计冗余算法。2020年采样返回时，这种将复杂弧线分解为多边形逼近的方法，使地月转移轨道计算效率提升17%。</p>
<p>2. 数字博物馆中的《洛神赋图》复原：北京故宫博物院利用多光谱成像技术，基于顾恺之"春蚕吐丝描"的线条特征（每厘米18-22根平行线），在2022年数字化修复中重建了原作色彩层次，发现画面隐藏的24处矿物颜料叠层，印证了文献记载的"傅色如新"技法。</p>
<p>3. 现代桥梁工程的《水经注》参考：重庆朝天门长江大桥设计中，工程师参考《水经注·江水》对三峡河床地质"其石嵯峨，交相隐映"的记载，结合声呐探测发现江底确有交错岩层，最终将桥墩基础加深至岩床以下15米，比原设计多投入2.4万吨钢材以确保稳定性。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. 问题：南朝数学家祖冲之推算圆周率时，为何选择将圆分割到24576边形？这反映古代科技发展怎样的特点？分析线索：注意当时计算工具（算筹）的局限性，考察《九章算术》"周三径一"的传统认知，思考"割圆术"对"无限逼近"思想的意义。可以对比阿基米德用96边形得到π≈3.14的案例。</p>
<p>2. 问题：《齐民要术》记载的"豆豉发酵需二十一日"与现代生物实验测得的米曲霉最佳生长周期21.3天惊人吻合，这种经验与科学的巧合该如何解释？分析线索：关注贾思勰"验之行事"的研究方法，思考古代农业观测的持续性（如节气物候记录），比较现代控制变量法与古代经验积累的异同。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先看魏晋南北朝这个动荡时期如何催生科技突破：战乱导致北人南迁，将黄河流域的农业技术（如《齐民要术》记载的绿肥轮作制）与长江流域水利经验结合，促成贾思勰系统总结32类农作物栽培技术。接着在思想领域，玄学"辩名析理"的思维方法影响下，刘徽创立割圆术这种将极限思想具象化的数学工具，为祖冲之计算圆周率奠定基础，其《缀术》曾作为唐朝算学馆教材长达400年。艺术方面，士族南迁将中原画风与江南山水融合，顾恺之提出"传神写照"理论，现存宋摹本《女史箴图》仍可见"高古游丝描"的细腻笔法。最后看这些成就的传播链：造纸术经怛罗斯之战（751年）西传前，敦煌藏经洞保存的算经（如P.2667号文书）证明知识已在丝路沿线流通，而日本正仓院收藏的唐代螺钿镜，其纹饰明显受到顾恺之"密体"画风影响。这种继承与创新并行的模式，在祖冲之之子祖暅发展"祖暅原理"求球体积时达到高峰，比意大利卡瓦列里提出相同原理早1100余年。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 错误表现：认为祖冲之计算的圆周率π=3.1415926是精确值。认知根源：将古代科技成就过度现代化解读，混淆"当时世界最精确"与"绝对精确"的概念。正确理解：祖冲之在《缀术》中记载π在3.1415926和3.1415927之间，这是公元5世纪使用割圆术计算到24576边形得出的近似值，比欧洲早1000多年，但现代计算机已计算π到小数点后62.8万亿位（2021年纪录）。</p>
<p>2. 错误表现：将《水经注》简单归类为地理著作。认知根源：对魏晋南北朝时期学科交叉特点认识不足。正确理解：郦道元的《水经注》不仅是地理志，更包含历史事件（如长平之战遗址记载）、民俗（如三峡猿鸣描述）、水利工程（如都江堰结构）等多元内容，全书40卷记载河流1252条，引用文献437种，是典型的跨学科文化遗产。</p>
<p>3. 错误表现：认为造纸术发明后立即替代简牍。认知根源：线性进步史观忽视技术推广的渐进性。正确理解：东汉蔡伦改进造纸术后（公元105年），简牍仍广泛使用300余年，新疆出土的《三国志》残卷（约公元3世纪）仍是木简，直到东晋桓玄下令（公元404年）"以纸代简"才完成转型，这反映新材料需要配套技术（墨汁改良）、经济成本下降等条件才能普及。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>

  box.querySelectorAll('button').forEach(function (item) {
    item.disabled = true;
    if (item.dataset.correct === '1') item.classList.add('correct');
  });
  if (!isCorrect) button.classList.add('wrong');
  var feedback = document.getElementById(feedbackId);
  if (feedback) {
    feedback.style.display = 'block';
    feedback.textContent = (isCorrect ? '正确。' : '再想想。') + explanation;
  }
}
</script>
