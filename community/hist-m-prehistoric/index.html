  <section class="section histm-depth core-knowledge-module text-module" id="lesson-focus"
    data-bloom-level="understand" data-scaffold="full" data-tts="lesson-focus">
    <div class="card">
      <span class="phase-tag">知识精讲</span>
      <h2>史前时期：从远古人类到农耕聚落</h2>
      <p>中国境内远古人类遗址说明我国是早期人类活动的重要地区。北京人会使用打制石器与火；河姆渡、半坡等新石器文化已种植作物、制作陶器，过定居生活。学习时要区分旧石器与新石器，并用考古发现说明人类进步。</p>
    </div>
  </section>
<section class="slide-page" data-page-type="content" data-tsh="方法范例">
  <section class="section histm-depth core-knowledge-module text-module" id="lesson-method"
    data-bloom-level="apply" data-scaffold="partial" data-tts="lesson-method">
    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：工具—用火—定居三条线</h2>
      <p>记史前人先抓：用什么工具、会不会用火、是否农耕定居。材料优先看遗址与器物，传说只能作辅助。</p>
      <div class="worked-example"><strong>范例：</strong>北京人用打制石器、会用火；河姆渡种水稻、半坡种粟，反映南北不同的早期农业。</div>
      <p id="lesson-pitfall" class="histm-pitfall"><strong>常见误区：</strong>常见误区是把神话传说直接当成考古事实，或分不清旧石器与新石器。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练：辨析要点</h3>
        <p>半坡居民主要从事？</p>
        <button type="button" data-correct="0" onclick="histmDepthCheck(this,false,&#x27;histm-depth-feedback&#x27;,&quot;半坡属于新石器时代农耕聚落。&quot;)">A. 远洋贸易</button><button type="button" data-correct="1" onclick="histmDepthCheck(this,true,&#x27;histm-depth-feedback&#x27;,&quot;半坡属于新石器时代农耕聚落。&quot;)">B. 农耕定居与制陶</button><button type="button" data-correct="0" onclick="histmDepthCheck(this,false,&#x27;histm-depth-feedback&#x27;,&quot;半坡属于新石器时代农耕聚落。&quot;)">C. 大机器工业</button><button type="button" data-correct="0" onclick="histmDepthCheck(this,false,&#x27;histm-depth-feedback&#x27;,&quot;半坡属于新石器时代农耕聚落。&quot;)">D. 蒸汽机发明</button>
        <div class="histm-feedback" id="histm-depth-feedback" role="status"></div>
      </div>
    </div>
  </section>
<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-1"><h2>📖 石器大发现</h2><div class="tu-q"><p><strong>And：</strong>学生见过石头工具图片</p><p><strong>But：</strong>不理解原始人如何靠石头生存</p><p><strong>Therefore：</strong>认识劳动工具决定文明水平</p></div><div class="tu-q"><p>旧石器时代人类用打制石器，比如北京人用砾石做的砍砸器能敲碎动物骨头；新石器时代出现磨制石器，河姆渡出土的骨耜（sì）长18厘米，能高效挖土。从打制到磨制，人类用了约200万年！就像从撕包装进化到用剪刀，劳动效率翻天覆地。</p></div><div class="tu-q"><p>🌍 就像现在用美工刀裁纸比撕纸整齐，半坡人用磨制石刀收割粟米，每亩产量比徒手采集多了5倍。工具进步直接改变生活质量！</p></div><div class="tu-q" data-answer="B"><h3>🏋️ 即练</h3><p>下列哪项是磨制石器特点？</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="易错选A，打制石器才有明显敲击痕">A.边缘有打砸痕迹</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="易错选A，打制石器才有明显敲击痕">B.表面光滑带刃口</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="易错选A，打制石器才有明显敲击痕">C.直接使用天然石块</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="易错选A，打制石器才有明显敲击痕">D.仅用于狩猎</button></div><div class="tu-fb" hidden></div></div></section>
