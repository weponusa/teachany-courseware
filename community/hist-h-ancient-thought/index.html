<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 儒家"中庸"与AI伦理：谷歌DeepMind在2023年机器人伦理设计中，采用"执两用中"原则处理自主性边界问题。当机器人面对医疗急救时，既不完全自主决策（可能出错）也不完全被动等待（延误时机），而是设计出68%自主权+32%人工复核的混合模式，这正是《中庸》"致中和"的现代科技转化。</p>
<p>2. 道家思想与生态修复：都江堰水利工程运用"道法自然"原理，通过鱼嘴分水、飞沙堰排沙等设计实现自动调节。2022年黄河三角洲湿地修复中，工程师参照《庄子·秋水》"因其固然"思想，放弃混凝土堤岸，改用芦苇等本土植物缓流促淤，使鸟类栖息地增加了43%。</p>
<p>3. 法家思维与公司管理：字节跳动采用"循名责实"的OKR考核体系，每个季度对6000+项目进行"效功爵制"式评估。2021年组织架构调整时，参考《韩非子·定法》"术者，因任而授官"原则，将TikTok算法团队重组为17个独立核算的"作战单元"，使迭代速度提升2.7倍。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. 问题：佛教"缘起性空"与量子纠缠现象有何本质区别？引导：比较龙树《中论》"众因缘生法"与量子力学波函数坍缩。注意公元2世纪印度佛教的"空"（śūnyatā）是哲学本体论概念，而海森堡测不准原理属于实证科学范畴。可考察大乘佛教"二谛说"中"世俗谛"与"胜义谛"的分野。</p>
<p>2. 问题：为何法家"以刑去刑"的理想在秦朝未能实现？引导：分析《商君书·画策》"刑重而必得"与睡虎地秦简《法律答问》的实际案例偏差。注意商鞅设想的"刑用于将过"（预防犯罪）与秦后期"劓鼻盈车"的酷吏政治差异。可对比汉武帝时期"春秋决狱"的儒家化修正。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>从春秋战国的礼崩乐坏出发，诸子面对"如何重建秩序"这一核心命题展开思想交锋。儒家孔子以"仁"重构周礼内核，在《论语》中提出"为政以德"的伦理政治观，孟子更将性善论发展为"民贵君轻"的民本思想。与之相对，老子在《道德经》中以"道生一"的宇宙论解构人为规范，庄子用"坐忘"实现精神超越，但黄老之学又将其转化为"无为而治"的治国术。法家则彻底转向现实主义，商鞅"徙木立信"确立法律权威，韩非整合"法、术、势"三要素，秦简《为吏之道》显示其如何细化为行政规程。佛教传入后经历格义阶段，至隋唐形成天台宗"一念三千"等本土化理论。四家思想在斗争中融合：董仲舒用阴阳五行统合儒法，魏晋玄学以道释儒，宋明理学吸收禅宗心性论，最终形成"外儒内法"的中国传统政治文化基因。典型案例是唐太宗既尊儒教（设弘文馆讲《孝经》），又行道家休养生息（贞观年间租庸调税率为1/30），同时完善《唐律疏议》这一法家结晶。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 混淆"仁"与"礼"的关系：学生常将儒家"仁"（内在道德）与"礼"（外在规范）割裂理解。考古发现西周青铜器铭文显示，早期"礼"更多指祭祀仪式，而孔子在《论语·颜渊》中强调"克己复礼为仁"，将二者辩证统一。错误根源在于未理解儒家"内外兼修"的特质，正确认知应如孟子所言"仁义礼智根于心"，礼是仁的外化表现。</p>
<p>2. 道家"无为"等于消极：学生看到《道德经》"无为而无不为"就理解为躺平。马王堆帛书《老子》乙本中"无为"出现12次，均与"自然"（自发性规律）关联。东汉河上公注解说"因物自然，不设不施"，实际是指政府减少干预的治理智慧。错误源于用现代个人主义视角解读古代政治哲学。</p>
<p>3. 法家"法"等同于现代法律：学生将《商君书》"刑过不避大臣"与现代法治混淆。睡虎地秦简记载的"盗马者黥为城旦"（刺面后服筑城劳役）显示，法家之"法"本质是君主工具。商鞅变法时"令民为什伍"的连坐制度，与罗马《十二铜表法》有本质差异，错误源于脱离专制主义中央集权的历史语境。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
