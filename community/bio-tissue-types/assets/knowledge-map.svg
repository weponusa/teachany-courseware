<circle cx="832.2" cy="165.0" r="3.4" fill="#7c3aed" fill-opacity=".85"/>
<text x="844.2" y="170.0" font-size="13.5" fill="#334155">器官是由不同组织有机结合形</text>
<text x="844.2" y="192.0" font-size="13.5" fill="#334155">成的功能单位</text>
<circle cx="832.2" cy="209.0" r="3.4" fill="#7c3aed" fill-opacity=".85"/>
<text x="844.2" y="214.0" font-size="13.5" fill="#334155">每秒向大脑发送约200个疼痛信</text>
<text x="844.2" y="236.0" font-size="13.5" fill="#334155">号</text>
<rect x="1070.6" y="128" width="236.4" height="166" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-opacity=".35" stroke-width="2"/>
