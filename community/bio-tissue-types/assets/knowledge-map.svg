<text x="70.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">组织是什么</text>
<circle cx="69.0" cy="165.0" r="3.4" fill="#7c3aed" fill-opacity=".85"/>
<text x="81.0" y="170.0" font-size="13.5" fill="#334155">组织是由形态相似、功能相同</text>
<text x="81.0" y="192.0" font-size="13.5" fill="#334155">的细胞联合形成的细胞群</text>
<circle cx="69.0" cy="209.0" r="3.4" fill="#7c3aed" fill-opacity=".85"/>
<text x="81.0" y="214.0" font-size="13.5" fill="#334155">一根橘络里可能有上千条管状</text>
<text x="81.0" y="236.0" font-size="13.5" fill="#334155">细胞并排工作</text>
<rect x="307.4" y="128" width="236.4" height="166" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-opacity=".35" stroke-width="2"/>
