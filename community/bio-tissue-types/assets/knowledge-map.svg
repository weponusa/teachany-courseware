<circle cx="577.8" cy="165.0" r="3.4" fill="#7c3aed" fill-opacity=".85"/>
<text x="589.8" y="170.0" font-size="13.5" fill="#334155">不同组织有独特的结构适应其</text>
<text x="589.8" y="192.0" font-size="13.5" fill="#334155">功能</text>
<circle cx="577.8" cy="209.0" r="3.4" fill="#7c3aed" fill-opacity=".85"/>
<text x="589.8" y="214.0" font-size="13.5" fill="#334155">举哑铃时，你的肱二头肌会增</text>
<text x="589.8" y="236.0" font-size="13.5" fill="#334155">粗——这是因为肌肉组织…</text>
