<text x="324.4" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">不同组织再生速度探究</text>
<circle cx="323.4" cy="165.0" r="3.4" fill="#7c3aed" fill-opacity=".85"/>
<text x="335.4" y="170.0" font-size="13.5" fill="#334155">设计实验比较上皮组织与结缔</text>
<text x="335.4" y="192.0" font-size="13.5" fill="#334155">组织的再生速度</text>
