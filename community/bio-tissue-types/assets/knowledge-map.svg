<text x="1087.6" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">深层理解：五镜头</text>
<circle cx="1086.6" cy="165.0" r="3.4" fill="#7c3aed" fill-opacity=".85"/>
<text x="1098.6" y="170.0" font-size="13.5" fill="#334155">用分层蛋糕比喻组织构成器官</text>
<text x="1098.6" y="192.0" font-size="13.5" fill="#334155">（奶油=上皮组织</text>
