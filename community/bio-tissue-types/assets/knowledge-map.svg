<text x="1098.6" y="214.0" font-size="13.5" fill="#334155">神经组织像电话线传递信号</text>
<circle cx="1086.6" cy="231.0" r="3.4" fill="#7c3aed" fill-opacity=".85"/>
<text x="1098.6" y="236.0" font-size="13.5" fill="#334155">植物分生组织像&#x27;干细胞&#x27;，动</text>
<text x="1098.6" y="258.0" font-size="13.5" fill="#334155">物上皮组织像&#x27;防护服&#x27;</text>
