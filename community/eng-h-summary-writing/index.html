      <p>概要写作是用简洁语言忠实概括原文要点，不掺个人观点与细节堆砌。先分清原文结构（论点/原因/对策等），再用自己的话改写，注意词数限制与衔接。</p>

<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-1"><h2>📖 抓核心句</h2><div class="tu-q"><p><strong>And：</strong>学生能识别段落主题句</p><p><strong>But：</strong>常混淆细节与核心观点</p><p><strong>Therefore：</strong>学会区分主次信息才能写好概要</p></div><div class="tu-q"><p>核心句=作者最想表达的观点，通常出现在段首/段尾。例：一段讲'电子书优势'的文字（共5句），首句'电子书节省空间'是核心，后4句用'1本书仅占5MB''可存1000本在手机'等数据证明，这些是细节支撑。</p></div><div class="tu-q"><p>🌍 就像看朋友圈长文——先扫开头结尾知道'TA去三亚玩了'是重点，中间海鲜价格、冲浪照片都是细节。</p></div><div class="tu-q" data-answer="B"><h3>🏋️ 即练</h3><p>哪句最可能是核心句？

B. 电子词典显著提升学习效率
