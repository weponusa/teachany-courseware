  <style>
    /* ─── 基础重置 & 调色板 ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --push: #f59e0b;
      --pull: #34d399;
      --effect: #a78bfa;
      --size:  #38bdf8;
      --bg:    #0d1b2e;
      --bg2:   #112240;
      --card:  #162b4a;
      --border: #1e3a5f;
      --text:  #e2e8f0;
      --muted: #64748b;
      --radius: 18px;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    /* ─── 共用布局 ─── */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    section { padding: 64px 0; }
    section:nth-child(even) { background: var(--bg2); }
    .section-title {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 900;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .section-sub {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 32px;
    }
    .tag {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 99px;
      font-size: .85rem;
      font-weight: 600;
    }

    /* ─── Hero ─── */
    .hero {
      min-height: 540px;
      display: flex; align-items: center;
      background:
        radial-gradient(ellipse at 70% 40%, rgba(245,158,11,.18) 0%, transparent 55%),
        radial-gradient(ellipse at 30% 60%, rgba(52,211,153,.15) 0%, transparent 55%),
        var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 80px 0;
    }
    .hero-inner {
      max-width: 1100px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; gap: 48px; flex-wrap: wrap;
    }
    .hero-text { flex: 1; min-width: 280px; }
    .hero-eyebrow {
      font-size: .9rem; color: var(--muted); letter-spacing: .12em;
      text-transform: uppercase; margin-bottom: 16px;
    }
    .hero-title {
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 900; line-height: 1.15; margin-bottom: 20px;
      background: linear-gradient(135deg, #fff 25%, var(--push) 55%, var(--pull) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-desc { font-size: 1.05rem; color: #94a3b8; margin-bottom: 32px; }
    .hero-badges { display: flex; flex-wrap: wrap; gap: 10px; }
    .hero-badge {
      padding: 8px 20px; border-radius: 99px;
      font-size: .9rem; font-weight: 600;
      border: 1.5px solid; cursor: default;
    }

    /* ─── 标准知识结构图 ─── */
    .hero-figure { flex: 1; min-width: 260px; }
    .hero-cover-img {
      width: 100%; max-width: 560px; border-radius: var(--radius);
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
      display: block;
    }

    /* ─── 学习目标 ─── */
    .objective-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
      gap: 20px;
    }
    .obj-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 20px;
    }
    .obj-icon { font-size: 2rem; margin-bottom: 10px; }
    .obj-text { font-size: .95rem; color: var(--text); line-height: 1.6; }

    /* ─── ABT情境 ─── */
    .abt-box {
      background: var(--card);
      border-left: 5px solid var(--push);
      border-radius: var(--radius);
      padding: 32px 36px;
      font-size: 1.1rem;
      line-height: 1.85;
    }
    .abt-box p + p { margin-top: 16px; }
    .abt-but { color: var(--push); font-weight: 700; }
    .abt-therefore { color: var(--pull); font-weight: 700; }

    /* ─── 知识模块卡片 ─── */
    .force-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }
    @media (max-width: 700px) { .force-cards { grid-template-columns: 1fr; } }
    .force-card {
      border-radius: var(--radius);
      padding: 32px 28px;
      border: 2px solid;
    }
    .force-card h3 { font-size: 1.5rem; margin-bottom: 14px; }
    .force-card .examples {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-top: 18px;
    }
    .force-card .ex-chip {
      padding: 5px 14px;
      border-radius: 99px;
      font-size: .9rem;
    }

    /* ─── Canvas 互动 ─── */
    #sim-canvas {
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: #0a1628;
      cursor: pointer;
      display: block;
      margin: 0 auto;
      touch-action: none;
    }
    .sim-controls {
      display: flex; flex-wrap: wrap; gap: 16px;
      align-items: center; margin-top: 20px;
    }
    .sim-btn {
      padding: 10px 28px; border-radius: 99px;
      border: 2px solid; background: transparent;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      color: var(--text); transition: background .2s;
    }
    .sim-btn:hover { opacity: .85; }
    .sim-btn.push-btn  { border-color: var(--push); color: var(--push); }
    .sim-btn.push-btn:hover  { background: rgba(245,158,11,.15); }
    .sim-btn.pull-btn  { border-color: var(--pull); color: var(--pull); }
    .sim-btn.pull-btn:hover  { background: rgba(52,211,153,.15); }
    .sim-btn.reset-btn { border-color: var(--muted); color: var(--muted); }
    .force-slider-group {
      display: flex; align-items: center; gap: 12px;
      font-size: .95rem; color: var(--text);
    }
    input[type=range] {
      accent-color: var(--push);
      width: 140px;
    }
    #sim-status {
      margin-top: 12px; min-height: 32px;
      font-size: 1rem; color: #94a3b8; text-align: center;
    }

    /* ─── 互动练习 ─── */
    .practice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    .practice-item {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      text-align: center;
      transition: transform .15s, border-color .2s;
      user-select: none;
    }
    .practice-item:hover { transform: translateY(-3px); }
    .practice-item .p-icon { font-size: 2.6rem; margin-bottom: 8px; }
    .practice-item .p-label { font-size: .9rem; color: var(--text); }
    .practice-item .p-answer {
      margin-top: 10px; font-size: .85rem; font-weight: 700;
      display: none;
    }
    .practice-item.revealed .p-answer { display: block; }
    .practice-item.is-push { border-color: var(--push); }
    .practice-item.is-pull { border-color: var(--pull); }

    /* ─── 选择题 ─── */
    .quiz-block {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 28px 20px;
      margin-bottom: 20px;
    }
    .quiz-q { font-size: 1.05rem; font-weight: 700; margin-bottom: 16px; }
    .quiz-options { display: flex; flex-direction: column; gap: 10px; }
    .quiz-opt {
      padding: 10px 18px; border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg); cursor: pointer;
      transition: background .15s, border-color .2s;
      font-size: .95rem;
    }
    .quiz-opt:hover { background: rgba(255,255,255,.05); }
    .quiz-opt.correct { border-color: var(--pull); background: rgba(52,211,153,.1); color: var(--pull); }
    .quiz-opt.wrong   { border-color: #ef4444; background: rgba(239,68,68,.1); color: #ef4444; }
    .quiz-feedback {
      margin-top: 12px; font-size: .9rem;
      padding: 10px 16px; border-radius: 10px;
      display: none;
    }
    .quiz-feedback.show { display: block; }
    .quiz-feedback.ok  { background: rgba(52,211,153,.1); color: var(--pull); border: 1px solid var(--pull); }
    .quiz-feedback.err { background: rgba(239,68,68,.1); color: #fca5a5; border: 1px solid #ef4444; }

    /* ─── 成就徽章 ─── */
    .badge-grid {
      display: flex; flex-wrap: wrap; gap: 20px;
      justify-content: center;
    }
    .badge-card {
      background: var(--card); border: 2px solid var(--border);
      border-radius: 20px; padding: 28px 24px;
      text-align: center; width: 180px;
      transition: border-color .25s, transform .2s;
    }
    .badge-card:hover { transform: translateY(-4px); }
    .badge-card.unlocked { border-color: #fbbf24; box-shadow: 0 0 18px rgba(251,191,36,.25); }
    .badge-icon { font-size: 3rem; margin-bottom: 10px; }
    .badge-name { font-size: .9rem; font-weight: 700; margin-bottom: 4px; }
    .badge-desc { font-size: .78rem; color: var(--muted); }
    .badge-lock { font-size: .75rem; color: var(--muted); margin-top: 8px; }

    /* ─── 视频播放器 ─── */
    .video-wrap {
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
    }
    .video-wrap video {
      width: 100%;
      display: block;
    }

    /* ─── 滚动进场动画 ─── */
    .fade-in { opacity: 0; transform: translateY(24px); transition: opacity .55s, transform .55s; }
    .fade-in.visible { opacity: 1; transform: none; }

    /* ─── Progress bar ─── */
    #progress-bar {
      position: fixed; top: 0; left: 0; height: 3px;
      background: linear-gradient(90deg, var(--push), var(--pull));
      z-index: 9999; width: 0%; transition: width .1s;
    }
  </style>

<section id="quiz-section" data-tsh="挑战一下！选择题是检验理解的好方法。">
  <div class="container fade-in">
    <p class="section-sub">QUIZ</p>
    <h2 class="section-title">📝 选择题挑战</h2>
    <p style="color:var(--muted);margin-bottom:28px">每题只有一个正确答案，选错了会有错因分析哦！</p>

    <!-- Q1 -->
    <div class="quiz-block">
      <div class="quiz-q">Q1. 小明用手推开了一扇门，这个动作中用的力是什么力？</div>
      <div class="quiz-options">
        <div class="quiz-opt" onclick="checkQuiz(this,'wrong','❌ 错了！拉力是把物体拉向自己的力。推门时，力的方向是离开自己，这是推力。')">A. 拉力</div>
        <div class="quiz-opt" onclick="checkQuiz(this,'correct','✅ 正确！推力让门离开小明，向推的方向打开。')">B. 推力</div>
        <div class="quiz-opt" onclick="checkQuiz(this,'wrong','❌ 推力和拉力是两种不同的力，不能同时存在于同一个动作中。推门用的是推力。')">C. 推力和拉力都有</div>
        <div class="quiz-opt" onclick="checkQuiz(this,'wrong','❌ 这里确实用到了力——推力。打开门需要给门一个向前的推力。')">D. 没有用力</div>
      </div>
      <div class="quiz-feedback"></div>
    </div>

    <!-- Q2 -->
    <div class="quiz-block">
      <div class="quiz-q">Q2. 下面哪个选项描述了力的效果？</div>
      <div class="quiz-options">
        <div class="quiz-opt" onclick="checkQuiz(this,'wrong','❌ 力的颜色不是力的效果。力是看不见颜色的。力的效果是指力对物体产生的影响。')">A. 力有颜色</div>
        <div class="quiz-opt" onclick="checkQuiz(this,'correct','✅ 正确！力能改变物体的运动状态（让它动起来或停下来），也能改变物体的形状（如捏橡皮泥）。')">B. 力能改变物体的运动状态和形状</div>
        <div class="quiz-opt" onclick="checkQuiz(this,'wrong','❌ 力确实有方向（推力向外，拉力向内），但这描述的是力的特征，不是力的效果。')">C. 力只有方向，没有大小</div>
        <div class="quiz-opt" onclick="checkQuiz(this,'wrong','❌ 力是可以感受到的作用，不是魔法。力的效果是改变运动状态和形状。')">D. 力是一种神秘的魔法</div>
      </div>
      <div class="quiz-feedback"></div>
    </div>

    <!-- Q3 -->
    <div class="quiz-block">
      <div class="quiz-q">Q3. 用一个更大的力推同一辆小车，会发生什么？</div>
      <div class="quiz-options">
        <div class="quiz-opt" onclick="checkQuiz(this,'wrong','❌ 力越大，效果越明显。小车会更快速地移动，而不是变慢。')">A. 小车移动得更慢</div>
        <div class="quiz-opt" onclick="checkQuiz(this,'wrong','❌ 力越大，小车运动得越快，而不是停止。只有施加反方向的力才能让它停下来。')">B. 小车立刻停止</div>
        <div class="quiz-opt" onclick="checkQuiz(this,'correct','✅ 正确！力越大，物体运动越快，移动的距离也越远。这就是"力越大，效果越明显"的规律！')">C. 小车移动得更快、更远</div>
        <div class="quiz-opt" onclick="checkQuiz(this,'wrong','❌ 力的大小是会影响效果的。力越大，小车运动越快，而不是没有区别。')">D. 没有任何区别</div>
      </div>
      <div class="quiz-feedback"></div>
    </div>

    <!-- Q4 -->
    <div class="quiz-block">
      <div class="quiz-q">Q4. 拉橡皮筋时，橡皮筋变长了。这说明了什么？</div>
      <div class="quiz-options">
        <div class="quiz-opt" onclick="checkQuiz(this,'wrong','❌ 橡皮筋变长是因为受到了拉力，而不是推力。推力是向外推，不会让橡皮筋变长。')">A. 推力改变了物体的形状</div>
        <div class="quiz-opt" onclick="checkQuiz(this,'wrong','❌ 拉力是把物体拉向自己，方向是向内的。橡皮筋变长是形变，不是运动状态改变。')">B. 拉力改变了物体的运动状态</div>
        <div class="quiz-opt" onclick="checkQuiz(this,'correct','✅ 正确！拉橡皮筋时，拉力改变了橡皮筋的形状——它从短变长了。这是力改变形状的例子！')">C. 拉力改变了物体的形状</div>
        <div class="quiz-opt" onclick="checkQuiz(this,'wrong','❌ 拉橡皮筋确实用了力（拉力）。没有力的话，橡皮筋不会自己变长。')">D. 没有力的作用</div>
      </div>
      <div class="quiz-feedback"></div>
    </div>
  </div>
</section>

      <h2>方法：找施力物与受力物</h2>
      <p>分析力时写清谁推谁。比较力的作用效果时，控制接触部位，只改大小或方向。测量前先校零。</p>
      <div class="worked-example"><strong>范例：</strong>推箱子：人是施力物，箱子是受力物；箱子同时也对人有反作用力。</div>
      <p id="lesson-pitfall" class="scie-pitfall"><strong>常见误区：</strong>常见误区是认为只有接触才有力，忽略磁力等；或认为静止物体不受力。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练 1：概念辨析</h3>
        <p>用力捏气球，气球变扁，说明力可以？</p>
        <button type="button" data-correct="0" onclick="scieDepthCheck(this,false,&#x27;scie-depth-feedback-1&#x27;,&quot;力能使物体形变。&quot;)">A. 只改变颜色</button><button type="button" data-correct="1" onclick="scieDepthCheck(this,true,&#x27;scie-depth-feedback-1&#x27;,&quot;力能使物体形变。&quot;)">B. 改变物体形状</button><button type="button" data-correct="0" onclick="scieDepthCheck(this,false,&#x27;scie-depth-feedback-1&#x27;,&quot;力能使物体形变。&quot;)">C. 让质量瞬间消失</button><button type="button" data-correct="0" onclick="scieDepthCheck(this,false,&#x27;scie-depth-feedback-1&#x27;,&quot;力能使物体形变。&quot;)">D. 创造空气</button>
        <div class="scie-feedback" id="scie-depth-feedback-1" role="status"></div>
      </div>
      <div class="module-check" data-conceptest="true">
        <h3>马上练 2：观察推理</h3>
        <p>用弹簧测力计测拉力前，正确的准备是？</p>
        <button type="button" data-correct="0" onclick="scieDepthCheck(this,false,&#x27;scie-depth-feedback-2&#x27;,&quot;测前校零才能读准。&quot;)">A. 随便拉拉就读数</button><button type="button" data-correct="1" onclick="scieDepthCheck(this,true,&#x27;scie-depth-feedback-2&#x27;,&quot;测前校零才能读准。&quot;)">B. 先检查指针是否对准零刻度</button><button type="button" data-correct="0" onclick="scieDepthCheck(this,false,&#x27;scie-depth-feedback-2&#x27;,&quot;测前校零才能读准。&quot;)">C. 倒着读最大刻度当结果</button><button type="button" data-correct="0" onclick="scieDepthCheck(this,false,&#x27;scie-depth-feedback-2&#x27;,&quot;测前校零才能读准。&quot;)">D. 不挂重物也能读出重力</button>
        <div class="scie-feedback" id="scie-depth-feedback-2" role="status"></div>
      </div>
    </div>

<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-1"><h2>📖 力的方向</h2><div class="tu-q"><p><strong>And：</strong>学生知道推拉能让物体动起来</p><p><strong>But：</strong>但常混淆斜着推也算推力</p><p><strong>Therefore：</strong>需明确力方向与作用效果关系</p></div><div class="tu-q"><p>推力拉力方向决定物体运动趋势。比如课桌重50N：①正前方推30N课桌直线前移；②斜向上45°推30N时，实际向前分力≈21N（30N×cos45°），还会产生向上分力让课桌有离地趋势。这说明方向不同，力的作用效果完全不同。</p></div><div class="tu-q"><p>🌍 推超市购物车时：水平推省力；若向下压着推，部分力浪费在压地面上。拉行李箱上坡，斜向上30°比直着拉更省力，因为更多力用于对抗重力。</p></div><div class="tu-q" data-answer="A"><h3>🏋️ 即练</h3><p>如图斜向上拉箱子，哪个说法正确？</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="选B忽略了力的分解；选C未考虑角度影响；选D不懂力会分散">A. 水平方向分力=拉力×cosθ</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="选B忽略了力的分解；选C未考虑角度影响；选D不懂力会分散">B. 竖直方向无分力</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="选B忽略了力的分解；选C未考虑角度影响；选D不懂力会分散">C. 拉力大小与角度无关</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="选B忽略了力的分解；选C未考虑角度影响；选D不懂力会分散">D. 所有力都用于移动</button></div><div class="tu-fb" hidden></div></div></section>

<section class="section" id="knowledge-graph" style="max-width:1080px;margin:24px auto;padding:0 20px;"><h2 class="section-title">🗺️ 知识图谱：推和拉的力</h2><div data-teachany-kg="sci-e-push-pull-force"><canvas class="tkg-fallback-canvas" width="720" height="120" aria-label="知识图谱互动画布" style="display:block;width:100%;max-height:140px;border-radius:12px;"></canvas></div></section>
<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
