    <div class="card">
      <span class="phase-tag">知识精讲</span>
      <h2>世界气候类型与分布</h2>
      <p>世界主要气候类型受纬度、海陆、地形、洋流等因素影响，呈一定分布规律：如赤道附近多热带雨林气候，两极附近为寒带气候，中纬度大陆东岸常见季风气候。学习要“名称—特征—分布—成因”四合一。</p>
    </div>
  </section>
<section class="slide-page" data-page-type="content" data-tsh="方法范例">

    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：以赤道为轴南北对称记忆</h2>
      <p>先按热量带抓大类，再区分大陆东岸/西岸差异。读图定位比死背地名更有效。</p>
      <div class="worked-example"><strong>范例：</strong>地中海气候分布在南北纬 30°–40° 大陆西岸，夏季炎热干燥、冬季温和多雨。</div>
      <p id="lesson-pitfall" class="geom-pitfall"><strong>常见误区：</strong>常见误区是只记名称不记分布规律，或把天气现象当成气候类型。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练：辨析要点</h3>
        <p>热带雨林气候主要分布在？</p>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 国际物流航线规划：马士基航运公司优化亚欧航线时，必须考虑北印度洋季风气候。每年6-9月西南季风期间，货轮会选择绕行阿拉伯海南部避开暴风区，这使新加坡至汉堡航线增加3天航程但确保安全，正是应用了季风气候降水集中、风力强劲的特征知识。</p>
<p>2. 冬奥会选址评估：北京2022年冬奥组委考察张家口赛区时，发现其位于N41°的温带季风气候区，但海拔1800米的崇礼1月均温-12℃，比同纬度纽约（-0.6℃）低11.4℃，这正是地形抬升导致气温垂直递减的典型例证，最终使其成为理想雪上项目举办地。</p>
<p>3. 光伏发电站建设：迪拜Mohammed bin Rashid太阳能公园选址24°N的沙漠气候区，工程师利用该地年日照超3500小时、降水不足100mm的特征，设计倾斜22°的光伏板角度以最大化接收太阳辐射，年发电量达500万兆瓦时，相当于减少120万吨碳排放。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. 为什么南美洲西岸的热带沙漠气候（如阿塔卡马沙漠）能向南延伸到18°S，而非洲西岸的纳米布沙漠只到25°S？思考线索：对比两大陆西岸洋流性质——秘鲁寒流比本格拉寒流更强；注意安第斯山脉对东南信风的阻挡作用；查看南美大陆在该纬度的轮廓特征。</p>
<p>2. 若青藏高原被削平到1000米海拔，东亚气候会发生什么变化？分析角度：首先考虑冬季风路径是否改变；其次推算高原热泵效应消失对夏季风水汽输送的影响；最后思考长江中下游"梅雨"的持续时间可能如何变化——目前上海6-7月降水量占全年28%。</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>当我们打开世界气候分布图，首先注意到赤道两侧醒目的深绿色区域——这是年降水量超2000mm的热带雨林气候，刚果盆地和亚马逊平原的参天大树正依赖这种终年高温多雨的环境。向北移动，在10°-20°之间出现草原景观，这里的萨赫勒地区年降水量骤降至400-800mm，形成明显的干湿季交替，斑马迁徙的节奏正与热带草原气候的雨季同步。继续往北，神秘撒哈拉沙漠提醒我们关注23°-30°间的副热带高压带，开罗年降水仅25mm却蒸发量高达2000mm，这种极度干旱的成因要从行星风系三圈环流找答案。转向大陆东岸，上海与纽约同处北纬31°和40°却气候迥异，前者夏季受东南季风影响降水集中（6月降水185mm），后者全年受西风带控制均匀降水，这揭示了海陆热力性质差异如何重塑气候分布。最后观察安第斯山脉西坡，从热带雨林到高山苔原的垂直变化，验证了海拔每升高1000米气温下降6℃的规律，的的喀喀湖（3812米）畔的印第安人至今穿着羊驼毛衣抵御10℃的全年均温。气候类型分布看似复杂，实则是纬度位置、大气环流、海陆分布和地形因素共同作用的结果谱写的自然交响曲。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 错误表现：认为热带雨林气候只分布在赤道附近。许多学生会忽略海拔因素，看到赤道附近的乞力马扎罗山（3°S）存在积雪就产生困惑。认知根源在于把纬度位置当作唯一影响因素，忽略了地形对气温的垂直递减作用（每升高1000米降温6℃）。正确理解是：热带雨林气候确实集中分布在赤道两侧10°范围内，但在高耸山地会出现垂直气候带，如厄瓜多尔安第斯山脉海拔2800米以上就属于高山气候。</p>
<p>2. 错误表现：将地中海气候与温带海洋性气候混淆。学生常因二者都分布在30°-40°大陆西岸而弄混，比如误以为洛杉矶（34°N）冬季多雨是温带海洋性气候。认知根源在于未掌握降水季节差异的关键特征。正确理解是：地中海气候夏季干燥（如罗马7月降水仅15mm）、冬季温和多雨，而温带海洋性气候全年降水均匀（伦敦各月降水均在50mm左右）。</p>
<p>3. 错误表现：认为所有内陆地区都是温带大陆性气候。学生看到乌鲁木齐（44°N）年均温7.8℃就简单归类，却忽略了中亚沙漠的极端性。认知根源在于未理解海陆位置对气候极端性的放大作用。正确理解是：同纬度内陆地区，距海越远气温年较差越大，如乌兰巴托（48°N）年较差高达40℃，而大连（39°N）仅28℃。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
