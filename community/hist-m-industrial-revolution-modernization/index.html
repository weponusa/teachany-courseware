      <h2>工业革命与近代化</h2>
      <p>近代化包含经济工业化、政治民主化、思想科学化等。工业革命是经济近代化的核心动力，并推动教育、城市化与全球联系。中国洋务运动等也是对近代化的早期回应。</p>
    </div>

<section class="slide-page" data-page-type="content" data-tsh="方法范例">
  <section class="section histm-depth core-knowledge-module text-module" id="lesson-method"
    data-bloom-level="apply" data-scaffold="partial" data-tts="lesson-method">
    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：近代化多维度理解</h2>
      <p>答题不要把近代化等同于“西化”一词，而要分经济、政治、思想等层面举例。</p>
      <div class="worked-example"><strong>范例：</strong>机器大工业提高生产力，同时要求自由劳动力与更广阔市场，推动资本主义扩展。</div>
      <p id="lesson-pitfall" class="histm-pitfall"><strong>常见误区：</strong>常见误区是认为近代化只有政治制度一条路，忽视经济与科技。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练：辨析要点</h3>

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 现代物流系统的原型：亚马逊仓库的智能分拣系统直接承袭自19世纪中叶英国工厂的流水线设计。2022年杭州无人仓采用AGV小车搬运，其路径规划算法与1830年利物浦码头轨道调度逻辑高度相似，只是将蒸汽机车替换为二维码导航。这种生产组织模式变革，正是工业革命留给数字时代的重要遗产。</p>
<p>2. 碳排放核算的历史参照：国际能源署(IEA)评估各国减排责任时，需追溯工业化起点。英国1850年人均CO₂排放量2.5吨的数据，成为当今"共同但有区别责任"原则的计算基准。2023年全球气候谈判中，发展中国家仍援引1870年各国煤炭消费占比（英国42% vs 印度0.7%）来主张发展权。</p>
<p>3. 职业教育体系的雏形：德国双元制教育直接源于19世纪后期克虏伯钢铁厂的学徒车间。当时培养一名合格机械师需7年，现代西门子技术学院仍保留这种"车间+理论"模式。2021年柏林工业大学机械系课程中，仍有15%课时在复原19世纪机床操作规范。</p>
</section>
<section class="card amber">
<h3>🧩 深入追问</h3>
<p>1. 问题：为什么美国工业革命初期（1790-1820）大量复制英国技术，却直到1850年后才实现反超？分析线索：比较两国资源禀赋差异（英国煤炭储量vs美国木材丰度），注意关键转折点——1846年英国废除《谷物法》对全球贸易的影响，再思考1869年横贯铁路通车后美国市场规模扩张的乘数效应。</p>
<p>2. 问题：工业革命如何重塑家庭结构？从1801年英国人口普查数据可见，纺织区15岁以下儿童就业率达23%，但1841年降至11%。这背后既有工厂法限制，也有家庭收入结构变化。进一步思考：当1850年曼彻斯特工人周薪达到15先令（较1780年增长3倍）时，家庭消费模式发生了哪些质变？这些变化又如何反馈到生产领域？</p>
</section>
<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先要理解工业革命为何发端于18世纪晚期的英国——这绝非偶然。农业革命带来的粮食盈余（1700-1800年英国小麦亩产增长47%）释放了劳动力，殖民贸易积累的资本（1760年利物浦奴隶贸易占GDP的5.2%）提供了投资，而专利制度（1624年《垄断法》）保护了技术创新。接着看技术串联如何发生：1733年飞梭使织布提速后，1764年珍妮纺纱机弥补了纱线短缺，但这种棉纺织业突破必须等到1784年科特炼钢法提供可靠金属部件，最终由瓦特蒸汽机（1800年全英已有500台）提供稳定动力。</p>
<p>随着1830年利物浦-曼彻斯特铁路开通，工业化进入新阶段。铁路建设消耗了英国1847年57%的生铁产量，反过来刺激了炼钢技术（1856年贝塞麦转炉使钢价下降80%）。这种自我强化的循环，使得1851年世博会水晶宫能展示2.8万件工业品。最后要看到，工业化不仅是技术史，更是社会重组过程。1842年《矿工报告》揭露的童工问题，催生了1847年《十小时工作制法案》，而1860年英国城市人口首次超过农村，彻底改变了人类聚居形态。这种从技术革新到制度调适的连锁反应，正是"近代化"的核心特征。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 错误认为工业革命仅发生在英国：许多学生看到"第一次工业革命"便默认是英国专属。这种误解源于教材常以英国为典型案例（如1765年哈格里夫斯发明珍妮纺纱机）。实际上，1815年后法国、德国鲁尔区相继出现机械化纺织厂，1830年美国洛厄尔工厂已实现水力织布机规模化生产。正确理解应是：英国是发源地，但工业革命具有跨国扩散性，各国工业化进程存在10-20年时差。</p>
<p>2. 混淆"工厂制"与"手工工场"本质区别：学生常将两者都归为"集中生产"，忽略制度变革。典型错误表现为将18世纪曼彻斯特棉纺厂与16世纪佛罗伦萨羊毛工场混为一谈。认知根源在于未抓住蒸汽动力（1781年瓦特改良蒸汽机热效率达3%）带来的生产组织革命——工厂制要求严格工时（如1844年英国工厂法规定童工每日不超过6.5小时）、标准化流程（如博尔顿-瓦特工厂的零件公差控制）。</p>
<p>3. 高估铁路的初始作用：受教科书插图影响，学生常将1825年斯托克顿-达灵顿铁路视为工业革命早期标志。实际上直到1850年，英国货运量仍以运河为主（占比65%），铁路真正爆发是在1870年后钢轨普及期。这种时空错位源于将技术发明与应用高峰混同，需结合具体数据纠正。</p>
</section>

      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
