      <h2>方法：独立战争 + 1787年宪法</h2>
      <p>战争解决独立问题，宪法解决国家结构与分权制衡。注意独立不等于废除奴隶制等局限。</p>
      <div class="worked-example"><strong>范例：</strong>《独立宣言》宣称人生而平等，鼓舞殖民地人民，也影响后来资产阶级革命。</div>
      <p id="lesson-pitfall" class="histm-pitfall"><strong>常见误区：</strong>常见误区是只记华盛顿打仗，忽视文献与制度建设。</p>
      <div class="module-check" data-conceptest="true">

<section class="card teal">
<h3>🌏 生活与科技中的应用</h3>
<p>1. 现代抗议运动中的符号借用：2013年土耳其盖齐公园抗议中，示威者模仿波士顿倾茶事件，将警察防暴盾牌扔入喷泉并高呼"No taxation without representation"。这种跨时空的意象移植，展现了历史事件如何成为公民抗争的通用语言模板。</p>
<p>2. 军事物流系统的历史参照：美军在伊拉克战争期间的后勤研究，曾分析1778年大陆军福吉谷冬营的补给困境。当时1/3士兵因缺靴子赤脚行军，现代军队由此发展出"即时定位补给系统"，通过RFID标签追踪每双军靴的库存位置。</p>
<p>3. 政治漫画的视觉语法传承：当代讽刺画家仍沿用保尔·里维尔1770年《波士顿惨案》版画的构图逻辑——将英国红衫军排列成机械化的杀人方阵。2020年《纽约客》关于国会山事件的漫画中，抗议者被同样处理为无个性特征的暴力符号群。</p>

<h3>🧩 深入追问</h3>
<p>1. 问题：若没有七年战争（1756-1763）的巨额军费压力，英国是否会调整对北美政策？分析线索：比较战前后英国国债数字（从7500万镑增至1.3亿镑），注意1763年《皇家公告线》禁止殖民者西进的政策动机，思考帝国财政体系与殖民地自治传统的根本矛盾是否必然爆发。</p>
<p>2. 问题：为何以奴隶制闻名的杰斐逊能在《独立宣言》中写入"人人生而平等"？分析线索：对比宣言初稿中删除的谴责奴隶制段落（因南卡罗来纳州反对），考察1776年弗吉尼亚州黑人占比（40%），思考启蒙思想与现实利益的博弈如何塑造革命话语的局限性。</p>

<section class="card purple">
<h3>📖 知识脉络梳理</h3>
<p>先要理解18世纪中叶大英帝国的特殊治理结构：北美13殖民地虽缴纳关税（1764年《糖税法》将税率提高3倍），却在威斯敏斯特议会没有代表权。这种"虚拟代表制"理论遭遇殖民地精英的洛克式主权观挑战，当1765年《印花税法》要求所有法律文件加贴税票时，律师帕特里克·亨利在弗吉尼亚议会率先通过抵制决议。接着是螺旋上升的对抗循环——1770年波士顿惨案中5名市民死亡引发舆论沸腾，3年后东印度公司茶叶垄断权触发倾茶事件，英国议会随即通过《强制法案》关闭波士顿港。1774年第一届大陆会议召开时，12个殖民地（佐治亚缺席）代表已开始协调民兵组织，次年4月列克星敦的民兵"一分钟人"与英军交火时，其实双方都沿用了欧洲线性战术手册。最后阶段呈现全球化特征：法国拉法耶特侯爵1777年带来200名工程师帮助训练大陆军，西班牙在密西西比河牵制英军，而1781年约克镇决战时，法海军德格拉斯伯爵的28艘战舰切断了英军海上退路。战争结束时产生的1783年《巴黎和约》看似是终点，实则埋下新矛盾——英国保留加拿大导致后来1812年战争，而未解决的西部土地分配问题将持续撕裂年轻的美利坚。</p>
</section>

<section class="card">
<h3>🔍 易错点辨析</h3>
<p>1. 错误认为"波士顿倾茶事件是战争直接导火索"：学生常将1773年倾茶事件与1775年列克星敦枪声直接关联，忽略中间《强制法案》和第一届大陆会议等关键过渡。根源在于线性思维简化因果链，实际上英国通过5项惩罚性法案激化矛盾，殖民地代表在1774年费城会议已形成联合抵抗体系，倾茶事件只是长期抗争中的标志性节点。</p>
<p>2. 混淆《独立宣言》与《邦联条例》功能：常见错误是将1776年杰斐逊起草的宣言等同于1781年生效的政府组织文件。认知偏差来自对"独立"与"建国"两个阶段的模糊，前者是理论纲领（含27条对英王控诉），后者是实践框架（保留各州主权导致13个独立财政体系），直到1787宪法才解决此矛盾。</p>
<p>3. 高估法国援助的决定性作用：学生容易将1781年约克镇围城战的法军支援视为胜败关键，实际上此前6年战争中，北美民兵的游击战术（如摩根步枪队在萨拉托加战役的丛林作战）和华盛顿的持久战略（大陆军仅2.5万人却周旋8年）才是根基。法军最后介入时，英军已因全球殖民地战线过长损耗了40%兵力。</p>
</section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
