<section class="slide-page" data-page-type="concept" data-page-index="4" data-tts="concept-forms" data-tsh="核心 - 六种能量形式" data-bloom-level="2" data-scaffold="full">
    <div class="slide-inner"><div class="card">
      <div class="section-header"><span class="phase-tag">Concept</span><h2>能量有哪些"面孔"？</h2></div>
      <p>自然界里，能量有很多种"面孔"。<strong>动能</strong>藏在运动的物体里——奔跑的人、行驶的汽车都有动能。<strong>势能</strong>藏在位置或形变里——举高的重物、拉长的橡皮筋都储存了势能。</p>
      <p><strong>热能</strong>让物体变热；<strong>光能</strong>来自太阳和电灯；<strong>电能</strong>在电线和电池里流动；<strong>化学能</strong>储存在食物、煤炭、汽油中。科学家说：能量可以从一种形式<strong>转化</strong>成另一种，但<strong>不能凭空产生，也不能凭空消失</strong>。</p>
      <figure class="ta-standard-figure"><img src="./assets/energy-forms-concept.png" alt="六种常见能量形式与生活实例：奔跑、举高、发热、发光、用电、食物"><figcaption>先认形式，再追转化</figcaption></figure>
    </div></div>
  </section>
<section class="slide-page" data-page-type="interactive" data-page-index="5" data-tts="phet-energy" data-tsh="互动 - PhET 能量滑板公园" data-bloom-level="3" data-scaffold="partial" data-conceptest="true">
    <div class="slide-inner"><div class="card card-glow">

      <div class="phet-wrap">
        <iframe src="https://phet.colorado.edu/sims/html/energy-skate-park-basics/latest/energy-skate-park-basics_zh_CN.html" allowfullscreen loading="lazy" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" title="PhET 能量滑板公园模拟"></iframe>

<section class="slide-page" data-page-type="concept" data-page-index="6" data-tts="example-heat" data-tsh="实例 - 热传递与电能" data-bloom-level="3" data-scaffold="partial">
    <div class="slide-inner"><div class="card">
      <div class="section-header"><span class="phase-tag">Examples</span><h2>热是怎么传过来的？</h2></div>
      <p>当能量以<strong>热能</strong>形式传递时，科学家总结了三种方式：<strong>传导</strong>（固体直接接触传热，如铁勺烫手）、<strong>对流</strong>（液体或气体流动带走热量，如热水上升）、<strong>辐射</strong>（不需要介质，如太阳光照到地球）。热总是从<strong>温度高</strong>的地方传向<strong>温度低</strong>的地方。</p>
      <p>再看<strong>电能</strong>：插座里的电能流入电灯，一部分变成<strong>光能</strong>让我们看见，另一部分变成<strong>热能</strong>让灯泡发热——所以节能灯比白炽灯更省电，因为它把更多电能变成了光能，而不是浪费成热能。</p>
      <figure class="ta-standard-figure"><img src="./assets/energy-transform-life.png" alt="电能转化与热传递三种方式：电灯发光发热、传导对流辐射"><figcaption>电能→光能+热能；热传递：传导、对流、辐射</figcaption></figure>
    </div></div>
  </section>
<section class="slide-page" data-page-type="content" data-tsh="精讲">
  <section class="section scie-depth core-knowledge-module text-module" id="lesson-focus"
    data-bloom-level="understand" data-scaffold="full" data-tts="lesson-focus">
    <div class="card">
      <span class="phase-tag">知识精讲</span>
      <h2>能量的多种形式</h2>
      <p>能量有动能、势能、电能、光能、声能、热能等许多形式，可以相互转化，但不会无中生有。手电筒：化学能→电能→光能和热能；荡秋千：动能与重力势能反复转化。认识能量形式有助于节约用电和安全使用电器。</p>
    </div>
  </section>
<section class="slide-page" data-page-type="content" data-tsh="方法范例">
  <section class="section scie-depth core-knowledge-module text-module" id="lesson-method"
    data-bloom-level="apply" data-scaffold="partial" data-tts="lesson-method">
    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：写“从什么能变成什么能”</h2>
      <p>分析装置时按过程写转化链，检查是否漏掉热、声等伴随形式。节能就是减少不必要的转化浪费。</p>
      <div class="worked-example"><strong>范例：</strong>太阳能热水器：光能转化为水的内能（热能），使水温升高。</div>
      <p id="lesson-pitfall" class="scie-pitfall"><strong>常见误区：</strong>常见误区是认为能量用完就彻底消失，其实常常转化成了不太容易再利用的热散失。</p>
      <div class="module-check" data-conceptest="true">

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
