<text x="324.4" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">方法：定计划、做记录、交</text>
<text x="324.4" y="172.0" font-size="16.0" font-weight="700" fill="#0f172a">流分享</text>
<circle cx="323.4" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="335.4" y="192.0" font-size="13.5" fill="#334155">根据页数制定每周阅读页数</text>
<circle cx="323.4" cy="209.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="335.4" y="214.0" font-size="13.5" fill="#334155">常见误区是三天打鱼两天晒网</text>
<text x="335.4" y="236.0" font-size="13.5" fill="#334155">，或只追情节不做思考</text>
