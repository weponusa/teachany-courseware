<text x="578.8" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">选书有妙招</text>
<circle cx="577.8" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="589.8" y="192.0" font-size="13.5" fill="#334155">核心是&#x27;兴趣+难度&#x27;匹配原则</text>
<circle cx="577.8" cy="209.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="589.8" y="214.0" font-size="13.5" fill="#334155">上周二年级小美用这个方法找</text>
<text x="589.8" y="236.0" font-size="13.5" fill="#334155">到了《彩虹鱼》系列</text>
