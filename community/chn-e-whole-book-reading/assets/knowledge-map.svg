<text x="70.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">整本书阅读：有计划地读完</text>
<text x="70.0" y="172.0" font-size="16.0" font-weight="700" fill="#0f172a">一本</text>
<circle cx="69.0" cy="187.0" r="3.4" fill="#ffe66d" fill-opacity=".85"/>
<text x="81.0" y="192.0" font-size="13.5" fill="#334155">与单篇课文相比，更强调坚持</text>
<text x="81.0" y="214.0" font-size="13.5" fill="#334155">、预测、联系和整体思考</text>
