<text x="388.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">记叙文写作：把事情写完整具体</text>
<circle cx="387.0" cy="187.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="399.0" y="192.0" font-size="13.5" fill="#334155">重点把经过写具体，写出自己的感受，让</text>
<text x="399.0" y="214.0" font-size="13.5" fill="#334155">读者明白发生了什么、为什么难忘</text>
<rect x="689.0" y="128" width="300.0" height="166" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-opacity=".35" stroke-width="2"/>
<path d="M703.0 128 h272.0 a14,14 0 0 1 14,14 v30.0 h-300.0 v-30.0 a14,14 0 0 1 14,-14 z" fill="#60a5fa" fill-opacity=".13"/>
<text x="706.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">方法：六要素齐全、经过放慢、感受</text>
<text x="706.0" y="172.0" font-size="16.0" font-weight="700" fill="#0f172a">点题</text>
<circle cx="705.0" cy="187.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="717.0" y="192.0" font-size="13.5" fill="#334155">列提纲时标清六要素，中间经过用一两处</text>
<text x="717.0" y="214.0" font-size="13.5" fill="#334155">细节“放慢镜头”</text>
<circle cx="705.0" cy="231.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="717.0" y="236.0" font-size="13.5" fill="#334155">常见误区是只有结果没有经过，或记流水</text>
<text x="717.0" y="258.0" font-size="13.5" fill="#334155">账没有重点</text>
<rect x="1007.0" y="128" width="300.0" height="166" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-opacity=".35" stroke-width="2"/>
<path d="M1021.0 128 h272.0 a14,14 0 0 1 14,14 v30.0 h-300.0 v-30.0 a14,14 0 0 1 14,-14 z" fill="#60a5fa" fill-opacity=".13"/>
<text x="1024.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">深层理解：五镜头</text>
<circle cx="1023.0" cy="187.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="1035.0" y="192.0" font-size="13.5" fill="#334155">像拆积木一样分解时间、地点、人物、事</text>
<text x="1035.0" y="214.0" font-size="13.5" fill="#334155">件</text>
<circle cx="1023.0" cy="231.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="1035.0" y="236.0" font-size="13.5" fill="#334155">每个细节都是为突出中心思想服务</text>
<circle cx="1023.0" cy="253.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="1035.0" y="258.0" font-size="13.5" fill="#334155">对比流水账和详略得当的范文差异</text>
