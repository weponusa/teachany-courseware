<text x="70.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">段落写作：围绕一个意思写完整</text>
<circle cx="69.0" cy="165.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="81.0" y="170.0" font-size="13.5" fill="#334155">写好一段话要有明确的中心，几句话都围</text>
<text x="81.0" y="192.0" font-size="13.5" fill="#334155">绕这个中心，顺序合理，语句通顺</text>
<rect x="371.0" y="128" width="300.0" height="166" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-opacity=".35" stroke-width="2"/>
<path d="M385.0 128 h272.0 a14,14 0 0 1 14,14 v8.0 h-300.0 v-8.0 a14,14 0 0 1 14,-14 z" fill="#60a5fa" fill-opacity=".13"/>
<text x="388.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">方法：先写中心句、再写两三支撑句</text>
<circle cx="387.0" cy="165.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="399.0" y="170.0" font-size="13.5" fill="#334155">写完检查是否有句子跑题</text>
<circle cx="387.0" cy="187.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="399.0" y="192.0" font-size="13.5" fill="#334155">常见误区是一段多中心或只有中心句没有</text>
<text x="399.0" y="214.0" font-size="13.5" fill="#334155">具体内容</text>
<rect x="689.0" y="128" width="300.0" height="166" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-opacity=".35" stroke-width="2"/>
<path d="M703.0 128 h272.0 a14,14 0 0 1 14,14 v8.0 h-300.0 v-8.0 a14,14 0 0 1 14,-14 z" fill="#60a5fa" fill-opacity=".13"/>
<text x="706.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">深层理解：五镜头</text>
<circle cx="705.0" cy="165.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="717.0" y="170.0" font-size="13.5" fill="#334155">像拆乐高一样分解段落：总起句是底座，</text>
<text x="717.0" y="192.0" font-size="13.5" fill="#334155">支撑句是积木块，总结句是封顶</text>
<circle cx="705.0" cy="209.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="717.0" y="214.0" font-size="13.5" fill="#334155">总起句是段落GPS，告诉读者方向</text>
<circle cx="705.0" cy="231.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="717.0" y="236.0" font-size="13.5" fill="#334155">总起句是上层面包，支撑句是肉饼蔬菜，</text>
<text x="717.0" y="258.0" font-size="13.5" fill="#334155">总结句是下层面包</text>
<rect x="1007.0" y="128" width="300.0" height="166" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-opacity=".35" stroke-width="2"/>
<path d="M1021.0 128 h272.0 a14,14 0 0 1 14,14 v8.0 h-300.0 v-8.0 a14,14 0 0 1 14,-14 z" fill="#60a5fa" fill-opacity=".13"/>
<text x="1024.0" y="150.0" font-size="16.0" font-weight="700" fill="#0f172a">观察并描写课间活动</text>
<circle cx="1023.0" cy="165.0" r="3.4" fill="#60a5fa" fill-opacity=".85"/>
<text x="1035.0" y="170.0" font-size="13.5" fill="#334155">选择一项课间活动（如跳绳、踢毽子），</text>
<text x="1035.0" y="192.0" font-size="13.5" fill="#334155">用一段话完整描写过程</text>
