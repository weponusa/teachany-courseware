      <h2>古代亚非文明</h2>
      <p>古埃及、古巴比伦、古印度等亚非文明发源于大河流域，创造了文字、法律、数学与宗教文化成就。认识它们要抓住自然环境与文明特征的关系，并理解人类文明的多元起源。</p>
    </div>

<section class="slide-page" data-page-type="content" data-tsh="方法范例">

    <div class="card">
      <span class="phase-tag">方法与范例</span>
      <h2>方法：大河—成就—特征对照</h2>
      <p>每个文明记一条代表性成就：如埃及金字塔与象形文字、古巴比伦《汉谟拉比法典》、古印度种姓与佛教起源等。</p>
      <div class="worked-example"><strong>范例：</strong>《汉谟拉比法典》反映古巴比伦已有较完备的成文法，是研究古代法律的重要史料。</div>
      <p id="lesson-pitfall" class="histm-pitfall"><strong>常见误区：</strong>常见误区是只用欧洲中心看世界，忽视亚非文明的开创性贡献。</p>
      <div class="module-check" data-conceptest="true">
        <h3>马上练：辨析要点</h3>
        <p>亚非古代文明多发源于？</p>
        <button type="button" data-correct="0" onclick="histmDepthCheck(this,false,&#x27;histm-depth-feedback&#x27;,&quot;大河提供灌溉与交通条件，利于早期农耕文明。&quot;)">A. 热带雨林深处无水源处</button><button type="button" data-correct="1" onclick="histmDepthCheck(this,true,&#x27;histm-depth-feedback&#x27;,&quot;大河提供灌溉与交通条件，利于早期农耕文明。&quot;)">B. 大河流域</button><button type="button" data-correct="0" onclick="histmDepthCheck(this,false,&#x27;histm-depth-feedback&#x27;,&quot;大河提供灌溉与交通条件，利于早期农耕文明。&quot;)">C. 极地冰原</button><button type="button" data-correct="0" onclick="histmDepthCheck(this,false,&#x27;histm-depth-feedback&#x27;,&quot;大河提供灌溉与交通条件，利于早期农耕文明。&quot;)">D. 近代工业城市</button>
        <div class="histm-feedback" id="histm-depth-feedback" role="status"></div>

    </div>
  </section>
<section class="section teachany-upgrade-block" data-bloom-level="understand" data-scaffold="partial" id="module-1"><h2>📖 尼罗河赠礼</h2><div class="tu-q"><p><strong>And：</strong>学生知道埃及有金字塔</p><p><strong>But：</strong>但不懂为何只有尼罗河能孕育古埃及文明</p><p><strong>Therefore：</strong>理解地理环境对文明的决定作用</p></div><div class="tu-q"><p>古埃及文明被称为'尼罗河的赠礼'，因为这条每年7-10月定期泛滥的河流，不仅带来肥沃淤泥（洪水退后每平方米沉积2厘米厚淤泥），还形成天然灌溉系统。例如法老美尼斯在公元前3100年统一上下埃及后，组织修建的蓄水池工程可灌溉50万亩农田，这解释了为何埃及能养活百万人口并建造金字塔。</p></div><div class="tu-q"><p>🌍 就像今天长江三角洲的稻田依赖长江水，古埃及人在尼罗河畔种植小麦和大麦。我们吃的面包最早就是古埃及人用尼罗河三角洲的小麦发明的，他们甚至用面粉当工资发给工人。</p></div><div class="tu-q" data-answer="A"><h3>🏋️ 即练</h3><p>古埃及人称尼罗河泛滥季为'阿赫特'，主要是因为洪水带来了什么？</p><div class="tu-opts"><button type="button" class="tu-opt" data-choice="A" data-diagnosis="选B/C/D的同学要注意：虽然尼罗河确实有这些功能，但文明发展的关键是农业基础，黑色淤泥使粮食产量提升3倍以上">A.肥沃的黑色淤泥</button><button type="button" class="tu-opt" data-choice="B" data-diagnosis="选B/C/D的同学要注意：虽然尼罗河确实有这些功能，但文明发展的关键是农业基础，黑色淤泥使粮食产量提升3倍以上">B.大量的鱼群</button><button type="button" class="tu-opt" data-choice="C" data-diagnosis="选B/C/D的同学要注意：虽然尼罗河确实有这些功能，但文明发展的关键是农业基础，黑色淤泥使粮食产量提升3倍以上">C.饮用水源</button><button type="button" class="tu-opt" data-choice="D" data-diagnosis="选B/C/D的同学要注意：虽然尼罗河确实有这些功能，但文明发展的关键是农业基础，黑色淤泥使粮食产量提升3倍以上">D.运输通道</button></div><div class="tu-fb" hidden></div></div></section>

<script>
(function(){
  var cv = document.getElementById('navMapCanvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var nodes = window.__NAV_NODES__ || [];
  var layout = 'ring', hotspots = [];
  function compute(){
    var W = cv.width, H = cv.height, n = nodes.length, i, pts = [];
    if (layout === 'ring') {
      var cx = W/2, cy = H/2, r = Math.min(W, H)/2 - 70;
      for (i = 0; i < n; i++) {
        var a = -Math.PI/2 + i * 2*Math.PI/n;
        pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
      }
    } else {
      var cols = n > 6 ? 2 : 1, per = Math.ceil(n/cols);
      for (i = 0; i < n; i++) {
        var c = Math.floor(i/per), row = i%per;
        pts.push([W*(c?0.72:0.28), 60 + row*(H-100)/Math.max(1,per-1)]);
      }
    }
    return pts;
  }
  function draw(){
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var pts = compute();
    hotspots = [];
    ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    for (i = 0; i < pts.length; i++) {
      var x = pts[i][0], y = pts[i][1], nd = nodes[i];
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2);
      ctx.fillStyle = nd.color; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(nd.icon, x, y - 2);
      ctx.font = '12px "PingFang SC",sans-serif';
      ctx.fillText(nd.label.length > 6 ? nd.label.slice(0,6) : nd.label, x, y + 14);
      hotspots.push({x:x, y:y, r:34, target:nd.target});
    }
  }
  cv.addEventListener('click', function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (cv.width / rect.width);
    var my = (e.clientY - rect.top) * (cv.height / rect.height);
    for (var i = 0; i < hotspots.length; i++) {
      var h = hotspots[i], dx = mx - h.x, dy = my - h.y;
      if (dx*dx + dy*dy <= h.r*h.r) {
        var el = document.getElementById(h.target);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
    }
  });
  document.getElementById('navLayoutRing').addEventListener('click', function(){ layout = 'ring'; draw(); });
  document.getElementById('navLayoutList').addEventListener('click', function(){ layout = 'list'; draw(); });
  draw();
})();
</script>
