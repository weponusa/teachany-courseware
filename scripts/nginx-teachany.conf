# TeachAny · 腾讯云主站 nginx 配置（静态站）
# 放置: /etc/nginx/sites-available/teachany → 软链到 sites-enabled/
# 站点根: /var/www/teachany （deploy-tencent.sh 的同步目标）

server {
    listen 80;
    listen [::]:80;
    server_name teachany.cn www.teachany.cn _;
    root /var/www/teachany;
    index index.html;

    # 目录型 URL 自动补斜杠（/community/xxx → /community/xxx/）
    absolute_redirect off;

    # 静态资源长缓存（文件名含版本参数，改版本即刷新）
    location ~* \.(css|js|png|webp|jpg|svg|woff2?|mp3|json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin *;
    }

    # HTML 短缓存（保持与 CF 行为一致，便于镜像间切换）
    location ~* \.html$ {
        expires 10m;
        add_header Cache-Control "public, max-age=600";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # 大文件（hero png / mp4）不限速但允许断点续传
    sendfile on;
    tcp_nopush on;

    # 兜底路由
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    access_log /var/log/nginx/teachany.access.log;
    error_log  /var/log/nginx/teachany.error.log warn;
}
